<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ETS 2026 TOEIC Studio — Luyện Đề, Từ Vựng &amp; Công Thức</title>
  <style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #f1f5f9;
  --ink: #141413;
  --ink-muted: #475569;
  --ink-subtle: #64748b;
  --ink-vi: #0c5978;
  --ink-vi-bg: #f0f7fa;
  --ink-vi-border: #bcd9e6;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --primary: #1e3a8a;
  --primary-hover: #172e6e;
  --primary-soft: #eef2ff;
  --accent: #0f766e;
  --accent-soft: #f0fdfa;
  --success: #15803d;
  --success-soft: #f0fdf4;
  --danger: #b91c1c;
  --danger-soft: #fef2f2;
  --warn: #b45309;
  --warn-soft: #fffbeb;
  --highlight: #fef08a;
  --shadow-sm: 0 1px 2px rgba(20, 20, 19, .04), 0 4px 12px -2px rgba(20, 20, 19, .03);
  --shadow-md: 0 2px 4px rgba(20, 20, 19, .04), 0 12px 28px -6px rgba(20, 20, 19, .07);
  --shadow-lg: 0 20px 44px -12px rgba(20, 20, 19, .18);
  --radius: 14px;
  --radius-sm: 9px;
  --font: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-sans: var(--font);
  --font-serif: 'Times New Roman', 'Cambria', 'Noto Serif', serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
  --transition: all .2s cubic-bezier(.22, 1, .36, 1);
  --ui-scale: 1;
  --q-scale: 1;
  --left-pane-pct: 50%;
  /* Legacy aliases so no rule ever fails */
  --bg-surface: var(--surface);
  --bg-subtle: var(--surface-2);
  --text-main: var(--ink);
  --text-muted: var(--ink-muted);
  --ok: var(--success);
  --ok-soft: var(--success-soft);
}

body.theme-sepia {
  --bg: #f6f0e4;
  --surface: #fffdf8;
  --surface-2: #f9f4e8;
  --surface-3: #efe7d6;
  --ink: #26201a;
  --ink-muted: #574c3f;
  --ink-subtle: #786b59;
  --ink-vi: #0c5978;
  --ink-vi-bg: #eef6f8;
  --ink-vi-border: #b8dce8;
  --border: #e5dcc8;
  --border-strong: #d2c5ab;
  --primary: #1d5bbf;
  --primary-hover: #17499c;
  --primary-soft: #eaf1fb;
  --highlight: #fde68a;
}

body.theme-dark {
  --bg: #0b1220;
  --surface: #111b2e;
  --surface-2: #162238;
  --surface-3: #1e2d48;
  --ink: #f1f5f9;
  --ink-muted: #cbd5e1;
  --ink-subtle: #94a3b8;
  --ink-vi: #38bdf8;
  --ink-vi-bg: rgba(56, 189, 248, .10);
  --ink-vi-border: rgba(56, 189, 248, .28);
  --border: #24324d;
  --border-strong: #33476b;
  --primary: #3b82f6;
  --primary-hover: #60a5fa;
  --primary-soft: rgba(59, 130, 246, .16);
  --accent: #2dd4bf;
  --accent-soft: rgba(45, 212, 191, .12);
  --success: #22c55e;
  --success-soft: rgba(34, 197, 94, .14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, .14);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, .14);
  --highlight: rgba(250, 204, 21, .35);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .35);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, .4);
  --shadow-lg: 0 22px 48px rgba(0, 0, 0, .65);
}

html.font-xs, body.font-xs { --ui-scale: 0.90; --q-scale: 1; }
html.font-sm, body.font-sm { --ui-scale: 0.96; --q-scale: 1; }
html.font-md, body.font-md { --ui-scale: 1; --q-scale: 1; }
html.font-lg, body.font-lg { --ui-scale: 1.12; --q-scale: 1.02; }
html.font-xl, body.font-xl { --ui-scale: 1.24; --q-scale: 1.04; }
html.font-xxl, body.font-xxl { --ui-scale: 1.36; --q-scale: 1.06; }

*, *::before, *::after { box-sizing: border-box; }
html {
  font-size: calc(15px * var(--ui-scale, 1));
}
html, body {
  margin: 0; padding: 0; font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.58; -webkit-font-smoothing: antialiased;
  overflow-x: clip;
  -webkit-text-size-adjust: 100%;
}
body { font-size: 1rem; }
body.is-workspace { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

button, input, select, textarea { font-family: inherit; }
button, .btn, .opt-btn, .pal-cell, .q-matrix-cell, .omr-q-pip, .fc-card, .match-tile { touch-action: manipulation; }
.show-mob { display: none; }
.ws-mob-resizer-bar { display: none; }
.handbook-mob-toggle { display: none; }
.handbook-layout > *, .result-bento-grid > * { min-width: 0; max-width: 100%; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
a { color: var(--primary); text-decoration: none; }

/* Bilingual Engine */
.vi-only { display: none; }
body.bilingual-on .vi-only { display: block; }
.vi-text {
  margin-top: 5px;
  padding: 6px 10px;
  background: var(--ink-vi-bg);
  border-left: 3px solid var(--ink-vi);
  border-radius: 6px;
  color: var(--ink-vi);
  font-size: calc(0.8867rem * var(--q-scale, 1));
  line-height: 1.5;
}
.opt-vi {
  margin-top: 4px;
  color: var(--ink-vi);
  font-size: calc(0.8533rem * var(--q-scale, 1));
  font-weight: 500;
}

/* Shared Buttons & Pills */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong);
  background: var(--surface); color: var(--ink); font-size: 0.9333rem; font-weight: 700;
  transition: var(--transition); white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--primary); background: var(--surface-2); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-lg, .btn-hero { padding: 12px 22px; font-size: 1.0333rem; border-radius: 12px; font-weight: 800; }
.btn-sm { padding: 6px 12px; font-size: 0.8667rem; }
.btn-xs { padding: 5px 10px; font-size: 0.8133rem; border-radius: 7px; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
.btn-success { background: var(--success); border-color: var(--success); color: #fff; }
.btn-success:hover:not(:disabled) { background: #15803d; border-color: #15803d; color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #b91c1c; border-color: #b91c1c; color: #fff; }
.btn-warn { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn-warn:hover:not(:disabled) { background: #b45309; border-color: #b45309; color: #fff; }
.btn-soft { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.btn-soft:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); border-color: transparent; }
.btn-active, .btn.is-active { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-active:hover:not(:disabled), .btn.is-active:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px;
  border-radius: 999px; font-size: 0.7667rem; font-weight: 700;
  background: var(--surface-3); color: var(--ink-muted);
}
.badge-primary { background: var(--primary-soft); color: var(--primary); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-accent { background: var(--accent-soft); color: var(--accent); }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}

/* Custom Native-Free Dropdown Select (<div class="custom-select">) */
.custom-select { position: relative; display: inline-block; min-width: 155px; user-select: none; }
.custom-select.open { z-index: 260; }
.custom-select-trigger {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 11px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--ink); font-size: 0.8667rem; font-weight: 600;
  transition: var(--transition); cursor: pointer;
}
.custom-select-trigger:hover { border-color: var(--primary); background: var(--surface-2); }
.custom-select.open .custom-select-trigger { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.custom-select-menu,
.custom-select-portal {
  position: fixed; min-width: 155px; width: max-content; max-width: min(360px, 94vw);
  max-height: 300px; overflow-y: auto; background: var(--surface); border: 1.5px solid var(--border-strong);
  border-radius: 11px; box-shadow: var(--shadow-lg); padding: 5px; z-index: 99999; display: none;
  flex-direction: column; gap: 2px;
}
.custom-select-opt {
  width: 100%; text-align: left; padding: 8px 10px; border-radius: 7px; border: none;
  background: transparent; color: var(--ink); font-size: 0.8667rem; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer;
}
.custom-select-opt:hover { background: var(--surface-3); }
.custom-select-opt.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }

/* Custom Calendar Picker inside Modal */
.cal-widget {
  border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px; background: var(--surface-2); margin-top: 6px;
}
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 800; font-size: 0.9rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-dow { font-size: 0.7333rem; font-weight: 800; color: var(--ink-subtle); padding: 3px 0; }
.cal-day {
  padding: 6px 0; border-radius: 6px; border: 1px solid transparent; background: var(--surface);
  color: var(--ink); font-size: 0.8333rem; font-weight: 600; cursor: pointer;
}
.cal-day:hover { border-color: var(--primary); }
.cal-day.active { background: var(--primary); color: #fff; font-weight: 800; }
.cal-day.muted { opacity: .35; pointer-events: none; }

/* Global Hub Navbar (Hidden inside 100vh Practice / Exam Workspaces!) */
.hub-nav {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(14px, 2vw, 28px); min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .18s ease;
  will-change: transform;
}
@media (max-width: 760px), (max-width: 960px) and (max-height: 520px) and (pointer: coarse) {
  body.nav-hidden .hub-nav {
    transform: translateY(calc(-100% - 4px));
    opacity: 0;
    pointer-events: none;
  }
}
body.is-workspace .hub-nav { display: none; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.06rem; cursor: pointer; flex-shrink: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, #2563eb 0%, #0d9488 100%);
  color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 0.9rem;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}
.nav-tabs {
  flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: flex-start;
  gap: 6px; overflow-x: auto; scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab:first-child { margin-left: auto; }
.nav-tab:last-child { margin-right: auto; }
.nav-tab {
  padding: 8px 14px; border-radius: 10px; border: none; background: transparent;
  color: var(--ink-muted); font-size: 0.93rem; font-weight: 700; display: inline-flex; align-items: center; gap: 7px;
  transition: var(--transition); white-space: nowrap; flex-shrink: 0;
}
.nav-tab:hover { background: var(--surface-3); color: var(--ink); transform: translateY(-1px); }
.nav-tab.active { background: var(--primary-soft); color: var(--primary); box-shadow: inset 0 -2px 0 var(--primary); }
.nav-actions { display: flex; align-items: center; gap: 7px; flex-wrap: nowrap; flex-shrink: 0; }
.settings-trigger-btn {
  width: 38px; height: 38px; padding: 0; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
}
.nav-bilingual-btn {
  height: 38px; padding: 0 12px; border-radius: 10px; gap: 6px; white-space: nowrap;
  display: inline-flex; align-items: center; font-weight: 700;
}
.nav-bilingual-btn.is-active, .settings-trigger-btn.is-active {
  background: var(--primary-soft); border-color: var(--primary); color: var(--primary);
}
@media (max-width: 960px) {
  .nav-bilingual-lbl { display: none; }
  .nav-bilingual-btn { width: 38px; padding: 0; justify-content: center; }
  .nav-tab span.lbl { display: none !important; }
  .nav-tab { padding: 7px 12px; }
}
.settings-popover {
  position: fixed; z-index: 99998; background: var(--surface); border: 1.5px solid var(--border-strong);
  border-radius: 14px; box-shadow: var(--shadow-lg); padding: 14px; overflow-y: auto;
  max-height: calc(100dvh - 70px - env(safe-area-inset-bottom));
  max-width: calc(100vw - 16px);
}
.settings-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); font-size: 0.98rem;
}
.settings-sec {
  padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
}
.settings-lbl {
  font-size: 0.72rem; font-weight: 800; color: var(--ink-subtle); letter-spacing: .04em;
  text-transform: uppercase; margin-bottom: 6px;
}
.settings-profile-row { display: flex; gap: 6px; }
.settings-voice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.settings-voice-grid .btn { padding: 5px 6px; font-size: 0.74rem; gap: 4px; }

/* Full-width Edge-to-Edge Container for Hub Pages */
.page-wrap { max-width: none; width: 100%; margin: 0; padding: 20px clamp(14px, 2.2vw, 32px) 64px; font-size: 1rem; }
body.is-workspace .page-wrap { display: none; }

/* KPI Row & Portal Grid */
.hero-banner {
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 48%, #0f766e 100%);
  color: #fff; border-radius: 18px; padding: 28px 32px; margin-bottom: 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  box-shadow: 0 18px 38px -14px rgba(30, 58, 138, 0.35);
  position: relative; overflow: hidden;
}
.hero-banner h1 { margin: 0 0 8px; font-size: 2rem; font-weight: 900; letter-spacing: -.025em; line-height: 1.2; }
.hero-banner p { margin: 0; opacity: .94; font-size: 1rem; max-width: 860px; line-height: 1.6; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 22px; }
.kpi-card { padding: 18px 20px; position: relative; transition: var(--transition); }
.kpi-card:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow-md); }
.kpi-label { font-size: 0.8667rem; font-weight: 700; color: var(--ink-subtle); }
.kpi-val { font-size: 2.1333rem; font-weight: 900; margin-top: 4px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi-sub { font-size: 0.8667rem; color: var(--ink-muted); margin-top: 4px; }

.portal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
.portal-card {
  padding: 24px; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
}
.portal-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: var(--shadow-md); }
.portal-icon {
  width: 52px; height: 52px; border-radius: 13px; display: grid; place-items: center;
  font-size: 1.7333rem; background: var(--primary-soft); color: var(--primary); transition: var(--transition);
}
.portal-card:hover .portal-icon { transform: scale(1.06) rotate(-3deg); }
.portal-title { font-size: 1.3333rem; font-weight: 900; margin: 10px 0 6px; letter-spacing: -.015em; }
.portal-desc { font-size: 0.9333rem; color: var(--ink-muted); margin: 0; line-height: 1.55; }

/* Section Header & Filter Strip */
.view-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
.view-title { font-size: 1.6667rem; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 10px; letter-spacing: -.02em; }
.filter-bar {
  padding: 15px 18px; margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
.input, .select {
  padding: 9px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong);
  background: var(--surface); color: var(--ink); font-size: 0.9333rem; outline: none;
}
.input:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.progress-track { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width .25s ease; }

/* VOCA Hub Mode Cards */
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 16px; }
.mode-card {
  padding: 19px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 9px;
  transition: all .18s ease;
}
.mode-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.mode-card h3 { margin: 0; font-size: 1.1333rem; font-weight: 900; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mode-card p { margin: 0; font-size: 0.92rem; color: var(--ink-muted); line-height: 1.5; }

/* Shared Helpers for Modals, Notebook Desktop & Responsive Directives */
.cw-top-grid { display: grid; grid-template-columns: 2fr 0.85fr 1.45fr; gap: 8px; }
.modal-actions-row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.nb-actions-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nb-part-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.ets-refer-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
.ws-corner-split-wrap { display: none; }
.formula-filter-summary, .toc-collapse-summary { display: none; }
.formula-topic-head {
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
  gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 14px;
}
.formula-mode-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.formula-drill-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
@media (max-width: 1460px) and (min-width: 901px) {
  .hide-pc-tight { display: none !important; }
}

/* VOCA Study Focus Shell — Wide Edge-Balanced Laptop Focus + Crisp Mobile */
.study-shell { max-width: min(1380px, calc(100vw - 44px)); margin: 0 auto; }
.study-topbar {
  padding: 9px 16px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; gap: 10px;
}
.study-topbar-title { display: flex; align-items: center; gap: 8px; min-width: 0; flex-shrink: 0; }
.study-topbar-actions { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; flex-shrink: 0; }
.study-mode-title { font-size: 0.95rem; }
.round-banner {
  padding: 6px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.round-stats-row { display: flex; align-items: center; gap: 16px; font-size: 0.88rem; flex-wrap: wrap; }
.round-stats-row span { display: inline-flex; align-items: center; gap: 4px; }
.round-progress { width: 240px; }

/* Flashcard 3D Stage & Mode Focus Cards (Large Laptop Visibility) */
.fc-stage { perspective: 1200px; max-width: min(1040px, 92vw); margin: 0 auto; }
.fc-card {
  position: relative; min-height: clamp(350px, 46vh, 450px); width: 100%; border-radius: 18px;
  transform-style: preserve-3d; transition: transform .42s cubic-bezier(.22, .88, .32, 1);
  cursor: pointer; user-select: none;
}
.fc-card.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: 18px;
  box-shadow: var(--shadow-md); padding: 26px 32px; display: flex; flex-direction: column; justify-content: space-between;
  overflow-y: auto;
}
.fc-face.fc-back { transform: rotateY(180deg); background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); }
.fc-word { font-size: clamp(2.5rem, 3.6vw, 3.3rem); font-weight: 900; letter-spacing: -.025em; color: var(--ink); text-align: center; }
.fc-ipa { font-size: 1.12rem; color: var(--primary); font-family: 'Segoe UI', sans-serif; text-align: center; margin-top: 4px; }
.fc-vi-main { font-size: clamp(1.8rem, 2.3vw, 2.25rem); font-weight: 800; color: var(--ink-vi); text-align: center; margin: 10px 0; }
.fc-actions-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; max-width: min(1040px, 92vw); margin: 14px auto 0;
}
.fc-actions-row.is-fc2 { max-width: min(760px, 92vw); }
.fc-action-btn {
  padding: 13px 12px; border-radius: 11px; border: 1.5px solid var(--border-strong);
  background: var(--surface); color: var(--ink); font-weight: 700; font-size: 0.94rem;
  display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all .15s ease;
}
.fc-action-btn small { font-size: 0.75rem; font-weight: 500; opacity: .82; }
.fc-action-btn.act-forget { border-color: #fca5a5; background: var(--danger-soft); color: var(--danger); }
.fc-action-btn.act-hard { border-color: #fcd34d; background: var(--warn-soft); color: var(--warn); }
.fc-action-btn.act-good { border-color: #93c5fd; background: var(--primary-soft); color: var(--primary); }
.fc-action-btn.act-easy { border-color: #86efac; background: var(--success-soft); color: var(--success); }
.fc-action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

.voca-focus-card { padding: 26px 32px; max-width: min(1080px, 94vw); margin: 0 auto; }
.voca-prompt-hero { text-align: center; margin: 14px 0 20px; }
.voca-opt-grid, .opt-list.voca-opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.voca-audio-ctrl-row { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: nowrap; }

/* Quizlet-style Round Summary Card */
.summary-hero { padding: 28px; text-align: center; }
.summary-flex { display: flex; align-items: center; justify-content: center; gap: 28px; flex-wrap: wrap; margin: 18px 0; }
.summary-stat-box { padding: 12px 18px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); min-width: 135px; }
.missed-list { max-height: 280px; overflow-y: auto; text-align: left; border: 1px solid var(--border); border-radius: 10px; margin: 14px 0; }
.missed-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.missed-row:last-child { border-bottom: none; }

/* Voca List Table & Match Grid */
.voca-row-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 11px; }
.voca-item-card { padding: 13px 15px; display: flex; flex-direction: column; gap: 6px; }
.match-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.match-tile {
  min-height: clamp(96px, 13vh, 138px); padding: 12px; border-radius: 12px; border: 1.5px solid var(--border-strong);
  background: var(--surface); display: grid; place-items: center; text-align: center;
  font-weight: 700; font-size: 1.02rem; cursor: pointer; transition: all .14s;
}
.match-tile.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.match-tile.matched { border-color: var(--success); background: var(--success-soft); color: var(--success); opacity: .5; pointer-events: none; }
.match-tile.wrong { border-color: var(--danger); background: var(--danger-soft); animation: shake .25s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

/* Tests Hub Grid */
.test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
.test-card { padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
.test-card.is-featured { border-color: var(--primary); box-shadow: var(--shadow-md); }

/* =========================================================
   100vh PRACTICE & REAL EXAM WORKSPACE (ZERO OUTER SCROLL)
   ========================================================= */
.ws-root { display: none; }
body.is-workspace .ws-root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }

.ws-topbar {
  height: 50px; min-height: 50px; flex-shrink: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  position: relative; z-index: 80;
}
.ws-left-meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ws-title { font-size: 0.9rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Compact Inline Audio Pill */
.audio-pill {
  display: flex; align-items: center; gap: 6px; padding: 3px 8px;
  border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border-strong);
  height: 34px; position: relative;
}
.audio-play-btn {
  width: 26px; height: 26px; border-radius: 50%; border: none;
  background: var(--primary); color: #fff; font-size: 0.7333rem; display: grid; place-items: center; flex-shrink: 0;
}
.audio-range { width: 88px; accent-color: var(--primary); cursor: pointer; }
.audio-time { font-size: 0.7667rem; font-variant-numeric: tabular-nums; color: var(--ink-muted); min-width: 72px; text-align: center; }

.ws-right-actions { display: flex; align-items: center; gap: 6px; position: relative; }
.exam-timer {
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1rem;
  padding: 4px 10px; border-radius: 8px; background: var(--surface-3); color: var(--ink);
}
.exam-timer.warn { background: var(--warn-soft); color: var(--warn); }
.exam-timer.danger { background: var(--danger-soft); color: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.65} }

/* Dual Independent Scroll Split Panes + Draggable Resizer */
.ws-split {
  flex: 1 1 auto; min-height: 0;
  display: grid; grid-template-columns: minmax(0, var(--left-pane-pct, 50%)) 8px minmax(0, 1fr);
  background: var(--bg); position: relative;
}
.ws-resizer {
  width: 8px; background: var(--surface-3); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  cursor: col-resize; display: flex; align-items: center; justify-content: center; user-select: none; transition: background .15s;
}
.ws-resizer:hover, .ws-resizer.dragging { background: var(--primary-soft); border-color: var(--primary); }
.ws-resizer::after {
  content: '⋮'; font-size: 0.8rem; font-weight: 900; color: var(--ink-subtle);
}
.ws-pane {
  height: 100%; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden;
  padding: 16px 20px 32px; background: var(--surface); box-sizing: border-box;
}
.ws-split.is-part5.is-left-collapsed > .ws-pane-left {
  padding: 0 !important;
  border: none !important;
  overflow: hidden !important;
}
.ws-split.is-part5.is-left-collapsed > .ws-resizer {
  background: var(--primary-soft);
  border-right: 1.5px solid var(--primary);
}
.ws-pane-left { background: var(--surface); }
.ws-pane::-webkit-scrollbar { width: 8px; }
.ws-pane::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

/* Question Cards, Locked Option States & Strikethrough Eliminator */
.q-card {
  border: 1px solid var(--border); border-radius: 12px; padding: 15px 17px;
  margin-bottom: 14px; background: var(--surface); box-shadow: var(--shadow-sm);
}
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.q-stem { font-size: calc(1rem * var(--q-scale, 1)); font-weight: 700; margin-bottom: 10px; color: var(--ink); line-height: 1.55; }
.opt-list { display: flex; flex-direction: column; gap: 7px; }
.opt-row { display: flex; align-items: stretch; gap: 6px; }
.opt-btn {
  flex: 1; width: 100%; text-align: left; padding: 9px 12px; border-radius: 9px;
  border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--ink);
  display: flex; align-items: flex-start; gap: 10px; transition: all .12s;
  font-size: calc(0.9467rem * var(--q-scale, 1)); cursor: pointer;
  user-select: text; -webkit-user-select: text;
}
.opt-btn:hover:not(.is-locked-choice):not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
.opt-btn.is-eliminated {
  opacity: .42; text-decoration: line-through; background: var(--surface-2);
}
.opt-elim-btn {
  width: 30px; flex-shrink: 0; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink-subtle); font-size: 0.7333rem; font-weight: 800;
  display: grid; place-items: center; transition: var(--transition); cursor: pointer;
}
.opt-elim-btn:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.opt-elim-btn.active { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.opt-key {
  width: 24px; height: 24px; border-radius: 6px; background: var(--surface-3);
  font-weight: 800; font-size: 0.8333rem; display: grid; place-items: center; flex-shrink: 0;
  user-select: none;
}
.opt-btn.selected { border-color: var(--primary); background: var(--primary-soft); }
.opt-btn.selected .opt-key { background: var(--primary); color: #fff; }
.opt-btn.is-correct { border-color: var(--success); background: var(--success-soft); }
.opt-btn.is-correct .opt-key { background: var(--success); color: #fff; }
.opt-btn.is-wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt-btn.is-wrong .opt-key { background: var(--danger); color: #fff; }
.opt-btn.is-locked-choice,
.opt-btn:disabled { cursor: text; user-select: text !important; -webkit-user-select: text !important; }
.opt-btn .opt-content, .opt-btn .opt-vi { user-select: text !important; -webkit-user-select: text !important; }

.exp-drawer {
  margin-top: 11px; padding: 12px 14px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: calc(0.9067rem * var(--q-scale, 1)); line-height: 1.62;
}
.formula-pill {
  padding: 8px 11px; border-radius: 7px; background: var(--warn-soft);
  border-left: 3px solid var(--warn); color: var(--ink); font-weight: 600; margin-bottom: 8px;
}
.vocab-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.vocab-chip {
  padding: 4px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border-strong);
  font-size: 0.8rem; cursor: pointer;
}
.vocab-chip:hover { border-color: var(--primary); color: var(--primary); }

/* Passage / Script Styling */
.passage-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
  padding: 16px 18px; margin-bottom: 12px; font-size: calc(0.9867rem * var(--q-scale, 1)); line-height: 1.68;
}
.passage-line { margin-bottom: 9px; }
.speaker-tag { font-weight: 800; color: var(--primary); margin-right: 4px; }
.spoiler-blur { filter: blur(6px); user-select: none; pointer-events: none; transition: filter .2s; }
mark.user-hl { background: var(--highlight); color: inherit; padding: 1px 2px; border-radius: 3px; transition: box-shadow .15s, background .15s; }
#wsRoot mark.user-hl { cursor: pointer; }
#wsRoot mark.user-hl:hover { box-shadow: 0 0 0 1.5px var(--warn); }
mark.evidence-hl {
  background: rgba(13, 148, 136, 0.16); color: inherit;
  border-bottom: 2px solid #0d9488; padding: 1px 4px; border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(13, 148, 136, 0.25);
  animation: evPulse 1.1s ease-out 1;
}
body.theme-dark mark.evidence-hl {
  background: rgba(45, 212, 191, 0.18); border-bottom-color: #2dd4bf;
  box-shadow: 0 0 0 1px rgba(45, 212, 191, 0.35);
}
.ev-q-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 0.7rem; font-weight: 800; line-height: 1;
  padding: 2px 6px; margin-right: 5px; border-radius: 999px;
  background: #0d9488; color: #ffffff; vertical-align: 1px;
}
@keyframes evPulse {
  0% { box-shadow: 0 0 0 5px rgba(13, 148, 136, 0.38); }
  100% { box-shadow: 0 0 0 1px rgba(13, 148, 136, 0.25); }
}
.exp-section {
  margin-top: 8px; padding: 8px 10px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
}
.exp-section-title {
  font-size: 0.7667rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  color: var(--primary); display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 5px;
}
.exp-trap-list { margin: 4px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.exp-trap-item { font-size: 0.8533rem; line-height: 1.5; padding: 4px 8px; border-radius: 6px; background: var(--surface-2); }
.ets-sel-pop-btn.is-unhl { color: #dc2626; font-weight: 700; }
.page-img-frame { border-radius: 10px; border: 1px solid var(--border); overflow: hidden; background: #fff; cursor: zoom-in; }

/* Bottom Border Dock & Anchored 200-Question Popover */
.ws-bottom-dock {
  height: 50px; min-height: 50px; flex-shrink: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  position: relative; z-index: 35;
}
.palette-trigger {
  padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--border-strong);
  background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: 0.8667rem;
  display: inline-flex; align-items: center; gap: 8px; transition: var(--transition);
}
.palette-trigger:hover:not(:disabled) { border-color: var(--primary); }
.palette-trigger.is-locked-lc {
  border-color: var(--danger); background: var(--danger-soft); color: var(--danger);
  cursor: not-allowed; opacity: .9;
}

.palette-popover {
  position: fixed; bottom: 58px; left: 50%; transform: translateX(-50%);
  width: min(780px, 95vw); max-height: min(490px, 75vh); overflow-y: auto;
  background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: 14px;
  box-shadow: var(--shadow-lg); padding: 14px 16px; z-index: 140;
}
.pal-part-title { font-size: 0.8rem; font-weight: 800; color: var(--ink-subtle); margin: 10px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.pal-part-title:first-child { margin-top: 0; }
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 5px; }
.pal-cell {
  height: 32px; border-radius: 7px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--ink); font-size: 0.8rem; font-weight: 700;
  position: relative; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.pal-cell:hover:not(:disabled) { border-color: var(--primary); }
.pal-cell.is-current { outline: 2.5px solid var(--primary); outline-offset: 1px; }
.pal-cell.is-correct { background: var(--success); border-color: var(--success); color: #fff; }
.pal-cell.is-wrong { background: var(--danger); border-color: var(--danger); color: #fff; }
.pal-cell.is-picked { background: var(--primary); border-color: var(--primary); color: #fff; }
.pal-cell.is-locked {
  opacity: 0.85;
  cursor: not-allowed;
  background: var(--surface-2);
  color: var(--ink-muted);
  border-color: var(--border-strong);
}
.pal-cell.is-locked.is-picked {
  background: var(--primary);
  border-color: var(--primary);
  color: #ffffff;
  opacity: 0.88;
}
.pal-cell.is-flagged::after {
  content: ''; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px;
  border-radius: 50%; background: var(--warn);
}

/* Popover Menu (⋮ vertical controls) */
.menu-popover {
  position: absolute; top: calc(100% + 6px); right: 0; min-width: 240px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 11px;
  box-shadow: var(--shadow-lg); padding: 8px; z-index: 95; display: flex; flex-direction: column; gap: 4px;
}
.menu-item {
  width: 100%; text-align: left; padding: 7px 10px; border-radius: 7px; border: none;
  background: transparent; color: var(--ink); font-size: 0.8667rem; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.menu-item:hover { background: var(--surface-3); }

/* Auto-Advance Countdown Banner in Real Exam */
.exam-countdown-bar {
  position: fixed; bottom: 58px; left: 50%; transform: translateX(-50%);
  padding: 10px 18px; border-radius: 12px; z-index: 55;
  display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-lg);
  font-size: 0.9rem; font-weight: 700; min-width: min(560px, 92vw); justify-content: center;
}
.exam-countdown-bar.ok { background: #0f172a; color: #f8fafc; border: 1.5px solid var(--primary); }
.exam-countdown-bar.warn { background: #7c2d12; color: #fef2f2; border: 2px solid #f59e0b; }

/* Handbook & Rich Formula Tables */
.handbook-layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
.handbook-sidebar { padding: 12px; position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow-y: auto; }
.topic-item {
  width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: none;
  background: transparent; color: var(--ink-muted); font-size: 0.8667rem; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 2px;
}
.topic-item:hover { background: var(--surface-3); color: var(--ink); }
.topic-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.rich-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; }
.rich-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.rich-table th {
  background: var(--primary-soft); color: var(--primary); text-align: left; padding: 9px 12px;
  font-weight: 800; border-bottom: 1.5px solid var(--border-strong); position: sticky; top: 0;
}
.rich-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.rich-table tr:nth-child(even) td { background: var(--surface-2); }
.tag-chip { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.7333rem; font-weight: 800; margin-right: 5px; }
.tag-dau-hieu { background: var(--primary-soft); color: var(--primary); }
.tag-cong-thuc { background: var(--warn-soft); color: var(--warn); }
.tag-meo { background: var(--accent-soft); color: var(--accent); }
.tag-bay { background: var(--danger-soft); color: var(--danger); }
.tag-vi-du { background: var(--success-soft); color: var(--success); }

.cheatsheet-box {
  background: linear-gradient(135deg, var(--primary-soft) 0%, var(--accent-soft) 100%);
  border: 1.5px solid var(--border-strong); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
}
.cheat-formula-banner {
  padding: 10px 14px; border-radius: 9px; background: var(--surface); border: 1px solid var(--primary);
  font-weight: 800; color: var(--primary); margin: 10px 0 14px; font-size: 0.92rem;
}
.quiz-mask-card { padding: 15px 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: var(--surface); }
.quiz-mask-blur {
  padding: 10px 12px; border-radius: 8px; background: var(--surface-3); color: var(--ink);
  cursor: pointer; margin-top: 8px; border: 1px dashed var(--border-strong);
}
.quiz-mask-blur.is-hidden span { filter: blur(6px); opacity: .55; }
.quiz-mask-blur:not(.is-hidden) .mask-hint { display: none; }

/* Formula Practice Drill Cards */
.drill-card {
  border: 1.5px solid var(--border); border-radius: 14px; padding: 16px 18px;
  margin-bottom: 14px; background: var(--surface); box-shadow: var(--shadow-sm);
}
.drill-context {
  padding: 12px 14px; border-radius: 10px; background: var(--surface-2);
  border-left: 3.5px solid var(--primary); margin-bottom: 12px; font-size: 0.92rem; line-height: 1.62;
}

/* Modals, Lightbox & Toast */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .62); backdrop-filter: blur(3px); z-index: 90;
  display: grid; place-items: center; padding: 16px;
}
.modal-card {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px;
  max-width: 680px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow-lg);
}
.toast-container { position: fixed; top: 64px; right: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 14px; border-radius: 10px; background: #0f172a; color: #f8fafc;
  font-size: 0.8667rem; font-weight: 600; box-shadow: var(--shadow-lg); max-width: 360px;
}

/* Responsive Tablet & Mobile (Consolidated cleanly at bottom of stylesheet) */
@media (max-width: 900px) {
  .ws-pane-left { border-right: none; border-bottom: 1.5px solid var(--border); }
}

/* ================= v3.0 & v4.0 COMPONENT STYLES ================= */
.requeue-strip {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 12px; border-radius: 10px;
  background: var(--warn-soft); border: 1px solid rgba(217,119,6,0.35);
  font-size: 0.8rem; font-weight: 700; color: var(--warn); margin-bottom: 10px;
}
.requeue-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;

  background: var(--primary-soft); color: var(--primary);

}

}
.cloze-input-inline {

}

}
.masked-cell {
  filter: blur(5px); user-select: none; cursor: pointer;
  transition: filter 0.18s ease;
}

  filter: none; user-select: auto;

/* ============================================================================
   v5.0 — ANIMATED VECTOR SVG ICONS & QUIET LUXURY EDITORIAL SYSTEM
   ============================================================================ */
.ets-icon {
  width: 17px;
  height: 17px;
  display: inline-block;
  vertical-align: -3px;
  flex-shrink: 0;
  overflow: visible;
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
}
.brand-badge .ets-icon {
  width: 20px;
  height: 20px;
  vertical-align: -4px;
}
.ets-icon-draw {
  stroke-dasharray: 100;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}
button:hover .ets-icon-draw,
.nav-tab:hover .ets-icon-draw,
.card:hover .ets-icon-draw {
  animation: etsStrokeDraw 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
button:hover .ets-icon-pulse,
.nav-tab:hover .ets-icon-pulse {
  animation: etsPulseScale 0.55s ease-in-out;
  transform-origin: center;
}
button:hover .ets-icon-wave {
  animation: etsWavePulse 0.65s ease-in-out infinite alternate;
}
button:hover .ets-icon-spin {
  animation: etsSpinSlow 1.8s linear infinite;
  transform-origin: center;
}
button:hover .ets-icon-bounce {
  animation: etsBounceVert 0.5s ease-in-out;
}
button:hover .ets-icon-tilt {
  transform: rotate(-12deg) scale(1.06);
  transform-origin: center;
}

@keyframes etsStrokeDraw {
  0% { stroke-dashoffset: 100; }
  100% { stroke-dashoffset: 0; }
}
@keyframes etsPulseScale {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.16); }
}
@keyframes etsWavePulse {
  0% { opacity: 0.45; transform: translateX(0); }
  100% { opacity: 1; transform: translateX(1.2px); }
}
@keyframes etsSpinSlow {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes etsBounceVert {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2.5px); }
}

    if (/web\s*page|website|trang\s*web/.test(h)) return 'Web page';
    if (/press\s*release|thông\s*cáo/.test(h)) return 'press release';
    if (/customer\s*review|product\s*review|\breview\b|đánh\s*giá/.test(h)) return 'review';
    if (/blog\s*post|\bblog\b/.test(h)) return 'blog post';
    if (/article|bài\s*báo/.test(h)) return 'article';
    if (/\bletter\b|\bthư\b/.test(h)) return 'letter';
    if (/\bmemo\b|memorandum|biên\s*bản\s*ghi\s*nhớ/.test(h)) return 'memo';
    if (/advertisement|\bad\b|quảng\s*cáo/.test(h)) return 'advertisement';
    if (/coupon|phiếu\s*giảm/.test(h)) return 'coupon';
    if (/certificate|chứng\s*nhận/.test(h)) return 'certificate';
    if (/voucher/.test(h)) return 'voucher';
    if (/invoice|hóa\s*đơn/.test(h)) return 'invoice';
    if (/receipt|biên\s*lai/.test(h)) return 'receipt';
    if (/schedule|itinerary|lịch\s*trình/.test(h)) return 'schedule';
    if (/survey|khảo\s*sát/.test(h)) return 'survey';
    if (/report|báo\s*cáo/.test(h)) return 'report';
    if (/order\s*form/.test(h)) return 'order form';
    if (/registration\s*form/.test(h)) return 'registration form';
    if (/form|biểu\s*mẫu/.test(h)) return 'form';
    if (/flyer|tờ\s*rơi/.test(h)) return 'flyer';
    if (/brochure/.test(h)) return 'brochure';
    if (/announcement|thông\s*báo\s*tuyển/.test(h)) return 'announcement';
    if (/instructions|hướng\s*dẫn/.test(h)) return 'instructions';
    if (/information|thông\s*tin/.test(h)) return 'information';
    if (/notice|thông\s*báo/.test(h)) return 'notice';
    var map = {
      sms: 'text-message chain',
      chat: 'online chat discussion',
      email: 'e-mail',
      webpage: 'Web page',
      form: 'form',
      coupon: 'coupon',
      ad: 'advertisement',
      article: 'article',
      letter: 'letter',
      notice: 'notice'
    };
    return map[fallbackType] || 'text';
  }

  ETS.formatPart7ReferLabel = function (docBlocks) {
    if (!Array.isArray(docBlocks) || !docBlocks.length) return 'text';
    var labels = docBlocks.map(function (b) { return (b && b.docLabel) || inferDocLabelFromHint('', b && b.type); });
    function pluralize(lbl) {
      if (lbl === 'information' || lbl === 'instructions') return lbl;
      if (lbl.endsWith('s')) return lbl;
      return lbl + 's';
    }
    if (labels.length === 1) return labels[0];
    if (labels.length === 2) {
      if (labels[0] === labels[1]) return pluralize(labels[0]);
      return labels[0] + ' and ' + labels[1];
    }
    if (labels[0] === labels[1] && labels[1] === labels[2]) return pluralize(labels[0]);
    if (labels[0] === labels[1]) return pluralize(labels[0]) + ' and ' + labels[2];
    if (labels[1] === labels[2]) return labels[0] + ' and ' + pluralize(labels[1]);
    return labels[0] + ', ' + labels[1] + ', and ' + labels[2];
  };

  function withDocLabel(block, hint) {
    block.docLabel = inferDocLabelFromHint(hint, block.type);
    return block;
  }

  function classifyRawDoc(doc, idx, totalDocs, globalCtxLower) {
    var lns = doc.lines || [];
    var ownHint = ((doc.title || '') + ' ' + (doc.headerHint || '')).toLowerCase();
    var hint = (totalDocs > 1) ? ownHint : (ownHint + ' ' + globalCtxLower);
    var allEn = lns.map(function (l) { return l.en || ''; }).join('\n');

    // Check for SMS / Text message chain / Online chat
    var timeMsgCount = 0;
    var uniqueSenders = [];
    lns.forEach(function (l) {
      var spk = String(l.speaker || '').trim();
      var en = String(l.en || '').trim();
      var s = spk + ' ' + en;
      if (/\(\d{1,2}:\d{2}\s*[AP]\.?M\.?\)/i.test(s) || /\[?\d{1,2}:\d{2}\s*[AP]\.?M\.?\]?/i.test(l.time || '')) {
        timeMsgCount++;
        var mSender = en.match(/^([A-Z][A-Za-z\s.-]{1,28})\s*\(\d{1,2}:\d{2}\s*[AP]\.?M\.?\)/i) ||
                      spk.match(/^(.+?)\s*\(\d{1,2}:\d{2}\s*[AP]\.?M\.?\)/i);
        var sName = mSender ? mSender[1].trim() : spk;
        if (sName && uniqueSenders.indexOf(sName) === -1) uniqueSenders.push(sName);
      }
    });
    if (timeMsgCount >= 2 || /text[\s-]*message|sms|online\s*chat|chat\s*discussion|tin\s*nhắn|thảo\s*luận\s*trực\s*tuyến/i.test(hint)) {
      var isExplicitSms = /text[\s-]*message|sms|chuỗi\s*tin\s*nhắn/i.test(hint) && !/online\s*chat|chat\s*discussion/i.test(hint);
      var isExplicitChat = /chat\s*discussion|online\s*chat|thảo\s*luận\s*trực\s*tuyến/i.test(hint);
      if (isExplicitChat || (!isExplicitSms && uniqueSenders.length >= 3)) {
        return withDocLabel(buildChatBlockFromLines(doc, lns), hint);
      }
      return withDocLabel(buildSmsBlockFromLines(doc, lns), hint);
    }

    // Check for Email BEFORE Webpage so URLs mentioned inside an email body don't hijack the Email card
    if (/^(To|From)\s*:/im.test(allEn) || /\be-?mail\b|thư\s*điện\s*tử/i.test(ownHint) || (totalDocs === 1 && /\be-?mail\b|thư\s*điện\s*tử/i.test(hint))) {
      return withDocLabel(buildEmailBlockFromLines(doc, lns), hint);
    }

    // Check for Webpage
    if (/trang\s*web|web\s*page|website/i.test(ownHint) || (!/^(To|From)\s*:/im.test(allEn) && (/https?:\/\/|www\./i.test(allEn.split('\n').slice(0, 3).join(' ')) || /web\s*page|website/i.test(hint)))) {
      return withDocLabel(buildWebpageBlockFromLines(doc, lns), hint);
    }

    // Check for Form / Order / Invoice / Schedule / Table / Report / Survey
    if (/invoice|order\s*form|registration\s*form|schedule|directory|price\s*list|receipt|biểu\s*mẫu|bảng\s*biểu|hóa\s*đơn|lịch\s*trình|báo\s*cáo|report|form|chart|survey|khảo\s*sát|biên\s*lai/i.test(hint)) {
      return withDocLabel(buildPaperBlockFromLines('form', doc, lns), hint);
    }

    // Check for Coupon / Certificate
    if (/coupon|certificate|voucher|phiếu\s*giảm|chứng\s*nhận/i.test(hint)) {
      return withDocLabel(buildPaperBlockFromLines('coupon', doc, lns), hint);
    }

    // Check for Ad / Flyer
    if (/advertisement|flyer|brochure|poster|quảng\s*cáo|tờ\s*rơi/i.test(hint)) {
      return withDocLabel(buildPaperBlockFromLines('ad', doc, lns), hint);
    }

    // Check for Article / Press Release / Review / Blog post
    if (/article|press\s*release|review|blog\s*post|bài\s*báo|thông\s*cáo|đánh\s*giá/i.test(hint)) {
      return withDocLabel(buildPaperBlockFromLines('article', doc, lns), hint);
    }

    // Check for Letter
    if (/Dear\s+[A-Z]/m.test(allEn) || /\bletter\b|\bthư\b/i.test(hint)) {
      return withDocLabel(buildPaperBlockFromLines('letter', doc, lns), hint);
    }

    // Default Notice / Memo
    return withDocLabel(buildPaperBlockFromLines('notice', doc, lns), hint);
  }

  function buildEmailBlockFromLines(doc, lns) {
    var headers = [];
    var body = [];
    var inHeader = true;
    for (var i = 0; i < lns.length; i++) {
      var en = String(lns[i].en || '').trim();
      var vi = String(lns[i].vi || '').trim();
      var spk = String(lns[i].speaker || '').trim();
      if (inHeader && /^(To|From|Date|Subject|Sent|Cc|Attachment|Attachments|Re)\s*:/i.test(en)) {
        // Normalize single-line compact emails ("To: A From: B Date: C Subject: D Dear ...")
        var normEn = en.indexOf('\n') === -1 && en.indexOf('|') === -1
          ? en.replace(/\s+(?=(?:From|Date|Subject|Sent|Cc|Attachment|Attachments)\s*:)/gi, '\n')
          : en;
        var parts = normEn.split(/\s*\|\s*|\n+/);
        var pendingBodyVi = false;
        parts.forEach(function (p) {
          var m = p.match(/^(To|From|Date|Subject|Sent|Cc|Attachment|Attachments|Re)\s*:\s*(.*)$/i);
          if (m) {
            var hLabel = m[1] + ':';
            var hVal = m[2].trim();
            if (/^Subject$/i.test(m[1])) {
              var greetSplit = hVal.match(/^(.{2,70}?)\s+((?:Dear\s+[A-Z]|Hello[,! ]|Hi[,! ]|Good\s+(?:morning|afternoon)|To\s+Whom|We\s+are\s+writing|Thank\s+you\s+for|Please\s+note|I\s+am\s+writing)[\s\S]*)$/);
              if (greetSplit) {
                headers.push({ label: hLabel, value: greetSplit[1].trim(), vi: '' });
                body.push({ en: greetSplit[2].trim(), vi: vi });
                pendingBodyVi = true;
                return;
              }
            }
            headers.push({ label: hLabel, value: hVal, vi: (parts.length === 1 ? vi : '') });
          } else if (p.trim()) {
            body.push({ en: p.trim(), vi: pendingBodyVi ? '' : vi });
            pendingBodyVi = true;
          }
        });
        if (normEn !== en && body.length === 0 && headers.length > 0) {
          inHeader = true;
        }
      } else if (inHeader && /^(To|From|Date|Subject|Attachment)$/i.test(spk)) {
        headers.push({ label: spk + ':', value: en, vi: vi });
      } else {
        if (headers.length > 0) inHeader = false;
        body.push({ speaker: spk, en: en, vi: vi, units: lns[i].units || null });
      }
    }
    return {
      type: 'email',
      headerStyle: (headers.length <= 4) ? 'boxed' : 'table',
      headers: headers,
      body: body
    };
  }

  function buildWebpageBlockFromLines(doc, lns) {
    var url = 'https://www.ets-global-business.org';
    var body = [];
    for (var i = 0; i < lns.length; i++) {
      var en = String(lns[i].en || '').trim();
      var vi = String(lns[i].vi || '').trim();
      var mUrl = en.match(/(https?:\/\/[^\s|]+|www\.[^\s|]+)/i);
      if (mUrl && i <= 2) {
        url = mUrl[1];
        var rest = en.replace(mUrl[0], '').replace(/^[|\s—-]+|[|\s—-]+$/g, '').trim();
        if (rest) body.push({ en: rest, vi: vi, units: lns[i].units || null, isHeading: true });
      } else {
        body.push({ speaker: lns[i].speaker, en: en, vi: vi, units: lns[i].units || null, isHeading: (i === 0 && en.length < 75) });
      }
    }
    return {
      type: 'webpage',
      url: url,
      body: body
    };
  }

  function buildSmsBlockFromLines(doc, lns) {
    var messages = [];
    var sendersSeen = [];
    lns.forEach(function (l) {
      var spk = String(l.speaker || '').trim();
      var en = String(l.en || '').trim();
      var vi = String(l.vi || '').trim();
      if (!en) return;
      var sender = spk || 'Sender';
      var time = l.time || '';
      var m = en.match(/^([A-Z][A-Za-z\s.-]{1,32})\s*\((\d{1,2}:\d{2}\s*[AP]\.?M\.?)\)\s*:?\s*(.*)$/i);
      if (m) {
        sender = m[1].trim();
        time = m[2].trim();
        en = m[3].trim();
      } else {
        var mSpk = spk.match(/^(.+?)\s*\((\d{1,2}:\d{2}\s*[AP]\.?M\.?)\)$/i);
        if (mSpk) {
          sender = mSpk[1].trim();
          time = mSpk[2].trim();
        }
        var escSender = sender.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var dupRx = new RegExp('^' + escSender + '\\s*(?:\\(\\d{1,2}:\\d{2}\\s*[AP]\\.?M\\.?\\))?\\s*[:\\-]\\s*', 'i');
        en = en.replace(dupRx, '').trim();
      }
      if (sendersSeen.indexOf(sender) === -1) sendersSeen.push(sender);
      var side = (sendersSeen.indexOf(sender) % 2 === 0) ? 'left' : 'right';
      messages.push({ sender: sender, time: time, en: en, vi: vi, side: side });
    });
    return {
      type: 'sms',
      messages: messages
    };
  }

  function buildChatBlockFromLines(doc, lns) {
    var messages = [];
    lns.forEach(function (l) {
      var spk = String(l.speaker || '').trim();
      var en = String(l.en || '').trim();
      var vi = String(l.vi || '').trim();
      if (!en) return;
      var sender = spk || 'Participant';
      var time = l.time || '';
      var m = en.match(/^([A-Z][A-Za-z\s.-]{1,32})\s*\((\d{1,2}:\d{2}\s*[AP]\.?M\.?)\)\s*:?\s*(.*)$/i);
      if (m) {
        sender = m[1].trim();
        time = m[2].trim();
        en = m[3].trim();
      } else {
        var mSpk = spk.match(/^(.+?)\s*\((\d{1,2}:\d{2}\s*[AP]\.?M\.?)\)$/i);
        if (mSpk) {
          sender = mSpk[1].trim();
          time = mSpk[2].trim();
        }
        var escSender = sender.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var dupRx = new RegExp('^' + escSender + '\\s*(?:\\(\\d{1,2}:\\d{2}\\s*[AP]\\.?M\\.?\\))?\\s*[:\\-]\\s*', 'i');
        en = en.replace(dupRx, '').trim();
      }
      messages.push({ sender: sender, time: time, en: en, vi: vi });
    });
    return {
      type: 'chat',
      messages: messages
    };
  }

  function buildPaperBlockFromLines(type, doc, lns) {
    var body = lns.map(function (l, idx) {
      var en = String(l.en || '').trim();
      return {
        speaker: l.speaker,
        en: en,
        vi: l.vi || '',
        units: l.units || null,
        isHeading: (idx === 0 && en.length < 85 && !/[.?!]$/.test(en))
      };
    });
    return {
      type: type,
      title: doc.headerHint || '',
      body: body
    };
  }

  // Render body paragraphs / bullets / key-value tables inside a document frame
  function renderDocBodyItems(items, showVi, docType) {
    if (!items || !items.length) return '';
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.table && Array.isArray(it.table)) {
        html += renderNativeTable(it.table, it.headers);
        continue;
      }
      var en = String(it.en || '').trim();
      var vi = String(it.vi || '').trim();
      if (!en) continue;

      var pipeCount = (en.match(/\|/g) || []).length;

      // Special case: First line of an article/survey/letter with 1 pipe (e.g. "Headline | CITY (Date)" or "23 November | Address")
      if (i === 0 && pipeCount === 1 && !/^https?:\/\//i.test(en)) {
        var nextEn = (items[1] && String(items[1].en || '').trim()) || '';
        var nextPipes = (nextEn.match(/\|/g) || []).length;
        var segs0 = en.split(/\s*\|\s*/);
        if (nextPipes === 0 && !/[$£€¥]|\b(?:Subtotal|Shipping|Total|Tax|Departs|Arrives)\b/i.test(en)) {
          if (docType === 'letter' || /^\d{1,2}\s+[A-Z][a-z]+/.test(segs0[0])) {
            html += '<div class="ets-doc-p" style="font-weight:700;margin-bottom:4px;">' + formatDocText(segs0[0]) + '</div>';
            html += '<div class="ets-doc-p" style="font-weight:600;margin-bottom:10px;">' + formatDocText(segs0[1]) + '</div>';
          } else {
            html += '<div class="ets-doc-heading">' + formatDocText(segs0[0]) + '</div>';
            html += '<div class="ets-doc-subheading">' + formatDocText(segs0[1]) + '</div>';
          }
          if (showVi && vi) {
            html += '<div class="ets-doc-vi-line">' + ETS.esc(vi) + '</div>';
          }
          continue;
        }
      }

      // Check if line contains pipe-delimited table / invoice / schedule / form rows (>= 1 pipe)
      if (pipeCount >= 1 && !/^https?:\/\//i.test(en)) {
        var cells = en.split(/\s*\|\s*/);
        // Group consecutive pipe-delimited rows that share the same column count into a bordered ETS table
        var groupRows = [{ cells: cells, vi: vi }];
        var j = i + 1;
        while (j < items.length) {
          var nxtIt = items[j];
          var nxtEn = String(nxtIt && nxtIt.en || '').trim();
          var nxtPipes = (nxtEn.match(/\|/g) || []).length;
          if (nxtPipes === pipeCount && !/^https?:\/\//i.test(nxtEn)) {
            groupRows.push({ cells: nxtEn.split(/\s*\|\s*/), vi: String(nxtIt.vi || '').trim() });
            j++;
          } else {
            break;
          }
        }
        if (groupRows.length >= 2) {
          var firstRow = groupRows[0].cells;
          var looksLikeHeader = firstRow.every(function (c) {
            return c.length <= 42 && !/^[$£€¥]\s*\d|^\d{1,2}:\d{2}\s*[AP]\.?M\.?/i.test(c.trim());
          }) && !/^(?:Shipping|Subtotal|VAT|Tax|Discount|Total|Coffee|Time:|Event:|Venue:|Order:|Machine:|Location:|Test\s+\d+)/i.test(firstRow[0].trim());
          html += '<table class="ets-native-table">';
          var startRowIdx = 0;
          if (looksLikeHeader) {
            var hdrViCells = String(groupRows[0].vi || '').split(/\s*\|\s*/);
            html += '<thead><tr>';
            firstRow.forEach(function (h, hIdx) {
              var hVi = (showVi && hdrViCells.length === firstRow.length && hdrViCells[hIdx]) ? '<div class="ets-doc-vi-line" style="margin-top:3px;font-weight:500;">' + ETS.esc(hdrViCells[hIdx]) + '</div>' : '';
              html += '<th><div class="ets-td-en">' + formatDocText(h) + '</div>' + hVi + '</th>';
            });
            html += '</tr></thead>';
            startRowIdx = 1;
          }
          html += '<tbody>';
          for (var rIdx = startRowIdx; rIdx < groupRows.length; rIdx++) {
            var rCells = groupRows[rIdx].cells;
            var rViRaw = String(groupRows[rIdx].vi || '').trim();
            var rViCells = rViRaw ? rViRaw.split(/\s*\|\s*/) : [];
            var hasCellVi = showVi && rViCells.length === rCells.length;
            html += '<tr>';
            rCells.forEach(function (c, cIdx) {
              var isPriceCol = (cIdx === rCells.length - 1 && /^[$£€¥]\s*\d/.test(c.trim()));
              var isBoldRow = /^(?:Total|TOTAL|Subtotal|Total\s+owed|Total\s+paid|Total\s+amount)/i.test(rCells[0].trim());
              var styleAttr = (isPriceCol ? 'text-align:right;font-weight:700;' : '') + (isBoldRow ? 'font-weight:800;' : '');
              var cVi = (hasCellVi && rViCells[cIdx] && rViCells[cIdx].trim() !== c.trim())
                ? '<div class="ets-doc-vi-line" style="margin-top:3px;font-weight:500;text-align:left;">' + ETS.esc(rViCells[cIdx].trim()) + '</div>'
                : '';
              html += '<td' + (styleAttr ? ' style="' + styleAttr + '"' : '') + '><div class="ets-td-en">' + formatDocText(c) + '</div>' + cVi + '</td>';
            });
            html += '</tr>';
            if (showVi && !hasCellVi && rViRaw) {
              html += '<tr class="ets-table-vi-row"><td colspan="' + rCells.length + '" style="padding:3px 10px;background:var(--surface-2);"><div class="ets-doc-vi-line" style="margin:0;">' + ETS.esc(rViRaw) + '</div></td></tr>';
            }
          }
          html += '</tbody></table>';
          i = j - 1;
          continue;
        }

        html += '<div class="ets-doc-kv-row">';
        cells.forEach(function (c, cIdx) {
          var isRight = (cells.length === 2 && cIdx === 1 && /^[$£€¥]\s*\d/.test(c.trim()));
          html += '<div class="ets-doc-kv-cell"' + (isRight ? ' style="text-align:right;font-weight:700;"' : '') + '>' + formatDocText(c) + '</div>';
        });
        html += '</div>';
        if (showVi && vi) {
          html += '<div class="ets-doc-vi-line">' + ETS.esc(vi) + '</div>';
        }
        continue;
      }

      // Check for Contact/Order Form Field: Value lines inside `form` documents
      if (docType === 'form' && i > 0) {
        var mFormKv = en.match(/^([A-Z][A-Za-z0-9\s/()?-]{1,34}):\s+(.+)$/);
        if (mFormKv && en.length < 130) {
          html += '<div class="ets-doc-kv-row">' +
            '<div class="ets-doc-kv-cell" style="font-weight:800;max-width:210px;">' + ETS.esc(mFormKv[1] + ':') + '</div>' +
            '<div class="ets-doc-kv-cell">' + formatDocText(mFormKv[2]) + '</div>' +
          '</div>';
          if (showVi && vi) {
            html += '<div class="ets-doc-vi-line">' + ETS.esc(vi) + '</div>';
          }
          continue;
        }
      }

      var isBullet = /^[•\-*▪]\s+/.test(en);
      var isHeading = it.isHeading || (i === 0 && en.length < 75 && !/[.,:;]$/.test(en) && !/^Dear\s/i.test(en));
      var cls = 'ets-doc-p';
      if (isHeading) cls = 'ets-doc-heading';
      else if (isBullet) cls = 'ets-doc-bullet';
      else if (/^(Dear\s|Sincerely|Best regards|Warm regards|Cordially|Yours truly)/i.test(en)) cls = 'ets-doc-salutation';

      if (Array.isArray(it.units) && it.units.length > 0 && !isHeading) {
        if (showVi) {
          html += '<div class="ets-bilingual-units">';
          it.units.forEach(function (u, uIdx) {
            var uEn = String(u && u.en || '').trim();
            var uVi = String(u && u.vi || '').trim();
            if (!uEn) return;
            html += (uIdx > 0 ? ' ' : '') +
              '<div class="ets-bilingual-unit">' +
                '<div class="ets-unit-en ' + cls + '">' + formatDocText(uEn) + '</div>' +
                (uVi ? '<div class="ets-unit-vi">' + ETS.esc(uVi) + '</div>' : '') +
              '</div>';
          });
          html += '</div>';
        } else {
          html += '<div class="' + cls + '">' + it.units.map(function (u) { return formatDocText(String(u && u.en || '').trim()); }).join(' ') + '</div>';
        }
        continue;
      }

      html += '<div class="' + cls + '">' + formatDocText(en) + '</div>';
      if (showVi && vi) {
        html += '<div class="ets-doc-vi-line">' + ETS.esc(vi) + '</div>';
      }
    }
    return html;
  }

  function renderNativeTable(rows, headers, mergedHeader, subHeaders) {
    var colCount = 0;
    if (headers && headers.length) colCount = Math.max(colCount, headers.length);
    if (subHeaders && subHeaders.length) colCount = Math.max(colCount, subHeaders.length);
    if (rows && rows.length) {
      rows.forEach(function (r) { if (Array.isArray(r)) colCount = Math.max(colCount, r.length); });
    }
    if (colCount < 1) colCount = 2;

    var html = '<table class="ets-native-table">';
    if (mergedHeader || (headers && headers.length) || (subHeaders && subHeaders.length)) {
      html += '<thead>';
      if (mergedHeader) {
        var mhHtml = String(mergedHeader).split(/\r?\n/).map(function (seg) { return formatDocText(seg); }).join('<br>');
        html += '<tr class="ets-tbl-merged-hdr"><th colspan="' + colCount + '">' + mhHtml + '</th></tr>';
      }
      if (headers && headers.length) {
        html += '<tr>';
        headers.forEach(function (h) { html += '<th>' + formatDocText(h) + '</th>'; });
        html += '</tr>';
      }
      if (subHeaders && subHeaders.length) {
        html += '<tr class="ets-tbl-sub-hdr">';
        subHeaders.forEach(function (sh) { html += '<th>' + formatDocText(sh) + '</th>'; });
        html += '</tr>';
      }
      html += '</thead>';
    }
    html += '<tbody>';
    (rows || []).forEach(function (r) {
      html += '<tr>';
      r.forEach(function (cell) { html += '<td>' + formatDocText(String(cell)) + '</td>'; });
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  // Main renderer for a single ETS Document Block (Part 7 & Part 6)
  ETS.renderExamDocument = function (block, showVi) {
    if (!block) return '';
    var type = (block.type || 'notice').toLowerCase();

    // 1. ETS EMAIL WINDOW (.ets-doc-email)
    if (type === 'email') {
      var headers = block.headers || [];
      var hStyle = block.headerStyle || 'boxed';
      var headerHtml = '';
      if (hStyle === 'boxed' && headers.length > 0) {
        headerHtml += '<div class="ets-email-header-grid">';
        headers.forEach(function (h) {
          headerHtml +=
            '<div class="ets-email-hdr-row">' +
              '<div class="ets-email-hdr-label">' + ETS.esc(h.label) + '</div>' +
              '<div class="ets-email-hdr-val">' +
                '<span class="ets-email-hdr-en">' + ETS.esc(h.value) + '</span>' +
                (showVi && h.vi ? '<div class="ets-doc-vi-line" style="margin-top:3px;">' + ETS.esc(h.vi) + '</div>' : '') +
              '</div>' +
            '</div>';
        });

        headerHtml += '<div class="ets-email-titlebar">E-Mail Message</div>';
        headerHtml += '<div class="ets-email-table-hdr">';
        headers.forEach(function (h) {
          headerHtml +=
            '<div class="ets-email-th-row">' +
              '<span class="ets-email-th-lbl">' + ETS.esc(h.label) + '</span>' +
              '<span class="ets-email-th-val">' +
                '<span class="ets-email-hdr-en">' + ETS.esc(h.value) + '</span>' +
                (showVi && h.vi ? '<div class="ets-doc-vi-line" style="margin-top:3px;">' + ETS.esc(h.vi) + '</div>' : '') +
              '</span>' +

        });
        headerHtml += '</div>';

      return (

            '<div class="ets-email-body-paper">' +

          '</div>' +
        '</div>'
      );
    }

    // 2. ETS WEB PAGE BROWSER FRAME (.ets-doc-webpage)
    if (type === 'webpage') {
      var url = block.url || 'https://www.ets-global-business.org';
      var navTabs = '';
      if (block.tabs && block.tabs.length) {
        navTabs = '<div class="ets-web-tabs">';
        block.tabs.forEach(function (t, idx) {
          navTabs += '<span class="ets-web-tab' + (idx === 0 ? ' active' : '') + '">' + ETS.esc(t) + '</span>';
        });
        navTabs += '</div>';
      }
      return (
        '<div class="ets-exam-doc ets-doc-webpage">' +
          '<div class="ets-web-topbar">' +
            '<div class="ets-web-url-pill">' +
              ETS.icon('globe', 'ets-url-ico') +
              '<span class="ets-url-text">' + ETS.esc(url) + '</span>' +
            '</div>' +
          '</div>' +
          navTabs +
          '<div class="ets-web-body-wrap">' +
            '<div class="ets-web-body-paper">' +
              renderDocBodyItems(block.body, showVi, 'webpage') +
            '</div>' +
            renderEtsVScroll(12, 44) +
          '</div>' +
          renderEtsHScroll(10, 48) +
        '</div>'
      );
    }

    // 3. ETS SMARTPHONE TEXT-MESSAGE CHAIN (.ets-doc-sms)
    if (type === 'sms') {
      var msgs = block.messages || [];
      var bubblesHtml = '';
      msgs.forEach(function (m) {
        var side = m.side === 'right' ? 'right' : 'left';
        bubblesHtml +=
          '<div class="ets-sms-bubble ets-sms-' + side + '">' +
            '<div class="ets-sms-sender">' +
              ETS.esc(m.sender) + (m.time ? ' <span class="ets-sms-time">(' + ETS.esc(m.time) + ')</span>' : '') +
            '</div>' +
            '<div class="ets-sms-text">' + formatDocText(m.en) + '</div>' +
            (showVi && m.vi ? '<div class="ets-doc-vi-line">' + ETS.esc(m.vi) + '</div>' : '') +
          '</div>';
      });
      return (
        '<div class="ets-exam-doc ets-doc-sms">' +
          '<div class="ets-sms-bezel">' +
            '<div class="ets-sms-notch">' +
              '<span class="ets-sms-speaker"></span>' +
              '<span class="ets-sms-cam"></span>' +
            '</div>' +
            '<div class="ets-sms-screen">' +
              bubblesHtml +
            '</div>' +
            '<div class="ets-sms-homebar"></div>' +
          '</div>' +

      );

    // 4. ETS ONLINE CHAT DISCUSSION WINDOW (.ets-doc-chat)
    if (type === 'chat') {
      var cMsgs = block.messages || [];
      var chatRows = '';
      cMsgs.forEach(function (m) {
        chatRows +=
          '<div class="ets-chat-entry">' +
            '<div class="ets-chat-author">' +
              ETS.esc(m.sender) + (m.time ? ' <span class="ets-chat-time">' + ETS.esc(m.time) + '</span>' : '') +
            '</div>' +
            '<div class="ets-chat-msg">' + formatDocText(m.en) + '</div>' +
            (showVi && m.vi ? '<div class="ets-doc-vi-line">' + ETS.esc(m.vi) + '</div>' : '') +
          '</div>';
      });
      return (
        '<div class="ets-exam-doc ets-doc-chat">' +
          '<div class="ets-chat-topbar">' +
            '<div class="ets-chat-group-avatar">' + ETS.icon('users-group') + '</div>' +
            '<div class="ets-chat-topbar-title">' + ETS.esc(block.title || 'Online Chat Discussion') + '</div>' +
          '</div>' +
          '<div class="ets-chat-body-wrap">' +
            '<div class="ets-chat-paper">' +
              chatRows +
            '</div>' +
            renderEtsVScroll(24, 38) +
          '</div>' +
          renderEtsHScroll(8, 52) +

            '<div class="ets-chat-input-mock">Type a message...</div>' +

    // 5. COUPON / VOUCHER (.ets-doc-coupon)
    if (type === 'coupon') {
      return (
        '<div class="ets-exam-doc ets-doc-coupon">' +
          '<div class="ets-coupon-inner">' +
            (block.title ? '<div class="ets-doc-banner-title">' + ETS.esc(block.title) + '</div>' : '') +
            renderDocBodyItems(block.body, showVi, 'coupon') +
          '</div>' +
        '</div>'
      );
