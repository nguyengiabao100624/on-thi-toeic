  function refreshVocaSetupSummary() {
    if (!setupDraft) return;
    const pool = computeSetupPool(setupDraft);
    const takeCount = setupDraft.mode === 'list' && setupDraft.batchSize >= 9999
      ? pool.length
      : Math.min(pool.length, Math.max(1, Number(setupDraft.batchSize) || 25));

    document.querySelectorAll('.voca-pack-pill[data-pack]').forEach((el) => {
      el.classList.toggle('active', setupDraft.selectedSet.has(el.dataset.pack));
    });

    const isAllBatch = Number(setupDraft.batchSize) >= 9999;
    document.querySelectorAll('[data-setup-batch]').forEach((btn) => {
      const bVal = Number(btn.dataset.setupBatch);
      const isAct = (bVal >= 9999 && isAllBatch) || (bVal < 9999 && Number(setupDraft.batchSize) === bVal);
      btn.classList.toggle('btn-primary', isAct);
    });

    document.querySelectorAll('[data-setup-bool]').forEach((btn) => {
      const [k, rawFlag] = btn.dataset.setupBool.split(':');
      const expected = rawFlag === '1';
      btn.classList.toggle('btn-primary', Boolean(setupDraft[k]) === expected);
    });

    const summaryEl = document.getElementById('vocaSetupSummaryBox');
    if (summaryEl) {
      summaryEl.classList.toggle('is-empty', pool.length === 0);
      summaryEl.innerHTML = pool.length > 0 ? `
        <div style="font-size:0.8667rem;line-height:1.5;">
          <strong style="display:inline-flex;align-items:center;gap:5px;">${icon('layers')} Gói đã chọn: ${esc(formatDraftTestsSummary(setupDraft))}</strong>
          <div style="color:var(--ink-muted);">
            Khớp bộ lọc: <strong>${pool.length}</strong> từ → Sẽ học ngay đợt này: <strong style="color:var(--primary);">${takeCount} từ</strong>
          </div>
        </div>
        <span class="badge badge-primary">${esc(setupDraft.section === 'ALL' ? 'LC + RC' : setupDraft.section)} · ${takeCount} từ</span>
      ` : `
        <div style="font-size:0.8667rem;font-weight:700;display:flex;align-items:center;gap:6px;">
          ${icon('alert')} Không có từ nào khớp (hoặc chưa chọn gói Test). Hãy bật thêm gói Test hoặc nới bộ lọc trạng thái!
        </div>
      `;
    }

    const startBtn = document.getElementById('vocaSetupStartBtn');
    if (startBtn) {
      startBtn.disabled = pool.length === 0;
      startBtn.innerHTML = pool.length > 0
        ? `${icon('play')} Bắt Đầu Học Ngay (${takeCount} từ)`
        : `${icon('alert')} Chưa có từ khớp điều kiện`;
    }
  }

              <input id="vocaSetupCustomBatch" type="number" min="1" max="2000" class="input" style="width:125px;padding:6px 10px;"
                placeholder="Tự nhập số..." value="${esc(customInpVal)}" oninput="ETS.setVocaSetupCustomBatch(this.value)">

  function setVocaSetupField(key, val) {
    if (!setupDraft) return;
    setupDraft[key] = val;
    refreshVocaSetupSummary();
  }

  function setVocaSetupBatchPreset(n) {
    if (!setupDraft) return;
    setupDraft.batchSize = Number(n) || 25;
    const inp = document.getElementById('vocaSetupCustomBatch');
    if (inp) inp.value = setupDraft.batchSize >= 9999 ? '' : String(setupDraft.batchSize);
    refreshVocaSetupSummary();
  }

  function setVocaSetupCustomBatch(raw) {
    if (!setupDraft) return;
    const n = parseInt(raw, 10);
    setupDraft.batchSize = (!isNaN(n) && n > 0) ? Math.min(2000, n) : 9999;
    refreshVocaSetupSummary();
  }

  function toggleVocaSetupTest(code) {
    if (!setupDraft) return;
    if (setupDraft.selectedSet.has(code)) setupDraft.selectedSet.delete(code);
    else setupDraft.selectedSet.add(code);
    refreshVocaSetupSummary();
  }

  function vocaSetupSelectPresetTests(kind) {
    if (!setupDraft) return;
    const hasCustom = (state.voca.customWords || []).length > 0;
    if (kind === 'NONE') {
      setupDraft.selectedSet.clear();
    } else if (kind === 'INCOMPLETE') {
      const inc = ALL_TEST_CODES.filter((code) => {
        const sub = DB.voca.filter((v) => v.testCode === code && !String(v.uid).startsWith('CUSTOM_'));
        return sub.filter((v) => state.voca.statuses[v.uid] === 'mastered').length < sub.length;
      });
      setupDraft.selectedSet = new Set(inc.length ? inc : ALL_TEST_CODES);
    } else {
      setupDraft.selectedSet = new Set(hasCustom ? [...ALL_TEST_CODES, 'CUSTOM'] : ALL_TEST_CODES);
    }
    refreshVocaSetupSummary();
  }

  function saveVocaSetupFilterOnly() {
    if (!setupDraft) return;
    persistDraftToFilter(setupDraft);
    ETS.closeModal();
    if (state.route === 'voca-hub') renderVocaHub();
    toast('Đã lưu bộ lọc & gói từ vựng!');
  }

  function launchConfiguredVocaStudy() {
    if (!setupDraft) return;
    const pool = computeSetupPool(setupDraft);
    if (!pool.length) {
      toast('Chưa có từ nào khớp bộ lọc — hãy chọn ít nhất 1 gói Test!');
      return;
    }
    const cfg = {
      direct: true,
      tests: Array.from(setupDraft.selectedSet),
      section: setupDraft.section,
      status: setupDraft.status,
      sortOrder: setupDraft.sortOrder,
      batchSize: setupDraft.batchSize,
      autoSpeak: setupDraft.autoSpeak,
      search: setupDraft.search,
      fcFront: setupDraft.fcFront,
      fcShowExample: setupDraft.fcShowExample,
      quizDir: setupDraft.quizDir,
      clozeModeType: setupDraft.clozeModeType,
      dictHideVi: setupDraft.dictHideVi,
      matchPairs: setupDraft.matchPairs,
      audioPauseSec: setupDraft.audioPauseSec,
      audioLoop: setupDraft.audioLoop,
      listPageSize: setupDraft.listPageSize,
      listMask: setupDraft.listMask,
    };
    const m = setupDraft.mode;
    persistDraftToFilter(setupDraft);
    ETS.closeModal();
    startVocaMode(m, cfg);
  }

  function shouldAutoSpeakPrompt(word) {
    if (!word || !ses || !ses.autoSpeak) return false;
    if ((ses.mode === 'fc1' || ses.mode === 'fc2') && ses.fcFront === 'VI_FIRST') return false;
    if ((ses.mode === 'quiz' || (ses.mode === 'learn' && ses.learnStage === 'quiz')) && ses.quizDir === 'VI_EN') return false;
    return true;
  }

  function startVocaMode(mode, opts = {}) {
    clearHandsFree();
    stopAllAudio();
    const f = state.voca.filter;
    const mp = f.modePrefs || {};
    let pool = opts.customWords ? opts.customWords.slice() : getFilteredVoca(opts);
    if (!pool.length) {
      toast('Không có từ nào khớp bộ lọc hiện tại! Hãy đổi bộ lọc sang "Tất cả".');
      return;
    }
    const sortOrder = opts.sortOrder || f.sortOrder || (f.shuffle ? 'SHUFFLE' : 'SEQ');
    const effBatch = opts.batchSize != null ? Number(opts.batchSize) : (f.batchSize || 25);
    const batchLimit = opts.customWords
      ? pool.length
      : (mode === 'list' && effBatch >= 9999 ? pool.length : Math.min(pool.length, effBatch >= 9999 ? pool.length : Math.max(1, effBatch)));
    const activeBatch = pool.slice(0, batchLimit);
    const initListMask = opts.listMask || mp.listMask || 'NONE';

    ses = {
      mode,
      roundNum: opts.roundNum || 1,
      poolOffset: 0,
      fullFilteredPool: pool,
      batchSize: batchLimit,
      originalBatch: activeBatch.slice(),
      queue: activeBatch.slice(),
      idx: 0,
      isFlipped: false,
      shuffle: sortOrder === 'SHUFFLE' || !!f.shuffle,
      autoSpeak: opts.autoSpeak != null ? opts.autoSpeak : (f.autoSpeak !== false),
      startedAt: Date.now(),
      knownUids: new Set(),
      missedUids: new Set(),
      firstPassMissedUids: new Set(),
      requeueTracker: [],
      actionsDone: 0,
      finished: false,
      // Mode specifics
      fcFront: opts.fcFront || mp.fcFront || 'EN_FIRST',
      fcShowExample: opts.fcShowExample != null ? opts.fcShowExample : (mp.fcShowExample !== false),
      quizChoice: null,
      quizOptions: [],
      quizDir: opts.quizDir || mp.quizDir || 'EN_VI', // EN_VI | VI_EN | AUDIO_EN
      clozeChoice: null,
      clozeOptions: [],
      clozeModeType: opts.clozeModeType || mp.clozeModeType || 'CHOICE',
      clozeInput: '',
      dictInput: '',
      dictChecked: false,
      dictHintCount: 0,
      dictHideVi: opts.dictHideVi != null ? opts.dictHideVi : !!mp.dictHideVi,
      matchPairs: Math.max(2, Number(opts.matchPairs || mp.matchPairs || 6)),
      learnStage: 'quiz', // quiz -> type -> next chunk
      learnChunkIdx: 0,
      audioPlayingAll: false,
      audioPauseSec: Number(opts.audioPauseSec || mp.audioPauseSec || 2),
      audioLoop: opts.audioLoop != null ? opts.audioLoop : !!mp.audioLoop,
      listAutoPlaying: false,
      listPage: 0,
      listPageSize: Number(opts.listPageSize || mp.listPageSize || 80),
      listMaskEn: initListMask === 'MASK_EN',
      listMaskVi: initListMask === 'MASK_VI',
      listUnmasked: {},
      listActiveIdx: -1,
    };

    if (mode === 'learn') {
      ses.learnQueue = activeBatch.slice(0, 5);
      ses.learnRest = activeBatch.slice(5);
      ses.learnStage = 'quiz';
      ses.idx = 0;
      prepareQuizOptions(ses.learnQueue[0]);
    } else if (mode === 'quiz') {
      prepareQuizOptions(ses.queue[0]);
    } else if (mode === 'cloze') {
      prepareClozeQuestion(ses.queue[0]);
    } else if (mode === 'match') {
      setupMatchBoard();
    }

    ETS.navigate('voca-study');

    // Auto play first word when prompt shouldn't be spoiled
    const curWord = currentStudyWord();
    if (shouldAutoSpeakPrompt(curWord) && ['fc1', 'fc2', 'learn', 'quiz', 'dictation', 'cloze'].includes(mode)) {
      setTimeout(() => playWordAudio(curWord.audio, curWord.en), 140);
    }
  }

  function retryLastMissedRound() {
    const lr = state.voca.lastSessionSummary;
    if (!lr || !lr.missedUids || !lr.missedUids.length) return;
    const set = new Set(lr.missedUids);
    const words = DB.voca.filter((v) => set.has(v.uid));
    startVocaMode(lr.mode || 'fc2', { direct: true, customWords: state.voca.filter.shuffle ? shuffleArr(words) : words, roundNum: 2 });
  }

  function currentStudyWord() {
    if (!ses) return null;
    if (ses.mode === 'learn') return (ses.learnQueue && ses.learnQueue[ses.idx]) || null;
    if (ses.mode === 'fc1') return ses.queue[0] || null;
    return ses.queue[ses.idx] || null;
  }

  function finishSessionRound() {
    clearHandsFree();
    if (!ses) return;
    ses.finished = true;
    const elapsedSec = Math.max(1, Math.round((Date.now() - ses.startedAt) / 1000));
    const missedArr = ses.mode === 'fc2'
      ? Array.from(ses.missedUids)
      : Array.from(ses.firstPassMissedUids);
    const knownCount = ses.originalBatch.length - missedArr.length;

    state.voca.lastSessionSummary = {
      mode: ses.mode,
      modeLabel: MODE_LABELS[ses.mode] || ses.mode,
      totalCount: ses.originalBatch.length,
      knownCount: Math.max(0, knownCount),
      missedCount: missedArr.length,
      missedUids: missedArr,
      elapsedSec,
      dateStr: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
    };
    saveState();
    renderVocaStudy();
  }

  // ===================== FLASHCARD 1 (SRS INTRA-SESSION REQUEUE) =====================
  function fcFlipCard() {
    if (!ses) return;
    const card = currentStudyWord();
    if (!card) return;
    ses.isFlipped = !ses.isFlipped;
    const cardEl = document.getElementById('fc3dCard');
    if (cardEl) cardEl.classList.toggle('flipped', ses.isFlipped);

    // Auto-pronounce when flipped to the English face!
    const onEnglishFace = ses.fcFront === 'VI_FIRST' ? ses.isFlipped : !ses.isFlipped;
    if (onEnglishFace) {
      playWordAudio(card.audio, card.en);
    }
  }

  function toggleFcDirection() {
    if (!ses) return;
    ses.fcFront = ses.fcFront === 'VI_FIRST' ? 'EN_FIRST' : 'VI_FIRST';
    ses.isFlipped = false;
    renderVocaStudy();
  }

  function fc1Rate(rating) {
    // rating: 'forget' (+2), 'hard' (+5), 'good', 'easy'
    if (!ses || ses.mode !== 'fc1' || !ses.queue.length) return;
    const card = ses.queue.shift();
    if (!ses.fcHistory) ses.fcHistory = [];
    ses.fcHistory.push(card);
    ses.actionsDone++;
    ses.isFlipped = false;
    if (ETS.trackDailyProgress) ETS.trackDailyProgress('voca', 1);

    ses.requeueTracker = (ses.requeueTracker || [])
      .map((item) => ({ ...item, left: Math.max(0, item.left - 1) }))
      .filter((item) => item.left > 0 && item.uid !== card.uid);

    const now = Date.now();
    if (rating === 'forget' || rating === 'hard') {
      ses.firstPassMissedUids.add(card.uid);
      ses.missedUids.add(card.uid);
      ses.knownUids.delete(card.uid);
      state.voca.statuses[card.uid] = 'learning';
      state.voca.srs[card.uid] = { dueAt: now + (rating === 'forget' ? 10 * 60000 : 12 * 3600000), intervalDays: 0, reps: 0 };

      const offset = rating === 'forget' ? 2 : 5;
      const insertAt = Math.min(offset, ses.queue.length);
      ses.queue.splice(insertAt, 0, card);
      ses.requeueTracker.push({ uid: card.uid, en: card.en, left: Math.max(1, insertAt) });
      toast(ses.queue.length === 1
        ? `Ôn lại ngay '${card.en}' (thẻ cuối trong vòng)!`
        : `'${card.en}' sẽ quay lại sau ${insertAt} thẻ!`);
    } else {
      ses.missedUids.delete(card.uid);
      ses.knownUids.add(card.uid);
      state.voca.statuses[card.uid] = 'mastered';
      const prev = state.voca.srs[card.uid] || { intervalDays: 0, reps: 0 };
      const days = rating === 'easy' ? Math.max(4, prev.intervalDays * 2 || 4) : Math.max(1, (prev.intervalDays || 0) + 1);
      state.voca.srs[card.uid] = { dueAt: now + days * 86400000, intervalDays: days, reps: prev.reps + 1 };
    }
    saveState();

    if (ses.queue.length === 0) {
      finishSessionRound();
      return;
    }
    renderVocaStudy();
    const nxt = ses.queue[0];
    if (shouldAutoSpeakPrompt(nxt)) playWordAudio(nxt.audio, nxt.en);
  }

  function fcStepPrev() {
    if (!ses) return;
    if (ses.mode === 'fc1') {
      if (!ses.fcHistory || !ses.fcHistory.length) {
        toast('Đang ở thẻ đầu tiên của lượt này.');
        return;
      }
      const prev = ses.fcHistory.pop();
      ses.queue.unshift(prev);
      ses.isFlipped = false;
      renderVocaStudy();
      if (shouldAutoSpeakPrompt(prev)) playWordAudio(prev.audio, prev.en);
    } else if (ses.mode === 'fc2') {
      if (ses.idx <= 0) {
        toast('Đang ở thẻ đầu tiên.');
        return;
      }
      ses.idx--;
      ses.isFlipped = false;
      renderVocaStudy();
      const prev = ses.queue[ses.idx];
      if (shouldAutoSpeakPrompt(prev)) playWordAudio(prev.audio, prev.en);
    }
  }

  function fcStepNext() {
    if (!ses) return;
    if (ses.mode === 'fc1') {
      fc1Rate('good');
    } else if (ses.mode === 'fc2') {
      fc2Mark(true);
    }
  }

  // ===================== FLASHCARD 2 (QUIZLET BINARY ROUND) =====================
  function fc2Mark(isKnown) {
    if (!ses || ses.mode !== 'fc2') return;
    const card = ses.queue[ses.idx];
    if (!card) return;
    ses.actionsDone++;
    ses.isFlipped = false;
    if (ETS.trackDailyProgress) ETS.trackDailyProgress('voca', 1);

    if (isKnown) {
      ses.knownUids.add(card.uid);
      ses.missedUids.delete(card.uid);
      state.voca.statuses[card.uid] = 'mastered';
    } else {
      ses.missedUids.add(card.uid);
      ses.firstPassMissedUids.add(card.uid);
      ses.knownUids.delete(card.uid);
      state.voca.statuses[card.uid] = 'learning';
    }
    saveState();

    if (ses.idx + 1 >= ses.queue.length) {
      finishSessionRound();
      return;
    }
    ses.idx++;
    renderVocaStudy();
    const nxt = ses.queue[ses.idx];
    if (shouldAutoSpeakPrompt(nxt)) playWordAudio(nxt.audio, nxt.en);
  }

  // ===================== CONTEXT SENTENCE CLOZE (MODE 9) =====================
  function buildClozeSentenceHtml(w, isAnswered) {
    const ex = w.ex_en || w.exEn || `We need to review the term ${w.en} before the meeting.`;
    const target = (w.en || '').trim();
    const escT = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    let rx = new RegExp(`\\b${escT}[a-zA-Z]*\\b`, 'i');
    if (!rx.test(ex)) {
      const root = target.split(/\s+/)[0].slice(0, Math.max(4, target.length - 2)).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (root.length >= 3) rx = new RegExp(`\\b${root}[a-zA-Z]*\\b`, 'i');
    }
    const blankHtml = isAnswered
      ? `<span class="cloze-blank revealed">${esc(w.en)}</span>`
      : `<span class="cloze-blank">_______</span>`;
    if (rx.test(ex)) {
      const m = ex.match(rx);
      const pos = m ? ex.indexOf(m[0]) : -1;
      if (pos >= 0) {
        return esc(ex.slice(0, pos)) + blankHtml + esc(ex.slice(pos + m[0].length));
      }
    }
    return `${esc(ex)} → ${blankHtml}`;
  }

  function prepareClozeQuestion(target) {
    if (!target) return;
    const distractors = shuffleArr(DB.voca.filter((v) => v.uid !== target.uid && v.pos === target.pos)).slice(0, 3);
    while (distractors.length < 3) {
      const ex = DB.voca[Math.floor(Math.random() * DB.voca.length)];
      if (ex.uid !== target.uid && !distractors.some((d) => d.uid === ex.uid)) distractors.push(ex);
    }
    ses.clozeOptions = shuffleArr([target, ...distractors]);
    ses.clozeChoice = null;
    ses.clozeInput = '';
  }

  function answerClozeChoice(pickedUid) {
    if (!ses || ses.clozeChoice) return;
    const target = currentStudyWord();
    if (!target) return;
    ses.clozeChoice = pickedUid;
    ses.actionsDone++;
    if (ETS.trackDailyProgress) ETS.trackDailyProgress('voca', 1);
    const ok = pickedUid === target.uid;
    if (ok) {
      ses.knownUids.add(target.uid);
      state.voca.statuses[target.uid] = 'mastered';
    } else {
      ses.missedUids.add(target.uid);
      ses.firstPassMissedUids.add(target.uid);
      state.voca.statuses[target.uid] = 'learning';
    }
    saveState();
    playWordAudio(target.audio, target.en, 1.0);
    renderVocaStudy();
  }

  function checkClozeTyping() {
    if (!ses) return;
    const target = currentStudyWord();
    if (!target) return;
    const inp = document.getElementById('clozeTypeInp');
    const val = (inp ? inp.value : ses.clozeInput).trim();
    ses.clozeInput = val;
    const ok = val.toLowerCase() === (target.en || '').trim().toLowerCase();
    ses.clozeChoice = ok ? target.uid : 'WRONG_TYPED';
    ses.actionsDone++;
    if (ETS.trackDailyProgress) ETS.trackDailyProgress('voca', 1);
    if (ok) {
      ses.knownUids.add(target.uid);
      state.voca.statuses[target.uid] = 'mastered';
    } else {
      ses.missedUids.add(target.uid);
      ses.firstPassMissedUids.add(target.uid);
      state.voca.statuses[target.uid] = 'learning';
    }
    saveState();
    playWordAudio(target.audio, target.en, 1.0);
    renderVocaStudy();
  }

  function nextClozeStep() {
    if (!ses) return;
    if (ses.idx + 1 >= ses.queue.length) {
      finishSessionRound();
      return;
    }
    ses.idx++;
    prepareClozeQuestion(ses.queue[ses.idx]);
    renderVocaStudy();
    const nxt = ses.queue[ses.idx];
    if (nxt && ses.autoSpeak) playWordAudio(nxt.audio, nxt.en, 1.0);
  }

  // ===================== QUIZ & LEARN LOGIC =====================
  function prepareQuizOptions(target) {
    if (!target) return;
    const distractors = shuffleArr(DB.voca.filter((v) => v.uid !== target.uid)).slice(0, 3);
    ses.quizOptions = shuffleArr([target, ...distractors]);
    ses.quizChoice = null;
  }

  function answerQuiz(pickedUid) {
    if (!ses || ses.quizChoice) return;
    const target = currentStudyWord();
    if (!target) return;
    ses.quizChoice = pickedUid;
    ses.actionsDone++;
    const ok = pickedUid === target.uid;
    if (ok) {
      ses.knownUids.add(target.uid);
      if (ses.mode === 'quiz') state.voca.statuses[target.uid] = 'mastered';
    } else {
      ses.missedUids.add(target.uid);
      ses.firstPassMissedUids.add(target.uid);
      state.voca.statuses[target.uid] = 'learning';
    }
    saveState();
    renderVocaStudy();
  }

  function nextQuizStep() {
    if (!ses) return;
    if (ses.mode === 'learn') {
      if (ses.idx + 1 < ses.learnQueue.length) {
        ses.idx++;
      } else if (ses.learnStage === 'quiz') {
        ses.learnStage = 'type';
        ses.idx = 0;
        ses.dictInput = '';
        ses.dictChecked = false;
        ses.dictHintCount = 0;
      } else {
        // Move next chunk of 5 or finish
        if (!ses.learnRest || ses.learnRest.length === 0) {
          finishSessionRound();
          return;
        }
        ses.learnQueue = ses.learnRest.slice(0, 5);
        ses.learnRest = ses.learnRest.slice(5);
        ses.learnStage = 'quiz';
        ses.idx = 0;
      }
      const w = currentStudyWord();
      if (ses.learnStage === 'quiz') prepareQuizOptions(w);
      renderVocaStudy();
      if (shouldAutoSpeakPrompt(w)) playWordAudio(w.audio, w.en);
      return;
    }

    if (ses.idx + 1 >= ses.queue.length) {
      finishSessionRound();
      return;
    }
    ses.idx++;
    prepareQuizOptions(ses.queue[ses.idx]);
    renderVocaStudy();
    const w = ses.queue[ses.idx];
    if (shouldAutoSpeakPrompt(w)) playWordAudio(w.audio, w.en);
  }

  // ===================== DICTATION LOGIC =====================
  function checkDictation() {
    if (!ses || ses.dictChecked) return;
    const target = currentStudyWord();
    if (!target) return;
    const inp = document.getElementById('dictInputEl');
    const val = (inp ? inp.value : ses.dictInput || '').trim();
    ses.dictInput = val;
    ses.dictChecked = true;
    ses.actionsDone++;
    const ok = val.toLowerCase() === target.en.toLowerCase();
    if (ok) {
      ses.knownUids.add(target.uid);
      state.voca.statuses[target.uid] = 'mastered';
    } else {
      ses.missedUids.add(target.uid);
      ses.firstPassMissedUids.add(target.uid);
      state.voca.statuses[target.uid] = 'learning';
    }
    saveState();
    renderVocaStudy();
  }

  function revealDictHint() {
    if (!ses) return;
    ses.dictHintCount++;
    renderVocaStudy();
    const inp = document.getElementById('dictInputEl');
    if (inp) { inp.focus(); inp.value = ses.dictInput || ''; }
  }

  function nextDictStep() {
    if (!ses) return;
    if (ses.mode === 'learn') {
      nextQuizStep();
      return;
    }
    if (ses.idx + 1 >= ses.queue.length) {
      finishSessionRound();
      return;
    }
    ses.idx++;
    ses.dictInput = '';
    ses.dictChecked = false;
    ses.dictHintCount = 0;
    renderVocaStudy();
    const w = ses.queue[ses.idx];
    if (w && ses.autoSpeak) playWordAudio(w.audio, w.en);
    const inp = document.getElementById('dictInputEl');
    if (inp) inp.focus();
  }

  // ===================== MATCH GAME LOGIC =====================
  function setupMatchBoard() {
    if (!ses) return;
    const pairCap = Math.max(2, Number(ses.matchPairs || 6));
    const slice = ses.queue.slice(ses.idx, ses.idx + pairCap);
    if (!slice.length) { finishSessionRound(); return; }
    const tiles = [];
    slice.forEach((w) => {
      tiles.push({ id: 'en_' + w.uid, uid: w.uid, side: 'en', text: w.en, audio: w.audio });
      tiles.push({ id: 'vi_' + w.uid, uid: w.uid, side: 'vi', text: w.vi });
    });
    matchState = {
      tiles: shuffleArr(tiles),
      selected: null,
      matchedUids: new Set(),
      mistakes: 0,
      wrongPair: [],
      chunkStart: Date.now(),
    };
  }

  function clickMatchTile(idx) {
    if (!matchState) return;
    const t = matchState.tiles[idx];
    if (!t || matchState.matchedUids.has(t.uid)) return;
    if (t.side === 'en') playWordAudio(t.audio, t.text);

    if (matchState.selected === null) {
      matchState.selected = idx;
      renderVocaStudy();
      return;
    }
    if (matchState.selected === idx) {
      matchState.selected = null;
      renderVocaStudy();
      return;
    }
    const prev = matchState.tiles[matchState.selected];
    if (prev.uid === t.uid && prev.side !== t.side) {
      matchState.matchedUids.add(t.uid);
      ses.knownUids.add(t.uid);
      matchState.selected = null;
      if (matchState.matchedUids.size >= matchState.tiles.length / 2) {
        const sec = ((Date.now() - matchState.chunkStart) / 1000).toFixed(1);
        toast(`Xong lượt ghép trong ${sec}s!`);
        const pairCap = Math.max(2, Number(ses.matchPairs || 6));
        setTimeout(() => {
          if (!ses || ses.mode !== 'match') return;
          if (ses.idx + pairCap >= ses.queue.length) finishSessionRound();
          else { ses.idx += pairCap; setupMatchBoard(); renderVocaStudy(); }
        }, 550);
      } else {
        renderVocaStudy();
      }
    } else {
      matchState.mistakes++;
      ses.firstPassMissedUids.add(prev.uid);
      ses.missedUids.add(prev.uid);
      matchState.wrongPair = [matchState.selected, idx];
      matchState.selected = null;
      renderVocaStudy();
      setTimeout(() => {
        if (matchState) { matchState.wrongPair = []; renderVocaStudy(); }
      }, 380);
    }
  }

  // ===================== HANDS-FREE & LIST AUTO-PLAY =====================
  function toggleHandsFreeRun() {
    if (!ses) return;
    ses.audioPlayingAll = !ses.audioPlayingAll;
    clearHandsFree();
    if (!ses.audioPlayingAll) {
      stopAllAudio();
      renderVocaStudy();
      return;
    }
    runHandsFreeStep();
  }

  function runHandsFreeStep() {
    if (!ses || !ses.audioPlayingAll || state.route !== 'voca-study') return;
    const w = ses.queue[ses.idx];
    if (!w) {
      ses.audioPlayingAll = false;
      finishSessionRound();
      return;
    }
    renderVocaStudy();
    playWordAudio(w.audio, w.en).then(() => {
      handsFreeTimer = setTimeout(() => {
        if (!ses || !ses.audioPlayingAll) return;
        ses.knownUids.add(w.uid);
        if (ses.idx + 1 >= ses.queue.length) {
          if (ses.audioLoop) {
            ses.idx = 0;
            toast('Lặp lại chuỗi nghe từ đầu đợt!');
            runHandsFreeStep();
          } else {
            ses.audioPlayingAll = false;
            finishSessionRound();
          }
        } else {
          ses.idx++;
          runHandsFreeStep();
        }
      }, (ses.audioPauseSec || 2) * 1000);
    });
  }

  // ===================== RENDER STUDY WORKSPACE & ROUND SUMMARY =====================
  function renderRoundSummary(root) {
    const lr = state.voca.lastSessionSummary || {};
    const total = ses.originalBatch.length;
    const missedArr = lr.missedUids || [];
    const known = Math.max(0, total - missedArr.length);
    const pct = total ? Math.round((known / total) * 100) : 100;
    const missedObjs = DB.voca.filter((v) => missedArr.includes(v.uid));

    const r = 48;
    const circ = 2 * Math.PI * r;
    const dashOffset = circ * (1 - pct / 100);

      root.innerHTML = `
        <div class="study-shell">
          <div class="card study-topbar summary-topbar">
            <button class="btn btn-sm study-back-btn" onclick="ETS.navigate('voca-hub')">← <span class="hide-mob">Quay lại VOCA </span>Hub</button>
            <strong style="display:inline-flex;align-items:center;gap:6px;min-width:0;">${icon('analytics')} Tổng Kết Vòng ${ses.roundNum} · ${esc(MODE_LABELS[ses.mode])}</strong>
            <span class="badge badge-primary" style="white-space:nowrap;flex-shrink:0;">Hoàn tất</span>
          </div>

        <div class="card summary-hero">
          <div style="font-size:0.8667rem;font-weight:800;color:var(--primary);letter-spacing:.05em;">KẾT QUẢ PHIÊN HỌC VỪA XONG</div>
          <h2 style="margin:6px 0 4px;">${pct === 100 ? 'Xuất sắc! Thuộc trọn vẹn 100%!' : `Đã hoàn thành Vòng ${ses.roundNum}!`}</h2>
          <p style="color:var(--ink-muted);margin:0;font-size:0.9rem;">Thống kê này chỉ tính riêng cho <strong>${total} từ</strong> trong đợt học vừa rồi (tách biệt hoàn toàn với tổng kho 1.600 từ).</p>

          <div class="summary-flex">
            <svg width="124" height="124" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="11"/>
              <circle cx="60" cy="60" r="${r}" fill="none" stroke="${pct >= 80 ? 'var(--success)' : 'var(--primary)'}" stroke-width="11"
                stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}" stroke-linecap="round" transform="rotate(-90 60 60)"/>
              <text x="60" y="65" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${pct}%</text>
            </svg>

            <div class="summary-stat-box">
              <div style="font-size:0.8rem;color:var(--ink-subtle);">Đã thuộc / Đúng</div>
              <div style="font-size:1.7333rem;font-weight:800;color:var(--success);">${known}</div>
            </div>
            <div class="summary-stat-box">
              <div style="font-size:0.8rem;color:var(--ink-subtle);">Chưa thuộc / Quên</div>
              <div style="font-size:1.7333rem;font-weight:800;color:var(--danger);">${missedObjs.length}</div>
            </div>
            <div class="summary-stat-box">

          </div>

          ${missedObjs.length > 0 ? `
            <div style="margin-top:20px;text-align:left;">
              <strong style="font-size:0.9rem;display:inline-flex;align-items:center;gap:6px;">${icon('flag')} Danh sách ${missedObjs.length} từ cần ôn lại ở vòng tiếp theo:</strong>
              <div class="missed-list">
                ${missedObjs.map((w) => `
                  <div class="missed-row">
                    <div>
                      <strong>${esc(w.en)}</strong> <span style="color:var(--ink-subtle);font-size:0.8rem;">${esc(w.ipa)} (${esc(w.pos)})</span>
                      <div style="color:var(--ink-vi);font-size:0.8333rem;">${esc(w.vi)}</div>
                    </div>
                    <div style="display:flex;gap:6px;">
                      <button class="btn btn-xs" onclick="ETS.playWordAudio('${escJsStr(w.audio)}','${escJsStr(w.en)}')">${icon('volume')}</button>
                      <button class="btn btn-xs ${state.voca.bookmarks[w.uid] ? 'btn-primary' : ''}" onclick="ETS.toggleVocaBookmark('${escJsStr(w.uid)}');ETS.renderVocaStudy()">${icon('star')}</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  function renderVocaStudy() {
    const root = document.getElementById('appContent');
    if (!ses) { ETS.navigate('voca-hub'); return; }
    if (ses.finished) { renderRoundSummary(root); return; }

    const f = state.voca.filter;
    const totalBatch = ses.originalBatch.length;
    const remCount = ses.mode === 'fc1' ? ses.queue.length : Math.max(0, ses.queue.length - ses.idx);
    const knownCnt = ses.knownUids.size;
    const missedCnt = ses.missedUids.size;

    const isFc = (ses.mode === 'fc1' || ses.mode === 'fc2');
    const shortModeNames = {
      fc1: 'FC1 · SRS', fc2: 'FC2 · Quizlet', learn: 'Learn',
      quiz: 'Trắc nghiệm', cloze: 'Điền từ', match: 'Ghép thẻ',
      dictation: 'Chính tả', audio: 'Nghe chuỗi', list: 'Danh sách'
    };
    const topHtml = `
      <div class="card study-topbar">
        <div class="study-topbar-title">
          <button class="btn btn-xs study-back-btn" onclick="ETS.navigate('voca-hub')" title="Quay lại VOCA Hub">← <span class="hide-mob">VOCA Hub</span></button>
          <span class="badge badge-primary study-round-badge">V${ses.roundNum}</span>
          <strong class="study-mode-title"><span class="hide-mob">${esc(MODE_LABELS[ses.mode])}</span><span class="show-mob">${esc(shortModeNames[ses.mode] || MODE_LABELS[ses.mode])}</span></strong>
        </div>
        <div class="study-topbar-actions">
          ${isFc ? `<button class="btn btn-xs ${ses.fcFront === 'VI_FIRST' ? 'btn-primary' : ''}" onclick="ETS.toggleFcDirection()" title="Đổi chiều Anh ↔ Việt">${icon('refresh')} <span class="hide-mob">${ses.fcFront === 'VI_FIRST' ? 'Việt → Anh' : 'Anh → Việt'}</span><span class="show-mob">${ses.fcFront === 'VI_FIRST' ? 'VI→EN' : 'EN→VI'}</span></button>` : ''}
          <button class="btn btn-xs hide-mob ${ses.shuffle ? 'btn-primary' : ''}" onclick="ETS.toggleVocaShuffle()">${icon('shuffle')} ${ses.shuffle ? 'Đã đảo' : 'Đảo từ'}</button>
          <button class="btn btn-xs hide-mob" onclick="ETS.reshuffleVocaNow()">${icon('refresh')} Trộn lượt</button>
          <button class="btn btn-xs ${ses.autoSpeak ? 'btn-soft' : ''}" onclick="ETS.toggleAutoSpeak()" title="Bật/tắt tự động phát âm">${icon('volume')} <span class="hide-mob">Tự đọc: ${ses.autoSpeak ? 'BẬT' : 'TẮT'}</span></button>
          <button class="btn btn-xs hide-mob" onclick="ETS.finishSessionRound()">${icon('flag')} Tổng kết</button>
          <div class="show-mob" style="position:relative;">
            <button type="button" class="btn btn-xs ${studyToolsOpen ? 'btn-primary' : ''}" onclick="ETS.toggleVocaStudyMenu(event)" title="Tùy chọn vòng học & Tổng kết">${icon('more-vert')}</button>
            ${studyToolsOpen ? `
              <div class="menu-popover voca-study-popover">
                <button class="menu-item" onclick="ETS.toggleVocaStudyMenu();ETS.toggleVocaShuffle()"><span>${icon('shuffle')} Đảo ngẫu nhiên</span><span>${ses.shuffle ? 'BẬT' : 'TẮT'}</span></button>
                <button class="menu-item" onclick="ETS.toggleVocaStudyMenu();ETS.reshuffleVocaNow()"><span>${icon('refresh')} Trộn lượt mới</span></button>
                <button class="menu-item" onclick="ETS.toggleVocaStudyMenu();ETS.finishSessionRound()"><span>${icon('flag')} Xem tổng kết vòng</span></button>
              </div>
            ` : ''}
          </div>
        </div>
      </div>

      <div class="round-banner">
        <div class="round-stats-row">
          <span>${icon('layers')} Đợt: <strong>${totalBatch}</strong></span>
          <span>${icon('clock')} Còn: <strong style="color:var(--primary);">${remCount}</strong></span>
          <span>${icon('check-circle')} Thuộc: <strong style="color:var(--success);">${knownCnt}</strong></span>
          <span>${icon('x-circle')} Chưa: <strong style="color:var(--danger);">${missedCnt}</strong></span>
        </div>
        <div class="progress-track round-progress">
          <div class="progress-fill" style="width:${Math.min(100, Math.round((knownCnt / Math.max(1, totalBatch)) * 100))}%;background:var(--success);"></div>
        </div>
      </div>
    `;

    let bodyHtml = '';
    const w = currentStudyWord();

    // ---- FLASHCARD 1 (SRS REQUEUE) OR FLASHCARD 2 (QUIZLET) ----
    if (ses.mode === 'fc1' || ses.mode === 'fc2') {
      const isStar = !!state.voca.bookmarks[w.uid];
      const rqList = ses.requeueTracker || [];
      const isViFirst = ses.fcFront === 'VI_FIRST';
      const showFrontEx = ses.fcShowExample !== false;
      bodyHtml = `
        ${(ses.mode === 'fc1' && rqList.length > 0) ? `
          <div class="requeue-strip">
            <span style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap;">${icon('clock')} Lặp lại (${rqList.length}):</span>
            ${rqList.map((item) => `<span class="requeue-chip">${icon('refresh')} ${esc(item.en)} <strong style="color:var(--danger);">(${item.left})</strong></span>`).join('')}
          </div>
        ` : ''}
        <div class="fc-stage">
          <div class="fc-card ${ses.isFlipped ? 'flipped' : ''}" id="fc3dCard" onclick="ETS.fcFlipCard()">
            <div class="fc-face fc-front">
              <div class="fc-head-strip" style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                <span class="badge">${esc(w.testCode === 'CUSTOM' ? 'Cá nhân' : `${w.testCode} · ${w.section}`)}${isViFirst ? ' · VI→EN' : ''}</span>
                <div class="fc-head-actions" style="display:flex;gap:6px;" onclick="event.stopPropagation()">
                  <button class="btn btn-xs" onclick="ETS.playWordAudio('${escJsStr(w.audio)}','${escJsStr(w.en)}', 1.0)">${icon('volume')} 1x</button>
                  <button class="btn btn-xs" onclick="ETS.playWordAudio('${escJsStr(w.audio)}','${escJsStr(w.en)}', 0.75)" title="Nghe chậm 0.75x">${icon('volume-slow')} 0.75x</button>
                  <button class="btn btn-xs" onclick="ETS.startPronunciationCheck('${escJsStr(w.en)}', 'fcPronBox')">${icon('mic')} Phát âm</button>
                  <button class="btn btn-xs ${isStar ? 'btn-primary' : ''}" onclick="ETS.toggleVocaBookmark('${escJsStr(w.uid)}');ETS.renderVocaStudy()">${icon('star')}</button>
                </div>
              </div>
              <div id="fcPronBox" onclick="event.stopPropagation()" style="text-align:center;margin-top:4px;"></div>
              ${isViFirst ? `
                <div style="margin:auto 0;">
                  <div class="fc-word" style="font-size:1.8667rem;color:var(--ink-vi);">${esc(w.vi)}</div>
                  <div class="fc-ipa"><span class="badge">${esc(w.pos)}</span> · ${esc(w.ko || 'Hãy nhớ lại từ Tiếng Anh')}</div>
                  ${showFrontEx && w.ex_vi ? `<div style="margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--surface-2);font-size:0.9rem;text-align:center;color:var(--ink-muted);">Ngữ cảnh: "${esc(w.ex_vi)}"</div>` : ''}
                </div>
                <div style="text-align:center;font-size:0.8rem;color:var(--ink-subtle);">
                  Chạm vào thẻ (hoặc phím Space) để lật xem Tiếng Anh & Tự động phát âm!
                </div>
              ` : `
                <div style="margin:auto 0;">
                  <div class="fc-word">${esc(w.en)}</div>
                  <div class="fc-ipa">${esc(w.ipa)} · <span class="badge">${esc(w.pos)}</span></div>
                  ${showFrontEx && w.ex_en ? `<div style="margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--surface-2);font-size:0.9rem;text-align:center;color:var(--ink-muted);">"${esc(w.ex_en)}"</div>` : ''}
                </div>
                <div style="text-align:center;font-size:0.8rem;color:var(--ink-subtle);">
                  Chạm vào thẻ (hoặc phím Space) để lật xem Nghĩa · Lật về Tiếng Anh tự phát âm!
                </div>
              `}
            </div>

            <div class="fc-face fc-back">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="badge badge-primary">${esc(w.en)} · ${esc(w.pos)}</span>
                <div style="display:flex;gap:6px;" onclick="event.stopPropagation()">
                  <button class="btn btn-xs" onclick="ETS.playWordAudio('${escJsStr(w.audio)}','${escJsStr(w.en)}')">${icon('volume')} Đọc từ</button>
                  ${w.ex_en ? `<button class="btn btn-xs" onclick="ETS.speakEnglish('${escJsStr(w.ex_en)}')">${icon('play')} Đọc ví dụ</button>` : ''}
                </div>
              </div>
              <div style="margin:auto 0;">
                ${isViFirst ? `<div class="fc-word" style="font-size:2rem;">${esc(w.en)}</div><div class="fc-ipa">${esc(w.ipa)} · <span class="badge">${esc(w.pos)}</span></div>` : ''}
                <div class="fc-vi-main">${esc(w.vi)}</div>
                ${w.ko ? `<div style="text-align:center;font-size:0.8333rem;color:var(--ink-subtle);margin-bottom:8px;">Gốc sách: ${esc(w.ko)}</div>` : ''}
                ${w.note ? `<div style="padding:8px 12px;border-radius:8px;background:var(--warn-soft);font-size:0.8333rem;margin-bottom:8px;display:flex;align-items:center;gap:6px;">${icon('lightbulb')} <span>${esc(w.note)}</span></div>` : ''}
                ${w.ex_en ? `<div class="vi-text" style="text-align:center;">
                  <div style="color:var(--ink);font-weight:600;">${esc(w.ex_en)}</div>
                  <div>${esc(w.ex_vi || '')}</div>
                </div>` : ''}
              </div>
              <div style="text-align:center;font-size:0.8rem;color:var(--ink-subtle);">
                Chạm thẻ để lật lại mặt trước
              </div>
            </div>
          </div>
        </div>

        ${ses.mode === 'fc1' ? `
          <div class="fc-actions-row is-fc1">
            <button class="fc-action-btn act-forget" onclick="ETS.fc1Rate('forget')">
              <span class="fc-act-lbl">${icon('x-circle')} Quên <span class="hide-mob">[1]</span></span>
              <small><span class="hide-mob">Quay lại </span>+2 thẻ</small>
            </button>
            <button class="fc-action-btn act-hard" onclick="ETS.fc1Rate('hard')">
              <span class="fc-act-lbl">${icon('alert')} Khó <span class="hide-mob">[2]</span></span>
              <small><span class="hide-mob">Quay lại </span>+5 thẻ</small>
            </button>
            <button class="fc-action-btn act-good" onclick="ETS.fc1Rate('good')">
              <span class="fc-act-lbl">${icon('check-circle')} Nhớ <span class="hide-mob">tốt [3]</span></span>
              <small><span class="hide-mob">Xong thẻ · </span>+1 ngày</small>
            </button>
            <button class="fc-action-btn act-easy" onclick="ETS.fc1Rate('easy')">
              <span class="fc-act-lbl">${icon('zap')} Quá dễ <span class="hide-mob">[4]</span></span>
              <small><span class="hide-mob">Xong thẻ · </span>+4 ngày</small>
            </button>
          </div>
          <div style="display:flex;justify-content:center;gap:10px;margin-top:8px;">
            <button class="btn btn-sm" onclick="ETS.fcStepPrev()" ${(!ses.fcHistory || !ses.fcHistory.length) ? 'disabled' : ''}>← Xem lại thẻ vừa qua</button>
            <button class="btn btn-sm btn-soft" onclick="ETS.fcStepNext()">Tiếp theo (Next) →</button>
          </div>
        ` : `
          <div class="fc-actions-row is-fc2">
            <button class="fc-action-btn act-forget" onclick="ETS.fc2Mark(false)">
              <span style="display:inline-flex;align-items:center;gap:5px;">${icon('x-circle')} Chưa thuộc <span class="hide-mob">[← / 1]</span></span>

            <button class="fc-action-btn act-easy" onclick="ETS.fc2Mark(true)">

          <div style="display:flex;justify-content:center;gap:10px;margin-top:8px;">
            <button class="btn btn-sm" onclick="ETS.fcStepPrev()" ${ses.idx <= 0 ? 'disabled' : ''}>← Thẻ trước</button>
            <button class="btn btn-sm btn-soft" onclick="ETS.fcStepNext()">Tiếp theo <span class="hide-mob">(Next) </span>→</button>
          </div>
        `}
      `;
    }

    // ---- QUIZ OR LEARN (STAGE QUIZ) ----
    else if (ses.mode === 'quiz' || (ses.mode === 'learn' && ses.learnStage === 'quiz')) {
      const answered = !!ses.quizChoice;
      const isAudioDir = ses.quizDir === 'AUDIO_EN';
      const isViEnDir = ses.quizDir === 'VI_EN';
      const showEnOpts = isAudioDir || isViEnDir;
      bodyHtml = `
        <div class="card voca-focus-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
            <span class="badge badge-accent">${ses.mode === 'learn' ? 'Learn · Bước 1: Chọn nghĩa' : `Câu ${ses.idx + 1} / ${ses.queue.length}`}</span>
            ${renderCustomSelect({
              id: 'csVocaQuizDir',
              value: ses.quizDir,
              options: [
                { value: 'EN_VI', label: 'Nhìn Tiếng Anh → Chọn Tiếng Việt' },
                { value: 'VI_EN', label: 'Nhìn Tiếng Việt → Chọn Từ Tiếng Anh' },
                { value: 'AUDIO_EN', label: 'Nghe Audio → Chọn Từ Tiếng Anh' },
              ],
              onChangeJs: "ETS.setQuizDir('__VAL__')"
            })}
          </div>

          <div class="voca-prompt-hero">
            ${isAudioDir ? `
              <button class="btn btn-primary" onclick="ETS.playWordAudio('${escJsStr(w.audio)}','${escJsStr(w.en)}')">${icon('volume')} Nghe Phát Âm (${esc(w.pos)})</button>
              <div style="margin-top:8px;color:var(--ink-vi);font-weight:700;">Nghĩa: ${esc(w.vi)}</div>
            ` : (isViEnDir ? `
              <div style="font-size:1.7333rem;font-weight:800;color:var(--ink-vi);">${esc(w.vi)}</div>
              <div style="color:var(--ink-subtle);font-size:0.9333rem;margin-top:4px;">Từ loại: ${esc(w.pos)}</div>
              <button class="btn btn-xs" style="margin-top:6px;" onclick="ETS.playWordAudio('${escJsStr(w.audio)}','${escJsStr(w.en)}')">${icon('volume')} Nghe gợi ý</button>
            ` : `
              <div style="font-size:2rem;font-weight:800;">${esc(w.en)}</div>
              <div style="color:var(--primary);font-size:0.9667rem;">${esc(w.ipa)} · ${esc(w.pos)}</div>
              <button class="btn btn-xs" style="margin-top:6px;" onclick="ETS.playWordAudio('${escJsStr(w.audio)}','${escJsStr(w.en)}')">${icon('volume')} Nghe</button>
            `)}
          </div>

          <div class="opt-list voca-opt-grid">
            ${ses.quizOptions.map((opt, idx) => {
              let cls = 'opt-btn';
              if (answered) {
                cls += ' is-locked-choice';
                if (opt.uid === w.uid) cls += ' is-correct';
                else if (opt.uid === ses.quizChoice) cls += ' is-wrong';
              }
              return `
                <div role="button" tabindex="0" class="${cls}" onclick="if(!(window.getSelection&&window.getSelection().toString().trim().length>0)) ETS.answerQuiz('${escJsStr(opt.uid)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ETS.answerQuiz('${escJsStr(opt.uid)}');}">
                  <span class="opt-key">${['A', 'B', 'C', 'D'][idx]}</span>
                  <div>
                    <strong>${esc(showEnOpts ? opt.en : opt.vi)}</strong> ${showEnOpts && opt.ipa ? `<span style="font-size:0.8rem;color:var(--ink-subtle);">${esc(opt.ipa)}</span>` : ''}
                    ${answered && showEnOpts ? `<div style="font-size:0.8rem;color:var(--ink-subtle);">${esc(opt.vi)}</div>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          ${answered ? `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">
              <strong style="color:${ses.quizChoice === w.uid ? 'var(--success)' : 'var(--danger)'};display:inline-flex;align-items:center;gap:5px;">
                ${ses.quizChoice === w.uid ? `${icon('check-circle')} Chính xác!` : `${icon('x-circle')} Đáp án đúng: ${esc(showEnOpts ? w.en : w.vi)}`}
              </strong>
              <button class="btn btn-primary" onclick="ETS.nextQuizStep()">Tiếp tục →</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ---- DICTATION OR LEARN (STAGE TYPE) ----
    else if (ses.mode === 'dictation' || (ses.mode === 'learn' && ses.learnStage === 'type')) {
      const hintMask = w.en.split('').map((ch, i) => (i < ses.dictHintCount || ch === ' ' || ch === '-') ? ch : '_').join(' ');
      const ok = ses.dictChecked && ses.dictInput.toLowerCase() === w.en.toLowerCase();
      bodyHtml = `
        <div class="card voca-focus-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">
            <span class="badge badge-warn">${ses.mode === 'learn' ? 'Learn · Bước 2: Gõ Chính Tả' : `Nghe & Gõ · ${ses.idx + 1}/${ses.queue.length}`}</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <button class="btn btn-xs ${ses.dictHideVi ? 'btn-primary' : ''}" onclick="ETS.toggleDictHideVi()">${icon('eye')} ${ses.dictHideVi ? 'Đang ẩn nghĩa Việt' : 'Ẩn nghĩa Việt'}</button>
              <span class="badge">${esc(w.pos)} · ${w.en.length} ký tự</span>
            </div>
          </div>

          <div style="text-align:center;margin:12px 0;">
            <button class="btn btn-primary" onclick="ETS.playWordAudio('${escJsStr(w.audio)}','${escJsStr(w.en)}')">${icon('volume')} Nghe Phát Âm</button>
            ${(!ses.dictHideVi || ses.dictChecked) ? `<div style="font-size:1.2667rem;font-weight:800;color:var(--ink-vi);margin-top:12px;">${esc(w.vi)}</div>` : `<div style="font-size:0.8667rem;color:var(--ink-subtle);margin-top:10px;">(Chế độ thuần nghe — Tự gõ từ bạn nghe được)</div>`}
            <div style="font-family:monospace;font-size:1.3333rem;letter-spacing:2px;margin-top:10px;color:var(--ink-muted);">${esc(hintMask)}</div>
          </div>

          <div class="dict-input-row" style="display:flex;gap:8px;margin-top:16px;">
            <input id="dictInputEl" class="input dict-input-field" style="flex:1;min-width:0;font-size:1.0667rem;padding:10px 14px;" type="text" autocomplete="off"
              placeholder="Gõ từ tiếng Anh bạn nghe được..." value="${esc(ses.dictInput)}"
              ${ses.dictChecked ? 'disabled' : ''}
              onkeydown="if(event.key==='Enter'){ ${ses.dictChecked ? 'ETS.nextDictStep()' : 'ETS.checkDictation()'} }">
            ${!ses.dictChecked ? `<button class="btn dict-act-btn" onclick="ETS.revealDictHint()">${icon('lightbulb')} Gợi ý</button>` : ''}
            ${!ses.dictChecked ? `<button class="btn btn-primary dict-act-btn" onclick="ETS.checkDictation()">Kiểm tra</button>` : `<button class="btn btn-primary dict-act-btn" onclick="ETS.nextDictStep()">Tiếp →</button>`}
          </div>

          ${ses.dictChecked ? `

  let qPaceInterval = null;
  function startQuestionPaceTimer() {
    if (qPaceInterval) { clearInterval(qPaceInterval); qPaceInterval = null; }
    if (!ws || ws.mode !== 'practice') return;
    ws.qTimerStart = Date.now();
    ws.qElapsedSec = 0;
    qPaceInterval = setInterval(() => {
      if (!ws || state.route !== 'test-practice') return;
      ws.qElapsedSec = Math.floor((Date.now() - ws.qTimerStart) / 1000);
      const pill = document.getElementById('wsPacePill');
      if (pill) {
        const sc = currentScreen();
        const warnSec = (sc && sc.part === 5) ? 35 : 90;
        pill.innerHTML = `${icon('clock')} ${fmtTime(ws.qElapsedSec)}`;
        pill.classList.toggle('warn', ws.qElapsedSec >= warnSec);
      }
    }, 1000);
  }

  // ===================== LAUNCH PRACTICE MODE =====================
  function launchTestPractice(testCode, opts = {}) {
    clearWorkspaceTimers();
    stopAllAudio();
    ensureTestMaps(testCode);
    const allScreens = buildTestScreens(testCode);
    const meta = DB.testsMeta[testCode];

    let activeIndices = allScreens.map((_, idx) => idx);
    const filterMode = opts.filterMode || (opts.onlyWrong ? 'wrong' : opts.onlySkipped ? 'skipped' : 'all');
    if (opts.part) {
      const partIdx = allScreens.map((sc, idx) => (sc.part === Number(opts.part) ? idx : -1)).filter((x) => x >= 0);
      if (partIdx.length) activeIndices = partIdx;
    } else if (filterMode === 'wrong') {
      const ansMap = state.test.answers[testCode] || {};
      const keys = DB.answerKeys[testCode] || {};
      const wrongScreenIdx = allScreens.map((sc, idx) => {
        for (let q = sc.qStart; q <= sc.qEnd; q++) {
          if (ansMap[q] && ansMap[q] !== keys[q]) return idx;
        }
        return -1;
      }).filter((x) => x >= 0);
      if (wrongScreenIdx.length) activeIndices = wrongScreenIdx;
      else toast('Không có câu sai nào trong đề này!');
    } else if (filterMode === 'skipped') {
      const ansMap = state.test.answers[testCode] || {};
      const chkMap = state.test.checked[testCode] || {};
      const skipIdx = allScreens.map((sc, idx) => {
        for (let q = sc.qStart; q <= sc.qEnd; q++) {
          if (!ansMap[q] && chkMap[q]) return idx;
        }
        return -1;
      }).filter((x) => x >= 0);
      if (skipIdx.length) activeIndices = skipIdx;
      else toast('Không có câu bỏ trống nào!');
    } else if (filterMode === 'right') {
      const ansMap = state.test.answers[testCode] || {};
      const keys = DB.answerKeys[testCode] || {};
      const rightIdx = allScreens.map((sc, idx) => {
        for (let q = sc.qStart; q <= sc.qEnd; q++) {
          if (ansMap[q] && ansMap[q] === keys[q]) return idx;
        }
        return -1;
      }).filter((x) => x >= 0);
      if (rightIdx.length) activeIndices = rightIdx;
      else toast('Chưa có câu đúng nào trong đề này!');
    } else if (filterMode === 'flagged') {
      const flgMap = state.test.flags[testCode] || {};
      const flgIdx = allScreens.map((sc, idx) => {
        for (let q = sc.qStart; q <= sc.qEnd; q++) {
          if (flgMap[q]) return idx;
        }
        return -1;
      }).filter((x) => x >= 0);
      if (flgIdx.length) activeIndices = flgIdx;
      else toast('Chưa có câu cắm cờ nào trong đề này!');
    }

    let screenIdx = activeIndices[0] || 0;
    if (opts.startQ) {
      const found = allScreens.findIndex((sc) => opts.startQ >= sc.qStart && opts.startQ <= sc.qEnd);
      if (found >= 0) {
        screenIdx = found;
        if (!activeIndices.includes(found)) activeIndices = allScreens.map((_, idx) => idx);
      }
    }

    ws = {
      mode: 'practice',
      testCode,
      meta,
      allScreens,
      activeIndices,
      posInActive: Math.max(0, activeIndices.indexOf(screenIdx)),
      filterMode,
      onlyWrong: filterMode === 'wrong',
      onlySkipped: filterMode === 'skipped',
      paletteOpen: false,
      paletteFilter: 'all', // all | unanswered | flagged | P5 | P6 | P7
      audioMenuOpen: false,
      toolsMenuOpen: false,
      retryMenuOpen: false,
      showScript: false,
      clozeScript: false,
      clozeRevealed: {},
      showAllEvidence: false,
      showAllEvidenceGroup: null,
      activeEvidence: null,
      qTimerStart: Date.now(),
      qElapsedSec: 0,
      showOriginPage: false,
      overridePageNum: null,
      abLoop: { a: null, b: null, active: false },
      playbackRate: 1.0,
      audioCurrent: 0,
      audioDuration: 0,
      audioPlaying: false,
      loadedAudioTrack: null,
    };

    state.test.activeCode = testCode;
    ETS.navigate('test-practice');
    startQuestionPaceTimer();
  }

  function startRealExam(testCode, countdownSec) {
    const cdSec = countdownSec != null ? Number(countdownSec) : preExamCountdownChoice || 3;
    closeModal();
    clearWorkspaceTimers();
    stopAllAudio();
    const allScreens = buildTestScreens(testCode);
    const meta = DB.testsMeta[testCode];

    ws = {
      mode: 'exam',
      testCode,
      meta,
      allScreens,
      activeIndices: allScreens.map((_, idx) => idx),
      posInActive: 0,
      lcFinished: false, // Unlocked once Track 54 (Q98-100) finishes!
      paletteOpen: false,
      paletteFilter: 'all',
      overridePageNum: null,
      countdownBase: cdSec,
      countdownRemaining: 0,
      countdownMissing: [],
      examAnswers: {},
      examFlags: {},
      examEliminated: {},
      remainingSec: 7200, // 120:00
      timerHidden: false,
      startedAt: Date.now(),
      audioVolume: 1.0,
      loadedAudioTrack: null,
    };

    state.test.activeCode = testCode;
    ETS.navigate('test-exam');

    examInterval = setInterval(() => {
      if (!ws || ws.mode !== 'exam') return;
      ws.remainingSec--;
      if (ws.remainingSec === 300) {
        playExamBell(2);
        if (!ws.timerHidden) toast('⏰ Còn 5 phút cuối!');
      }
      if (ws.remainingSec === 300 && ws.timerHidden) {
        ws.timerHidden = false;
        toast('Chỉ còn 5 phút cuối! Đồng hồ thi đã tự động hiện lại.');
        const hdrEl = document.getElementById('wsTopRightSlot');
        if (hdrEl) hdrEl.innerHTML = buildTopRightHtml(currentScreen(), true, getQPart((currentScreen() || { qStart: 1 }).qStart));
      }
      const tEl = document.getElementById('wsExamTimer');
      if (tEl && !ws.timerHidden) {
        tEl.innerHTML = `${icon('clock')} ${fmtTime(ws.remainingSec)}`;
        tEl.className = 'exam-timer' + (ws.remainingSec <= 300 ? ' danger' : ws.remainingSec <= 900 ? ' warn' : '');
      }
      if (ws.remainingSec <= 0) {
        clearWorkspaceTimers();
        const code = ws.testCode;
        submitRealExam(true);
        showTimeUpOverlay({
          title: 'HẾT GIỜ LÀM BÀI',
          sub: `Đề ${code} · Đã hết 120 phút. Bài thi đã được tự động nộp và chấm điểm.`,
        });
      }
    }, 1000);

    playExamCurrentTrack(true);
  }

  function currentScreen() {
    if (!ws) return null;
    const realIdx = ws.activeIndices[ws.posInActive];

    if (!sc) return false;
    const map = ansMap || (ws && ws.mode === 'exam' ? ws.examAnswers : (ws && state.test.answers[ws.testCode])) || {};
    for (let q = sc.qStart; q <= sc.qEnd; q++) {
      if (!map[q]) return false;
    }
    return true;
  }

      ${curF !== 'all' ? `<button class="btn btn-xs btn-soft" onclick="ETS.setWorkspaceFilter('all')" title="Bấm để bỏ lọc">${fLabels[curF]} ${icon('close')}</button>` : ''}

            <button class="menu-item" onclick="ETS.resetPracticeScope('part')"><span>${icon('layers')} Luyện lại cả Part ${partInfo.part}</span></button>
            <button class="menu-item" style="color:var(--danger);" onclick="ETS.resetPracticeScope('all')"><span>${icon('trash')} Xóa bài làm toàn Test ${ws.testCode}</span></button>
          </div>

      </div>
      <div style="position:relative;">

        ${ws.toolsMenuOpen ? `
          <div class="menu-popover" style="min-width:255px;">
            <div style="padding:4px 10px;font-size:0.7333rem;font-weight:800;color:var(--ink-subtle);">CỠ CHỮ (${fontPct}) &amp; GIAO DIỆN</div>
