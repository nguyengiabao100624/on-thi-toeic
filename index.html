    // 6. ARTICLE / PRESS RELEASE / LETTER / NOTICE / AD / FORM (.ets-doc-paper-*)
    var paperSubtype = 'ets-doc-' + type;
    return (
      '<div class="ets-exam-doc ets-doc-paper ' + paperSubtype + '">' +
        (block.banner ? '<div class="ets-doc-top-banner">' + ETS.esc(block.banner) + '</div>' : '') +
        '<div class="ets-doc-paper-inner">' +
          renderDocBodyItems(block.body, showVi, type) +
        '</div>' +
      '</div>'
    );
  };

  // ==========================================================================
  // PART 6 INLINE CLOZE PASSAGE RENDERER (.ets-doc-part6)
  // Renders numbered inline blanks [131]..[146] directly inside the ETS frame!
  // ==========================================================================
  ETS.renderPart6Document = function (first, group, mode, testId, activeQnum, showVi, ansMap, checkedMap, isSubmitted) {
    var qMap = {};
    group.forEach(function (q) { qMap[q.q || q.qnum] = q; });

    function getOptText(qObj, key) {
      if (!qObj || !qObj.options || !key) return '';
      if (Array.isArray(qObj.options)) {
        var idx = ['A', 'B', 'C', 'D'].indexOf(key);
        return idx >= 0 && qObj.options[idx] ? String(qObj.options[idx]).replace(/^\([A-D]\)\s*/, '') : '';
      }
      var entry = qObj.options[key];
      if (!entry) return '';
      var raw = typeof entry === 'string' ? entry : (entry.en || '');
      return String(raw).replace(/^\([A-D]\)\s*/, '').trim();
    }

    function replaceBlanksInLine(rawEn) {
      var safe = ETS.esc(rawEn);
      return safe.replace(/(?:(?:_{2,}|-{2,})\s*)?\[(\d{3})\](?:\s*(?:_{2,}|-{2,}))?/g, function (match, g1) {
        var qn = parseInt(g1, 10);
        var qObj = qMap[qn];
        var isActive = (qn === activeQnum);
        var chosen = (ansMap && ansMap[qn]) ? ansMap[qn] : '';
        var isLocked = !!isSubmitted || (mode === 'practice' && !!(checkedMap && checkedMap[qn]));

        var slotCls = 'ets-p6-blank-slot' + (isActive ? ' active' : '');
        var innerTop = '-------';
        if (chosen && qObj && qObj.options) {
          var chosenText = getOptText(qObj, chosen);
          innerTop = '<span class="ets-p6-filled-val">(' + chosen + ') ' + ETS.esc(chosenText || chosen) + '</span>';
          if (isLocked) {
            var corr = qObj.ans || qObj.answer;
            slotCls += (chosen === corr) ? ' is-correct' : ' is-wrong';
          } else {
            slotCls += ' is-answered';
          }
        }
        return (
          '<span class="' + slotCls + '" data-jump-q="' + qn + '" title="Câu ' + qn + '">' +
            '<span class="ets-p6-dash">' + innerTop + '</span>' +
            '<span class="ets-p6-qnum">' + qn + '.</span>' +
          '</span>'
        );
      });
    }

    // Expand pipe-delimited header lines (e.g. T01 Q135, Q139, Q143)
    var rawLines = (first && first.lines) || [];
    var lines = [];
    rawLines.forEach(function (ln, idx) {
      var en = String(ln.en || '').trim();
      if (idx === 0 && en.indexOf('|') !== -1 && !/\[1[34]\d\]/.test(en)) {
        var segs = en.split(/\s*\|\s*/);
        var viSegs = String(ln.vi || '').split(/\s*\|\s*/);
        segs.forEach(function (seg, sIdx) {
          if (seg.trim()) {
            var segVi = (viSegs.length === segs.length)
              ? (viSegs[sIdx] || '').trim()
              : ((sIdx === segs.length - 1) ? String(ln.vi || '').replace(/\s*\|\s*/g, ' · ') : '');
            lines.push({
              speaker: ln.speaker || '',
              en: seg.trim(),
              vi: segVi,
              units: null
            });
          }
        });
      } else {
        lines.push(ln);
      }
    });

    var p6Type = ETS.inferPart6DocType(first);
    var isEmail = (p6Type === 'e-mail') || lines.some(function (l) { return /^(To|From|Date|Subject)\s*:/i.test(l.en || ''); });
    var isWeb = (p6Type === 'Web page') || lines.some(function (l) { return /https?:\/\/|www\./i.test(l.en || ''); });

    var emailHeadersHtml = '';
    var bodyHtml = '';
    var emailHeaders = [];
    var inEmailHdr = isEmail;

    function cleanViBlanks(s) {
      return String(s || '').replace(/(?:[-—_]{2,}\s*)?\[(\d{3})\](?:\s*[-—_]{2,})?/g, '[$1]').replace(/\s{2,}/g, ' ').trim();
    }

    lines.forEach(function (ln, idx) {
      var en = String(ln.en || '').trim();
      var vi = cleanViBlanks(ln.vi);
      if (!en) return;
      if (inEmailHdr && /^(To|From|Date|Subject|Sent|Cc|Attachment|Attachments|Re)\s*:\s*(.*)$/i.test(en)) {
        var mHdr = en.match(/^([A-Za-z]+)\s*:\s*(.*)$/);
        if (mHdr) {
          emailHeaders.push({ label: mHdr[1] + ':', val: mHdr[2].trim(), vi: vi });
          return;
        }
      } else if (emailHeaders.length > 0) {
        inEmailHdr = false;
      }

      if (idx === 0 && !isEmail && en.length < 75 && !/[.?!]$/.test(en) && !/^Dear\s/i.test(en) && !/^\d{1,2}\s+[A-Z][a-z]+$/.test(en)) {
        bodyHtml += '<div class="ets-doc-heading">' + replaceBlanksInLine(en) + '</div>';
        if (showVi && vi) bodyHtml += '<div class="ets-doc-vi-line">' + ETS.esc(vi) + '</div>';
        return;
      }
      if (/^(To|From|Date|Subject|Re)\s*:/i.test(en)) {
        bodyHtml += '<div class="ets-p6-meta-line">' + replaceBlanksInLine(en) + '</div>';
        if (showVi && vi) bodyHtml += '<div class="ets-doc-vi-line">' + ETS.esc(vi) + '</div>';
        return;
      }
      if (Array.isArray(ln.units) && ln.units.length > 0) {
        if (showVi) {
          bodyHtml += '<div class="ets-bilingual-units">';
          ln.units.forEach(function (u, uIdx) {
            var uEn = String(u && u.en || '').trim();
            var uVi = cleanViBlanks(u && u.vi);
            if (!uEn) return;
            bodyHtml += (uIdx > 0 ? ' ' : '') +
              '<div class="ets-bilingual-unit">' +
                '<div class="ets-unit-en ets-doc-p">' + replaceBlanksInLine(uEn) + '</div>' +
                (uVi ? '<div class="ets-unit-vi">' + ETS.esc(uVi) + '</div>' : '') +
              '</div>';
          });
          bodyHtml += '</div>';
        } else {
          bodyHtml += '<div class="ets-doc-p">' + ln.units.map(function (u) { return replaceBlanksInLine(String(u && u.en || '').trim()); }).join(' ') + '</div>';
        }
        return;
      }
      bodyHtml += '<div class="ets-doc-p">' + replaceBlanksInLine(en) + '</div>';
      if (showVi && vi) {
        bodyHtml += '<div class="ets-doc-vi-line">' + ETS.esc(vi) + '</div>';
      }
    });

    if (emailHeaders.length > 0) {
      emailHeadersHtml = '<div class="ets-email-header-grid">';
      emailHeaders.forEach(function (h) {
        emailHeadersHtml +=
          '<div class="ets-email-hdr-row">' +
            '<div class="ets-email-hdr-label">' + ETS.esc(h.label) + '</div>' +
            '<div class="ets-email-hdr-val">' +
              '<span class="ets-email-hdr-en">' + replaceBlanksInLine(h.val) + '</span>' +
              (showVi && h.vi ? '<div class="ets-doc-vi-line" style="margin-top:3px;">' + ETS.esc(h.vi) + '</div>' : '') +
            '</div>' +
          '</div>';
      });
      emailHeadersHtml += '</div>';
      return (
        '<div class="ets-exam-doc ets-doc-email ets-doc-part6">' +
          emailHeadersHtml +
          '<div class="ets-email-body-wrap">' +
            '<div class="ets-email-body-paper">' +
              bodyHtml +
            '</div>' +
            renderEtsVScroll(16, 40) +
          '</div>' +
        '</div>'
      );
    }

    var frameCls = 'ets-exam-doc ets-doc-paper ets-doc-part6';
    if (isEmail) frameCls += ' ets-p6-email';
    if (isWeb) frameCls += ' ets-p6-web';
    if (p6Type === 'letter') frameCls += ' ets-doc-letter';
    if (p6Type === 'article') frameCls += ' ets-doc-article';
    if (p6Type === 'advertisement') frameCls += ' ets-doc-ad';

    return (
      '<div class="' + frameCls + '">' +
        '<div class="ets-doc-paper-inner">' +
          bodyHtml +
        '</div>' +
      '</div>'
    );
  };

  ETS.inferPart6DocType = function (firstOrLines) {
    var lns = Array.isArray(firstOrLines) ? firstOrLines : ((firstOrLines && firstOrLines.lines) || []);
    var spk0 = String((lns[0] && lns[0].speaker) || '').trim().toLowerCase();
    var ctx = String((!Array.isArray(firstOrLines) && firstOrLines && (firstOrLines.docTypeLabel || firstOrLines.context)) || '').trim().toLowerCase();
    var h = spk0 + ' ' + ctx;
    if (/e-?mail|thư\s*điện\s*tử/.test(h)) return 'e-mail';
    if (/product\s*description/.test(h)) return 'product description';
    if (/product\s*review|\breview\b/.test(h)) return 'product review';
    if (/blog\s*post|\bblog\b/.test(h)) return 'blog post';
    if (/press\s*release/.test(h)) return 'press release';
    if (/advertisement|\bad\b|quảng\s*cáo/.test(h)) return 'advertisement';
    if (/flyer|tờ\s*rơi/.test(h)) return 'flyer';
    if (/brochure/.test(h)) return 'brochure';
    if (/booklet/.test(h)) return 'booklet';
    if (/announcement/.test(h)) return 'announcement';
    if (/directions/.test(h)) return 'directions';
    if (/instructions/.test(h)) return 'instructions';
    if (/information/.test(h) && !/thông\s*tin\s*thư/.test(h)) return 'information';
    if (/memo/.test(h)) return 'memo';
    if (/letter|thông\s*tin\s*thư|\bthư\b/.test(h)) return 'letter';
    if (/article|bài\s*báo/.test(h)) return 'article';
    if (/web\s*page|website|trang\s*web/.test(h)) return 'Web page';
    if (/notice|thông\s*báo/.test(h)) return 'notice';
    return 'text';
  };

  // ==========================================================================
  // PART 3 & PART 4 NATIVE GRAPHIC RENDERER (.ets-doc-graphic)
  // Renders schedules, directories, maps, floor plans, charts in pure HTML/SVG
  // ==========================================================================
  function renderGraphicItemsList(items) {
    var html = '<div class="ets-graphic-list">';
    items.forEach(function (it) {
      if (typeof it === 'string') {
        html += '<div class="ets-graphic-list-row"><span class="ets-gl-left">' + formatDocText(it) + '</span></div>';
      } else if (it && typeof it === 'object') {
        html +=
          '<div class="ets-graphic-list-row">' +
            '<span class="ets-gl-left">' + ETS.esc(it.label || '') + '</span>' +
            (it.value ? '<span class="ets-gl-right">' + ETS.esc(it.value || '') + '</span>' : '') +
          '</div>';
      }
    });
    html += '</div>';
    return html;
  }

  ETS.renderGraphicDoc = function (graphicDoc) {
    if (!graphicDoc) return '';
    var sv = graphicDoc.styleVariant ? String(graphicDoc.styleVariant).trim() : '';
    var outerHtml = '';
    if (graphicDoc.outerTitle) {
      outerHtml = '<div class="ets-tbl-outer-title' + (graphicDoc.outerTitleAlign === 'left' ? ' is-left' : '') + '">' + ETS.esc(graphicDoc.outerTitle) + '</div>';
    }
    var boxCls = 'ets-exam-doc ets-doc-graphic' + (sv ? (' ets-gv-' + ETS.esc(sv)) : '');
    var inner = '';

    if (sv === 'browser') {
      inner += '<div class="ets-gv-browser-bar"><span class="ets-gv-browser-dots"><i></i><i></i><i></i></span><span style="font-size:0.78rem;font-weight:700;color:#52525b;">Browser</span></div>';
      inner += '<div class="ets-gv-browser-inner">';
      if (graphicDoc.title) inner += '<div class="ets-graphic-title">' + ETS.esc(graphicDoc.title) + '</div>';
    } else if (sv === 'shaded-box') {
      if (graphicDoc.title) inner += '<div class="ets-gv-shaded-hdr">' + ETS.esc(graphicDoc.title) + '</div>';
    } else if (sv === 'dark-banner-form') {
      if (graphicDoc.title) inner += '<div class="ets-gv-dark-hdr">' + ETS.esc(graphicDoc.title) + '</div>';
    } else if (sv === 'billing') {
      if (Array.isArray(graphicDoc.topLines) && graphicDoc.topLines.length) {
        inner += '<div class="ets-gv-billing-top">' + graphicDoc.topLines.map(function (ln) { return ETS.esc(ln); }).join('<br>') + '</div>';
      }
      if (graphicDoc.subtitle) inner += '<div class="ets-gv-billing-sub">' + ETS.esc(graphicDoc.subtitle) + '</div>';
    } else {
      if (graphicDoc.title && graphicDoc.title !== graphicDoc.outerTitle && graphicDoc.title !== graphicDoc.mergedHeader) {
        inner += '<div class="ets-graphic-title">' + ETS.esc(graphicDoc.title) + '</div>';
      }
      if (graphicDoc.subtitle) {
        inner += '<div class="ets-graphic-subtitle">' + ETS.esc(graphicDoc.subtitle) + '</div>';
      }
    }

    if (graphicDoc.svg) {
      var imgMatch = String(graphicDoc.svg).match(/href="([^"]+p34_graphics\/[^"]+)"/);
      if (imgMatch && imgMatch[1]) {
        inner += '<div class="no-print" style="display:flex;justify-content:flex-end;margin-bottom:4px;"><button type="button" class="btn btn-xs btn-soft" onclick="ETS.openImageLightbox(\'' + ETS.escJsStr(imgMatch[1]) + '\', \'Hình minh họa gốc HD\')">' + ETS.icon('search') + ' Xem ảnh gốc HD</button></div>';
      }
      inner += '<div class="ets-p34-plate">' + graphicDoc.svg + '</div>';
    }
    if (graphicDoc.headers || graphicDoc.rows || graphicDoc.mergedHeader || graphicDoc.subHeaders) {
      inner += renderNativeTable(
        graphicDoc.rows || [],
        graphicDoc.headers || [],
        graphicDoc.mergedHeader || '',
        graphicDoc.subHeaders || []
      );
    }
    if (graphicDoc.items && graphicDoc.items.length) {
      inner += renderGraphicItemsList(graphicDoc.items);
    }
    if (Array.isArray(graphicDoc.fields) && graphicDoc.fields.length) {
      inner += '<div class="ets-tbl-fields">';
      graphicDoc.fields.forEach(function (fld) {
        inner += '<div class="ets-tbl-field-row">' +
          '<div class="ets-tbl-field-lbl">' + ETS.esc(fld.label || '') + '</div>' +
          '<div class="ets-tbl-field-boxes">' +
            (fld.boxes || ['']).map(function (bx) {
              return '<div class="ets-tbl-input-box">' + ETS.esc(bx || '') + '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      });
      inner += '</div>';
    }
    if (graphicDoc.footerSignature) {
      inner += '<div class="ets-tbl-footer-sig">' + ETS.esc(graphicDoc.footerSignature) + '</div>';
    }
    if (graphicDoc.footer) {
      inner += '<div class="ets-graphic-footer">' + ETS.esc(graphicDoc.footer) + '</div>';
    }
    if (sv === 'browser') inner += '</div>';
    return outerHtml + '<div class="' + boxCls + '">' + inner + '</div>';
  };
})();


'use strict';

window.ETS = Object.assign(window.ETS || {}, (function () {
  const _baseIcon = (window.ETS && typeof window.ETS.icon === 'function') ? window.ETS.icon : null;
  const icon = (name, cls) => _baseIcon ? _baseIcon(name, cls) : '';
  const STORAGE_KEY = 'ets2026_mastery_hub_v1';
  const rawData = window.__ETS_DATA__ || {};
  const DB = {
    voca: rawData.voca || [],
    test01: rawData.test01 || [],
    tests02To10: rawData.tests02To10 || {},
    tests: { T01: rawData.test01 || [], ...(rawData.tests02To10 || {}) },
    testsMeta: rawData.testsMeta || {},
    answerKeys: rawData.answerKeys || {},
    formulas: rawData.formulas || [],
    formulasRich: rawData.formulasRich || { parsed: [] },
    dictExtra: rawData.dictExtra || {},
  };

  const PART_RANGES = [
    { part: 1, name: 'Part 1: Hình ảnh', start: 1, end: 6 },
    { part: 2, name: 'Part 2: Hỏi - Đáp', start: 7, end: 31 },
    { part: 3, name: 'Part 3: Hội thoại', start: 32, end: 70 },
    { part: 4, name: 'Part 4: Bài nói ngắn', start: 71, end: 100 },
    { part: 5, name: 'Part 5: Điền câu', start: 101, end: 130 },
    { part: 6, name: 'Part 6: Điền đoạn văn', start: 131, end: 146 },
    { part: 7, name: 'Part 7: Đọc hiểu', start: 147, end: 200 },
  ];

  // Exact Q -> ETS page number map (pages 02..40)
  const Q_PAGE_BREAKS = [
    [196, 40], [191, 38], [186, 36], [181, 34], [176, 32], [172, 30], [168, 28],
    [164, 27], [161, 26], [158, 25], [155, 24], [153, 23], [151, 22], [149, 21],
    [147, 20], [143, 19], [139, 18], [135, 17], [131, 16], [121, 15], [109, 14],
    [101, 13], [95, 12], [83, 11], [71, 10], [65, 9], [56, 8], [44, 7],
    [32, 6], [7, 5], [5, 4], [3, 3], [1, 2]
  ];

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  const PROFILE_KEY = 'ets2026_active_profile';
  const PROFILE_USERS = {
    bao: { id: 'bao', name: 'Nguyễn Gia Bảo', shortName: 'Gia Bảo', badge: 'B' },
    anh: { id: 'anh', name: 'Nguyễn Thị Ngọc Ánh', shortName: 'Ngọc Ánh', badge: 'A' },
  };
  const FONT_SCALES = ['xs', 'sm', 'md', 'lg', 'xl', 'xxl'];
  const FONT_SCALE_LABELS = { xs: '90%', sm: '96%', md: '100%', lg: '112%', xl: '124%', xxl: '136%' };
  const TTS_VOICES = [
    { id: 'ava', gender: 'female', lang: 'en-US', pitch: 1.08, label: 'Nữ · Mỹ — Ava', sample: 'Hello! Consistent daily practice leads to a higher TOEIC score.' },
    { id: 'emma', gender: 'female', lang: 'en-US', pitch: 1.22, label: 'Nữ · Mỹ — Emma', sample: 'Welcome back! Let us review important grammar and vocabulary together.' },
    { id: 'sonia', gender: 'female', lang: 'en-GB', pitch: 1.0, label: 'Nữ · Anh — Sonia', sample: 'Welcome to today’s lesson. Pay close attention to pronunciation.' },
    { id: 'andrew', gender: 'male', lang: 'en-US', pitch: 0.92, label: 'Nam · Mỹ — Andrew', sample: 'Good morning! Listen closely to key details in each conversation.' },
    { id: 'brian', gender: 'male', lang: 'en-US', pitch: 0.78, label: 'Nam · Mỹ — Brian', sample: 'Focus on the main idea first, then check supporting facts carefully.' },
    { id: 'ryan', gender: 'male', lang: 'en-GB', pitch: 0.95, label: 'Nam · Anh — Ryan', sample: 'Let us practise listening carefully for names, numbers, and schedules.' },
  ];
  const VOICE_ALIAS_MAP = { aria: 'ava', jenny: 'emma', guy: 'andrew', christopher: 'brian' };

  function isHttpOrigin() {
    return location.protocol === 'http:' || location.protocol === 'https:';
  }
  function getProfileStorageKey(pid) {
    return `${STORAGE_KEY}_${PROFILE_USERS[pid] ? pid : 'bao'}`;
  }

  let activeProfileId = (() => {
    try {
      const p = localStorage.getItem(PROFILE_KEY);
      if (p && PROFILE_USERS[p]) return p;
    } catch (e) {}
    return 'bao';
  })();

  function defaultState() {
    return {
      theme: 'light',      // 'light' | 'sepia' | 'dark'
      fontScale: 'md',     // 'xs' | 'sm' | 'md' | 'lg' | 'xl' | 'xxl'
      ttsVoice: 'ava',     // 'ava' | 'emma' | 'sonia' (female) · 'andrew' | 'brian' | 'ryan' (male)
      vocaAudioSource: 'book', // 'book' = original VOCA mp3 · 'ai' = selected AI voice
      ttsRate: 1.0,
      leftPanePct: 50,     // 32..68
      topPanePct: 44,      // 22..78 (mobile vertical split)
      bilingual: true,
      route: 'home',       // home | voca-hub | voca-study | test-hub | test-practice | test-exam | test-result | formulas | notebook
      daily: {
        targetScore: 750,
        examDate: '2026-12-31',
        streak: 1,
        lastDate: todayStr(),
        today: { date: todayStr(), voca: 0, lc: 0, rc: 0, formula: 0 }
      },
      voca: {
        statuses: {},   // uid -> 'learning' | 'mastered'
        bookmarks: {},  // uid -> true
        srs: {},        // uid -> { dueAt, intervalDays, reps }
        notes: {},      // uid -> string
        customWords: [],
        filter: {
          test: 'ALL',
          tests: [],
          section: 'ALL',
          status: 'ALL',
          search: '',
          shuffle: false,
          sortOrder: 'SEQ', // SEQ | SHUFFLE | WEAK_FIRST
          batchSize: 25,
          autoSpeak: true,
          modePrefs: {
            fcFront: 'EN_FIRST',
            fcShowExample: true,
            quizDir: 'EN_VI',
            clozeModeType: 'CHOICE',
            matchPairs: 6,
            audioPauseSec: 2,
            audioLoop: false,
            listPageSize: 40,
            listMaskEn: false,
            listMaskVi: false,
          },
        },
        lastSessionSummary: null,
      },
      test: {
        activeCode: 'T01',
        answers: {},    // { T01: { "1": "A" } }
        checked: {},    // { T01: { "1": true } } -> locks option in Practice Mode until Reset!
        flags: {},      // { T01: { "1": true } }
        notes: {},      // { T01: { "1": "..." } }
        highlights: {}, // { T01: { "g_id": ["keyword1", ...] } }
        eliminated: {}, // { T01: { "1": { "A": true } } }
        attempts: [],   // [{ id, testCode, date, totalSec, lcRight, rcRight, lcScore, rcScore, totalScore, answers, skippedCount }]
      },
      formulas: {
        activeId: 0,
        viewMode: 'quick', // quick | full | quiz | drill
        search: '',
        bookmarks: {},
        quizDone: {},      // { "tid_idx": true }
        drillAnswers: {},  // { "F00_Q1": "B" }
      },
      lastActivity: { type: 'voca', label: 'Tiếp tục học Từ vựng', payload: {} },
    };
  }

  function syncCustomWordsIntoDb(st) {
    const cws = (st && st.voca && Array.isArray(st.voca.customWords)) ? st.voca.customWords : [];
    if (!cws.length) return;
    const existing = new Set(DB.voca.map((v) => v.uid));
    cws.forEach((cw) => {
      if (cw && cw.uid && !existing.has(cw.uid)) {
        DB.voca.unshift(cw);
        existing.add(cw.uid);
      }
    });
  }

  function loadState(pid = activeProfileId) {
    const def = defaultState();
    try {
      const raw = localStorage.getItem(getProfileStorageKey(pid));
      if (!raw) return def;
      const p = JSON.parse(raw);
      const merged = {
        ...def,
        ...p,
        daily: {
          ...def.daily,
          ...(p.daily || {}),
          today: { ...def.daily.today, ...((p.daily && p.daily.today) || {}) }
        },
        voca: {
          ...def.voca,
          ...(p.voca || {}),
          customWords: Array.isArray(p.voca && p.voca.customWords) ? p.voca.customWords : [],
          filter: {
            ...def.voca.filter,
            ...((p.voca && p.voca.filter) || {}),
            tests: Array.isArray(p.voca && p.voca.filter && p.voca.filter.tests)
              ? p.voca.filter.tests.filter(Boolean)
              : ((p.voca && p.voca.filter && p.voca.filter.test && p.voca.filter.test !== 'ALL') ? [p.voca.filter.test] : []),
            modePrefs: {
              ...def.voca.filter.modePrefs,
              ...((p.voca && p.voca.filter && p.voca.filter.modePrefs) || {}),
            },
          }
        },
        test: {
          ...def.test,
          ...(p.test || {}),
          eliminated: (p.test && p.test.eliminated) || {},
        },
        formulas: {
          ...def.formulas,
          ...(p.formulas || {}),
          drillAnswers: (p.formulas && p.formulas.drillAnswers) || {},
        },
      };
      if (!['light', 'sepia', 'dark'].includes(merged.theme)) merged.theme = 'light';
      if (!FONT_SCALES.includes(merged.fontScale)) merged.fontScale = 'md';
      if (VOICE_ALIAS_MAP[merged.ttsVoice]) merged.ttsVoice = VOICE_ALIAS_MAP[merged.ttsVoice];
      if (!TTS_VOICES.some((v) => v.id === merged.ttsVoice)) merged.ttsVoice = 'ava';
      merged.ttsRate = Math.max(0.75, Math.min(1.25, Number(merged.ttsRate) || 1.0));
      if (merged.daily.today.date !== todayStr()) {
        merged.daily.today = { date: todayStr(), voca: 0, lc: 0, rc: 0, formula: 0 };
      }
      syncCustomWordsIntoDb(merged);
      return merged;
    } catch (e) {
      return def;
    }
  }

  let profileHydrated = !isHttpOrigin();
  let profileDirty = false;
  let profileSyncTimer = null;
  let lastLocalSaveTs = Date.now();

  const state = loadState(activeProfileId);

  function applyStateObjectInPlace(rawObj) {
    const def = defaultState();
    const s = rawObj || {};
    const merged = {
      ...def,
      ...s,
      daily: { ...def.daily, ...(s.daily || {}), today: { ...def.daily.today, ...((s.daily && s.daily.today) || {}) } },
      voca: {
        ...def.voca,
        ...(s.voca || {}),
        filter: {
          ...def.voca.filter,
          ...((s.voca && s.voca.filter) || {}),
          modePrefs: { ...def.voca.filter.modePrefs, ...((s.voca && s.voca.filter && s.voca.filter.modePrefs) || {}) }
        }
      },
      test: { ...def.test, ...(s.test || {}) },
      formulas: { ...def.formulas, ...(s.formulas || {}) },
    };
    if (!['light', 'sepia', 'dark'].includes(merged.theme)) merged.theme = 'light';
    if (!FONT_SCALES.includes(merged.fontScale)) merged.fontScale = 'md';
    if (VOICE_ALIAS_MAP[merged.ttsVoice]) merged.ttsVoice = VOICE_ALIAS_MAP[merged.ttsVoice];
    if (!TTS_VOICES.some((v) => v.id === merged.ttsVoice)) merged.ttsVoice = 'ava';
    merged.ttsRate = Math.max(0.75, Math.min(1.25, Number(merged.ttsRate) || 1.0));
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, merged);
    syncCustomWordsIntoDb(state);
  }

  // Migrate legacy un-profiled storage strictly once into 'bao', remove legacy global key so profiles never leak
  (function migrateAndHydrateLocalProfile() {
    try {
      const baoKey = getProfileStorageKey('bao');
      const anhKey = getProfileStorageKey('anh');
      const legacyRaw = localStorage.getItem(STORAGE_KEY);
      if (legacyRaw) {
        if (!localStorage.getItem(baoKey) && !localStorage.getItem(anhKey)) {
          localStorage.setItem(baoKey, legacyRaw);
        }
        localStorage.removeItem(STORAGE_KEY);
      }
      const pRaw = localStorage.getItem(getProfileStorageKey(activeProfileId));
      if (pRaw) {
        applyStateObjectInPlace(JSON.parse(pRaw));
      } else {
        applyStateObjectInPlace(defaultState());
      }
    } catch (e) {}
  })();

  const CLOUD_PROFILE_UUIDS = {
    bao: '8f4b2e19-7c3a-4d91-b862-15e9c0a47d21',
    anh: '2876e83e-0f30-463e-afba-72d66d112064'
  };
  const CLOUD_GIST_ID = 'cf1da5e7595edc3d7c3a0d6151cc0dca';
  let cloudSyncTimer = null;
  let inFlightCloudPushes = 0;

  function isLocalServerOrigin() {
    const h = String(location.hostname || '').toLowerCase();
    return h === '127.0.0.1' || h === 'localhost' || h.startsWith('192.168.') || h.startsWith('10.');
  }

  function getPersistableRoute(r) {
    if (r === 'voca-study') return 'voca-hub';
    if (r === 'test-practice' || r === 'test-exam' || r === 'test-result' || r === 'paper-live') return 'test-hub';
    const allowed = ['home', 'voca-hub', 'test-hub', 'formulas', 'notebook', 'paper-exam', 'omr-scan'];
    return allowed.includes(r) ? r : 'home';
  }

  function serializeStateForStorage(stObj) {
    const s = stObj || state;
    return JSON.stringify({ ...s, route: getPersistableRoute(s.route) });
  }

  function getStateSyncFingerprint(stObj) {
    const s = stObj || {};
    return JSON.stringify({
      theme: s.theme || 'light',
      bilingual: !!s.bilingual,
      vStatuses: (s.voca && s.voca.statuses) || {},
      vBookmarks: (s.voca && s.voca.bookmarks) || {},
      vCustom: ((s.voca && s.voca.customWords) || []).length,
      tAnswers: (s.test && s.test.answers) || {},
      tChecked: (s.test && s.test.checked) || {},
      tFlags: (s.test && s.test.flags) || {},
      tNotes: (s.test && s.test.notes) || {},
      tAttempts: ((s.test && s.test.attempts) || []).length,
      fMastered: (s.formulas && s.formulas.masteredIds) || [],
      fDrills: (s.formulas && s.formulas.drillAnswers) || {},
      daily: (s.daily && s.daily.today) || {},
      streak: (s.daily && s.daily.streak) || 1,
    });
  }

  function mergeProfileStates(locObj, srvObj, srvIsNewer) {
    const def = defaultState();
    const older = (srvIsNewer ? locObj : srvObj) || {};
    const newer = (srvIsNewer ? srvObj : locObj) || {};
    const preservedRoute = (locObj && locObj.route) || state.route || 'home';

    // If a full reset happened more recently on one side, respect that reset timestamp
    const olderReset = Number(older._resetAt) || 0;
    const newerReset = Number(newer._resetAt) || 0;
    if (newerReset > olderReset && newerReset > (Number(older._lastEditAt) || 0)) {
      return { ...newer, route: preservedRoute };
    }

    const mergeTestMap = (field) => {
      const out = {};
      const oMap = (older.test && older.test[field]) || {};
      const nMap = (newer.test && newer.test[field]) || {};
      const codes = new Set([...Object.keys(oMap), ...Object.keys(nMap)]);
      codes.forEach((c) => {
        out[c] = { ...(oMap[c] || {}), ...(nMap[c] || {}) };
      });
      return out;
    };

    // Merge customWords by lowercase English word
    const cwMap = new Map();
    const pushCw = (arr) => {
      if (!Array.isArray(arr)) return;
      arr.forEach((w) => {
        if (w && w.en) cwMap.set(String(w.en).trim().toLowerCase(), w);
      });
    };
    pushCw(older.voca && older.voca.customWords);
    pushCw(newer.voca && newer.voca.customWords);

    // Merge attempts by id
    const attMap = new Map();
    const pushAtt = (arr) => {
      if (!Array.isArray(arr)) return;
      arr.forEach((a) => {
        if (a && a.id) attMap.set(a.id, a);
      });
    };
    pushAtt(older.test && older.test.attempts);
    pushAtt(newer.test && newer.test.attempts);
    const mergedAttempts = Array.from(attMap.values()).sort((a, b) => (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0));

    // Merge mastered formula IDs
    const fMastered = Array.from(new Set([
      ...((older.formulas && Array.isArray(older.formulas.masteredIds)) ? older.formulas.masteredIds : []),
      ...((newer.formulas && Array.isArray(newer.formulas.masteredIds)) ? newer.formulas.masteredIds : [])
    ]));

    return {
      ...def,
      ...older,
      ...newer,
      route: preservedRoute,
      _resetAt: Math.max(olderReset, newerReset),
      daily: {
        ...def.daily,
        ...(older.daily || {}),
        ...(newer.daily || {}),
        streak: Math.max(Number(older.daily && older.daily.streak) || 1, Number(newer.daily && newer.daily.streak) || 1),
        today: {
          ...def.daily.today,
          ...((older.daily && older.daily.today) || {}),
          ...((newer.daily && newer.daily.today) || {})
        }
      },
      voca: {
        ...def.voca,
        ...(older.voca || {}),
        ...(newer.voca || {}),
        statuses: { ...((older.voca && older.voca.statuses) || {}), ...((newer.voca && newer.voca.statuses) || {}) },
        bookmarks: { ...((older.voca && older.voca.bookmarks) || {}), ...((newer.voca && newer.voca.bookmarks) || {}) },
        srs: { ...((older.voca && older.voca.srs) || {}), ...((newer.voca && newer.voca.srs) || {}) },
        customWords: Array.from(cwMap.values()),
        filter: {
          ...def.voca.filter,
          ...((older.voca && older.voca.filter) || {}),
          ...((newer.voca && newer.voca.filter) || {})
        }
      },
      test: {
        ...def.test,
        ...(older.test || {}),
        ...(newer.test || {}),
        answers: mergeTestMap('answers'),
        checked: mergeTestMap('checked'),
        flags: mergeTestMap('flags'),
        notes: mergeTestMap('notes'),
        highlights: mergeTestMap('highlights'),
        eliminated: mergeTestMap('eliminated'),
        attempts: mergedAttempts
      },
      formulas: {
        ...def.formulas,
        ...(older.formulas || {}),
        ...(newer.formulas || {}),
        masteredIds: fMastered,
        drillAnswers: {
          ...((older.formulas && older.formulas.drillAnswers) || {}),
          ...((newer.formulas && newer.formulas.drillAnswers) || {})
        }
      }
    };
  }

  function pushProfileToCloud(pid, payloadStr, syncNow) {
    const uuid = CLOUD_PROFILE_UUIDS[pid];
    if (!uuid) return Promise.resolve(false);
    const url = `https://textdb.dev/api/data/${uuid}`;
    if (syncNow && navigator.sendBeacon) {
      try {
        const sent = navigator.sendBeacon(url, new Blob([payloadStr], { type: 'text/plain' }));
        if (sent) return Promise.resolve(true);
      } catch (e) {}
    }
    inFlightCloudPushes++;
    return fetch(url, {
      method: 'POST',
      keepalive: !!syncNow,
      headers: { 'Content-Type': 'text/plain' },
      body: payloadStr
    })
      .then((r) => r.ok)
      .catch(() => false)
      .finally(() => {
        inFlightCloudPushes = Math.max(0, inFlightCloudPushes - 1);
      });
  }

  function pushProfileToServer(syncNow) {
    if (String(location.search || '').includes('noprofile')) return;
    if (profileSyncTimer) { clearTimeout(profileSyncTimer); profileSyncTimer = null; }
    if (cloudSyncTimer) { clearTimeout(cloudSyncTimer); cloudSyncTimer = null; }
    const pid = activeProfileId;
    const pushTs = lastLocalSaveTs;
    const safeStateObj = { ...state, route: getPersistableRoute(state.route) };
    const payload = JSON.stringify({ state: safeStateObj, updatedAt: pushTs });
    if (isLocalServerOrigin()) {
      if (syncNow && navigator.sendBeacon) {
        try {
          navigator.sendBeacon(`/api/profile?id=${encodeURIComponent(pid)}`, new Blob([payload], { type: 'application/json' }));
        } catch (e) {}
      } else {
        fetch(`/api/profile?id=${encodeURIComponent(pid)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload
        }).catch(() => {});
      }
    }
    pushProfileToCloud(pid, payload, !!syncNow).then((ok) => {
      if (ok && lastLocalSaveTs <= pushTs) {
        profileDirty = false;
      }
    });
  }

  function saveState() {
    lastLocalSaveTs = Date.now();
    state._lastEditAt = lastLocalSaveTs;
    profileDirty = true;
    try {
      const json = serializeStateForStorage(state);
      localStorage.setItem(getProfileStorageKey(activeProfileId), json);
      localStorage.setItem(getProfileStorageKey(activeProfileId) + '_ts', String(lastLocalSaveTs));
    } catch (e) { /* storage quota guard */ }
    if (profileSyncTimer) clearTimeout(profileSyncTimer);
    profileSyncTimer = setTimeout(() => {
      profileSyncTimer = null;
      pushProfileToServer(false);
    }, 150);
  }

  window.addEventListener('pagehide', () => {
    if (profileDirty && profileHydrated) pushProfileToServer(true);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && profileHydrated && !profileDirty && inFlightCloudPushes === 0 && !['test-exam', 'paper-live', 'voca-study', 'test-practice'].includes(state.route)) {
      loadProfileFromServer(activeProfileId, { renderCurrent: true });
    }
  });

  setInterval(() => {
    if (document.visibilityState === 'visible' && profileHydrated && !profileDirty && inFlightCloudPushes === 0 && !['test-exam', 'paper-live', 'voca-study', 'test-practice'].includes(state.route) && !document.getElementById('etsModal')) {
      loadProfileFromServer(activeProfileId, { renderCurrent: true });
    }
  }, 15000);

  async function fetchRemoteProfileData(id) {
    let bestData = null;
    const consider = (d) => {
      if (!d || !d.state) return;
      const ts = Number(d.updatedAt) || 0;
      if (!bestData || ts >= (Number(bestData.updatedAt) || 0)) bestData = d;
    };
    if (isLocalServerOrigin()) {
      try {
        const resp = await fetch(`/api/profile?id=${encodeURIComponent(id)}`, { cache: 'no-store' });
        if (resp.ok) consider(await resp.json());
      } catch (e) {}
    }
    const uuid = CLOUD_PROFILE_UUIDS[id];
    if (uuid) {
      try {
        const resp = await fetch(`https://textdb.dev/api/data/${uuid}?t=${Date.now()}`, { cache: 'no-store' });
        if (resp.ok) {
          const txt = await resp.text();
          if (txt && txt.trim().startsWith('{')) consider(JSON.parse(txt));
        }
      } catch (e) {}
    }
    if (!bestData && CLOUD_GIST_ID) {
      try {
        const resp = await fetch(`https://api.github.com/gists/${CLOUD_GIST_ID}?t=${Date.now()}`, { cache: 'no-store' });
        if (resp.ok) {
          const gist = await resp.json();
          const fileObj = gist && gist.files && gist.files[`${id}.json`];
          if (fileObj && fileObj.content) consider(JSON.parse(fileObj.content));
        }
      } catch (e) {}
    }
    if (!bestData && isHttpOrigin()) {
      try {
        const resp = await fetch(`user_profiles/${encodeURIComponent(id)}.json?t=${Date.now()}`, { cache: 'no-store' });
        if (resp.ok) consider(await resp.json());
      } catch (e) {}
    }
    return bestData;
  }

  async function loadProfileFromServer(pid, opts = {}) {
    const id = PROFILE_USERS[pid] ? pid : 'bao';
    if (!opts.forceServer && (profileDirty || inFlightCloudPushes > 0 || profileSyncTimer || cloudSyncTimer)) {
      return;
    }
    const editTsAtStart = lastLocalSaveTs;
    try {
      const data = await fetchRemoteProfileData(id);
      if (!data || !data.state) {
        profileHydrated = true;
        return;
      }
      if (id !== activeProfileId) return;
      if (!opts.forceServer && (profileDirty || inFlightCloudPushes > 0 || lastLocalSaveTs !== editTsAtStart)) {
        return;
      }
      const srvTs = Number(data && data.updatedAt) || 0;
      const locTs = Number(localStorage.getItem(getProfileStorageKey(id) + '_ts') || 0);
      const locRaw = localStorage.getItem(getProfileStorageKey(id));
      let locObj = null;
      try { if (locRaw) locObj = JSON.parse(locRaw); } catch (e) {}

      const activeRouteBeforeLoad = state.route || 'home';
      const prevFp = getStateSyncFingerprint(state);

      const srvIsNewer = !locObj || srvTs > locTs;
      const mergedState = locObj ? mergeProfileStates(locObj, data.state, srvIsNewer) : { ...data.state, route: activeRouteBeforeLoad };
      applyStateObjectInPlace(mergedState);
      // Never allow cloud sync to hijack the user's current route on this device
      state.route = activeRouteBeforeLoad;

      const nextFp = getStateSyncFingerprint(state);
      const dataChanged = prevFp !== nextFp;

      const finalTs = Math.max(srvTs, locTs, lastLocalSaveTs);
      lastLocalSaveTs = finalTs;
      try {
        const json = serializeStateForStorage(state);
        localStorage.setItem(getProfileStorageKey(id), json);
        localStorage.setItem(getProfileStorageKey(id) + '_ts', String(finalTs));
      } catch (e) {}

      profileHydrated = true;
      profileDirty = false;
      applyThemeAndBilingual();
      renderNavState();

      const isInteractiveSession = ['voca-study', 'test-practice', 'test-exam', 'test-result', 'paper-live', 'omr-scan'].includes(state.route);
      if (opts.renderCurrent && (opts.forceServer || (dataChanged && !isInteractiveSession && !document.getElementById('etsModal')))) {
        const savedScrollY = window.scrollY || 0;
        const safeRoute = isInteractiveSession ? getPersistableRoute(state.route) : (state.route || 'home');
        navigate(safeRoute);
        if (!opts.forceServer) {
          window.scrollTo(0, savedScrollY);
        }
      }

      // If local had additional items that were merged into server state, push merged state back to cloud
      const srvSum = computeProfileSummaryFromState(id, data.state);
      const mrgSum = computeProfileSummaryFromState(id, state);
      if (mrgSum.mastered > srvSum.mastered || mrgSum.answered > srvSum.answered || mrgSum.attempts > srvSum.attempts) {
        pushProfileToServer(false);
      }
    } catch (e) {
      profileHydrated = true;
    }
  }

  async function selectProfile(pid, keepRoute = true) {
    const nextId = PROFILE_USERS[pid] ? pid : 'bao';
    const prevRoute = getPersistableRoute(state.route || 'home');
    if (profileDirty && profileHydrated) pushProfileToServer(true);
    closeHubSettings();
    transientResetHooks.forEach((fn) => { try { fn(); } catch (e) {} });
    activeProfileId = nextId;
    try { localStorage.setItem(PROFILE_KEY, nextId); } catch (e) {}
    profileHydrated = false;
    profileDirty = false;
    try {
      const locRaw = localStorage.getItem(getProfileStorageKey(nextId));
      applyStateObjectInPlace(locRaw ? JSON.parse(locRaw) : defaultState());
    } catch (e) {
      applyStateObjectInPlace(defaultState());
    }
    closeModal();
    applyThemeAndBilingual();
    renderNavState();
    const safeRoute = keepRoute ? prevRoute : getPersistableRoute(state.route || 'home');
    navigate(safeRoute);
    await loadProfileFromServer(nextId, { forceServer: true, renderCurrent: true });

  function computeProfileSummaryFromState(id, stObj) {
    const s = stObj || {};

    const ansByTest = (s.test && s.test.answers) || {};

  function trackDailyProgress(type, amount = 1) {
    const tStr = todayStr();
    if (!state.daily) state.daily = defaultState().daily;
    if (state.daily.today.date !== tStr) {
      const prev = new Date(state.daily.lastDate || tStr);
      const curr = new Date(tStr);
      const diff = Math.round((curr - prev) / 86400000);
      if (diff === 1) state.daily.streak = (state.daily.streak || 1) + 1;
      else if (diff > 1) state.daily.streak = 1;
      state.daily.lastDate = tStr;
      state.daily.today = { date: tStr, voca: 0, lc: 0, rc: 0, formula: 0 };
    }
    if (typeof state.daily.today[type] === 'number') {
      state.daily.today[type] += amount;
    }
    saveState();
  }

    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escJsStr(str) {
    if (str == null) return '';
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '&quot;')
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '');
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  function shuffleArr(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function scaledToeicSection(rawRight, section = 'LC') {

  function getSectionCefr(secScore, section = 'LC') {
    const s = Number(secScore) || 0;
    if (section === 'RC') {
      if (s >= 455) return 'C1';
      if (s >= 385) return 'B2';
      if (s >= 275) return 'B1';
      if (s >= 115) return 'A2';
      if (s >= 60) return 'A1';
      return 'Pre-A1';
    }
    if (s >= 490) return 'C1';
    if (s >= 400) return 'B2';
    if (s >= 275) return 'B1';
    if (s >= 110) return 'A2';
    if (s >= 60) return 'A1';
    return 'Pre-A1';
  }

  function getCefrProfile(totalScore, lcScore, rcScore) {
    const s = Number(totalScore) || 0;
    const lc = lcScore != null ? Number(lcScore) : Math.round(s * 0.52);
    const rc = rcScore != null ? Number(rcScore) : Math.max(5, s - lc);
    const lcCefr = getSectionCefr(lc, 'LC');
    const rcCefr = getSectionCefr(rc, 'RC');
    const equatingBand = `${Math.max(10, s - 15)}–${Math.min(990, s + 15)}`;
    if (s >= 945) return { level: 'C1', label: 'C1 — Thành thạo chuyên nghiệp (Effective Operational Proficiency)', color: '#10b981', lcCefr, rcCefr, equatingBand };
    if (s >= 785) return { level: 'B2', label: 'B2 — Độc lập chuyên nghiệp (Vantage / High Intermediate)', color: '#2563eb', lcCefr, rcCefr, equatingBand };

    if (s >= 225) return { level: 'A2', label: 'A2 — Sơ cấp cơ bản (Waystage / Elementary)', color: '#d97706', lcCefr, rcCefr, equatingBand };
    if (s >= 120) return { level: 'A1', label: 'A1 — Nhập môn (Breakthrough / Beginner)', color: '#64748b', lcCefr, rcCefr, equatingBand };

  function toggleCustomSelect(id, ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    const el = document.getElementById(id);
    const meta = _csRegistry[id];
    if (!el || !meta) return;
    const wasOpen = _csOpenId === id && el.classList.contains('open');
    closeAllCustomSelects();
    if (!wasOpen) {
      closeHubSettings();
      const trig = el.querySelector('.custom-select-trigger');
      if (!trig) return;
      _csOpenId = id;
      el.classList.add('open');
      const curVal = el.dataset.value != null ? el.dataset.value : meta.value;
      const portal = ensureSelectPortal();
      portal.innerHTML = meta.options.map((o) => {
        const isAct = String(o.value) === String(curVal);
        const quotedVal = `'${escJsStr(o.value)}'`;
        const rawVal = (typeof o.value === 'number' || typeof o.value === 'boolean' || o.value === null)
          ? String(o.value)
          : quotedVal;
        const callJs = meta.onChangeJs
          .replace(/'__VAL__'/g, quotedVal)
          .replace(/"__VAL__"/g, quotedVal)
          .replace(/__VAL__/g, rawVal)
          .replace(/"/g, '&quot;');
        return `
          <button type="button" role="option" aria-selected="${isAct ? 'true' : 'false'}"
            class="custom-select-opt ${isAct ? 'active' : ''}" data-val="${esc(o.value)}"
            onclick="ETS.pickCustomSelect('${escJsStr(id)}', '${escJsStr(o.value)}', '${escJsStr(o.label)}'); ${callJs}">
            <span>${esc(o.label)}</span>
            <span class="cs-check">${isAct ? icon('check') : ''}</span>
          </button>
        `;
      }).join('');

      const rect = trig.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom - 10;
      const spaceAbove = rect.top - 10;
      const openUp = spaceBelow < 190 && spaceAbove > spaceBelow;
      el.classList.toggle('open-up', openUp);
      portal.style.display = 'flex';
      portal.style.position = 'fixed';
      portal.style.zIndex = '99999';
      portal.style.minWidth = `${Math.max(155, Math.round(rect.width))}px`;
      portal.style.maxHeight = `${Math.max(120, Math.min(300, openUp ? spaceAbove : spaceBelow))}px`;
      if (openUp) {
        portal.style.top = 'auto';
        portal.style.bottom = `${Math.round(window.innerHeight - rect.top + 5)}px`;
      } else {
        portal.style.bottom = 'auto';
        portal.style.top = `${Math.round(rect.bottom + 5)}px`;
      }
      portal.style.left = `${Math.round(rect.left)}px`;
      portal.style.right = 'auto';
      const mRect = portal.getBoundingClientRect();
      if (mRect.right > window.innerWidth - 10) {
        portal.style.left = `${Math.round(Math.max(10, window.innerWidth - mRect.width - 10))}px`;
      }
      if (mRect.left < 10) portal.style.left = '10px';
    }
  }

  function playWordAudio(src, fallbackText, rate = 1.0) {
    clearTimeout(audioTimer);
    try { wordAudio.pause(); } catch (e) {}
    const safeRate = Number(rate) || 1.0;
    // User may choose the AI voice instead of the book recording for vocabulary
    if (state.vocaAudioSource === 'ai' && fallbackText) {
      speakEnglish(fallbackText, safeRate);
      return Promise.resolve();
    }
    if (!src) {
      if (fallbackText) speakEnglish(fallbackText, safeRate);
      return Promise.resolve();
    }
    wordAudio.src = src;
    wordAudio.currentTime = 0;
    wordAudio.playbackRate = safeRate;
    const p = wordAudio.play();
    if (p && p.catch) {
      return p.catch(() => {
        if (fallbackText) speakEnglish(fallbackText, safeRate);

    return Promise.resolve();

  // Pick a browser/OS voice that matches the chosen AI voice's gender + accent.
  function pickWebVoice(voiceId) {
    const vo = TTS_VOICES.find((v) => v.id === voiceId) || TTS_VOICES[0];
    const voices = (_webVoicesCache.length ? _webVoicesCache : refreshWebVoices()).filter((v) => /^en/i.test(v.lang || ''));
    if (!voices.length) return { voice: null, vo, genderMatched: false };
    const isFemale = (v) => FEMALE_VOICE_RX.test(v.name || '') && !/male/i.test((v.name || '').replace(/female/i, ''));
    const isMale = (v) => MALE_VOICE_RX.test(v.name || '') && !isFemale(v);
    const sameGender = voices.filter((v) => (vo.gender === 'female' ? isFemale(v) : isMale(v)));
    const pool = sameGender.length ? sameGender : voices;
    const scoreOf = (v) => {
      let s = 0;
      const n = (v.name || '').toLowerCase();
      if ((v.lang || '').toLowerCase().replace('_', '-') === vo.lang.toLowerCase()) s += 40;
      if (n.includes(vo.id)) s += 60;
      if (/natural|online|neural/.test(n)) s += 20;
      return s;
    };
    const ranked = pool.slice().sort((a, b) => scoreOf(b) - scoreOf(a));
    // Different voice ids of the same gender rotate to different OS voices when several exist
    const sameIds = TTS_VOICES.filter((v) => v.gender === vo.gender).map((v) => v.id);
    const rotIdx = Math.max(0, sameIds.indexOf(vo.id));
    const pick = ranked.find((v) => scoreOf(v) >= 60) || ranked[Math.min(rotIdx, ranked.length - 1)] || ranked[0];
    return { voice: pick || null, vo, genderMatched: sameGender.length > 0 };
  }

  function speakWithWebSpeech(cleanText, rateVal, voiceId) {
    if (!window.speechSynthesis || !cleanText) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(cleanText);
      const { voice, vo, genderMatched } = pickWebVoice(voiceId || state.ttsVoice || 'ava');
      if (voice) u.voice = voice;
      u.lang = (voice && voice.lang) || vo.lang;
      // Pitch gives each id its own colour; if the OS has no voice of that gender, shift pitch strongly.
      u.pitch = genderMatched ? vo.pitch : (vo.gender === 'female' ? 1.55 : 0.6);
      u.rate = rateVal === 1.0 ? 0.96 : rateVal;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function speakEnglish(text, rate, voiceOverride) {
    const cleanText = String(text || '').replace(/\s+/g, ' ').trim();
    if (!cleanText) return;
    const baseRate = (rate != null && !Number.isNaN(Number(rate))) ? Number(rate) : (Number(state && state.ttsRate) || 1.0);
    const rateVal = Math.max(0.65, Math.min(1.25, baseRate));
    const rawVoice = voiceOverride || (state && state.ttsVoice) || 'ava';
    const voiceId = VOICE_ALIAS_MAP[rawVoice] || rawVoice;
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    if (_ttsAudioEl) {
      try { _ttsAudioEl.pause(); _ttsAudioEl.src = ''; } catch (e) {}
      _ttsAudioEl = null;
    }
    if (isHttpOrigin()) {
      try {
        const url = `/api/tts?text=${encodeURIComponent(cleanText.slice(0, 600))}&voice=${encodeURIComponent(voiceId)}&rate=${rateVal.toFixed(2)}`;
        const aud = new Audio(url);
        _ttsAudioEl = aud;
        let fellBack = false;
        const fallback = () => {
          if (fellBack || _ttsAudioEl !== aud) return;
          fellBack = true;
          speakWithWebSpeech(cleanText, rateVal, voiceId);
        };
        aud.onerror = fallback;
        const pr = aud.play();
        if (pr && pr.catch) pr.catch(fallback);
        return;
      } catch (e) {}
    }
    speakWithWebSpeech(cleanText, rateVal, voiceId);
  }

  // Preview: prefer a pre-generated neural sample MP3 (works offline and on file://),
  // then fall back to live TTS.
  function previewTtsVoice(voiceIdOverride) {
    const targetId = voiceIdOverride || state.ttsVoice || 'ava';
    const vo = TTS_VOICES.find((v) => v.id === targetId) || TTS_VOICES[0];
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    if (_ttsAudioEl) { try { _ttsAudioEl.pause(); } catch (e) {} _ttsAudioEl = null; }
    const rate = Number(state.ttsRate) || 1.0;
    const aud = new Audio(`web_assets/tts_samples/${vo.id}.mp3`);
    _ttsAudioEl = aud;
    aud.playbackRate = rate;
    let done = false;
    const fb = () => { if (done || _ttsAudioEl !== aud) return; done = true; speakEnglish(vo.sample, rate, vo.id); };
    aud.onerror = fb;
    const pr = aud.play();
    if (pr && pr.catch) pr.catch(fb);
  }

  function startPronunciationCheck(targetWord, boxId) {
    const cleanTarget = String(targetWord || '').trim().toLowerCase().replace(/[^a-z0-9\s-]/g, '');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const box = boxId ? document.getElementById(boxId) : null;
    if (!SR) {
      speakEnglish(targetWord, 0.75);
      toast('Trình duyệt không hỗ trợ mic trực tiếp — Đã phát mẫu chậm 0.75x để bạn nhại theo (Shadowing).');
      if (box) box.innerHTML = `<span class="badge badge-warn">${icon('mic')} Chế độ Shadowing: Nghe mẫu 0.75x & phát âm to rõ từ "${esc(targetWord)}"</span>`;
      return;
    }
    try {
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      if (box) box.innerHTML = `<span class="badge badge-primary">${icon('mic')} Đang lắng nghe... Hãy đọc to: "${esc(targetWord)}"</span>`;
      else toast(`Đang lắng nghe... Hãy phát âm: "${esc(targetWord)}"`);
      rec.onresult = (ev) => {
        const alts = Array.from(ev.results[0] || []).map((r) => r.transcript.trim().toLowerCase().replace(/[^a-z0-9\s-]/g, ''));
        const spoken = alts[0] || '';
        const ok = alts.some((a) => a === cleanTarget || a.includes(cleanTarget) || cleanTarget.includes(a));
        if (ok) {
          if (box) box.innerHTML = `<span class="badge badge-success">${icon('check-circle')} Phát âm chuẩn! Nhận diện: "${esc(spoken)}" (100%)</span>`;
          toast(`Phát âm chuẩn: "${esc(spoken)}"`);
        } else {
          if (box) box.innerHTML = `<span class="badge badge-warn">${icon('target')} Bạn đọc: "${esc(spoken)}" · Mẫu: "${esc(targetWord)}" — Thử lại nhé!</span>`;
          toast(`Nhận diện: "${esc(spoken)}" · Hãy nghe lại mẫu nhé!`);
        }
      };
      rec.onerror = () => {
        speakEnglish(targetWord, 0.75);
        if (box) box.innerHTML = `<span class="badge badge-warn">${icon('mic')} Đã bật đọc mẫu chậm 0.75x để bạn luyện Shadowing!</span>`;
      };
      rec.start();
    } catch (e) {
      speakEnglish(targetWord, 0.75);
    }
  }

  // Highlight text helper & Vocabulary Lookup
  function applyHighlightsHtml(rawText, phrases) {
    let html = esc(rawText);
    if (!phrases || !phrases.length) return html.replace(/\n/g, '<br>');
    for (const ph of phrases) {
      if (!ph || ph.length < 2) continue;
      const safe = esc(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      try {
        html = html.replace(new RegExp(`(${safe})`, 'gi'), '<mark class="user-hl">$1</mark>');
      } catch (e) {}
    }
    return html.replace(/\n/g, '<br>');
  }

  const DYN_DICT_KEY = 'ets2026_dyn_dict_v1';
  let _vocaIdxMap = null;
  let _extraIdxMap = null;

  function buildDictIndices() {
    if (!_vocaIdxMap) {
      _vocaIdxMap = new Map();
      DB.voca.forEach((v) => {
        const full = (v.en || '').toLowerCase().trim();
        if (full && !_vocaIdxMap.has(full)) _vocaIdxMap.set(full, { ...v, inVoca1600: true });
        const stem = full.replace(/\s*\([^)]*\)\s*/g, '').replace(/\s*\+.*$/, '').trim();
        if (stem && !_vocaIdxMap.has(stem)) _vocaIdxMap.set(stem, { ...v, inVoca1600: true });
      });
    }
    if (!_extraIdxMap) {
      _extraIdxMap = new Map();
      const ex = DB.dictExtra || {};
      Object.keys(ex).forEach((k) => {
        const entry = ex[k];
        if (!entry) return;
        const low = k.toLowerCase().trim();
        if (low && !_extraIdxMap.has(low)) _extraIdxMap.set(low, { ...entry, inVoca1600: false });
        const stem = low.replace(/\s*\([^)]*\)\s*/g, '').replace(/\s*\+.*$/, '').trim();
        if (stem && !_extraIdxMap.has(stem)) _extraIdxMap.set(stem, { ...entry, inVoca1600: false });
      });
    }
  }

  function getDynDict() {
    try { return JSON.parse(localStorage.getItem(DYN_DICT_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function saveDynDictEntry(key, entry) {
    try {
      const d = getDynDict();
      d[key] = entry;
      const keys = Object.keys(d);
      if (keys.length > 600) keys.slice(0, keys.length - 600).forEach((k) => delete d[k]);
      localStorage.setItem(DYN_DICT_KEY, JSON.stringify(d));
    } catch (e) {}
  }

  function generateWordLemmas(w) {
    const out = [w];
    if (w.endsWith('ies') && w.length > 4) out.push(w.slice(0, -3) + 'y');
    if (w.endsWith('ied') && w.length > 4) out.push(w.slice(0, -3) + 'y');
    if (w.endsWith('ves') && w.length > 4) out.push(w.slice(0, -3) + 'f', w.slice(0, -3) + 'fe');
    if (w.endsWith('es') && w.length > 3) out.push(w.slice(0, -2), w.slice(0, -1));
    if (w.endsWith('s') && !w.endsWith('ss') && w.length > 3) out.push(w.slice(0, -1));
    if (w.endsWith('ed') && w.length > 4) {
      const b = w.slice(0, -2);
      out.push(b, b + 'e');
      if (b.length >= 3 && b[b.length - 1] === b[b.length - 2]) out.push(b.slice(0, -1));
    }
    if (w.endsWith('ing') && w.length > 5) {
      const b = w.slice(0, -3);
      out.push(b, b + 'e');
      if (b.endsWith('y')) out.push(b.slice(0, -1) + 'ie');
      if (b.length >= 3 && b[b.length - 1] === b[b.length - 2]) out.push(b.slice(0, -1));
    }
    if (w.endsWith('ly') && w.length > 4) {
      const b = w.slice(0, -2);
      out.push(b);
      if (w.endsWith('ily')) out.push(w.slice(0, -3) + 'y');
      if (w.endsWith('ally')) out.push(w.slice(0, -2));
    }
    if (w.endsWith('er') && w.length > 4) {
      const b = w.slice(0, -2);
      out.push(b, b + 'e');
      if (w.endsWith('ier')) out.push(w.slice(0, -3) + 'y');
    }
    if (w.endsWith('est') && w.length > 5) {
      const b = w.slice(0, -3);
      out.push(b, b + 'e');
      if (w.endsWith('iest')) out.push(w.slice(0, -4) + 'y');
    }
    return [...new Set(out.filter((x) => x && x.length >= 2))];
  }

  function lookupWordInDb(word) {
    const clean = String(word || '').replace(/[\u2018\u2019]/g, "'").trim().toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g, '').replace(/[^a-z\-'\s]/g, '').replace(/\s+/g, ' ');
    if (!clean) return null;
    buildDictIndices();
    const dyn = getDynDict();
    const cands = clean.includes(' ') ? [clean] : generateWordLemmas(clean);
    for (const c of cands) {
      if (_vocaIdxMap.has(c)) return _vocaIdxMap.get(c);
    }
    for (const c of cands) {
      if (_extraIdxMap.has(c)) return _extraIdxMap.get(c);
    }
    for (const c of cands) {
      if (dyn[c]) return dyn[c];
    }
    if (clean.length >= 4) {
      const pref = DB.voca.find((v) => v.en.toLowerCase().startsWith(clean));
      if (pref) return { ...pref, inVoca1600: true };
    }
    return null;
  }

  const _pendingLookupCache = {};
  function commitWordToVoca(entry) {
    if (!entry || !entry.en) return null;
    const cleanEn = entry.en.trim();
    const cleanLow = cleanEn.toLowerCase();
    const exists = (state.voca.customWords || []).find((w) => (w.en || '').toLowerCase().trim() === cleanLow)
      || DB.voca.find((w) => (w.en || '').toLowerCase().trim() === cleanLow);
    if (exists) {
      const wasStarred = !!(exists.uid && state.voca.bookmarks[exists.uid]);
      if (exists.uid) state.voca.bookmarks[exists.uid] = true;
      saveState();
      return { wordObj: exists, status: 'existing', wasStarred };
    }
    const uid = `CUSTOM_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
    const viText = (entry.vi || entry.def_en || '').trim();
    const exEnText = (entry.ex_en || entry.exEn || `We need to review the term ${cleanEn} carefully.`).trim();
    const exViText = (entry.ex_vi || entry.exVi || viText).trim();
    const wordObj = {
      uid,
      test: 'CỦA TÔI',
      testCode: 'CUSTOM',
      section: entry.section || 'Từ Đã Lưu',
      num: (state.voca.customWords?.length || 0) + 1,
      en: cleanEn,
      pos: (entry.pos || 'vocab').trim(),
      ipa: (entry.ipa || '').trim() || `/${cleanEn}/`,
      vi: viText,
      ex_en: exEnText,
      ex_vi: exViText,
      exEn: exEnText,
      exVi: exViText,
      note: entry.def_en ? `Định nghĩa: ${entry.def_en}` : (entry.note || ''),
      audio: entry.audio || ''
    };
    if (!Array.isArray(state.voca.customWords)) state.voca.customWords = [];
    state.voca.customWords.unshift(wordObj);
    state.voca.bookmarks[uid] = true;
    syncCustomWordsIntoDb(state);
    _vocaIdxMap = null;
    saveState();
    return { wordObj, status: 'created', wasStarred: false };
  }

  async function fetchOnlineDictEntry(wordText) {
    const clean = String(wordText || '').replace(/[\u2018\u2019]/g, "'").trim().toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g, '');
    if (!clean) return null;
    let ipa = '', pos = 'vocab', exEn = '', defEn = '', vi = '', exVi = '';
    try {
      const [dictRes, trRes] = await Promise.allSettled([
        fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(clean)}`).then((r) => (r.ok ? r.json() : null)),
        fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURIComponent(wordText)}`).then((r) => (r.ok ? r.json() : null)),
      ]);
      if (dictRes.status === 'fulfilled' && Array.isArray(dictRes.value) && dictRes.value[0]) {
        const d0 = dictRes.value[0];
        ipa = d0.phonetic || (Array.isArray(d0.phonetics) && (d0.phonetics.find((p) => p.text) || {}).text) || '';
        const m0 = Array.isArray(d0.meanings) && d0.meanings[0];
        if (m0) {
          pos = m0.partOfSpeech || 'vocab';
          const df = Array.isArray(m0.definitions) ? (m0.definitions.find((x) => x.example) || m0.definitions[0]) : null;
          if (df) {
            defEn = df.definition || '';
            exEn = df.example || '';
          }
        }
      }
      if (trRes.status === 'fulfilled' && Array.isArray(trRes.value) && Array.isArray(trRes.value[0])) {
        vi = trRes.value[0].map((seg) => (seg && seg[0]) || '').join('').trim();
      }
      if (exEn) {
        try {
          const exTr = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURIComponent(exEn)}`).then((r) => (r.ok ? r.json() : null));
          if (Array.isArray(exTr) && Array.isArray(exTr[0])) {
            exVi = exTr[0].map((seg) => (seg && seg[0]) || '').join('').trim();
          }
        } catch (e) {}
      }
    } catch (e) {}
    if (!(vi || ipa || defEn)) return null;
    const entry = { en: wordText.trim(), pos, ipa, vi: vi || defEn || '(Xem nghĩa tiếng Anh)', ex_en: exEn, ex_vi: exVi, def_en: defEn, source: 'online', inVoca1600: false };
    saveDynDictEntry(clean, entry);
    return entry;
  }

  async function fetchDynamicDictionaryWord(wordText, containerId) {
    const entry = await fetchOnlineDictEntry(wordText);
    const box = document.getElementById(containerId);
    if (entry) {
      if (box) {
        const modalCard = box.closest('.modal-card');
        if (modalCard) modalCard.innerHTML = renderRichLookupBody(entry, 'Từ điển Anh–Việt Trực tuyến');
      }
    } else if (box) {
      box.innerHTML = `<div style="font-size:0.8667rem;color:var(--ink-muted);padding:10px;background:var(--surface-2);border-radius:8px;">Không tìm thấy nghĩa tự động (có thể đang mất mạng). Bạn vẫn có thể nghe phát âm 1x / 0.75x, luyện đọc Mic, hoặc bấm <strong>+ Thêm Từ Của Tôi</strong> để tự ghi chú.</div>`;
    }
  }

  async function saveHighlightedWordDirect(rawText) {
    const phrase = String(rawText || '').replace(/[\u2018\u2019]/g, "'").trim().replace(/\s+/g, ' ');
    if (!phrase) return;
    const firstWord = (phrase.match(/[A-Za-z'-]{2,}/) || [phrase])[0];
    const cleanPhrase = phrase.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, '');
    const phraseWords = cleanPhrase ? cleanPhrase.split(/\s+/) : [];
    let match = (cleanPhrase && cleanPhrase.length <= 40 && phraseWords.length <= 4)
      ? lookupWordInDb(cleanPhrase)
      : null;
    if (!match && firstWord) match = lookupWordInDb(firstWord);
    if (match) {
      const res = commitWordToVoca(match);
      if (res) {
        toast(formatSavedWordToast(res, match.source === 'online'));
        refreshVocaOrNotebookRoute();
        return;
      }
    }
    const target = (cleanPhrase && cleanPhrase.length <= 32 && phraseWords.length <= 3) ? cleanPhrase : firstWord;
    toast(`Đang tra từ điển để lưu "${target}"...`);
    const dynEntry = await fetchOnlineDictEntry(target);
    if (dynEntry) {
      const res = commitWordToVoca(dynEntry);
      if (res) {
        toast(formatSavedWordToast(res, true));
        refreshVocaOrNotebookRoute();
        return;
      }
    }
    toast(`Chưa có "${target}" trong từ điển, bạn hãy tự nhập nghĩa nhé.`);
    openAddCustomWordModal(target);
  }

  // Custom Native-Free Calendar Picker for Goal Settings Modal
  let calYear = 2026;
  let calMonth = 11; // 0..11
  let calSelectedDate = '2026-12-31';

  function buildCalGridHtml() {
    const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const monthNames = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
    const cells = [];
    for (let i = 0; i < firstDay; i++) cells.push(`<div class="cal-day muted"></div>`);
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isAct = ds === calSelectedDate;
      cells.push(`<button type="button" class="cal-day ${isAct ? 'active' : ''}" onclick="ETS.pickCalDate('${ds}')">${d}</button>`);
    }
    return `
      <div class="cal-head">
        <button type="button" class="btn btn-xs" onclick="ETS.stepCalMonth(-1)">${icon('chevron-left')}</button>
        <span>${icon('calendar')} ${monthNames[calMonth]} ${calYear} (Đang chọn: ${esc(calSelectedDate)})</span>
        <button type="button" class="btn btn-xs" onclick="ETS.stepCalMonth(1)">${icon('chevron-right')}</button>
      </div>
      <div class="cal-grid">
        ${['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map((w) => `<div class="cal-dow">${w}</div>`).join('')}
        ${cells.join('')}
      </div>
    `;
  }

  function stepCalMonth(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    const box = document.getElementById('customCalBox');
    if (box) box.innerHTML = buildCalGridHtml();
  }

  function pickCalDate(ds) {
    calSelectedDate = ds;
    const inp = document.getElementById('goalDateHidden');
    if (inp) inp.value = ds;
    const box = document.getElementById('customCalBox');
    if (box) box.innerHTML = buildCalGridHtml();
  }

  function stepFontScale(delta) {
    if (delta === 0) return setFontScale('md');
    const curIdx = FONT_SCALES.indexOf(state.fontScale || 'md');
    const idx = curIdx >= 0 ? curIdx : 2;
    const nextIdx = Math.max(0, Math.min(FONT_SCALES.length - 1, idx + (delta > 0 ? 1 : -1)));
    setFontScale(FONT_SCALES[nextIdx]);
  }

  // Router & Sub-View Dispatchers
  const viewRenderers = {};
  function registerView(name, fn) { viewRenderers[name] = fn; }

  let lastNavScrollY = 0;
  function resetNavVisibility() {
    document.body.classList.remove('nav-hidden');
    lastNavScrollY = window.scrollY || 0;

  function navigate(route, opts = {}) {
    resetNavVisibility();
    if (state.route !== route && (state.route === 'test-exam' || state.route === 'test-practice' || state.route === 'voca-study')) {
      stopAllAudio();
    }
    if (state.route === 'paper-exam' && route !== 'paper-exam' && window.ETS.stopPaperAudioAndTimer) {
      window.ETS.stopPaperAudioAndTimer();
    }
    if (state.route === 'paper-live' && route !== 'paper-live' && window.ETS.stopPaperLiveExam) {
      window.ETS.stopPaperLiveExam();
    }
    if (state.route === 'omr-scan' && route !== 'omr-scan' && window.ETS.stopOmrCamera) {
      window.ETS.stopOmrCamera();
    }
    hideSelectionPopover();
    const tc = document.getElementById('toastContainer');
    if (tc) tc.replaceChildren();
    state.route = route;
    try {
      if (profileHydrated && localStorage.getItem(getProfileStorageKey(activeProfileId))) {
        localStorage.setItem(getProfileStorageKey(activeProfileId), serializeStateForStorage(state));
      }
    } catch (e) {}
    applyThemeAndBilingual();
    renderNavState();
    const fn = viewRenderers[route];
    if (fn) fn(opts);
    else if (route === 'paper-exam' && window.ETS.renderPaperExamView) window.ETS.renderPaperExamView(opts && opts.testCode);
    else if (route === 'omr-scan' && window.ETS.renderOmrScannerView) window.ETS.renderOmrScannerView();
    else renderHome();
    if (route !== 'test-practice' && route !== 'test-exam') window.scrollTo(0, 0);
  }

  // Mistake Notebook & Data Safety Page
  function renderNotebook() {
    const root = document.getElementById('appContent');
    const wrongs = [];
    const partStats = {};
    PART_RANGES.forEach((r) => { partStats[r.part] = { name: r.name, done: 0, right: 0, wrong: 0 }; });

    for (const tCode of Object.keys(state.test.answers)) {
      const ansMap = state.test.answers[tCode] || {};
      const keysMap = DB.answerKeys[tCode] || {};
      for (const qStr of Object.keys(ansMap)) {
        const q = Number(qStr);
        if (!ansMap[qStr]) continue;
        const pr = getQPart(q);
        if (pr && partStats[pr.part]) {
          partStats[pr.part].done++;
          if (keysMap[qStr] && ansMap[qStr] === keysMap[qStr]) partStats[pr.part].right++;
          else partStats[pr.part].wrong++;
        }
        if (keysMap[qStr] && ansMap[qStr] !== keysMap[qStr]) {
          wrongs.push({ testCode: tCode, q, picked: ansMap[qStr], right: keysMap[qStr], note: (state.test.notes[tCode] || {})[qStr] || '' });
        }
      }
    }
    wrongs.sort((a, b) => a.testCode.localeCompare(b.testCode) || a.q - b.q);

    const formulaWrongs = [];
    const fAns = (state.formulas && state.formulas.drillAnswers) || {};
    const fTopics = (DB.formulasRich && DB.formulasRich.parsed) || [];
    fTopics.forEach((tp) => {
      (tp.practiceQuestions || []).forEach((pq) => {
        const picked = fAns[pq.qId];
        if (picked && picked !== pq.ans) {
          formulaWrongs.push({
            tid: tp.id,
            topicTitle: tp.title || tp.friendlyTitle || `Chuyên đề #${tp.id}`,
            qId: pq.qId,
            picked,
            right: pq.ans,
            diff: pq.difficulty || 'medium',
            stem_en: pq.stem_en || '',

        <div class="nb-part-grid">
          ${PART_RANGES.map((r) => {
            const st = partStats[r.part];
            const acc = st.done ? Math.round((st.right / st.done) * 100) : null;
            return `
              <div style="padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);">

        ses.idx = 0;
        ses.isFlipped = false;
        toast('Đã đảo ngẫu nhiên danh sách từ hiện tại!');
      } else {
        const remSet = new Set(ses.queue.map((x) => x.uid));
        ses.queue = ses.originalBatch.filter((x) => remSet.has(x.uid));
        ses.idx = 0;
        ses.isFlipped = false;
        toast('Đã khôi phục thứ tự gốc của danh sách từ!');
      }
      if (ses.mode === 'quiz' && ses.queue[0]) prepareQuizOptions(ses.queue[0]);
      if (ses.mode === 'cloze' && ses.queue[0]) prepareClozeQuestion(ses.queue[0]);
      if (ses.queue[0] && ses.mode !== 'dictation' && ses.autoSpeak) {
        playWordAudio(ses.queue[0].audio, ses.queue[0].en);
      }
      renderVocaStudy();
    }
  }

  function reshuffleVocaNow() {
    if (!ses) return;
    state.voca.filter.shuffle = true;
    ses.shuffle = true;
    saveState();
    if (ses.mode === 'match') {
      setupMatchBoard();
      toast('Đã trộn bảng ghép thẻ mới!');
      renderVocaStudy();
      return;
    }
    if (ses.mode === 'fc1') {
      ses.queue = shuffleArr(ses.queue);
    } else {
      const donePart = ses.queue.slice(0, ses.idx);
      const remPart = shuffleArr(ses.queue.slice(ses.idx));
      ses.queue = [...donePart, ...remPart];
    }
    if (ses.learnQueue && ses.learnQueue.length > 1) {
      ses.learnQueue = shuffleArr(ses.learnQueue);
    }
    const cur = currentStudyWord();
    if (ses.mode === 'quiz' && cur) prepareQuizOptions(cur);
    if (ses.mode === 'cloze' && cur) prepareClozeQuestion(cur);
    toast('Đã xáo trộn ngẫu nhiên các từ còn lại trong lượt!');
    renderVocaStudy();
  }

    state.voca.filter.autoSpeak = !state.voca.filter.autoSpeak;

    cloze: 'Ẩn từ vựng mục tiêu trong câu ví dụ TOEIC thực tế; chọn đáp án hoặc tự điền.',

    list: 'Xem bảng tổng hợp theo gói đã gộp, che cột tự kiểm tra hoặc bật Auto-Play.',
  };

  let setupDraft = null;

  function buildInitialSetupDraft(mode, prefill = {}) {
    const f = state.voca.filter || {};
    const mp = f.modePrefs || {};
    const curSel = getSelectedTests(f, prefill);
    const hasCustom = (state.voca.customWords || []).length > 0;
    const initialSet = new Set(
      curSel.length > 0
        ? curSel
        : (hasCustom ? [...ALL_TEST_CODES, 'CUSTOM'] : ALL_TEST_CODES)
    );
    return {
      mode,
      selectedSet: initialSet,
      section: prefill.section || f.section || 'ALL',
      status: prefill.status || f.status || 'ALL',
      sortOrder: prefill.sortOrder || f.sortOrder || (f.shuffle ? 'SHUFFLE' : 'SEQ'),
      batchSize: prefill.batchSize != null ? prefill.batchSize : (f.batchSize || 25),
      autoSpeak: prefill.autoSpeak != null ? prefill.autoSpeak : (f.autoSpeak !== false),
      search: prefill.search != null ? prefill.search : (f.search || ''),
      fcFront: prefill.fcFront || mp.fcFront || 'EN_FIRST',
      fcShowExample: prefill.fcShowExample != null ? prefill.fcShowExample : (mp.fcShowExample !== false),
      quizDir: prefill.quizDir || mp.quizDir || 'EN_VI',
      clozeModeType: prefill.clozeModeType || mp.clozeModeType || 'CHOICE',
      dictHideVi: prefill.dictHideVi != null ? prefill.dictHideVi : !!mp.dictHideVi,
      matchPairs: Number(prefill.matchPairs || mp.matchPairs || 6),
      audioPauseSec: Number(prefill.audioPauseSec || mp.audioPauseSec || 2),
      audioLoop: prefill.audioLoop != null ? prefill.audioLoop : !!mp.audioLoop,
      listPageSize: Number(prefill.listPageSize || mp.listPageSize || 80),
      listMask: prefill.listMask || mp.listMask || 'NONE',
    };
  }

  function computeSetupPool(draft = setupDraft) {
    if (!draft || !draft.selectedSet || draft.selectedSet.size === 0) return [];
    const arr = Array.from(draft.selectedSet);
    return getFilteredVoca({
      tests: arr,
      section: draft.section,
      status: draft.status,
      sortOrder: draft.sortOrder,
      search: draft.search,
      shuffle: false,
    });
  }

  function formatDraftTestsSummary(draft = setupDraft) {
    if (!draft || !draft.selectedSet || draft.selectedSet.size === 0) return 'Chưa chọn gói Test nào';
    const hasCustom = (state.voca.customWords || []).length > 0;
    const allStd = ALL_TEST_CODES.every((c) => draft.selectedSet.has(c));
    if (allStd && (!hasCustom || draft.selectedSet.has('CUSTOM'))) return 'Tất cả 10 Test';
    const arr = Array.from(draft.selectedSet);
    if (arr.length <= 4) return arr.map((c) => (c === 'CUSTOM' ? 'Từ cá nhân' : c)).join(' + ');
    return `${arr.length} gói (${arr.slice(0, 3).join(' + ')} +${arr.length - 3})`;
  }

  function persistDraftToFilter(draft) {
    const f = state.voca.filter;
    const hasCustom = (state.voca.customWords || []).length > 0;
    const allStd = draft.selectedSet.size > 0 && ALL_TEST_CODES.every((c) => draft.selectedSet.has(c));
    const testsArr = (allStd && (!hasCustom || draft.selectedSet.has('CUSTOM'))) ? [] : Array.from(draft.selectedSet);
    f.tests = testsArr;
    f.test = testsArr.length === 0 ? 'ALL' : (testsArr.length === 1 ? testsArr[0] : 'MULTI');
    f.section = draft.section;
    f.status = draft.status;
    f.sortOrder = draft.sortOrder;
    f.shuffle = draft.sortOrder === 'SHUFFLE';
    f.batchSize = draft.batchSize;
    f.autoSpeak = draft.autoSpeak;
    f.search = draft.search || '';
    f.modePrefs = {
      ...(f.modePrefs || {}),
      fcFront: draft.fcFront,
      fcShowExample: draft.fcShowExample,
      quizDir: draft.quizDir,
      clozeModeType: draft.clozeModeType,
      dictHideVi: draft.dictHideVi,
      matchPairs: draft.matchPairs,
      audioPauseSec: draft.audioPauseSec,
      audioLoop: draft.audioLoop,
      listPageSize: draft.listPageSize,
      listMask: draft.listMask,
    };
    saveState();
  }
