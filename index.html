  function renderWorkspace() {
    const host = document.getElementById('wsRoot');
    if (!host || !ws) return;
    const sc = currentScreen();
    const isExam = ws.mode === 'exam';
    const partInfo = getQPart(sc.qStart);
    const labelRange = sc.qStart === sc.qEnd ? `Câu ${sc.qStart}` : `Câu ${sc.qStart}–${sc.qEnd}`;
    const shortRange = sc.qStart === sc.qEnd ? `${sc.qStart}` : `${sc.qStart}–${sc.qEnd}`;
    const metaTitle = `${ws.testCode} · Part ${partInfo.part} · ${labelRange}`;
    const mobTitle = `${ws.testCode}·P${partInfo.part}·${shortRange}`;

    const ansMap = isExam ? ws.examAnswers : (state.test.answers[ws.testCode] || {});
    const checkedMap = isExam ? {} : (state.test.checked[ws.testCode] || {});
    const flagsMap = isExam ? ws.examFlags : (state.test.flags[ws.testCode] || {});
    const keysMap = DB.answerKeys[ws.testCode] || {};

    const audioCenterHtml = buildAudioCenterHtml(sc, isExam);
    const topRightHtml = buildTopRightHtml(sc, isExam, partInfo);
    const leftHtml = buildLeftPaneHtml(sc, isExam, checkedMap, ansMap, flagsMap, keysMap);
    const rightHtml = buildRightPaneHtml(sc, isExam, ansMap, checkedMap, flagsMap, keysMap);

    const activeTotal = ws.activeIndices.length;
    const isExamLcLocked = isExam && !ws.lcFinished;
    const isCurScreenDone = isScreenAllAnswered(sc, ansMap);
    const canGoPrev = !isExam ? ws.posInActive > 0 : (ws.lcFinished && sc.qStart > 101);
    const canGoNext = !isExam
      ? ws.posInActive < activeTotal - 1
      : (ws.lcFinished ? ws.posInActive < activeTotal - 1 : (isCurScreenDone && ws.posInActive < activeTotal - 1));

    const hasAudio = !!audioCenterHtml;
    const isReadingAudioBar = !!(isExam && !sc.audio && ws.lcFinished);
    const isUnifiedP2P5 = !isExam && (sc.part === 2 || sc.part === 5);
    const isScreenAnswered = !isExam && sc.qStart === sc.qEnd && !!checkedMap[sc.qStart];
    if ((!isExam || (sc.part !== 5 && sc.part !== 2)) && Number(state.topPanePct) === 0 && !ws.userSplitTouched) {
      state.topPanePct = 44;
      document.documentElement.style.setProperty('--top-pane-pct', '44%');
    }
    const curLeftPct = sc.part === 5
      ? (state.p5LeftPanePct != null ? Number(state.p5LeftPanePct) : (state.leftPanePct != null ? Number(state.leftPanePct) : 50))
      : Math.max(32, Math.min(68, Number(state.leftPanePct) || 50));
    document.documentElement.style.setProperty('--left-pane-pct', `${curLeftPct}%`);
    const isLeftCollapsed = (sc.part === 5 && curLeftPct <= 2);
    const topPct = (state.topPanePct != null) ? Math.max(0, Math.min(78, Number(state.topPanePct))) : 44;
    const isTopCollapsed = (topPct === 0);
    const isExamP5DefaultCollapsed = isExam && partInfo.part === 5 && !ws.userSplitTouched;
    const splitCornerLabel = topPct === 0 ? 'Hiện đề' : `${topPct}%`;

    host.innerHTML = `
      <header class="ws-topbar ${hasAudio ? (isReadingAudioBar ? 'has-audio is-exam-rc' : 'has-audio') : 'ws-topbar-reading'} ${isExam ? 'is-exam-topbar' : ''}">
        <div class="ws-left-meta">
          <button class="btn btn-sm ws-back-btn" onclick="ETS.exitWorkspace()" title="${isExam ? 'Thoát thi' : 'Quay lại Kho Đề'}">← <span class="hide-mob">${isExam ? 'Thoát thi' : 'Kho Đề'}</span></button>
          <span class="badge hide-mob ${isExam ? 'badge-danger' : 'badge-primary'}">${isExam ? icon('clock') + ' THI THẬT' : icon('sparkles') + ' LUYỆN TẬP'}</span>
          <span class="ws-title"><span class="hide-mob">${esc(metaTitle)}</span><span class="show-mob">${esc(mobTitle)}</span></span>
        </div>

        ${hasAudio ? `<div id="wsAudioCenterSlot">${audioCenterHtml}</div>` : '<div id="wsAudioCenterSlot" style="display:none;"></div>'}

        <div class="ws-right-actions" id="wsTopRightSlot">${topRightHtml}</div>
      </header>

      <main class="ws-split is-part${partInfo.part} ${isExam ? 'is-exam-split' : 'is-practice-split'} ${isUnifiedP2P5 ? 'is-unified-p2p5' : ''} ${isScreenAnswered ? 'is-answered' : ''} ${isLeftCollapsed ? 'is-left-collapsed' : ''} ${isTopCollapsed ? 'is-top-collapsed' : ''} ${ws.userSplitTouched ? 'is-user-split' : ''}" id="wsSplitGrid">
        <section class="ws-pane ws-pane-left" id="wsLeftPane">${leftHtml}</section>
        <div class="ws-resizer" id="wsResizer" title="Kéo để chỉnh tỷ lệ hai khung (Nhấp đúp để đặt lại)" ondblclick="ETS.resetSplitPaneWidth()">
          <span class="ws-resizer-grip" aria-hidden="true"></span>
        </div>
        <div class="ws-corner-split-wrap show-mob" id="wsCornerSplitWrap" onpointerdown="event.stopPropagation()">
          <button type="button" class="ws-corner-split-btn ${(isTopCollapsed || isExamP5DefaultCollapsed) ? 'is-collapsed' : ''}" id="wsCornerSplitBtn" onclick="ETS.toggleSplitMenu(event)" title="Chỉnh tỷ lệ khung Đề / Câu hỏi">
            ⇕ <span id="wsCornerSplitLbl">${esc(isExamP5DefaultCollapsed ? 'Hiện đề' : splitCornerLabel)}</span>
          </button>
          <div class="menu-popover ws-corner-split-menu ${ws.splitMenuOpen ? 'show' : ''}" id="wsCornerSplitMenu">
            <button type="button" class="menu-item ws-split-pill ${topPct === 0 ? 'active' : ''}" onclick="ETS.setMobileSplitPreset(0)"><span>Ẩn khung Đề</span><span>0%</span></button>
            <button type="button" class="menu-item ws-split-pill ${topPct > 0 && topPct <= 32 ? 'active' : ''}" onclick="ETS.setMobileSplitPreset(28)"><span>Đề nhỏ</span><span>28%</span></button>
            <button type="button" class="menu-item ws-split-pill ${topPct > 32 && topPct <= 55 ? 'active' : ''}" onclick="ETS.setMobileSplitPreset(44)"><span>Cân bằng</span><span>44%</span></button>
            <button type="button" class="menu-item ws-split-pill ${topPct > 55 ? 'active' : ''}" onclick="ETS.setMobileSplitPreset(66)"><span>Đề lớn</span><span>66%</span></button>
          </div>
        </div>
        <section class="ws-pane" id="wsRightPane">${rightHtml}</section>
      </main>

      ${isExam && ws.countdownRemaining > 0 ? `
        <div class="exam-countdown-bar ${ws.countdownMissing.length ? 'warn' : 'ok'}">
          ${ws.countdownMissing.length
            ? `<span>${icon('alert')} CẢNH BÁO: Bạn chưa chọn đáp án câu <strong>${ws.countdownMissing.join(', ')}</strong>! Hệ thống vẫn tự chuyển sau <strong>${ws.countdownRemaining}s</strong>...</span>`
            : `<span>${icon('check-circle')} Đã xong audio ${labelRange} · Tự động chuyển tiếp sau <strong>${ws.countdownRemaining}s</strong>...</span>`}
        </div>
      ` : ''}

      <div id="wsPopoverLayer">
        ${ws.paletteOpen && !isExamLcLocked ? renderPalettePopover(sc, isExam, ansMap, keysMap, flagsMap) : ''}
      </div>

      <footer class="ws-bottom-dock">
        <button class="btn btn-sm" id="wsPrevScreenBtn" ${!canGoPrev ? 'disabled' : ''} onclick="ETS.stepScreen(-1)">← <span class="hide-mob">Câu / Nhóm </span>trước</button>

        <button class="palette-trigger ${isExamLcLocked ? 'is-locked-lc' : ''}" id="wsPaletteBtn"
          ${isExamLcLocked ? 'disabled' : ''}
          onclick="ETS.togglePalettePopover(event)">
          ${buildDockPillInnerHtml(sc, isExam, ansMap, keysMap)}
        </button>

        <button class="btn btn-sm btn-primary" id="wsNextScreenBtn" ${!canGoNext ? 'disabled' : ''} onclick="ETS.stepScreen(1)"><span class="hide-mob">Câu / Nhóm </span>sau →</button>
      </footer>
    `;

    attachSplitResizer();
    attachWorkspaceAudio(false);
    postRenderDomHighlights(sc);
  }

  function buildDockPillInnerHtml(sc, isExam, ansMap, keysMap) {
    const partInfo = getQPart(sc.qStart);
    const labelRange = sc.qStart === sc.qEnd ? `Câu ${sc.qStart}` : `Câu ${sc.qStart}–${sc.qEnd}`;
    let r = 0, w = 0, p = 0;
    for (let q = 1; q <= 200; q++) {
      const a = ansMap[q];
      if (!a) continue;
      p++;
      if (!isExam) { if (a === keysMap[q]) r++; else w++; }
    }
    if (isExam && !ws.lcFinished) {
      const doneCur = isScreenAllAnswered(sc, ansMap);
      return `
        <span>${doneCur ? icon('check-circle') : icon('lock')} Đang nghe LC · ${esc(labelRange)}<span class="hide-mob"> (${doneCur ? 'Đã làm xong · Bấm "Câu / Nhóm sau →" để qua ngay' : 'Chọn xong để qua câu · Khóa quay lại'})</span></span>
        <span class="badge badge-danger hide-mob">Đã chọn ${p}/100</span>
      `;
    }
    return `
      <span>${icon('map-grid')} ${esc(labelRange)}<span class="hide-mob"> / 200 · Part ${partInfo.part}</span></span>
      ${isExam
        ? `<span class="badge badge-primary hide-mob">Đã chọn ${p}/200 (Tự do chuyển Q101–200)</span>`
        : `<span class="hide-mob" style="font-size:0.8rem;"><span style="color:var(--success);font-weight:700;">${r} đúng</span> · <span style="color:var(--danger);font-weight:700;">${w} sai</span> · ${200 - r - w} chờ</span>`}
      <span>${icon('chevron-down')}</span>
    `;
  }

  // ===================== DRAGGABLE SPLIT-PANE RESIZER =====================
  function applySplitPresetUi(pct) {
    const grid = document.getElementById('wsSplitGrid');
    if (grid) grid.classList.toggle('is-top-collapsed', pct === 0);
    const lbl = document.getElementById('wsCornerSplitLbl');
    if (lbl) lbl.textContent = pct === 0 ? 'Hiện đề' : `${pct}%`;
    const cbtn = document.getElementById('wsCornerSplitBtn');
    if (cbtn) cbtn.classList.toggle('is-collapsed', pct === 0);
    document.querySelectorAll('.ws-split-pill').forEach((btn) => {
      const target = btn.getAttribute('onclick') || '';
      const m = target.match(/setMobileSplitPreset\((\d+)\)/);
      if (m) btn.classList.toggle('active', Number(m[1]) === pct);
    });
  }

  function toggleSplitMenu(ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    if (!ws) return;
    ws.splitMenuOpen = !ws.splitMenuOpen;
    ws.audioMenuOpen = false;
    ws.toolsMenuOpen = false;
    ws.retryMenuOpen = false;
    ws.paletteOpen = false;
    const m = document.getElementById('wsCornerSplitMenu');
    if (m) m.classList.toggle('show', !!ws.splitMenuOpen);
    refreshPopoverLayerOnly();
  }

  function setMobileSplitPreset(pct) {
    const cleanPct = pct === 0 ? 0 : Math.max(22, Math.min(78, Number(pct) || 44));
    state.topPanePct = cleanPct;
    document.documentElement.style.setProperty('--top-pane-pct', `${cleanPct === 0 ? 44 : cleanPct}%`);
    if (ws) {
      ws.splitMenuOpen = false;
      ws.userSplitTouched = true;
    }
    const grid = document.getElementById('wsSplitGrid');
    if (grid) grid.classList.add('is-user-split');
    const m = document.getElementById('wsCornerSplitMenu');
    if (m) m.classList.remove('show');
    applySplitPresetUi(cleanPct);
    saveState();
  }

  function attachSplitResizer() {
    const resizer = document.getElementById('wsResizer');
    const grid = document.getElementById('wsSplitGrid');
    if (!resizer || !grid) return;

    resizer.onpointerdown = (e) => {
      if (e.target && e.target.closest && e.target.closest('.ws-split-pill,.ws-corner-split-wrap')) return;
      e.preventDefault();
      if (resizer.setPointerCapture && e.pointerId != null) {
        try { resizer.setPointerCapture(e.pointerId); } catch (err) {}
      }
      resizer.classList.add('dragging');
      const rect = grid.getBoundingClientRect();
      const isMob = window.innerWidth <= 900;
      const onMove = (ev) => {
        const scNow = currentScreen();
        const isPart5 = !!(scNow && scNow.part === 5);
        if (isMob) {
          if (!rect.height) return;
          const rawPct = Math.round(((ev.clientY - rect.top) / rect.height) * 100);
          const pct = isPart5
            ? (rawPct <= 3 ? 0 : Math.max(0, Math.min(85, rawPct)))
            : Math.max(20, Math.min(76, rawPct));
          state.topPanePct = pct;
          if (ws) ws.userSplitTouched = true;
          grid.classList.add('is-user-split');
          document.documentElement.style.setProperty('--top-pane-pct', `${pct}%`);
          grid.classList.toggle('is-top-collapsed', pct === 0);
          const lbl = document.getElementById('wsCornerSplitLbl');
          if (lbl) lbl.textContent = pct === 0 ? 'Hiện đề' : `${pct}%`;
        } else {
          if (!rect.width) return;
          const rawPct = Math.round(((ev.clientX - rect.left) / rect.width) * 100);
          if (isPart5) {
            const pct = rawPct <= 2 ? 0 : Math.max(0, Math.min(85, rawPct));
            state.p5LeftPanePct = pct;
            document.documentElement.style.setProperty('--left-pane-pct', `${pct}%`);
            grid.classList.toggle('is-left-collapsed', pct === 0);
          } else {
            const pct = Math.max(32, Math.min(68, rawPct));
            state.leftPanePct = pct;
            document.documentElement.style.setProperty('--left-pane-pct', `${pct}%`);
            grid.classList.remove('is-left-collapsed');
          }
        }
      };
      const onUp = () => {
        resizer.classList.remove('dragging');
        saveState();
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    };
  }

  function resetSplitPaneWidth() {
    state.leftPanePct = 50;
    state.p5LeftPanePct = 50;
    state.topPanePct = 44;
    document.documentElement.style.setProperty('--left-pane-pct', '50%');
    document.documentElement.style.setProperty('--top-pane-pct', '44%');
    const grid = document.getElementById('wsSplitGrid');
    if (grid) grid.classList.remove('is-left-collapsed');
    applySplitPresetUi(44);
    saveState();
    toast('Đã đặt lại tỷ lệ chia đôi màn hình 50% / 50%');
  }

  function formatClozeTranscriptLine(enText, lineKey, vocabArr) {
    if (!ws || !ws.clozeScript) return esc(enText);
    const words = String(enText || '').split(/(\s+)/);
    const vocabSet = new Set((vocabArr || []).map((v) => (v.word || '').toLowerCase().split(/\s+/)[0]).filter(Boolean));
    let blankCnt = 0;
    return words.map((tok, wIdx) => {
      const clean = tok.replace(/[^a-zA-Z]/g, '');
      const low = clean.toLowerCase();
      const shouldBlank = blankCnt < 2 && clean.length >= 5 && (vocabSet.has(low) || (wIdx >= 2 && clean.length >= 5 && wIdx % 4 === 2));
      if (!shouldBlank) return esc(tok);
      blankCnt++;
      const bKey = `${lineKey}_${wIdx}`;
      const isRev = !!(ws.clozeRevealed && ws.clozeRevealed[bKey]);
      if (isRev) {
        return `<span class="cloze-blank revealed" onclick="ETS.revealTranscriptBlank('${escJsStr(bKey)}', '${escJsStr(clean)}')">${esc(tok)}</span>`;
      }
      return `<span class="cloze-blank" onclick="ETS.revealTranscriptBlank('${escJsStr(bKey)}', '${escJsStr(clean)}')" title="Bấm để mở từ ẩn & nghe phát âm">_______ ${icon('lightbulb')}</span>`;
    }).join('');
  }

  function toggleClozeScript() {
    if (!ws) return;
    ws.clozeScript = !ws.clozeScript;
    if (ws.clozeScript) ws.showScript = true;
    toast(ws.clozeScript ? 'Đã BẬT chế độ Nghe Điền Từ (Bấm vào ô trống _______ để mở từ)' : 'Đã hiển thị đầy đủ Script');
    updatePanesAndDockKeepAudio();
  }

  function revealTranscriptBlank(bKey, wordText) {
    if (!ws) return;
    ws.clozeRevealed = ws.clozeRevealed || {};
    ws.clozeRevealed[bKey] = !ws.clozeRevealed[bKey];
    if (ws.clozeRevealed[bKey] && wordText) {
      ETS.speakEnglish(wordText, 1.0);
    }
    updatePanesAndDockKeepAudio();
  }

  function renderPartDirectionsHtml(part, qStart) {
    let title = '', desc = '';
    if (part === 5 && qStart === 101) {
      title = 'READING TEST · PART 5';
      desc = 'Directions: A word or phrase is missing in each of the sentences below. Four answer choices are given below each sentence. Select the best answer to complete the sentence. Then select the letter (A), (B), (C), or (D).';
    } else if (part === 6 && qStart === 131) {
      title = 'PART 6';
      desc = 'Directions: Read the texts that follow. A word, phrase, or sentence is missing in parts of each text. Four answer choices for each question are given below the text. Select the best answer to complete the text.';
    } else if (part === 7 && qStart === 147) {
      title = 'PART 7';
      desc = 'Directions: In this part you will read a selection of texts, such as magazine and newspaper articles, e-mails, and instant messages. Each text or set of texts is followed by several questions. Select the best answer for each question.';
    }
    if (!title) return '';
    return `
      <div class="ets-official-directions hide-mob">
        <strong>${title}</strong><br>${desc}
      </div>
      <details class="ets-dir-collapse show-mob">
        <summary><strong>${title}</strong> <span>Hướng dẫn ▾</span></summary>
        <div class="ets-dir-collapse-body">${desc}</div>
      </details>
    `;
  }

  function formatPart5StemHtml(stemEn) {
    return esc(stemEn || '').replace(/(-{3,}|_{3,})/g, '<span class="ets-p6-blank-slot">_______</span>');
  }

  function renderUnifiedP2P5LeftCardHtml(sc, first, gKey, hls, ansMap, checkedMap, flagsMap, keysMap) {
    const q = first.q || sc.qStart;
    const itemsArr = getTestItems(ws.testCode);
    const rich = (itemsArr && itemsArr[q - 1]) ? itemsArr[q - 1] : first;
    const picked = (ansMap && ansMap[q]) || '';
    const isLocked = !!(checkedMap && checkedMap[q]);
    const correctAns = (keysMap && keysMap[q]) || (rich && rich.ans) || 'A';
    const isFlag = !!(flagsMap && flagsMap[q]);
    const elimMapAll = (state.test.eliminated && state.test.eliminated[ws.testCode]) || {};
    const qElim = elimMapAll[q] || {};
    const isPart2 = sc.part === 2;
    const optKeys = isPart2 ? ['A', 'B', 'C'] : ['A', 'B', 'C', 'D'];
    const evForThisScreen = (ws.activeEvidence && ws.activeEvidence.q >= sc.qStart && ws.activeEvidence.q <= sc.qEnd) || isAllEvOnForScreen(sc);
    const revealScript = isPart2 ? !!(ws.showScript || isLocked || evForThisScreen) : true;

    const optionsHtml = optKeys.map((k) => {
      const optObj = rich && rich.options && rich.options[k];
      const isElim = !!qElim[k];
      let cls = 'opt-btn';
      if (isElim && !isLocked) cls += ' is-eliminated';
      if (!isLocked) {
        if (picked === k) cls += ' selected';
      } else {
        if (k === correctAns) cls += ' is-correct';
        else if (picked === k && k !== correctAns) cls += ' is-wrong';
      }
      const cleanOptEn = optObj ? String(optObj.en || '').replace(/^\s*(?:\([A-D]\)\s*)+/i, '').trim() : '';
      const cleanOptVi = optObj ? String(optObj.vi || '').replace(/^\s*(?:\([A-D]\)\s*)+/i, '').trim() : '';
      const optEnDisplay = revealScript
        ? (isPart2 ? formatClozeTranscriptLine(cleanOptEn, `Q${q}_OPT_${k}`, rich && rich.vocab) : esc(cleanOptEn))
        : `Phương án ${k} (nghe audio)`;
      return `
        <div class="opt-row">
          <div role="button" tabindex="${isLocked ? -1 : 0}" aria-disabled="${isLocked ? 'true' : 'false'}"
            class="${cls}${isLocked ? ' is-locked-choice' : ''}"
            onclick="ETS.pickOption(${q}, '${k}')"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ETS.pickOption(${q},'${k}');}"
            oncontextmenu="event.preventDefault();ETS.toggleEliminateOption(${q}, '${k}', event)">
            <span class="opt-key">${k}</span>
            <div style="flex:1;min-width:0;">
              <div class="opt-txt">${optEnDisplay}</div>
              ${revealScript && cleanOptVi ? `<div class="vi-only opt-vi">${esc(cleanOptVi)}</div>` : ''}
            </div>
          </div>
          ${!isLocked ? `
            <button type="button" class="opt-elim-btn ${isElim ? 'active' : ''}" onclick="ETS.toggleEliminateOption(${q}, '${k}', event)" title="Gạch loại phương án nhiễu ${k} (hoặc chuột phải vào đáp án)">${icon('close')}</button>
          ` : ''}
        </div>
      `;
    }).join('');

    return `
      <div class="q-card is-unified-p2p5 ${isPart2 ? 'is-unified-p2' : 'is-unified-p5'} ${isLocked ? 'is-locked-card' : ''}" id="qCard_${q}">
        <div id="wsPassageText">
          <div class="q-head">
            <div class="q-head-left" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;">
              <span class="badge q-num-badge ${isLocked ? (!picked ? 'badge-warn' : (picked === correctAns ? 'badge-success' : 'badge-danger')) : (isPart2 ? 'badge-primary' : 'badge-accent')}" style="white-space:nowrap;flex-shrink:0;"><span class="hide-mob">Part ${sc.part} · </span>Câu ${q}</span>
              ${isLocked ? `<strong class="q-head-status" style="font-size:0.8333rem;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:${!picked ? 'var(--warn)' : (picked === correctAns ? 'var(--success)' : 'var(--danger)')};">${!picked ? `${icon('clock')} Bỏ trống · Đúng: ${correctAns}` : (picked === correctAns ? `${icon('check-circle')} Chính xác` : `${icon('x-circle')} Sai · Đúng: ${correctAns}`)}</strong>` : ''}
            </div>
            <div class="q-head-actions" style="display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;align-items:center;">
              ${isPart2 ? `
                <button type="button" class="btn btn-xs ${ws.showScript ? 'btn-soft' : ''}" onclick="ETS.togglePracticeScript()" title="Hiện / Ẩn Script câu hỏi &amp; đáp án">${icon('eye')} <span class="hide-mob">${revealScript ? (isLocked && !ws.showScript ? 'Script (Tự mở)' : 'Ẩn Script') : 'Hiện Script'}</span><span class="show-mob">Script</span></button>
                ${revealScript ? `<button type="button" class="btn btn-xs hide-mob ${ws.clozeScript ? 'btn-primary' : ''}" onclick="ETS.toggleClozeScript()" title="Nghe điền từ ẩn từ khóa">${icon('edit')} <span>Điền từ</span></button>` : ''}
              ` : `
                <button type="button" class="btn btn-xs" onclick="if(ETS.selectFormulaTopic){ETS.selectFormulaTopic(48);} if(ETS.setFormulaViewMode){ETS.setFormulaViewMode('drill');} ETS.navigate('formulas'); setTimeout(()=>ETS.scrollToFormulaSec && ETS.scrollToFormulaSec('formulaDrillSection'), 80);" title="Luyện bộ 199 câu Part 5 trọng tâm">${icon('book-open')} <span class="hide-mob">199 Câu P5</span><span class="show-mob">199 P5</span></button>
              `}
              ${revealScript ? `<button type="button" class="btn btn-xs btn-soft" onmousedown="event.preventDefault()" onclick="ETS.highlightSelectedText('${escJsStr(gKey)}')" title="Bôi vàng từ đã chọn">${icon('highlighter')}<span class="hide-mob">${isPart2 ? '' : ' Đánh dấu'}</span></button>` : ''}
              ${hls.length ? `<button type="button" class="btn btn-xs" onclick="ETS.clearHighlights('${escJsStr(gKey)}')" title="Xóa highlight (${hls.length})">${icon('eraser')} (${hls.length})</button>` : ''}
              <button type="button" class="btn btn-xs ${isFlag ? 'btn-warn' : ''}" onclick="ETS.toggleFlag(${q})" title="${isFlag ? 'Bỏ cắm cờ' : 'Cắm cờ đánh dấu câu'}">${icon('flag')}<span class="hide-mob"> ${isFlag ? 'Đã cắm cờ' : 'Cắm cờ'}</span></button>
              ${isLocked ? `<button type="button" class="btn btn-xs hide-mob" onclick="ETS.resetSingleQuestion(${q})" title="Mở khóa để chọn lại câu này">${icon('refresh')}<span> Chọn lại</span></button>` : ''}
            </div>
          </div>

          ${isPart2 ? (revealScript ? `
            <div class="p2-unified-stem passage-line">
              <div class="q-stem" style="margin-bottom:0;"><span class="speaker-tag">Q:</span> ${formatClozeTranscriptLine((rich && rich.stem_en) || '', `Q${q}_STEM`, rich && rich.vocab)}</div>
              ${rich && rich.stem_vi ? `<div class="vi-only vi-text" style="margin-top:6px;">${esc(rich.stem_vi)}</div>` : ''}
            </div>
          ` : `
            <div class="p2-listen-banner">
              <span class="p2-listen-icon">${icon('headphones')}</span>
              <div class="p2-listen-text">
                <strong>Lắng nghe câu hỏi &amp; 3 đáp án (A, B, C)</strong> rồi chọn bên dưới. Script câu hỏi và đáp án sẽ tự mở ngay tại đây khi bạn chọn.
              </div>
            </div>
          `) : `
            <div class="p5-unified-stem">
              <div class="q-stem" style="font-size:calc(1.0333rem * var(--q-scale, 1));font-weight:700;line-height:1.68;margin-bottom:0;">${formatPart5StemHtml((rich && rich.stem_en) || '')}</div>
              ${rich && rich.stem_vi ? `<div class="vi-only vi-text" style="margin-top:8px;">${esc(rich.stem_vi)}</div>` : ''}
            </div>
          `}

          <div class="opt-list" style="margin-top:11px;">
            ${optionsHtml}
          </div>
        </div>
      </div>
    `;
  }

  // ===================== LEFT PANE BUILDER (100% NATIVE EXAM BOOKLET FOR P2-P7) =====================
  const TALL_P1_PHOTOS = {
    T01: [1],
    T02: [1],
    T03: [1, 3, 5],
    T04: [6],
    T06: [2, 3],
    T08: [3, 5],
    T09: [1],
    T10: [1, 3]
  };

  function buildLeftPaneHtml(sc, isExam, checkedMap, ansMap, flagsMap, keysMap) {
    flagsMap = flagsMap || (isExam ? ws.examFlags : (state.test.flags[ws.testCode] || {}));
    keysMap = keysMap || (DB.answerKeys[ws.testCode] || {});
    const items = sc.items || [];
    const first = items[0] || null;
    if (!first) {
      return `<div class="passage-box">Dữ liệu đề thi <strong>${esc(ws.testCode)}</strong> đang được khởi tạo.</div>`;
    }
    const allLocked = items.length > 0 && items.every((it) => checkedMap[it.q]);
    const gKey = first.group_id || `Q${sc.qStart}`;
    const hls = (state.test.highlights[ws.testCode] || {})[gKey] || [];
    const parts = [];

    if (sc.part === 1 && first.photo) {
      const evForP1 = (ws.activeEvidence && ws.activeEvidence.q >= sc.qStart && ws.activeEvidence.q <= sc.qEnd) || isAllEvOnForScreen(sc);
      const revealP1Script = ws.showScript || allLocked || evForP1;
      const photoSrc = String(first.photo).includes('?') ? first.photo : `${first.photo}?v=2`;
      const isTallP1 = !!(TALL_P1_PHOTOS[ws.testCode] && TALL_P1_PHOTOS[ws.testCode].includes(Number(first.q)));
      parts.push(`
        <div class="p1-photo-stage ${isTallP1 ? 'is-tall-photo' : 'is-wide-photo'}" id="wsPassageText">
          <div class="p1-floating-bar">
            <span class="badge badge-primary p1-floating-badge">Part 1 · Câu ${first.q}</span>
            <div class="p1-floating-actions">
              ${!isExam ? `<button type="button" class="btn btn-xs ${revealP1Script ? 'btn-soft' : ''}" onclick="ETS.togglePracticeScript()" title="Hiện / Ẩn Script 4 câu mô tả A–D ở khung bên phải">${icon('eye')} <span>${revealP1Script ? 'Ẩn Script' : 'Hiện Script'}</span></button>` : ''}
              <button type="button" class="btn btn-xs btn-soft" onclick="ETS.openImageLightbox('${escJsStr(photoSrc)}', 'Hình Câu ${first.q} (${escJsStr(ws.testCode)})')" title="Phóng to ảnh">${icon('search')} <span class="${isTallP1 ? '' : 'hide-mob'}">Phóng to</span></button>
            </div>
          </div>
          <div class="p1-photo-viewport" onclick="ETS.openImageLightbox('${escJsStr(photoSrc)}', 'Hình minh họa Câu ${first.q} (${escJsStr(ws.testCode)})')">
            <img src="${esc(photoSrc)}" alt="Part 1 Photograph Q${first.q}" class="p1-photo-img" onload="if(this.naturalWidth&&this.naturalHeight){const st=this.closest('.p1-photo-stage');if(st){st.classList.toggle('is-tall-photo',this.naturalHeight>this.naturalWidth);st.classList.toggle('is-wide-photo',this.naturalHeight<=this.naturalWidth);}}">
          </div>
        </div>
      `);
    }

    if ((sc.part === 3 || sc.part === 4) && first.graphicDoc && ETS.renderGraphicDoc) {
      parts.push(`<div class="card" style="padding:12px 14px;margin-bottom:12px;">${ETS.renderGraphicDoc(first.graphicDoc)}</div>`);
    }

    if (sc.part >= 5) {
      parts.push(renderPartDirectionsHtml(sc.part, sc.qStart));
      if (sc.part === 5 && !isExam) {
        parts.push(renderUnifiedP2P5LeftCardHtml(sc, first, gKey, hls, ansMap, checkedMap, flagsMap, keysMap));
      } else if (sc.part === 5) {
        parts.push(`
          <div class="passage-box" style="text-align:center;padding:28px 20px;">
            <div style="margin-bottom:10px;color:var(--primary);">${icon('file-text', 'ets-icon-lg')}</div>
            <h3 style="margin:0 0 6px;">Đang Thi Thật · Reading Part 5 (Câu ${first.q})</h3>
            <p style="font-size:0.9rem;color:var(--ink-muted);margin:0;">Đọc câu hỏi và chọn đáp án đúng nhất (A, B, C hoặc D) ở cột bên phải. Bạn có thể mở <strong>Bản đồ câu Đọc</strong> để tự do chuyển câu.</p>
          </div>
        `);
      } else if (sc.part === 6 && ETS.renderPart6Document) {
        const p6Label = ETS.inferPart6DocType ? ETS.inferPart6DocType(first) : 'text';
        parts.push(`
          <div class="ets-refer-row">
            <div class="ets-refer-heading" style="margin:0;">Questions ${sc.qStart}–${sc.qEnd} refer to the following ${esc(p6Label)}.</div>
            ${!isExam ? `
              <div style="display:flex;gap:4px;flex-shrink:0;">
                <button class="btn btn-xs btn-soft" onclick="ETS.highlightSelectedText('${escJsStr(gKey)}')" title="Bôi vàng từ đã chọn">${icon('highlighter')} <span class="hide-mob">Bôi vàng từ chọn</span><span class="show-mob">Bôi vàng</span></button>
                ${hls.length ? `<button class="btn btn-xs" onclick="ETS.clearHighlights('${escJsStr(gKey)}')">${icon('eraser')} (${hls.length})</button>` : ''}
              </div>
            ` : ''}
          </div>
          <div id="wsPassageText">
            ${ETS.renderPart6Document(first, items, ws.mode, ws.testCode, sc.qStart, !isExam, ansMap || {}, checkedMap || {}, false)}
          </div>
        `);
      } else if (sc.part === 7 && ETS.renderExamDocument && ETS.linesToDocBlocks) {
        const docBlocks = ETS.linesToDocBlocks(first, items);
        const multiLbl = ETS.formatPart7ReferLabel
          ? ETS.formatPart7ReferLabel(docBlocks)
          : (docBlocks.length >= 3 ? 'three texts' : docBlocks.length === 2 ? 'two texts' : 'text');
        parts.push(`
          <div class="ets-refer-row">
            <div class="ets-refer-heading" style="margin:0;">Questions ${sc.qStart}–${sc.qEnd} refer to the following ${esc(multiLbl)}.</div>
            ${!isExam ? `
              <div style="display:flex;gap:4px;flex-shrink:0;">
                <button class="btn btn-xs btn-soft" onclick="ETS.highlightSelectedText('${escJsStr(gKey)}')" title="Bôi vàng từ đã chọn">${icon('highlighter')} <span class="hide-mob">Bôi vàng từ chọn</span><span class="show-mob">Bôi vàng</span></button>
                ${hls.length ? `<button class="btn btn-xs" onclick="ETS.clearHighlights('${escJsStr(gKey)}')">${icon('eraser')} (${hls.length})</button>` : ''}
              </div>
            ` : ''}
          </div>
          <div id="wsPassageText" style="display:flex;flex-direction:column;gap:12px;">
            ${docBlocks.map((b, dIdx) => `<div class="ets-p7-doc-wrap" data-doc-idx="${dIdx}">${ETS.renderExamDocument(b, !isExam)}</div>`).join('')}
          </div>
        `);
      } else if (first.lines && first.lines.length) {
        parts.push(`
          <div class="passage-box" id="wsPassageText">
            ${first.lines.map((ln) => Array.isArray(ln.units) && ln.units.length
              ? `<div class="passage-line ets-bilingual-units">${ln.units.map((u, uIdx) => `${uIdx > 0 ? ' ' : ''}<div class="ets-bilingual-unit">
                  <div class="ets-unit-en">${uIdx === 0 && ln.speaker ? `<span class="speaker-tag">${esc(ln.speaker)}:</span>` : ''}${applyHighlightsHtml(u.en, hls)}</div>
                  ${!isExam && u.vi ? `<div class="vi-only ets-unit-vi">${esc(u.vi)}</div>` : ''}
                </div>`).join('')}</div>`
              : `
                <div class="passage-line">
                  ${ln.speaker ? `<span class="speaker-tag">${esc(ln.speaker)}:</span>` : ''}
                  <span>${applyHighlightsHtml(ln.en, hls)}</span>
                  ${!isExam && ln.vi ? `<div class="vi-only vi-text">${esc(ln.vi)}</div>` : ''}
                </div>
              `).join('')}
          </div>
        `);
      }
    }

    if (sc.part <= 4 && !isExam) {
      const evForThisScreen = (ws.activeEvidence && ws.activeEvidence.q >= sc.qStart && ws.activeEvidence.q <= sc.qEnd) || isAllEvOnForScreen(sc);
      const revealScript = ws.showScript || allLocked || evForThisScreen;
      if (sc.part === 2) {
        parts.push(renderUnifiedP2P5LeftCardHtml(sc, first, gKey, hls, ansMap, checkedMap, flagsMap, keysMap));
      } else if (sc.part >= 3 && first.lines && first.lines.length) {
        parts.push(`
          <div class="passage-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">
              <span class="badge badge-primary">${icon('file-text')} Audio Script (${sc.qStart === sc.qEnd ? 'Câu ' + sc.qStart : 'Câu ' + sc.qStart + '–' + sc.qEnd})</span>
              <div style="display:flex;gap:6px;">
                <button class="btn btn-xs ${ws.clozeScript ? 'btn-primary' : ''}" onclick="ETS.toggleClozeScript()">${icon('edit')} Nghe Điền Từ: ${ws.clozeScript ? 'BẬT' : 'TẮT'}</button>
                <button class="btn btn-xs btn-soft" onclick="ETS.togglePracticeScript()">${icon('eye')} ${revealScript ? 'Ẩn / Làm mờ' : 'Hiện Script'}</button>
              </div>
            </div>
            <div class="${revealScript ? '' : 'spoiler-blur'}">
              ${first.lines.map((ln, lIdx) => Array.isArray(ln.units) && ln.units.length
                ? `<div class="passage-line ets-bilingual-units">${ln.units.map((u, uIdx) => `${uIdx > 0 ? ' ' : ''}<div class="ets-bilingual-unit">
                    <div class="ets-unit-en">${uIdx === 0 && ln.speaker ? `<span class="speaker-tag">${esc(ln.speaker)}:</span>` : ''}${formatClozeTranscriptLine(u.en, `Q${first.q}_L${lIdx}_U${uIdx}`, first.vocab)}</div>
                    ${u.vi ? `<div class="vi-only ets-unit-vi">${esc(u.vi)}</div>` : ''}
                  </div>`).join('')}</div>`
                : `
                  <div class="passage-line">
                    ${ln.speaker ? `<span class="speaker-tag">${esc(ln.speaker)}:</span>` : ''}
                    <span>${formatClozeTranscriptLine(ln.en, `Q${first.q}_L${lIdx}`, first.vocab)}</span>
                    ${ln.vi ? `<div class="vi-only vi-text">${esc(ln.vi)}</div>` : ''}
                  </div>
                `).join('')}
            </div>
          </div>
        `);
      }
    } else if (sc.part <= 4 && isExam && !(sc.part === 1 && first.photo) && !first.graphicDoc) {
      parts.push(`
        <div class="passage-box" style="text-align:center;padding:40px 20px;">
          <div style="margin-bottom:10px;color:var(--primary);">${icon('headphones', 'ets-icon-lg')}</div>
          <h3 style="margin:0 0 6px;">Đang Thi Thật · Listening Part ${sc.part}</h3>
          <p style="font-size:0.9rem;color:var(--ink-muted);">Lắng nghe thật kỹ và chọn đáp án ở cột bên phải. Script & Giải thích sẽ mở sau khi Nộp bài.</p>
        </div>
      `);
    }

    return parts.join('') || `<div class="passage-box">Đọc câu hỏi ở cột bên phải.</div>`;
  }

  // ===================== RIGHT PANE BUILDER (QUESTIONS + LOCK-ON-PICK + STRIKETHROUGH) =====================
  function buildRightPaneHtml(sc, isExam, ansMap, checkedMap, flagsMap, keysMap) {
    const itemsArr = getTestItems(ws.testCode);
    const elimMapAll = isExam ? (ws.examEliminated || {}) : ((state.test.eliminated && state.test.eliminated[ws.testCode]) || {});
    const isUnifiedP2P5 = !isExam && (sc.part === 2 || sc.part === 5);
    const cards = [];

    for (let q = sc.qStart; q <= sc.qEnd; q++) {
      const rich = (itemsArr && itemsArr[q - 1]) ? itemsArr[q - 1] : null;
      const picked = ansMap[q] || '';
      const isLocked = !isExam && !!checkedMap[q];
      const correctAns = keysMap[q] || (rich && rich.ans) || 'A';
      const isFlag = !!flagsMap[q];
      const optKeys = sc.part === 2 ? ['A', 'B', 'C'] : ['A', 'B', 'C', 'D'];
      const noteText = (state.test.notes[ws.testCode] || {})[q] || '';
      const qElim = elimMapAll[q] || {};

      if (isUnifiedP2P5) {
        if (isLocked) {
          cards.push(`
            <div class="q-card exp-only-card" id="expCard_${q}">
              <div class="q-head exp-only-head">
                <div class="q-head-left" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;">
                  <span class="badge badge-primary" style="white-space:nowrap;">${icon('sparkles')} Giải Thích Chi Tiết · Câu ${q}</span>
                </div>
                <div class="q-head-actions" style="display:flex;gap:4px;flex-shrink:0;">
                  <button type="button" class="btn btn-xs" onclick="ETS.resetSingleQuestion(${q})" title="Mở khóa để chọn lại câu này">${icon('refresh')} Chọn lại</button>
                </div>
              </div>
              <div class="exp-drawer exp-drawer-standalone">
                ${buildRichExplanationHtml(rich, correctAns, picked, optKeys, { inResult: false, testCode: ws.testCode, qNum: q })}
                <div style="margin-top:10px;">
                  <input class="input" style="width:100%;font-size:0.8333rem;padding:6px 10px;" placeholder="Ghi chú riêng cho câu ${q}..." value="${esc(noteText)}" onchange="ETS.saveQuestionNote(${q}, this.value)">
                </div>
              </div>
            </div>
          `);
        } else {
          cards.push(`
            <div class="q-card exp-waiting-card" id="expCard_${q}">
              <div class="exp-waiting-inner">
                <div class="exp-waiting-icon">${icon('sparkles')}</div>
                <div class="exp-waiting-body">
                  <div class="exp-waiting-title">Giải Thích &amp; Phân Tích Chuyên Sâu · Câu ${q}</div>
                  <p class="exp-waiting-sub">
                    Chọn đáp án <strong>${sc.part === 2 ? 'A, B hoặc C' : 'A, B, C hoặc D'}</strong> ở khung bên trái để mở ngay <strong>Công thức, Dẫn chứng, Phân tích bẫy từng phương án</strong> và <strong>Từ vựng trọng tâm</strong> tại đây mà không cần cuộn trang.
                  </p>
                </div>
              </div>
              <div style="margin-top:10px;">
                <input class="input" style="width:100%;font-size:0.8333rem;padding:6px 10px;" placeholder="Ghi chú riêng cho câu ${q}..." value="${esc(noteText)}" onchange="ETS.saveQuestionNote(${q}, this.value)">
              </div>
            </div>
          `);
        }
        continue;
      }

      cards.push(`
        <div class="q-card" id="qCard_${q}">
          <div class="q-head">
            <div class="q-head-left" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;">
              <span class="badge q-num-badge ${isLocked ? (!picked ? 'badge-warn' : (picked === correctAns ? 'badge-success' : 'badge-danger')) : 'badge-primary'}" style="white-space:nowrap;flex-shrink:0;">Câu ${q}</span>
              ${isLocked ? `<strong class="q-head-status" style="font-size:0.8333rem;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:${!picked ? 'var(--warn)' : (picked === correctAns ? 'var(--success)' : 'var(--danger)')};">${!picked ? `${icon('clock')} Bỏ trống · Đúng: ${correctAns}` : (picked === correctAns ? `${icon('check-circle')} Chính xác<span class="hide-mob"> (Đã khóa)</span>` : `${icon('x-circle')} Sai · Đúng: ${correctAns}`)}</strong>` : ''}
            </div>
            <div class="q-head-actions" style="display:flex;gap:4px;flex-shrink:0;">
              <button class="btn btn-xs ${isFlag ? 'btn-warn' : ''}" onclick="ETS.toggleFlag(${q})" title="${isFlag ? 'Bỏ cắm cờ' : 'Cắm cờ đánh dấu câu'}">${icon('flag')}<span class="hide-mob"> ${isFlag ? 'Đã cắm cờ' : 'Cắm cờ'}</span></button>
              ${isLocked ? `<button class="btn btn-xs" onclick="ETS.resetSingleQuestion(${q})" title="Mở khóa để chọn lại câu này">${icon('refresh')}<span class="hide-mob"> Chọn lại</span></button>` : ''}
            </div>
          </div>

          ${(() => {
            if (sc.part === 1 && (isExam || (!isLocked && !ws.showScript))) {
              return `<div class="q-stem" style="font-size:0.88rem;color:var(--ink-muted);font-weight:600;">Quan sát bức tranh bên trái, lắng nghe 4 câu mô tả trong Audio và chọn đáp án đúng (A, B, C hoặc D):</div>`;
            }
            if (sc.part === 2 && (isExam || (!isLocked && !ws.showScript))) {
              return `<div class="q-stem" style="font-size:0.88rem;color:var(--ink-muted);font-weight:600;">Lắng nghe câu hỏi &amp; 3 câu trả lời trong Audio rồi chọn đáp án đúng (A, B hoặc C):</div>`;
            }
            if (rich && rich.stem_en) {
              const stemHtml = sc.part === 5 ? formatPart5StemHtml(rich.stem_en) : esc(rich.stem_en);
              return `
                <div class="q-stem">${stemHtml}</div>
                ${!isExam && rich.stem_vi ? `<div class="vi-only vi-text" style="margin-bottom:8px;">${esc(rich.stem_vi)}</div>` : ''}
              `;
            }
            return `<div class="q-stem" style="font-size:0.8667rem;color:var(--ink-muted);">Chọn đáp án cho Câu ${q}:</div>`;
          })()}

          <div class="opt-list">
            ${optKeys.map((k) => {
              const optObj = rich && rich.options && rich.options[k];
              const isElim = !!qElim[k];
              let cls = 'opt-btn';
              if (isElim && !isLocked) cls += ' is-eliminated';
              if (isExam || !isLocked) {
                if (picked === k) cls += ' selected';
              } else {
                if (k === correctAns) cls += ' is-correct';
                else if (picked === k && k !== correctAns) cls += ' is-wrong';
              }

              const showOptEn = !!(optObj && (sc.part >= 3 || (!isExam && (isLocked || ws.showScript))));
              const showOptVi = !!(showOptEn && !isExam);
              const cleanOptEn = optObj ? String(optObj.en || '').replace(/^\s*(?:\([A-D]\)\s*)+/i, '').trim() : '';
              const cleanOptVi = optObj ? String(optObj.vi || '').replace(/^\s*(?:\([A-D]\)\s*)+/i, '').trim() : '';
              return `
                <div class="opt-row">
                  <div role="button" tabindex="${isLocked ? -1 : 0}" aria-disabled="${isLocked ? 'true' : 'false'}"
                    class="${cls}${isLocked ? ' is-locked-choice' : ''}"
                    onclick="ETS.pickOption(${q}, '${k}')"
                    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ETS.pickOption(${q},'${k}');}"
                    oncontextmenu="event.preventDefault();ETS.toggleEliminateOption(${q}, '${k}', event)">
                    <span class="opt-key">${k}</span>
                    <div style="flex:1;">
                      <div class="opt-txt">${showOptEn ? esc(cleanOptEn) : (isExam ? `Phương án ${k}` : `Phương án ${k} (nghe audio)`)}</div>
                      ${showOptVi && cleanOptVi ? `<div class="vi-only opt-vi">${esc(cleanOptVi)}</div>` : ''}
                    </div>
                  </div>
                  ${!isLocked ? `
                    <button type="button" class="opt-elim-btn ${isElim ? 'active' : ''}" onclick="ETS.toggleEliminateOption(${q}, '${k}', event)" title="Gạch loại phương án nhiễu ${k} (hoặc chuột phải vào đáp án)">${icon('close')}</button>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          ${isLocked ? `
            <div class="exp-drawer">
              ${buildRichExplanationHtml(rich, correctAns, picked, optKeys, { inResult: false, testCode: ws.testCode, qNum: q })}
              <div style="margin-top:10px;">
                <input class="input" style="width:100%;font-size:0.8333rem;padding:6px 10px;" placeholder="Ghi chú riêng cho câu ${q}..." value="${esc(noteText)}" onchange="ETS.saveQuestionNote(${q}, this.value)">
              </div>
            </div>
          ` : ''}
        </div>
      `);
    }
    return cards.join('');
  }

  // ===================== 200-QUESTION BOTTOM POPOVER GRID =====================
  function renderPalettePopover(sc, isExam, ansMap, keysMap, flagsMap) {
    const pf = ws.paletteFilter || 'all';
    const filterButtons = [
      { id: 'all', lbl: isExam ? 'Tất cả (Mở Q101–200)' : 'Tất cả 200 câu' },
      { id: 'unanswered', lbl: 'Chưa làm' },
      { id: 'flagged', lbl: 'Đã cắm cờ' },
      { id: 'P5', lbl: 'Part 5 (101–130)' },
      { id: 'P6', lbl: 'Part 6 (131–146)' },
      { id: 'P7', lbl: 'Part 7 (147–200)' },
    ];

    return `
      <div class="palette-popover" id="wsPalettePopover">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
          <strong style="display:inline-flex;align-items:center;gap:6px;">${icon('map-grid')} Bản Đồ Câu Hỏi · ${esc(ws.testCode)} ${isExam ? '(Phần Đọc mở tự do · Phần Nghe đã khóa)' : ''}</strong>
          <div style="display:flex;gap:10px;font-size:0.7667rem;align-items:center;">
            ${isExam ? '<span>Đã chọn</span><span>Nghe (Khóa)</span>' : '<span style="color:var(--success);font-weight:700;">Đúng</span><span style="color:var(--danger);font-weight:700;">Sai</span>'}
            <span style="color:var(--warn);font-weight:700;">Cắm cờ</span>
            <button class="btn btn-xs" onclick="ETS.togglePalettePopover()">${icon('close')} Đóng</button>
          </div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);">
          ${filterButtons.map((b) => `
            <button type="button" class="btn btn-xs ${pf === b.id ? 'btn-primary' : ''}" onclick="ETS.setPaletteFilter('${b.id}', event)">${b.lbl}</button>
          `).join('')}
        </div>
        ${PART_RANGES.map((p) => {
          if (pf === 'P5' && p.part !== 5) return '';
          if (pf === 'P6' && p.part !== 6) return '';
          if (pf === 'P7' && p.part !== 7) return '';
          const cells = [];
          let pRight = 0;
          let pAnswered = 0;
          const pTotal = p.end - p.start + 1;
          for (let q = p.start; q <= p.end; q++) {
            const ans = ansMap[q];
            if (ans) {
              pAnswered++;
              if (!isExam && ans === keysMap[q]) pRight++;
            }
            if (pf === 'unanswered' && ans) continue;
            if (pf === 'flagged' && !flagsMap[q]) continue;
            const isCur = q >= sc.qStart && q <= sc.qEnd;
            const isLockedExam = isExam && (!ws.lcFinished || q <= 100);
            let cls = 'pal-cell';
            if (isCur) cls += ' is-current';
            if (flagsMap[q]) cls += ' is-flagged';
            if (isLockedExam) cls += ' is-locked';
            if (ans) {
              if (isExam) cls += ' is-picked';
              else cls += (ans === keysMap[q] ? ' is-correct' : ' is-wrong');
            }
            cells.push(`<button type="button" class="${cls}" ${isLockedExam ? 'disabled title="Phần Nghe đã khóa trong chế độ Thi thật"' : ''} onclick="ETS.jumpToQuestion(${q})">${q}</button>`);
          }
          if (!cells.length) return '';
          const partSuffix = (!isExam && pAnswered > 0)
            ? `(${pRight}/${pTotal})`
            : `(${pTotal} câu)`;
          return `<div class="pal-part-title">${p.name} ${partSuffix} ${isExam && p.part <= 4 ? icon('lock') : ''}</div><div class="pal-grid">${cells.join('')}</div>`;
        }).join('')}
      </div>
    `;
  }

  function setPaletteFilter(fId, ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    if (!ws) return;
    ws.paletteFilter = fId;
    refreshPopoverLayerOnly();
  }

  // ===================== INTERACTIVE HANDLERS (NEVER DESTROY RUNNING AUDIO!) =====================
  function pickOption(q, key) {
    if (!ws) return;
    if (window.getSelection && window.getSelection().toString().trim().length > 0) return;
    if (ws.mode === 'exam') {
      ws.examAnswers[q] = key;
      updateRightAndDockInPlace();
      return;
    }
    if (state.test.checked[ws.testCode][q]) return; // Locked!
    state.test.answers[ws.testCode][q] = key;
    state.test.checked[ws.testCode][q] = true;
    if (ETS.trackDailyProgress) ETS.trackDailyProgress(Number(q) <= 100 ? 'lc' : 'rc', 1);
    saveState();
    updatePanesAndDockKeepAudio();
  }

  function toggleEliminateOption(q, key, ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    if (!ws) return;
    if (ws.mode === 'exam') {
      ws.examEliminated = ws.examEliminated || {};
      ws.examEliminated[q] = ws.examEliminated[q] || {};
      ws.examEliminated[q][key] = !ws.examEliminated[q][key];
      updateRightAndDockInPlace();
      return;
    }
    ensureTestMaps(ws.testCode);
    if (state.test.checked[ws.testCode][q]) return;
    const map = state.test.eliminated[ws.testCode];
    map[q] = map[q] || {};
    map[q][key] = !map[q][key];
    saveState();
    updatePanesAndDockKeepAudio();
  }

  function updateRightAndDockInPlace() {
    if (!ws) return;
    const sc = currentScreen();
    const isExam = ws.mode === 'exam';
    const ansMap = isExam ? ws.examAnswers : (state.test.answers[ws.testCode] || {});
    const checkedMap = isExam ? {} : (state.test.checked[ws.testCode] || {});
    const flagsMap = isExam ? ws.examFlags : (state.test.flags[ws.testCode] || {});
    const keysMap = DB.answerKeys[ws.testCode] || {};

    const rp = document.getElementById('wsRightPane');
    const stTop = rp ? rp.scrollTop : 0;
    if (rp) { rp.innerHTML = buildRightPaneHtml(sc, isExam, ansMap, checkedMap, flagsMap, keysMap); rp.scrollTop = stTop; }
    updateDockPill(sc, isExam, ansMap, keysMap);
    if (ws.paletteOpen) refreshPopoverLayerOnly();
  }

  function updatePanesAndDockKeepAudio() {
    if (!ws) return;
    const sc = currentScreen();
    const isExam = ws.mode === 'exam';
    const ansMap = isExam ? ws.examAnswers : (state.test.answers[ws.testCode] || {});
    const checkedMap = isExam ? {} : (state.test.checked[ws.testCode] || {});
    const flagsMap = isExam ? ws.examFlags : (state.test.flags[ws.testCode] || {});
    const keysMap = DB.answerKeys[ws.testCode] || {};
    const isUnifiedP2P5 = !isExam && (sc.part === 2 || sc.part === 5);
    const isScreenAnswered = !isExam && sc.qStart === sc.qEnd && !!checkedMap[sc.qStart];
    const curLeftPct = sc.part === 5
      ? (state.p5LeftPanePct != null ? Number(state.p5LeftPanePct) : (state.leftPanePct != null ? Number(state.leftPanePct) : 50))
      : Math.max(32, Math.min(68, Number(state.leftPanePct) || 50));
    document.documentElement.style.setProperty('--left-pane-pct', `${curLeftPct}%`);

    const splitGrid = document.getElementById('wsSplitGrid');
    if (splitGrid) {
      splitGrid.classList.toggle('is-answered', isScreenAnswered);
      splitGrid.classList.toggle('is-left-collapsed', sc.part === 5 && curLeftPct <= 2);
    }

    const lp = document.getElementById('wsLeftPane');
    const rp = document.getElementById('wsRightPane');
    const lst = lp ? lp.scrollTop : 0;
    const rst = rp ? rp.scrollTop : 0;
    if (lp) { lp.innerHTML = buildLeftPaneHtml(sc, isExam, checkedMap, ansMap, flagsMap, keysMap); lp.scrollTop = lst; }
    if (rp) { rp.innerHTML = buildRightPaneHtml(sc, isExam, ansMap, checkedMap, flagsMap, keysMap); rp.scrollTop = isUnifiedP2P5 ? 0 : rst; }
    updateDockPill(sc, isExam, ansMap, keysMap);
    if (ws.paletteOpen) refreshPopoverLayerOnly();
    postRenderDomHighlights(sc);
  }

  function updateDockPill(sc, isExam, ansMap, keysMap) {
    const isExamLcLocked = isExam && !ws.lcFinished;
    const palBtn = document.getElementById('wsPaletteBtn');
    if (palBtn) {
      palBtn.disabled = isExamLcLocked;
      palBtn.classList.toggle('is-locked-lc', isExamLcLocked);
      palBtn.innerHTML = buildDockPillInnerHtml(sc, isExam, ansMap, keysMap);
    }
    if (ws) {
      const activeTotal = ws.activeIndices.length;
      const canGoPrev = !isExam ? ws.posInActive > 0 : (ws.lcFinished && sc.qStart > 101);
      const isCurScreenDone = isScreenAllAnswered(sc, ansMap);
      const canGoNext = !isExam
        ? ws.posInActive < activeTotal - 1
        : (ws.lcFinished ? ws.posInActive < activeTotal - 1 : (isCurScreenDone && ws.posInActive < activeTotal - 1));
      const prevBtn = document.getElementById('wsPrevScreenBtn');
      if (prevBtn) prevBtn.disabled = !canGoPrev;
      const nextBtn = document.getElementById('wsNextScreenBtn');
      if (nextBtn) nextBtn.disabled = !canGoNext;
    }
  }

  function refreshPopoverLayerOnly() {
    if (!ws) return;
    const layer = document.getElementById('wsPopoverLayer');
    if (!layer) return;
    const sc = currentScreen();
    const isExam = ws.mode === 'exam';
    const isExamLcLocked = isExam && !ws.lcFinished;
    const ansMap = isExam ? ws.examAnswers : (state.test.answers[ws.testCode] || {});
    const flagsMap = isExam ? ws.examFlags : (state.test.flags[ws.testCode] || {});
    const keysMap = DB.answerKeys[ws.testCode] || {};
    layer.innerHTML = (ws.paletteOpen && !isExamLcLocked)
      ? renderPalettePopover(sc, isExam, ansMap, keysMap, flagsMap)
      : '';
  }

  function refreshTopbarMenus() {
    if (!ws) return;
    const sc = currentScreen();
    const isExam = ws.mode === 'exam';
    const partInfo = getQPart(sc.qStart);
    const acSlot = document.getElementById('wsAudioCenterSlot');
    const trSlot = document.getElementById('wsTopRightSlot');
    if (acSlot) acSlot.innerHTML = buildAudioCenterHtml(sc, isExam);
    if (trSlot) trSlot.innerHTML = buildTopRightHtml(sc, isExam, partInfo);
  }

  function toggleFlag(q) {
    if (!ws) return;
    if (ws.mode === 'exam') {
      if (ws.examFlags[q]) delete ws.examFlags[q]; else ws.examFlags[q] = true;
      updateRightAndDockInPlace();
      return;
    }
    const fm = state.test.flags[ws.testCode];
    if (fm[q]) delete fm[q]; else fm[q] = true;
    saveState();
    updatePanesAndDockKeepAudio();
  }

  function saveQuestionNote(q, text) {
    if (!ws) return;
    state.test.notes[ws.testCode][q] = text;
    saveState();
  }

  function resetSingleQuestion(q) {
    if (!ws || ws.mode !== 'practice') return;
    delete state.test.checked[ws.testCode][q];
    delete state.test.answers[ws.testCode][q];
    if (state.test.eliminated && state.test.eliminated[ws.testCode]) {
      delete state.test.eliminated[ws.testCode][q];
    }
    saveState();
    updatePanesAndDockKeepAudio();
    toast(`Đã mở khóa Câu ${q} để luyện lại!`);
  }

  function resetPracticeScope(scope) {
    if (!ws || ws.mode !== 'practice') return;
    const sc = currentScreen();
    const part = getQPart(sc.qStart);
    if (scope === 'screen') {
      for (let q = sc.qStart; q <= sc.qEnd; q++) {
        delete state.test.checked[ws.testCode][q];
        delete state.test.answers[ws.testCode][q];
      }
      ws.retryMenuOpen = false;
      saveState();
      refreshTopbarMenus();
      updatePanesAndDockKeepAudio();
      toast('Đã làm mới câu/nhóm hiện tại!');
    } else if (scope === 'part') {
      for (let q = part.start; q <= part.end; q++) {
        delete state.test.checked[ws.testCode][q];
        delete state.test.answers[ws.testCode][q];
      }
      ws.retryMenuOpen = false;
      saveState();
      refreshTopbarMenus();
      updatePanesAndDockKeepAudio();
      toast(`Đã đặt lại toàn bộ Part ${part.part}!`);
    } else if (scope === 'all') {
      ws.retryMenuOpen = false;
      refreshTopbarMenus();
      confirmModal({
        title: `Xóa Bài Làm ${ws.testCode}`,
        message: `Bạn có chắc chắn muốn xóa toàn bộ đáp án đã chọn trong đề <strong>${esc(ws.testCode)}</strong> để luyện lại từ đầu không?`,
        confirmText: 'Xóa bài làm đề này',
        cancelText: 'Hủy',
        danger: true,
        onConfirm: () => {
          state.test.checked[ws.testCode] = {};
          state.test.answers[ws.testCode] = {};
          state.test.eliminated[ws.testCode] = {};
          saveState();
          updatePanesAndDockKeepAudio();
          toast(`Đã xóa bài làm của ${ws.testCode}!`);
        }
      });
    }
  }

  function stepScreen(delta) {
    if (!ws) return;
    if (ws.mode === 'exam' && !ws.lcFinished) {
      if (delta < 0) {
        toast('Đang thi phần Nghe (Listening): Không được quay lại câu cũ — chỉ có thể chuyển sang câu tiếp theo!');
        return;
      }
      if (delta > 0) {
        const sc = currentScreen();
        if (!isScreenAllAnswered(sc, ws.examAnswers)) {
          toast('Hãy chọn xong đáp án câu hiện tại trước khi bấm qua câu tiếp theo!');
          return;
        }
        advanceExamFromListening();
        return;
      }
      return;
    }
    const nxt = ws.posInActive + delta;
    if (nxt < 0 || nxt >= ws.activeIndices.length) return;
    if (ws.mode === 'exam' && ws.lcFinished && ws.allScreens[ws.activeIndices[nxt]].qStart <= 100) {
      toast('Đã qua phần Nghe (Listening) — không được quay lại phần Nghe, chỉ được chuyển tự do trong phần Đọc (Q101–200)!');
      return;
    }
    ws.posInActive = nxt;
    ws.overridePageNum = null;
    ws.paletteOpen = false;
    ws.audioMenuOpen = false;
    ws.toolsMenuOpen = false;
    ws.retryMenuOpen = false;
    ws.showAllEvidence = false;
    ws.showAllEvidenceGroup = null;
    ws.activeEvidence = null;
    ws.audioCurrent = 0;
    ws.audioPlaying = false;
    stopPersistentTestAudio();
    startQuestionPaceTimer();
    renderWorkspace();
  }

  function jumpToQuestion(q) {
    if (!ws) return;
    if (ws.mode === 'exam' && (!ws.lcFinished || q <= 100)) {
      toast('Không thể chuyển tới câu phần Nghe trong chế độ Thi thật!');
      return;
    }
    let pos = ws.activeIndices.findIndex((realIdx) => {
      const s = ws.allScreens[realIdx];
      return q >= s.qStart && q <= s.qEnd;
    });
    if (pos < 0) {
      ws.activeIndices = ws.allScreens.map((_, idx) => idx);
      ws.onlyWrong = false;
      ws.onlySkipped = false;
      ws.filterMode = 'all';

  function wrapMatchesInContainer(rootEl, terms) {
    if (!rootEl || !terms || !terms.length || !document.createTreeWalker) return;
    const cleanTerms = terms.filter((t) => typeof t === 'string' && t.trim().length >= 2)
      .sort((a, b) => b.length - a.length);
    if (!cleanTerms.length) return;
    const escaped = cleanTerms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const rx = new RegExp('(' + escaped.join('|') + ')', 'gi');
    const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const par = node.parentElement;
        if (!par) return NodeFilter.FILTER_REJECT;
        if (par.closest('mark.user-hl, mark.evidence-hl, button, input, textarea, select, script, style, .ets-p6-blank-slot, .opt-key, .badge')) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    let cur;
    while ((cur = walker.nextNode())) nodes.push(cur);
    nodes.forEach((txtNode) => {
      const val = txtNode.nodeValue;
      rx.lastIndex = 0;
      if (!rx.test(val)) return;
      rx.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let lastIdx = 0;
      let m;
      while ((m = rx.exec(val)) !== null) {
        if (m.index > lastIdx) frag.appendChild(document.createTextNode(val.slice(lastIdx, m.index)));
        const mk = document.createElement('mark');
        mk.className = 'user-hl';
        mk.dataset.phrase = m[0];
        mk.title = 'Bấm vào highlight để bỏ hoặc tra từ';
        mk.textContent = m[0];
        frag.appendChild(mk);
        lastIdx = rx.lastIndex;
      }
      if (lastIdx < val.length) frag.appendChild(document.createTextNode(val.slice(lastIdx)));
      txtNode.parentNode.replaceChild(frag, txtNode);
    });
  }

  function highlightEvidenceQuoteInRoot(rootEl, quoteStr, qNum, makePrimary, colorIdx = 0, allowInsideMark = false, badgeLabel = '', viQuoteStr = '') {
    if (!rootEl || !quoteStr || !document.createTreeWalker) return false;
    let cleaned = String(quoteStr || '')
      .replace(/^\s*\d{1,3}\.\s*/, '')
      .replace(/^\s*\([A-D]\)\s*/i, '')
      .replace(/^["'\u201C\u201D\u2018\u2019]+|["'\u201C\u201D\u2018\u2019]+$/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (cleaned.length < 3) return false;
    const cCls = `ev-c${Math.abs(Number(colorIdx) || 0) % 5}`;
    const finalBadge = String(badgeLabel || `Câu ${qNum}`).trim();

    const buildFlexRx = (str) => {
      const tokens = str.split(/\s+/).filter(Boolean).map((tok) => {
        let e = tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          .replace(/['\u2018\u2019]/g, "['\\u2018\\u2019]")
          .replace(/["\u201C\u201D]/g, '["\\u201C\\u201D]');
        // Allow UK/US spelling variants (flavour/flavor, centre/center, organisation/organization, etc.)
        e = e.replace(/ou?r/gi, 'ou?r')
          .replace(/(?:re|er)\b/gi, '(?:re|er)')
          .replace(/i[sz](?=e|ed|ing|ation)/gi, 'i[sz]')
          .replace(/ll(?=ed|ing|er\b)/gi, 'll?');
        return e;
      });
      return new RegExp('(' + tokens.join('[\\s\\u00A0—–\\-,;:]+') + ')', 'i');
    };

    const rx = buildFlexRx(cleaned);
    const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const par = node.parentElement;
        if (!par) return NodeFilter.FILTER_REJECT;
        if (par.closest('button, input, textarea, select, script, style, .opt-key, .speaker-tag, .ev-q-badge, .ev-q-tag, .ets-unit-vi, .ets-doc-vi-line, .vi-text, .opt-vi, .ets-table-vi-row')) {
          return NodeFilter.FILTER_REJECT;
        }
        if (!allowInsideMark && par.closest('mark.evidence-hl')) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let txtNode;
    while ((txtNode = walker.nextNode())) {
      const val = txtNode.nodeValue;
      const m = rx.exec(val);
      if (!m) continue;
      let sIdx = m.index;
      let eIdx = m.index + m[0].length;
      while (sIdx > 0 && /[A-Za-z0-9'\u2018\u2019-]/.test(val[sIdx - 1])) sIdx--;
      const frag = document.createDocumentFragment();
      if (sIdx > 0) frag.appendChild(document.createTextNode(val.slice(0, sIdx)));
      const mk = document.createElement('mark');
      mk.className = `evidence-hl ${cCls}`;
      mk.dataset.evQ = String(qNum);
      mk.dataset.evBadge = finalBadge;
      if (viQuoteStr) mk.dataset.evViQuote = String(viQuoteStr);
      mk.dataset.evColor = cCls;
      if (makePrimary && !document.getElementById('evMarkMain')) {
        mk.id = 'evMarkMain';
      }
      const tag = document.createElement('span');
      tag.className = 'ev-q-tag';
      tag.textContent = `[${finalBadge}]`;
      mk.appendChild(tag);
      mk.appendChild(document.createTextNode(val.slice(sIdx, eIdx)));
      frag.appendChild(mk);
      const after = val.slice(eIdx);
      if (after) frag.appendChild(document.createTextNode(after));
      txtNode.parentNode.replaceChild(frag, txtNode);
      return true;
    }
    return false;
  }

  function getScreenEvKey(sc) {

  function getMarkOffsetRatio(enContainer, mkEl) {
    if (!enContainer || !mkEl || !document.createTreeWalker) return 0;
    let total = 0;
    let mkStart = -1;
    const walker = document.createTreeWalker(enContainer, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (p.closest('.ev-q-tag, .ets-unit-vi, .ets-doc-vi-line, .vi-text, .ets-table-vi-row')) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n;
    while ((n = walker.nextNode())) {
      const len = (n.nodeValue || '').length;
      if (mkStart < 0 && mkEl.contains(n)) {
        mkStart = total;
      }
      total += len;
    }
    if (mkStart < 0 || total <= 0) return 0;
    return Math.max(0, Math.min(0.999, mkStart / total));
  }

      if (msgBox.nextElementSibling && msgBox.nextElementSibling.classList.contains('ets-doc-vi-line')) {

    return null;
