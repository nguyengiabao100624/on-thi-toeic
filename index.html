    parts.push(`<text x="500" y="1382" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#64748b">ETS 2026 Mastery Hub · Kích thước khung đáp án chuẩn IIG 145.9 × 95.6 mm · Đặt trọn 4 dấu góc vào khung khi chụp OMR</text>`);
    parts.push(`</svg>`);
    return parts.join('');
  }

  // --------------------------------------------------------------------------
  // HOMOGRAPHY & PERSPECTIVE WARP (8-DOF DLT Gaussian Elimination)
  // --------------------------------------------------------------------------
  function solveLinearSystem8(A, b) {
    const n = 8;
    const M = A.map((row, i) => row.concat([b[i]]));
    for (let col = 0; col < n; col++) {
      let maxRow = col;
      for (let r = col + 1; r < n; r++) {
        if (Math.abs(M[r][col]) > Math.abs(M[maxRow][col])) maxRow = r;
      }
      const tmp = M[col];
      M[col] = M[maxRow];
      M[maxRow] = tmp;
      const piv = M[col][col];
      if (Math.abs(piv) < 1e-10) return null;
      for (let j = col; j <= n; j++) M[col][j] /= piv;
      for (let r = 0; r < n; r++) {
        if (r === col) continue;
        const factor = M[r][col];
        for (let j = col; j <= n; j++) M[r][j] -= factor * M[col][j];
      }
    }
    return M.map((row) => row[n]);
  }

  // Computes homography mapping 4 canonical dst points -> 4 source pts
  function solveHomographyPts(dstPts, srcPts) {
    const A = [];
    const b = [];
    for (let i = 0; i < 4; i++) {
      const X = dstPts[i].x, Y = dstPts[i].y;
      const x = srcPts[i].x, y = srcPts[i].y;
      A.push([X, Y, 1, 0, 0, 0, -x * X, -x * Y]);
      b.push(x);
      A.push([0, 0, 0, X, Y, 1, -y * X, -y * Y]);
      b.push(y);
    }
    const h = solveLinearSystem8(A, b);
    if (!h) return null;
    return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
  }

  function applyHomography(H, x, y) {
    const denom = H[6] * x + H[7] * y + 1;
    if (Math.abs(denom) < 1e-8) return { x: 0, y: 0 };
    return {
      x: (H[0] * x + H[1] * y + H[2]) / denom,
      y: (H[3] * x + H[4] * y + H[5]) / denom
    };
  }

  function computeHomographyDstToSrc(srcCorners) {
    return solveHomographyPts(
      [FIDUCIALS.tl, FIDUCIALS.tr, FIDUCIALS.bl, FIDUCIALS.br],
      [srcCorners.tl, srcCorners.tr, srcCorners.bl, srcCorners.br]
    );
  }

  // Illumination-normalized grayscale field (removes flash/shadow gradients without bleaching gray bands)
  function buildNormalizedGray(gray, dw, dh) {
    const gxN = 6, gyN = 8;
    const grid = new Float32Array(gxN * gyN);
    for (let gy = 0; gy < gyN; gy++) {
      const y0 = Math.floor((gy / gyN) * dh);
      const y1 = Math.floor(((gy + 1) / gyN) * dh);
      for (let gx = 0; gx < gxN; gx++) {
        const x0 = Math.floor((gx / gxN) * dw);
        const x1 = Math.floor(((gx + 1) / gxN) * dw);
        const samples = [];
        for (let y = y0; y < y1; y += 3) {
          for (let x = x0; x < x1; x += 3) samples.push(gray[y * dw + x]);
        }
        samples.sort((a, b) => a - b);
        grid[gy * gxN + gx] = samples.length ? samples[Math.floor(samples.length * 0.86)] : 255;
      }
    }
    const norm = new Float32Array(dw * dh);
    for (let y = 0; y < dh; y++) {
      const fy = (y / dh) * gyN - 0.5;
      const iy0 = Math.max(0, Math.min(gyN - 1, Math.floor(fy)));
      const iy1 = Math.max(0, Math.min(gyN - 1, iy0 + 1));
      const wy = Math.max(0, Math.min(1, fy - iy0));
      for (let x = 0; x < dw; x++) {
        const fx = (x / dw) * gxN - 0.5;
        const ix0 = Math.max(0, Math.min(gxN - 1, Math.floor(fx)));
        const ix1 = Math.max(0, Math.min(gxN - 1, ix0 + 1));
        const wx = Math.max(0, Math.min(1, fx - ix0));
        const bg = (grid[iy0 * gxN + ix0] * (1 - wx) + grid[iy0 * gxN + ix1] * wx) * (1 - wy)
                 + (grid[iy1 * gxN + ix0] * (1 - wx) + grid[iy1 * gxN + ix1] * wx) * wy;
        norm[y * dw + x] = Math.min(255, (gray[y * dw + x] * 252) / Math.max(70, bg));
      }
    }
    return norm;
  }

  function fitRobustLine(pts, horizontal) {
    if (!pts || pts.length < 3) return null;
    // Initial OLS
    const fitOls = (arr) => {
      let sx = 0, sy = 0, sxx = 0, sxy = 0;
      const n = arr.length;
      for (const p of arr) {
        const u = horizontal ? p.x : p.y;
        const v = horizontal ? p.y : p.x;
        sx += u; sy += v; sxx += u * u; sxy += u * v;
      }
      const denom = n * sxx - sx * sx;
      const slope = Math.abs(denom) > 1e-6 ? (n * sxy - sx * sy) / denom : 0;
      const intercept = (sy - slope * sx) / n;
      return { slope, intercept };
    };
    const init = fitOls(pts);
    const res = pts.map((p) => {
      const u = horizontal ? p.x : p.y;
      const v = horizontal ? p.y : p.x;
      return { p, err: Math.abs(v - (init.slope * u + init.intercept)) };
    });
    res.sort((a, b) => a.err - b.err);
    const keep = res.slice(0, Math.max(4, Math.ceil(res.length * 0.72))).map((r) => r.p);
    return fitOls(keep);
  }

  function intersectHVLines(hLine, vLine) {
    // Horizontal: y = mH * x + bH; Vertical: x = mV * y + bV
    const denom = 1 - hLine.slope * vLine.slope;
    if (Math.abs(denom) < 1e-6) return null;
    const x = (vLine.slope * hLine.intercept + vLine.intercept) / denom;
    const y = hLine.slope * x + hLine.intercept;
    return { x, y };
  }

  // Fallback Stage B: Detect LISTENING + READING outer frame & center gutter on mẫu tô trắc nghiệm.pdf / TF66E100
  function detectOfficialEtsGridCorners(normGray, dw, dh, scale) {
    const tw = Math.min(540, dw);
    const s = tw / dw;
    const th = Math.round(dh * s);
    const small = new Float32Array(tw * th);
    for (let y = 0; y < th; y++) {
      const sy = Math.min(dh - 1, Math.round(y / s));
      for (let x = 0; x < tw; x++) {
        small[y * tw + x] = normGray[sy * dw + Math.min(dw - 1, Math.round(x / s))];
      }
    }
    const sampleSmall = (x, y) => {
      if (x < 0 || x >= tw || y < 0 || y >= th) return 255;
      return small[(y | 0) * tw + (x | 0)];
    };
    const pct75 = (arr) => {
      if (!arr.length) return 255;
      const a = arr.slice().sort((u, v) => u - v);
      return a[Math.min(a.length - 1, Math.floor(a.length * 0.75))];
    };

    const BAND_FRACS = [0.197, 0.376, 0.554, 0.733, 0.911];
    let bestCand = null;
    const rowMask = new Uint8Array(tw);
    for (let deg = -10; deg <= 10; deg += 1) {
      const slope = Math.tan((deg * Math.PI) / 180);
      for (let yr = Math.round(th * 0.02); yr < Math.round(th * 0.48); yr += 2) {
        for (let x = 0; x < tw; x++) {
          const yy = Math.round(yr + (x - tw * 0.5) * slope);
          const v = sampleSmall(x, yy);
          rowMask[x] = (v <= 228) ? 1 : 0;
        }
        const runs = [];
        let x = 0;
        while (x < tw) {
          if (!rowMask[x]) { x++; continue; }
          const xStart = x;
          let gap = 0, lastOn = x;
          x++;
          while (x < tw) {
            if (rowMask[x]) { lastOn = x; gap = 0; }
            else { gap++; if (gap > 1) break; }
            x++;
          }
          if (lastOn - xStart >= tw * 0.14) runs.push([xStart, lastOn]);
        }
        for (let i = 0; i < runs.length - 1; i++) {
          const [L0, L1] = runs[i];
          const [R0, R1] = runs[i + 1];
          const wL = L1 - L0, wR = R1 - R0;
          const totalW = R1 - L0;
          const gap = R0 - L1;
          if (totalW < tw * 0.35 || totalW > tw * 0.96) continue;
          if (gap < Math.max(1.5, totalW * 0.005) || gap > totalW * 0.052) continue;
          if (Math.abs(wL - wR) / Math.max(wL, wR) > 0.12) continue;

          const totalH = totalW * (PDF_BOX.h / PDF_BOX.w);
          const outL = Math.max(
            sampleSmall(L0 - 4, yr + (L0 - tw * 0.5) * slope),
            sampleSmall(L0 - 7, yr + (L0 - tw * 0.5) * slope)
          );
          const outR = Math.max(
            sampleSmall(R1 + 4, yr + (R1 - tw * 0.5) * slope),
            sampleSmall(R1 + 7, yr + (R1 - tw * 0.5) * slope)
          );
          if (outL < 205 || outR < 205) continue;

          // Snap to crisp white-above -> gray-header top boundary & measure collinearity across L & R
          let hdrTopYr = yr, hdrScore = -1e9;
          const xsHdr = [0.10, 0.22, 0.34, 0.42, 0.58, 0.66, 0.78, 0.90].map((f) => L0 + totalW * f);
          for (let dy = -Math.round(totalH * 0.11); dy <= Math.round(totalH * 0.03); dy++) {
            const perProbe = [];
            for (const xh of xsHdr) {
              const yy = yr + dy + (xh - tw * 0.5) * slope;
              const ab = sampleSmall(xh, yy - 3) * 0.5 + sampleSmall(xh, yy - 5) * 0.5;
              const bl = sampleSmall(xh, yy + 3) * 0.5 + sampleSmall(xh, yy + 6) * 0.5;
              perProbe.push((ab - bl) + (ab - sampleSmall(xh, yy)) * 0.6);
            }
            // Trim lowest 2 (immune to occasional top black timing dot) and sum
            perProbe.sort((a, b) => a - b);
            const sc = perProbe.slice(2).reduce((acc, v) => acc + v, 0) / 6;
            if (sc > hdrScore) { hdrScore = sc; hdrTopYr = yr + dy; }
          }
          if (hdrTopYr + totalH >= th * 0.99) continue;

          // 5-band anti-phase ETS checkerboard check (Listening gray vs Reading white alternating every 5 rows!)
          const diffs = [];
          for (let b = 0; b < 5; b++) {
            const fracY = BAND_FRACS[b];
            const valsL = [], valsR = [];
            for (let k = 0; k < 6; k++) {
              const txL = L0 + wL * (0.10 + (k / 5) * 0.80);
              const txR = R0 + wR * (0.10 + (k / 5) * 0.80);
              for (let dy = -2; dy <= 2; dy += 2) {
                valsL.push(sampleSmall(txL, hdrTopYr + totalH * fracY + (txL - tw * 0.5) * slope + dy));
                valsR.push(sampleSmall(txR, hdrTopYr + totalH * fracY + (txR - tw * 0.5) * slope + dy));
              }
            }
            const bgL = pct75(valsL);
            const bgR = pct75(valsR);
            diffs.push((b % 2 === 0) ? (bgR - bgL) : (bgL - bgR));
          }
          const posBands = diffs.filter((d) => d > 6).length;
          const antiSum = diffs.reduce((acc, d) => acc + d, 0);
          if (posBands < 4 || antiSum < 35) continue;

          const abVals = [], blVals = [];
          const yTopCheck = hdrTopYr - Math.max(3, totalH * 0.036);
          const yBotCheck = hdrTopYr + totalH + Math.max(3, totalH * 0.030);
          for (let k = 0; k < 6; k++) {
            const txL = L0 + wL * ((k + 0.5) / 6);
            const txR = R0 + wR * ((k + 0.5) / 6);
            abVals.push(sampleSmall(txL, yTopCheck + (txL - tw * 0.5) * slope), sampleSmall(txR, yTopCheck + (txR - tw * 0.5) * slope));
            blVals.push(sampleSmall(txL, yBotCheck + (txL - tw * 0.5) * slope), sampleSmall(txR, yBotCheck + (txR - tw * 0.5) * slope));
          }
          const aboveWhite = pct75(abVals);
          const belowWhite = pct75(blVals);
          if (aboveWhite < 200 || belowWhite < 195) continue;

          const score = hdrScore * 2.0 + antiSum * 2.5 + posBands * 30 + (aboveWhite - 190) * 0.7 + (belowWhite - 190) * 0.5 + totalW * 0.15;
          if (!bestCand || score > bestCand.score) {
            bestCand = { score, deg, slope, L0: L0 / s, L1: L1 / s, R0: R0 / s, R1: R1 / s, yrTop: hdrTopYr / s, estW: totalW / s, estH: totalH / s };
          }
        }
      }
    }

    if (!bestCand) return null;

    // Step 2: Refine outer borders & crisp white center gutter in normGray (dw x dh)
    const sampleNorm = (x, y) => {
      const ix = Math.max(0, Math.min(dw - 1, Math.round(x)));
      const iy = Math.max(0, Math.min(dh - 1, Math.round(y)));
      return normGray[iy * dw + ix];
    };

    const xMidInit = (bestCand.L0 + bestCand.R1) * 0.5;
    // Measure TOP border Y independently in Left half (Listening) & Right half (Reading) so slope error in Step 1 auto-corrects!
    function findHalfTopY(fracMin, fracMax) {
      const probes = [];
      for (let i = 0; i < 7; i++) probes.push(bestCand.L0 + bestCand.estW * (fracMin + (i / 6) * (fracMax - fracMin)));
      const cxHalf = (probes[0] + probes[probes.length - 1]) * 0.5;
      const baseHalfY = bestCand.yrTop + (cxHalf - xMidInit) * bestCand.slope;
      let bestY = baseHalfY, bestSc = -1e9;
      for (let dy = -Math.round(bestCand.estH * 0.12); dy <= Math.round(bestCand.estH * 0.09); dy++) {
        const scArr = [];
        for (const xp of probes) {
          const yy = baseHalfY + dy + (xp - cxHalf) * bestCand.slope;
          const above = Math.min(sampleNorm(xp, yy - 3), sampleNorm(xp, yy - 5));
          const below = (sampleNorm(xp, yy + 3) + sampleNorm(xp, yy + 6)) * 0.5;
          let sc = (above - sampleNorm(xp, yy)) * 1.1 + Math.min(75, Math.max(-35, above - below)) * 0.8;
          if (above < 185) sc -= 120;
          scArr.push(sc);
        }
        // Trimmed mean ignores up to 2 probes landing on top black timing dots
        scArr.sort((a, b) => a - b);
        const avgSc = scArr.slice(2).reduce((a, b) => a + b, 0) / 5;
        if (avgSc > bestSc) { bestSc = avgSc; bestY = baseHalfY + dy; }
      }
      return { cx: cxHalf, y: bestY };
    }
    const hTopL = findHalfTopY(0.06, 0.43);
    const hTopR = findHalfTopY(0.57, 0.94);
    const initSlope = (hTopR.y - hTopL.y) / Math.max(20, hTopR.cx - hTopL.cx);
    const initTopAt = (x) => hTopL.y + (x - hTopL.cx) * initSlope;

    // Top line: tightly track along initTopAt(px)
    const topPts = [];
    const searchTopY = Math.max(7, Math.round(bestCand.estH * 0.045));
    for (let i = 0; i < 16; i++) {
      const frac = i < 8 ? (0.04 + (i / 7) * 0.42) : (0.54 + ((i - 8) / 7) * 0.42);
      const px = bestCand.L0 + frac * bestCand.estW;
      const baseY = initTopAt(px);
      let bestTy = baseY, bestTs = -1e9;
      for (let d = -searchTopY; d <= searchTopY; d++) {
        const y = baseY + d;
        const above = Math.min(sampleNorm(px, y - 3), sampleNorm(px, y - 6));
        const below = (sampleNorm(px, y + 3) + sampleNorm(px, y + 6)) * 0.5;
        let sc = (above - sampleNorm(px, y)) * 1.1 + Math.min(75, Math.max(-30, above - below)) * 0.7;
        if (above < 190) sc -= 140;
        if (sc > bestTs) { bestTs = sc; bestTy = y; }
      }
      topPts.push({ x: px, y: bestTy });
    }
    const lTop = fitRobustLine(topPts, true);
    if (!lTop) return null;

    // Refine 4 Header vertical boundaries inside the bubble-free Header Band (averaged over 3 heights)
    function findHeaderEdgeX(estX, topAtEstX, dirOutSign) {
      const rad = Math.max(8, Math.round(bestCand.estW * 0.032));
      const yOffsets = [bestCand.estH * 0.028, bestCand.estH * 0.052, bestCand.estH * 0.076];
      let bestX = estX, bestSc = -1e9;
      for (let d = -rad; d <= rad; d++) {
        const x = estX + d;
        let sumSc = 0;
        for (const yOff of yOffsets) {
          const yAtX = topAtEstX + yOff;
          const outW = Math.min(sampleNorm(x + dirOutSign * 3, yAtX), sampleNorm(x + dirOutSign * 6, yAtX));
          const inG = (sampleNorm(x - dirOutSign * 3, yAtX) + sampleNorm(x - dirOutSign * 6, yAtX)) * 0.5;
          let s1 = (outW - sampleNorm(x, yAtX)) * 1.1 + Math.min(70, Math.max(-40, outW - inG)) * 0.65;
          if (outW < 185) s1 -= 120;
          sumSc += s1;
        }
        const sc = sumSc / yOffsets.length - Math.abs(d) * 0.25;
        if (sc > bestSc) { bestSc = sc; bestX = x; }
      }
      return bestX;
    }
    const xL_head = findHeaderEdgeX(bestCand.L0, lTop.slope * bestCand.L0 + lTop.intercept, -1);
    const xLR_head = findHeaderEdgeX(bestCand.L1, lTop.slope * bestCand.L1 + lTop.intercept, 1);
    const xRL_head = findHeaderEdgeX(bestCand.R0, lTop.slope * bestCand.R0 + lTop.intercept, -1);
    const xR_head = findHeaderEdgeX(bestCand.R1, lTop.slope * bestCand.R1 + lTop.intercept, 1);

    const refinedW = Math.max(40, xR_head - xL_head);
    const refinedH = refinedW * (PDF_BOX.h / PDF_BOX.w);

    // Track Left Vertical Timing Bars (75.6..84.36pt in PDF, 100% bubble-free pure white margin)
    function detectLeftTimingTrack() {
      const topAtL = lTop.slope * xL_head + lTop.intercept;
      const baseTilt = -lTop.slope;
      const centerOffX = -0.0602 * refinedW;
      const barMinW = Math.max(4, Math.round(refinedW * 0.011));
      const barMaxW = Math.max(12, Math.round(refinedW * 0.036));
      const marginHalf = Math.max(16, Math.round(refinedW * 0.028));
      const yMin = Math.max(4, Math.round(topAtL - 0.06 * refinedH));
      const yMax = Math.min(dh - 4, Math.round(topAtL + 1.05 * refinedH));
      const rawBars = [];
      let curBand = null;
      const vGap = Math.max(2, Math.round(refinedH * 0.010));

      for (let y = yMin; y <= yMax; y++) {
        const expX = xL_head + centerOffX + baseTilt * (y - topAtL);
        const xStart = Math.max(1, Math.round(expX - marginHalf));
        const xEnd = Math.min(Math.round(xL_head - Math.max(5, refinedW * 0.018)), Math.round(expX + marginHalf));
        if (xEnd - xStart < barMinW) continue;
        let runS = -1, bestRun = null;
        for (let x = xStart; x <= xEnd; x++) {
          const v = sampleNorm(x, y);
          const aboveV = sampleNorm(x, y - vGap);
          const belowV = sampleNorm(x, y + vGap);
          const isDarkBarPx = v < 165 && (aboveV - v > 28 || belowV - v > 28 || v < 110);
          if (isDarkBarPx) {
            if (runS < 0) runS = x;
          } else if (runS >= 0) {
            const len = x - runS;
            if (len >= barMinW && len <= barMaxW) bestRun = { x0: runS, x1: x - 1, cx: (runS + x - 1) * 0.5 };
            runS = -1;
          }
        }
        if (runS >= 0) {
          const len = (xEnd + 1) - runS;
          if (len >= barMinW && len <= barMaxW) bestRun = { x0: runS, x1: xEnd, cx: (runS + xEnd) * 0.5 };
        }
        if (bestRun) {
          if (curBand && y - curBand.lastY <= 2 && Math.abs(bestRun.cx - curBand.lastCx) <= Math.max(4, barMinW)) {
            curBand.sumX += bestRun.cx;
            curBand.sumY += y;
            curBand.cnt += 1;
            curBand.lastY = y;
            curBand.lastCx = bestRun.cx;
          } else {
            if (curBand) rawBars.push({ x: curBand.sumX / curBand.cnt, y: curBand.sumY / curBand.cnt, h: curBand.cnt });
            curBand = { sumX: bestRun.cx, sumY: y, cnt: 1, lastY: y, lastCx: bestRun.cx };
          }
        }
      }
      if (curBand) rawBars.push({ x: curBand.sumX / curBand.cnt, y: curBand.sumY / curBand.cnt, h: curBand.cnt });
      if (rawBars.length < 10) return null;

      // RANSAC straight line on timing bar centers (immune to handwritten digits in left margin)
      const tolX = Math.max(2.6, refinedW * 0.0048);
      let bestLine = null, bestInliers = [];
      for (let i = 0; i < rawBars.length; i++) {
        for (let j = i + 1; j < rawBars.length; j++) {
          const dy = rawBars[j].y - rawBars[i].y;
          if (Math.abs(dy) < refinedH * 0.25) continue;
          const sl = (rawBars[j].x - rawBars[i].x) / dy;
          if (Math.abs(sl - baseTilt) > 0.14) continue;
          const ic = rawBars[i].x - sl * rawBars[i].y;
          const inl = rawBars.filter((p) => Math.abs(p.x - (sl * p.y + ic)) <= tolX);
          if (inl.length > bestInliers.length) {
            bestInliers = inl;
            bestLine = { slope: sl, intercept: ic };
          }
        }
      }
      if (!bestLine || bestInliers.length < 12) return null;
      const refit = fitRobustLine(bestInliers, false);
      if (!refit) return null;

      // Comb-filter match 25 bubble rows (yRow1..yRow25) onto detected Left Timing Bars!
      const expDy = (PDF_ROW_DY / PDF_BOX.h) * refinedH;
      const expY0 = topAtL + ((PDF_ROW_Y0 - PDF_BOX.y0) / PDF_BOX.h) * refinedH;
      const expY25 = expY0 + 24 * expDy;
      let bestComb = null;
      for (let mDy = 0.94; mDy <= 1.06; mDy += 0.003) {
        const dyTry = expDy * mDy;
        const shiftMin = -Math.max(8, Math.round(expDy * 0.95));
        const shiftMax = Math.max(8, Math.round(expDy * 0.95));
        for (let sh = shiftMin; sh <= shiftMax; sh += 1.0) {
          const yTry0 = expY0 + sh;
          let hits = 0, errSum = 0;
          for (let r = 0; r < 25; r++) {
            const ry = yTry0 + r * dyTry;
            let minD = 1e9;
            for (const b of bestInliers) {
              const d = Math.abs(b.y - ry);
              if (d < minD) minD = d;
            }
            if (minD <= Math.max(2.8, expDy * 0.28)) {
              hits++;
              errSum += minD * minD;
            }
          }
          const score = hits * 10 - errSum * 0.25 - Math.abs(mDy - 1) * 40 - Math.abs(sh) * 0.08;
          if (!bestComb || score > bestComb.score) {
            bestComb = { score, hits, yRow1: yTry0, dy: dyTry, yRow25: yTry0 + 24 * dyTry };
          }
        }
      }
      const yBotLeft = (bestComb && bestComb.hits >= 16)
        ? (bestComb.yRow25 + ((PDF_BOX.y1 - (PDF_ROW_Y0 + 24 * PDF_ROW_DY)) / PDF_BOX.h) * refinedH)
        : null;
      return {
        slopeXvsY: refit.slope,
        yBotLeft,
        hits: bestComb ? bestComb.hits : 0
      };
    }
    const timingTrack = detectLeftTimingTrack();

    // Constrained Straight-Line Bottom Edge: tight search avoids jumping up onto Row 25 dark bubbles!
    const botPts = [];
    const expectedHAtLeft = timingTrack && timingTrack.yBotLeft
      ? (timingTrack.yBotLeft - (lTop.slope * xL_head + lTop.intercept))
      : refinedH;
    const radBotUp = Math.max(4, Math.round(refinedH * 0.015));
    const radBotDown = Math.max(5, Math.round(refinedH * 0.022));
    for (let i = 0; i < 16; i++) {
      const frac = i < 8 ? (0.04 + (i / 7) * 0.42) : (0.54 + ((i - 8) / 7) * 0.42);
      const px = xL_head + frac * refinedW;
      const baseY = (lTop.slope * px + lTop.intercept) + expectedHAtLeft;
      let bestBy = baseY, bestBs = -1e9;
      for (let d = -radBotUp; d <= radBotDown; d++) {
        const y = baseY + d;
        const lineVal = sampleNorm(px, y);
        const below1 = sampleNorm(px, y + 2);
        const below2 = sampleNorm(px, y + 3);
        const belowNear = Math.max(below1, below2);
        const above = (sampleNorm(px, y - 2) + sampleNorm(px, y - 4)) * 0.5;
        const bandWeight = frac < 0.5 ? 0.72 : 0.22;
        let sc = (belowNear - lineVal) * 1.15 + Math.min(75, Math.max(-25, belowNear - above)) * bandWeight - Math.abs(d) * 0.6;
        if (belowNear < 175) sc -= 150;
        if (above < 105) sc -= 130; // Ignore filled Row 25 bubbles right above hairline bottom border
        if (lineVal > 195) sc -= 80;
        if (sc > bestBs) { bestBs = sc; bestBy = y; }
      }
      botPts.push({ x: px, y: bestBy });
    }
    const lBot = fitRobustLine(botPts, true);
    if (!lBot) return null;

    // Straight-Line Sweep Vertical Border Tracker anchored at Header X (Timing Track guides Left edge only; Right edge supports symmetric perspective keystone)
    function trackVerticalEdge(xHeadAnchor, dirOutSign, grayBandMask, customGuideSlope, maxRadFrac, guidePenalty) {
      const yHead = (lTop.slope * xHeadAnchor + lTop.intercept) + refinedH * 0.052;
      const botAtAnchor = lBot.slope * xHeadAnchor + lBot.intercept;
      const spanH = Math.max(30, botAtAnchor - yHead);
      const guideSlope = customGuideSlope != null ? customGuideSlope : -lTop.slope;
      const baseDxTotal = guideSlope * spanH;
      const radDx = Math.max(9, Math.round(refinedW * (maxRadFrac || 0.036)));
      let bestDx = baseDxTotal, bestScore = -1e9;
      const nSt = 28;
      for (let d = -radDx; d <= radDx; d += 0.5) {
        const dxTotal = baseDxTotal + d;
        const sl = dxTotal / spanH;
        const stScores = [];
        for (let j = 0; j < nSt; j++) {
          const fracY = 0.095 + (j / (nSt - 1)) * 0.875;
          const py = (lTop.slope * xHeadAnchor + lTop.intercept) + fracY * refinedH;
          const px = xHeadAnchor + sl * (py - yHead);
          const outW = Math.min(sampleNorm(px + dirOutSign * 3, py), sampleNorm(px + dirOutSign * 5, py));
          const onLine = sampleNorm(px, py);
          const inV = (sampleNorm(px - dirOutSign * 2.5, py) + sampleNorm(px - dirOutSign * 4.5, py)) * 0.5;
          let sc = (outW - onLine) * 1.15;
          if (grayBandMask(fracY)) {
            sc += Math.min(68, Math.max(-35, outW - inV)) * 0.65;
            if (inV < 85) sc -= 65; // Reject lines falling inside dark filled bubbles!
          }
          if (outW < 185) sc -= 130;
          stScores.push(sc);
        }
        stScores.sort((a, b) => a - b);
        const trimMean = stScores.slice(4).reduce((a, b) => a + b, 0) / (nSt - 4);
        const totalSc = trimMean - Math.abs(d) * (guidePenalty != null ? guidePenalty : 0.25);
        if (totalSc > bestScore) { bestScore = totalSc; bestDx = dxTotal; }
      }
      const finalSl = bestDx / spanH;
      return { slope: finalSl, intercept: xHeadAnchor - finalSl * yHead };
    }

    const isListenGrayBand = (f) => f < 0.105 || (f > 0.13 && f < 0.27) || (f > 0.49 && f < 0.63) || f > 0.84;
    const isReadGrayBand = (f) => f < 0.105 || (f > 0.31 && f < 0.45) || (f > 0.67 && f < 0.81);

    const lLeft = trackVerticalEdge(xL_head, -1, isListenGrayBand, timingTrack ? timingTrack.slopeXvsY : -lTop.slope, timingTrack ? 0.022 : 0.048, timingTrack ? 1.0 : 0.15);
    const lRight = trackVerticalEdge(xR_head, 1, isReadGrayBand, -lTop.slope, 0.052, 0.12);
    if (!lLeft || !lRight) return null;

    const pTL = intersectHVLines(lTop, lLeft);
    const pTR = intersectHVLines(lTop, lRight);
    const pBL = intersectHVLines(lBot, lLeft);
    const pBR = intersectHVLines(lBot, lRight);
    if (!pTL || !pTR || !pBL || !pBR) return null;

    const ratio = Math.hypot(pTR.x - pTL.x, pTR.y - pTL.y) / Math.max(20, Math.hypot(pBL.x - pTL.x, pBL.y - pTL.y));
    if (ratio < 1.15 || ratio > 1.95) return null;

    const out = {
      mode: 'ets-grid',
      tl: { x: pTL.x / scale, y: pTL.y / scale },
      tr: { x: pTR.x / scale, y: pTR.y / scale },
      bl: { x: pBL.x / scale, y: pBL.y / scale },
      br: { x: pBR.x / scale, y: pBR.y / scale }
    };

    // Track crisp white center-gutter borders independently guided by symmetric midpoint slant
    const midSlope = (lLeft.slope + lRight.slope) * 0.5;
    const lListenR = trackVerticalEdge(xLR_head, 1, isListenGrayBand, midSlope, 0.022, 0.45);
    const lReadL = trackVerticalEdge(xRL_head, -1, isReadGrayBand, midSlope, 0.022, 0.45);
    if (lListenR && lReadL && Math.abs(lListenR.slope) < 0.25 && Math.abs(lReadL.slope) < 0.25) {
      const pMTL = intersectHVLines(lTop, lListenR);
      const pMBL = intersectHVLines(lBot, lListenR);
      const pMTR = intersectHVLines(lTop, lReadL);
      const pMBR = intersectHVLines(lBot, lReadL);
      if (pMTL && pMBL && pMTR && pMBR) {
        const topSpan = pTR.x - pTL.x;
        const botSpan = pBR.x - pBL.x;
        const topF1 = (pMTL.x - pTL.x) / Math.max(10, topSpan);
        const topF2 = (pMTR.x - pTL.x) / Math.max(10, topSpan);
        const botF1 = (pMBL.x - pBL.x) / Math.max(10, botSpan);
        const botF2 = (pMBR.x - pBL.x) / Math.max(10, botSpan);
        const validTop = topF1 > 0.44 && topF1 < 0.54 && topF2 > topF1 + 0.004 && topF2 < 0.56;
        const validBot = botF1 > 0.44 && botF1 < 0.54 && botF2 > botF1 + 0.004 && botF2 < 0.56;
        if (validTop && validBot) {
          out.listenCorners = {
            tl: out.tl,
            tr: { x: pMTL.x / scale, y: pMTL.y / scale },
            bl: out.bl,
            br: { x: pMBL.x / scale, y: pMBL.y / scale }
          };
          out.readCorners = {
            tl: { x: pMTR.x / scale, y: pMTR.y / scale },
            tr: out.tr,
            bl: { x: pMBR.x / scale, y: pMBR.y / scale },
            br: out.br
          };
        }
      }
    }
    return out;
  }

  // --------------------------------------------------------------------------
  // DUAL AUTO-DETECTOR:
  //  1) Web A4 Sheet 4 Bullseyes -> projected to Answer Block [0..1000 x 0..655]
  //  2) Official ETS PDF ("mẫu tô trắc nghiệm.pdf") LISTENING + READING frame
  // --------------------------------------------------------------------------
  function autoDetectFiducials(canvasEl) {
    const w = canvasEl.width;
    const h = canvasEl.height;
    const scale = Math.min(1, 720 / Math.max(w, h));
    const dw = Math.max(80, Math.round(w * scale));
    const dh = Math.max(80, Math.round(h * scale));

    const tmp = document.createElement('canvas');
    tmp.width = dw;
    tmp.height = dh;
    const tctx = tmp.getContext('2d', { willReadFrequently: true });
    tctx.drawImage(canvasEl, 0, 0, dw, dh);
    const img = tctx.getImageData(0, 0, dw, dh).data;
    const gray = new Float32Array(dw * dh);
    for (let i = 0; i < dw * dh; i++) {
      gray[i] = 0.299 * img[i * 4] + 0.587 * img[i * 4 + 1] + 0.114 * img[i * 4 + 2];
    }

    const stride = dw + 1;
    const integ = new Float64Array(stride * (dh + 1));
    for (let y = 0; y < dh; y++) {
      let rowSum = 0;
      for (let x = 0; x < dw; x++) {
        rowSum += gray[y * dw + x];
        integ[(y + 1) * stride + (x + 1)] = integ[y * stride + (x + 1)] + rowSum;
      }
    }
    function boxMean(x0, y0, x1, y1) {
      const ax = Math.max(0, Math.floor(x0)), ay = Math.max(0, Math.floor(y0));
      const bx = Math.min(dw - 1, Math.floor(x1)), by = Math.min(dh - 1, Math.floor(y1));
      if (bx <= ax || by <= ay) return 255;
      const area = (bx - ax) * (by - ay);
      const sum = integ[by * stride + bx] - integ[ay * stride + bx] - integ[by * stride + ax] + integ[ay * stride + ax];
      return sum / area;
    }

    function scoreBullseye(cx, cy, rOut, rMid, rIn) {
      const mIn = boxMean(cx - rIn, cy - rIn, cx + rIn, cy + rIn);
      if (mIn > 135) return -1e9;
      const mMidAll = boxMean(cx - rMid, cy - rMid, cx + rMid, cy + rMid);
      const aIn = (2 * rIn) * (2 * rIn);
      const aMid = (2 * rMid) * (2 * rMid);
      const ringWhite = (mMidAll * aMid - mIn * aIn) / Math.max(1, aMid - aIn);
      if (ringWhite < mIn + 42) return -1e9;
      const mOutAll = boxMean(cx - rOut, cy - rOut, cx + rOut, cy + rOut);
      const aOut = (2 * rOut) * (2 * rOut);
      const outerBlack = (mOutAll * aOut - mMidAll * aMid) / Math.max(1, aOut - aMid);
      if (ringWhite < outerBlack + 35) return -1e9;
      const mSurrAll = boxMean(cx - rOut * 1.4, cy - rOut * 1.4, cx + rOut * 1.4, cy + rOut * 1.4);
      const aSurr = (2 * rOut * 1.4) * (2 * rOut * 1.4);
      const surrWhite = (mSurrAll * aSurr - mOutAll * aOut) / Math.max(1, aSurr - aOut);
      if (surrWhite < outerBlack + 30) return -1e9;

      // Directional symmetry gate: reject bubble clusters inside grid where contrast only exists on 1-2 sides
      const rw = (rIn + rMid) * 0.5;
      const ro = (rMid + rOut) * 0.5;
      const rBand = Math.max(1, (rMid - rIn) * 0.45);
      const ringArms = [
        boxMean(cx - rBand, cy - rw - rBand, cx + rBand, cy - rw + rBand),
        boxMean(cx - rBand, cy + rw - rBand, cx + rBand, cy + rw + rBand),
        boxMean(cx - rw - rBand, cy - rBand, cx - rw + rBand, cy + rBand),
        boxMean(cx + rw - rBand, cy - rBand, cx + rw + rBand, cy + rBand)
      ];
      if (Math.min(...ringArms) < mIn + 30) return -1e9;
      const outerArms = [
        boxMean(cx - rBand, cy - ro - rBand, cx + rBand, cy - ro + rBand),
        boxMean(cx - rBand, cy + ro - rBand, cx + rBand, cy + ro + rBand),
        boxMean(cx - ro - rBand, cy - rBand, cx - ro + rBand, cy + rBand),
        boxMean(cx + ro - rBand, cy - rBand, cx + ro + rBand, cy + rBand)
      ];
      if (Math.max(...outerArms) > Math.min(...ringArms) - 18) return -1e9;

      return (ringWhite - mIn) * 0.9 + (ringWhite - outerBlack) * 1.1 + (surrWhite - outerBlack) * 0.8;
    }

    function searchQuadrant(qx0, qy0, qx1, qy1) {
      let bestScore = -1e9;
      let bestRaw = { cx: (qx0 + qx1) * 0.5, cy: (qy0 + qy1) * 0.5, rOut: 6, rIn: 2, score: 0 };
      const rCandidates = [
        Math.max(4, Math.round(dw * 0.011)),
        Math.max(5, Math.round(dw * 0.015)),
        Math.max(7, Math.round(dw * 0.020)),
        Math.max(9, Math.round(dw * 0.026))
      ];
      for (const rOut of rCandidates) {
        const rMid = Math.max(2, Math.round(rOut * 0.62));
        const rIn = Math.max(1, Math.round(rOut * 0.31));
        for (let cy = Math.max(rOut + 2, qy0); cy < Math.min(dh - rOut - 2, qy1); cy += 2) {
          for (let cx = Math.max(rOut + 2, qx0); cx < Math.min(dw - rOut - 2, qx1); cx += 2) {
            const sc = scoreBullseye(cx, cy, rOut, rMid, rIn);
            if (sc > bestScore) {
              bestScore = sc;
              bestRaw = { cx, cy, rOut, rIn, score: sc };
            }
          }
        }
      }
      if (bestScore <= 0) {
        return { x: bestRaw.cx / scale, y: bestRaw.cy / scale, score: 0 };
      }
      // Sub-pixel core refinement within +-2 px around coarse peak
      let refX = bestRaw.cx, refY = bestRaw.cy, refSc = bestScore;
      const rMidRef = Math.max(2, Math.round(bestRaw.rOut * 0.62));
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const sc = scoreBullseye(bestRaw.cx + dx, bestRaw.cy + dy, bestRaw.rOut, rMidRef, bestRaw.rIn);
          if (sc > refSc) { refSc = sc; refX = bestRaw.cx + dx; refY = bestRaw.cy + dy; }
        }
      }
      let wSum = 0, xSum = 0, ySum = 0;
      const cRad = Math.max(2, bestRaw.rIn + 1);
      for (let yy = Math.max(0, refY - cRad); yy <= Math.min(dh - 1, refY + cRad); yy++) {
        for (let xx = Math.max(0, refX - cRad); xx <= Math.min(dw - 1, refX + cRad); xx++) {
          const dark = Math.max(0, 175 - gray[yy * dw + xx]);
          wSum += dark; xSum += xx * dark; ySum += yy * dark;
        }
      }
      const finX = wSum > 10 ? xSum / wSum : refX;
      const finY = wSum > 10 ? ySum / wSum : refY;
      return { x: finX / scale, y: finY / scale, r: bestRaw.rOut / scale, score: refSc };
    }

    // Check Mode A (Web A4 Bullseyes)
    const bTL = searchQuadrant(0, 0, Math.round(dw * 0.45), Math.round(dh * 0.46));
    const bTR = searchQuadrant(Math.round(dw * 0.55), 0, dw, Math.round(dh * 0.46));
    const minBotY = Math.round(Math.max(dh * 0.36, Math.max(bTL.y, bTR.y) * scale + dh * 0.16));
    const bBL = searchQuadrant(0, minBotY, Math.round(dw * 0.45), dh);
    const bBR = searchQuadrant(Math.round(dw * 0.55), minBotY, dw, dh);

    const minBullScore = Math.min(bTL.score, bTR.score, bBL.score, bBR.score);
    const bullSpanX = Math.hypot(bTR.x - bTL.x, bTR.y - bTL.y);
    const bullSpanY = Math.hypot(bBL.x - bTL.x, bBL.y - bTL.y);
    const bullRatio = bullSpanX / Math.max(10, bullSpanY);

    if (minBullScore >= 165 && bullRatio >= 1.0 && bullRatio <= 2.1) {
      const Hweb = solveHomographyPts(
        [
          { x: -FID_PAD_ANS_X, y: -FID_PAD_ANS_Y },
          { x: ANS_W + FID_PAD_ANS_X, y: -FID_PAD_ANS_Y },
          { x: -FID_PAD_ANS_X, y: ANS_H + FID_PAD_ANS_Y },
          { x: ANS_W + FID_PAD_ANS_X, y: ANS_H + FID_PAD_ANS_Y }
        ],
        [bTL, bTR, bBL, bBR]
      );
      if (Hweb) {
        return {
          mode: 'web-bullseye',
          tl: applyHomography(Hweb, 0, 0),
          tr: applyHomography(Hweb, ANS_W, 0),
          bl: applyHomography(Hweb, 0, ANS_H),
          br: applyHomography(Hweb, ANS_W, ANS_H)
        };
      }
    }

    // Mode B (Official ETS PDF Grid Frame — ignores Sections 10-13)
    const normGray = buildNormalizedGray(gray, dw, dh);
    const etsCorners = detectOfficialEtsGridCorners(normGray, dw, dh, scale);
    if (etsCorners) return etsCorners;

    // Fallback default rectangle in upper-middle region for easy manual drag adjustment
    return {
      mode: 'manual-fallback',
      tl: { x: w * 0.16, y: h * 0.13 },
      tr: { x: w * 0.84, y: h * 0.13 },
      bl: { x: w * 0.16, y: h * 0.47 },
      br: { x: w * 0.84, y: h * 0.47 }
    };
  }

  // --------------------------------------------------------------------------
  // PERSPECTIVE WARP + STRIPE-IMMUNE RELATIVE BUBBLE GRADING (ONLY Q1-200)
  // --------------------------------------------------------------------------
  const CANON_ROW_Y = (r) => ((PDF_ROW_Y0 + r * PDF_ROW_DY - PDF_BOX.y0) / PDF_BOX.h) * ANS_H;
  const CANON_BAND_Y = [
    69.2,
    0.5 * (CANON_ROW_Y(4) + CANON_ROW_Y(5)),
    0.5 * (CANON_ROW_Y(9) + CANON_ROW_Y(10)),
    0.5 * (CANON_ROW_Y(14) + CANON_ROW_Y(15)),
    0.5 * (CANON_ROW_Y(19) + CANON_ROW_Y(20)),
    ANS_H
  ];

  function makeCircleOffsets(rMin, rMax) {
    const pts = [];
    const rMin2 = rMin * rMin, rMax2 = rMax * rMax;
    const rad = Math.ceil(rMax);
    for (let dy = -rad; dy <= rad; dy++) {
      for (let dx = -rad; dx <= rad; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 >= rMin2 && d2 <= rMax2) pts.push({ dx, dy });
      }
    }
    return pts;
  }

  // True physical bubble radii in (ANS_W=1000, ANS_H=655):
  // Printed letter A/B/C/D: r = 0.0 .. 4.2 px
  // Pure white interior annulus: r = 4.6 .. 7.2 px
  // Full bubble interior disk: r = 0.0 .. 6.8 px
  // Printed black circle outline: r = 7.8 .. 9.6 px
  const OFF_LETTER = makeCircleOffsets(0.0, 4.2);
  const OFF_WHITE_ANN = makeCircleOffsets(4.6, 7.2);
  const OFF_FULL_DISK = makeCircleOffsets(0.0, 6.8);
  const OFF_BLACK_RING = makeCircleOffsets(7.8, 9.6);

  function medianOfSortedBuf(buf, len) {
    if (len <= 0) return 255;
    const sub = buf.subarray(0, len);
    sub.sort();
    const mid = len >> 1;
    return (len & 1) ? sub[mid] : 0.5 * (sub[mid - 1] + sub[mid]);
  }

  function fitSideVerticalBands(prof, pref, isListen, EH, PAD_Y) {
    const meanRange = (a, b) => {
      const i0 = Math.max(0, Math.min(EH - 1, a | 0));
      const i1 = Math.max(i0 + 1, Math.min(EH, b | 0));
      return (pref[i1] - pref[i0]) / (i1 - i0);
    };

    let bestSy = 1.0, bestOy = 0.0, bestSc = -1e9;
    for (let si = 0; si <= 80; si++) {
      const syTry = 0.80 + si * 0.005;
      for (let oi = 0; oi <= 104; oi++) {
        const oyTry = -52.0 + oi * 1.0;
        const yb0 = PAD_Y + oyTry + syTry * CANON_BAND_Y[0];
        const yb5 = PAD_Y + oyTry + syTry * CANON_BAND_Y[5];
        if (yb0 < 15 || yb5 > EH - 15) continue;
        const yTopEst = Math.round(PAD_Y + oyTry);
        if (yTopEst < 6) continue;
        const b0 = Math.round(yb0);
        const b1 = Math.round(PAD_Y + oyTry + syTry * CANON_BAND_Y[1]);
        const b2 = Math.round(PAD_Y + oyTry + syTry * CANON_BAND_Y[2]);
        const b3 = Math.round(PAD_Y + oyTry + syTry * CANON_BAND_Y[3]);
        const b4 = Math.round(PAD_Y + oyTry + syTry * CANON_BAND_Y[4]);
        const b5 = Math.round(yb5);

        const aboveTop = meanRange(yTopEst - 12, yTopEst - 2);
        const hdr = meanRange(yTopEst + 4, b0 - 3);
        const m0 = meanRange(b0 + 4, b1 - 4);
        const m1 = meanRange(b1 + 4, b2 - 4);
        const m2 = meanRange(b2 + 4, b3 - 4);
        const m3 = meanRange(b3 + 4, b4 - 4);
        const m4 = meanRange(b4 + 4, b5 - 4);
        const belowBot = meanRange(b5 + 3, Math.min(EH, b5 + 13));
        const contrast = isListen
          ? (m1 - m0) + (m1 - m2) + (m3 - m2) + (m3 - m4) + 0.9 * (belowBot - m4) + 0.7 * (aboveTop - hdr)
          : (m0 - hdr) + (m0 - m1) + (m2 - m1) + (m2 - m3) + (m4 - m3) + 0.7 * (aboveTop - hdr);
        const score = contrast - 6.0 * Math.abs(syTry - 1.0) - 0.04 * Math.abs(oyTry);
        if (score > bestSc) {
          bestSc = score;
          bestSy = syTry;
          bestOy = oyTry;
        }
      }
    }

    const refinedYb = [0, 0, 0, 0, 0, 0];
    for (let kb = 0; kb < 6; kb++) {
      if ((isListen && kb === 0) || (!isListen && kb === 5)) continue;
      const yEst = Math.round(PAD_Y + bestOy + bestSy * CANON_BAND_Y[kb]);
      let bestY = yEst, bestS = -1e9;
      for (let dy = -8; dy <= 8; dy++) {
        const y = yEst + dy;
        if (y < 6 || y >= EH - 6) continue;
        const above = meanRange(y - 8, y - 1);
        const below = meanRange(y + 2, y + 9);
        const lineV = prof[y];
        let sc = 0;
        if (isListen) {
          if (kb === 1 || kb === 3) sc = below - above;
          else if (kb === 2 || kb === 4) sc = above - below;
          else sc = (below - above) + (below - lineV) * 0.6;
        } else {
          if (kb === 0) sc = (below - above) + (below - lineV) * 0.5;
          else if (kb === 1 || kb === 3) sc = above - below;
          else sc = below - above;
        }
        sc -= 0.3 * Math.abs(dy);
        if (sc > bestS) {
          bestS = sc;
          bestY = y;
        }
      }
      refinedYb[kb] = bestY;
    }

    const syExact = isListen
      ? (refinedYb[5] - refinedYb[1]) / (CANON_BAND_Y[5] - CANON_BAND_Y[1])
      : (refinedYb[4] - refinedYb[0]) / (CANON_BAND_Y[4] - CANON_BAND_Y[0]);
    const yTopEst = isListen
      ? Math.round(refinedYb[1] - CANON_BAND_Y[1] * syExact)
      : Math.round(refinedYb[0] - CANON_BAND_Y[0] * syExact);

    let bestYtop = yTopEst, bestTopSc = -1e9;
    for (let dy = -8; dy <= 8; dy++) {
      const y = yTopEst + dy;
      if (y < 5 || y >= EH - 10) continue;
      const above = meanRange(y - 6, y - 1);
      const below = meanRange(y + 2, y + 8);
      const lineV = prof[y];
      const sc = (above - below) + (above - lineV) * 0.8 - 0.3 * Math.abs(dy);
      if (sc > bestTopSc) {
        bestTopSc = sc;
        bestYtop = y;
      }
    }

    if (isListen) {
      const predY0 = bestYtop + (CANON_BAND_Y[0] / CANON_BAND_Y[1]) * (refinedYb[1] - bestYtop);
      const y0Est = Math.round(predY0);
      let bestY0 = y0Est, bestS0 = -1e9;
      for (let dy = -3; dy <= 3; dy++) {
        const y = y0Est + dy;
        const above = meanRange(y - 6, y - 1);
        const below = meanRange(y + 2, y + 7);
        const sc = (0.5 * (above + below) - prof[y]) - 0.4 * Math.abs(dy);
        if (sc > bestS0) { bestS0 = sc; bestY0 = y; }
      }
      refinedYb[0] = bestY0;
    } else {
      const predY5 = refinedYb[4] + (CANON_BAND_Y[5] - CANON_BAND_Y[4]) * syExact;
      const y5Est = Math.round(predY5);
      let bestY5 = y5Est, bestS5 = -1e9;
      for (let dy = -4; dy <= 4; dy++) {
        const y = y5Est + dy;
        if (y < 6 || y >= EH - 6) continue;
        const above = meanRange(y - 4, y - 1);
        const below = meanRange(y + 2, y + 6);
        let sc = (0.5 * (above + below) - prof[y]) - 0.8 * Math.abs(dy);
        if (above < below - 22.0) sc -= 80.0;
        if (sc > bestS5) { bestS5 = sc; bestY5 = y; }
      }
      refinedYb[5] = bestY5;
    }

    return { yT: bestYtop, yb: refinedYb };
  }

  function singlePassSnap(srcPixels, sw, sh, initCorners, searchRadX, buildWarpedImage) {
    const LISTEN_X1 = ((307.56 - PDF_BOX.x0) / PDF_BOX.w) * ANS_W;
    const READ_X0 = ((315.12 - PDF_BOX.x0) / PDF_BOX.w) * ANS_W;
    const H0 = solveHomographyPts(
      [{ x: 0, y: 0 }, { x: ANS_W, y: 0 }, { x: 0, y: ANS_H }, { x: ANS_W, y: ANS_H }],
      [initCorners.tl, initCorners.tr, initCorners.bl, initCorners.br]
    );
    if (!H0) return null;

    const PAD_X = 72, PAD_Y = 72;
    const EW = ANS_W + 2 * PAD_X;
    const EH = ANS_H + 2 * PAD_Y;
    const expRgb = buildWarpedImage ? new Float32Array(EW * EH * 3) : null;
    const expLum = new Float32Array(EW * EH);

    for (let yy = 0; yy < EH; yy++) {
      const cy = yy - PAD_Y;
      const rowOff = yy * EW;
      for (let xx = 0; xx < EW; xx++) {
        const cx = xx - PAD_X;
        const den = H0[6] * cx + H0[7] * cy + 1.0;
        const sx = (H0[0] * cx + H0[1] * cy + H0[2]) / den;
        const sy = (H0[3] * cx + H0[4] * cy + H0[5]) / den;
        const x0 = Math.max(0, Math.min(sw - 2, Math.floor(sx)));
        const y0 = Math.max(0, Math.min(sh - 2, Math.floor(sy)));
        const fx = sx - x0;
        const fy = sy - y0;
        const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
        const i00 = (y0 * sw + x0) * 4;
        const i10 = i00 + 4;
        const i01 = i00 + sw * 4;
        const i11 = i01 + 4;
        const r = srcPixels[i00] * w00 + srcPixels[i10] * w10 + srcPixels[i01] * w01 + srcPixels[i11] * w11;
        const g = srcPixels[i00 + 1] * w00 + srcPixels[i10 + 1] * w10 + srcPixels[i01 + 1] * w01 + srcPixels[i11 + 1] * w11;
        const b = srcPixels[i00 + 2] * w00 + srcPixels[i10 + 2] * w10 + srcPixels[i01 + 2] * w01 + srcPixels[i11 + 2] * w11;
        const idx = rowOff + xx;
        if (expRgb) {
          const idx3 = idx * 3;
          expRgb[idx3] = r;
          expRgb[idx3 + 1] = g;
          expRgb[idx3 + 2] = b;
        }
        expLum[idx] = 0.299 * r + 0.587 * g + 0.114 * b;
      }
    }

    const L_prof = new Float32Array(EH);
    const R_prof = new Float32Array(EH);
    const S0_prof = new Float32Array(EH);
    const S1_prof = new Float32Array(EH);
    const S2_prof = new Float32Array(EH);
    const S3_prof = new Float32Array(EH);
    const prefL = new Float64Array(EH + 1);
    const prefR = new Float64Array(EH + 1);
    const prefS0 = new Float64Array(EH + 1);
    const prefS1 = new Float64Array(EH + 1);
    const prefS2 = new Float64Array(EH + 1);
    const prefS3 = new Float64Array(EH + 1);
    const tmpBuf = new Float32Array(400);

    for (let y = 0; y < EH; y++) {
      const rowOff = y * EW;
      let nL = 0;
      for (let x = PAD_X + 70; x < PAD_X + 440; x += 2) tmpBuf[nL++] = expLum[rowOff + x];
      const medL = medianOfSortedBuf(tmpBuf, nL);
      let nR = 0;
      for (let x = PAD_X + 560; x < PAD_X + 930; x += 2) tmpBuf[nR++] = expLum[rowOff + x];
      const medR = medianOfSortedBuf(tmpBuf, nR);

      let n0 = 0;
      for (let x = PAD_X + 45; x < PAD_X + 240; x += 2) tmpBuf[n0++] = expLum[rowOff + x];
      const med0 = 0.65 * medianOfSortedBuf(tmpBuf, n0) + 0.35 * medL;
      let n1 = 0;
      for (let x = PAD_X + 265; x < PAD_X + 460; x += 2) tmpBuf[n1++] = expLum[rowOff + x];
      const med1 = 0.65 * medianOfSortedBuf(tmpBuf, n1) + 0.35 * medL;
      let n2 = 0;
      for (let x = PAD_X + 540; x < PAD_X + 735; x += 2) tmpBuf[n2++] = expLum[rowOff + x];
      const med2 = 0.65 * medianOfSortedBuf(tmpBuf, n2) + 0.35 * medR;
      let n3 = 0;
      for (let x = PAD_X + 765; x < PAD_X + 960; x += 2) tmpBuf[n3++] = expLum[rowOff + x];
      const med3 = 0.65 * medianOfSortedBuf(tmpBuf, n3) + 0.35 * medR;

      L_prof[y] = medL; R_prof[y] = medR;
      S0_prof[y] = med0; S1_prof[y] = med1; S2_prof[y] = med2; S3_prof[y] = med3;
      prefL[y + 1] = prefL[y] + medL;
      prefR[y + 1] = prefR[y] + medR;
      prefS0[y + 1] = prefS0[y] + med0;
      prefS1[y + 1] = prefS1[y] + med1;
      prefS2[y + 1] = prefS2[y] + med2;
      prefS3[y + 1] = prefS3[y] + med3;
    }

    const fitL = fitSideVerticalBands(L_prof, prefL, true, EH, PAD_Y);
    const fitR = fitSideVerticalBands(R_prof, prefR, false, EH, PAD_Y);
    const fit0 = fitSideVerticalBands(S0_prof, prefS0, true, EH, PAD_Y);
    const fit1 = fitSideVerticalBands(S1_prof, prefS1, true, EH, PAD_Y);
    const fit2 = fitSideVerticalBands(S2_prof, prefS2, false, EH, PAD_Y);
    const fit3 = fitSideVerticalBands(S3_prof, prefS3, false, EH, PAD_Y);

    const yT_L = fitL.yT, yb_L = fitL.yb;
    const yT_R = fitR.yT, yb_R = fitR.yb;
    const clampDelta = (v, ref, lim) => ref + Math.max(-lim, Math.min(lim, v - ref));
    const stripLim = searchRadX >= 40 ? 14.0 : 3.5;
    const detYs0 = [clampDelta(fit0.yT, yT_L, stripLim), ...fit0.yb.map((y, k) => clampDelta(y, yb_L[k], stripLim))];
    const detYs1 = [clampDelta(fit1.yT, yT_L, stripLim), ...fit1.yb.map((y, k) => clampDelta(y, yb_L[k], stripLim))];
    const detYs2 = [clampDelta(fit2.yT, yT_R, stripLim), ...fit2.yb.map((y, k) => clampDelta(y, yb_R[k], stripLim))];
    const detYs3 = [clampDelta(fit3.yT, yT_R, stripLim), ...fit3.yb.map((y, k) => clampDelta(y, yb_R[k], stripLim))];

    const yTi_L = Math.max(0, Math.round(yT_L));
    const ybi_L = yb_L.map((y) => Math.round(y));
    const yTi_R = Math.max(0, Math.round(yT_R));
    const ybi_R = yb_R.map((y) => Math.round(y));

    const clampRows = (a, b) => {
      const ra = Math.max(2, Math.min(EH - 4, Math.round(a) + 5));
      const rb = Math.max(ra + 4, Math.min(EH - 2, Math.round(b) - 4));
      const out = [];
      for (let r = ra; r < rb; r++) out.push(r);
      return out;
    };

    const hist = new Uint32Array(256);
    let hTotal = 0;
    for (let i = 0; i < expLum.length; i += 4) {
      const v = Math.max(0, Math.min(255, expLum[i] | 0));
      hist[v]++;
      hTotal++;
    }
    let pWhite = 220, hCum = 0;
    const target88 = Math.floor(hTotal * 0.88);
    for (let b = 0; b < 256; b++) {
      hCum += hist[b];
      if (hCum >= target88) { pWhite = b; break; }
    }
    const outFloor = 0.78 * pWhite;
    const inCeil = 0.90 * pWhite;

    const colMedianProf = (rows) => {
      const prof = new Float32Array(EW);
      const rBuf = new Float32Array(rows.length);
      for (let x = 0; x < EW; x++) {
        for (let i = 0; i < rows.length; i++) rBuf[i] = expLum[rows[i] * EW + x];
        prof[x] = medianOfSortedBuf(rBuf, rows.length);
      }
      return prof;
    };

    const detectEdgeInBand = (xCanon, dirOut, rows, rad) => {
      const prof = colMedianProf(rows);
      const xC = Math.round(PAD_X + xCanon);
      let bestX = xC, bestS = -1e9;
      for (let dx = -rad; dx <= rad; dx++) {
        const x = xC + dx;
        if (x < 24 || x >= EW - 24) continue;
        let outW = 0, outMin = 255, inG = 0, inFar = 0, outExt = 0;
        if (dirOut < 0) {
          for (let k = x - 14; k < x - 2; k++) outW += prof[k];
          outW /= 12;
          for (let k = x - 11; k < x - 3; k++) if (prof[k] < outMin) outMin = prof[k];
          for (let k = x + 2; k < x + 11; k++) inG += prof[k];
          inG /= 9;
          for (let k = x + 11; k < x + 22; k++) inFar += prof[k];
          inFar /= 11;
          outExt = 255;
        } else {
          for (let k = x + 3; k < x + 15; k++) outW += prof[k];
          outW /= 12;
          for (let k = x + 3; k < x + 12; k++) if (prof[k] < outMin) outMin = prof[k];
          for (let k = x - 11; k < x - 2; k++) inG += prof[k];
          inG /= 9;
          for (let k = x - 22; k < x - 11; k++) inFar += prof[k];
          inFar /= 11;
          for (let k = x + 14; k < x + 24; k++) outExt += prof[k];
          outExt /= 10;
        }
        const lineV = Math.min(prof[x - 1], prof[x], prof[x + 1]);
        let sc = (outW - inG) * 1.65 + (outW - lineV) * 1.05 - 0.14 * Math.abs(dx);
        if (dirOut > 0 && outExt < outFloor) sc -= 150.0;
        if (inFar > inCeil + 8.0) sc -= 60.0;
        if (outMin < outFloor) sc -= 140.0;
        if (inG > inCeil) sc -= 110.0;
        if (sc > bestS) {
          bestS = sc;
          bestX = x;
        }
      }
      let ym = 0;
      for (let i = 0; i < rows.length; i++) ym += rows[i];
      ym /= Math.max(1, rows.length);
      return { x: bestX, score: bestS, ym };
    };

    const fitLinePts = (valsXY, fallbackX) => {
      if (!valsXY.length) return () => fallbackX;
      if (valsXY.length < 2) {
        const v0 = valsXY[0].x;
        return () => v0;
      }
      const slopes = [];
      for (let i = 0; i < valsXY.length; i++) {
        for (let j = i + 1; j < valsXY.length; j++) {
          const dy = valsXY[j].y - valsXY[i].y;
          if (Math.abs(dy) >= 80) slopes.push((valsXY[j].x - valsXY[i].x) / dy);
        }
      }
      const rawSlope = slopes.length ? medianNumLocal(slopes) : 0;
      const slope = Math.max(-0.15, Math.min(0.15, rawSlope));
      const inter = medianNumLocal(valsXY.map((p) => p.x - slope * p.y));
      return (yTarget) => inter + slope * yTarget;
    };

    function medianNumLocal(arr) {
      if (!arr.length) return 0;
      const s = arr.slice().sort((a, b) => a - b);
      const m = s.length >> 1;
      return (s.length & 1) ? s[m] : 0.5 * (s[m - 1] + s[m]);
    }

    const fitRobustEdgeLine = (xCanon, dirOut, bandSpecs, rad) => {
      const pts = [];
      for (let i = 0; i < bandSpecs.length; i++) {
        const rows = bandSpecs[i];
        if (rows.length < 6) continue;
        const det = detectEdgeInBand(xCanon, dirOut, rows, rad);
        if (det.score > 20.0) pts.push({ y: det.ym, x: det.x });
      }
      if (pts.length < 2) {
        const fbRows = [];
        for (let i = 0; i < bandSpecs.length; i++) {
          for (let j = 0; j < bandSpecs[i].length; j++) fbRows.push(bandSpecs[i][j]);
        }
        const det = detectEdgeInBand(xCanon, dirOut, fbRows.length ? fbRows : [EH >> 1], rad);
        return () => det.x;
      }
      return fitLinePts(pts, PAD_X + xCanon);
    };

    const L_bands = [
      clampRows(detYs0[0] + 6, detYs0[1] - 2),
      clampRows(detYs0[1], detYs0[2]),
      clampRows(detYs0[3], detYs0[4]),
      clampRows(detYs0[5], Math.min(EH - 2, detYs0[6])),
    ];
    const R_bands = [
      clampRows(detYs3[0] + 6, detYs3[1] - 2),
      clampRows(detYs3[2], detYs3[3]),
      clampRows(detYs3[4], detYs3[5]),
    ];

    let interpXL = fitRobustEdgeLine(0, -1, L_bands, searchRadX);
    let interpXR = fitRobustEdgeLine(ANS_W, 1, R_bands, searchRadX);

    const detectGutterInBand = (rows, estMid, rad, isHdr) => {
      const prof = colMedianProf(rows);
      const xMid = Math.round(PAD_X + estMid);
      let bestXg = xMid, bestSc = -1e9, bestValid = false;
      for (let xg = Math.max(28, xMid - rad); xg <= Math.min(EW - 28, xMid + rad); xg++) {
        let inside = 0, insideMin = 255;
        for (let k = xg - 5; k <= xg + 5; k++) inside += prof[k];
        inside /= 11;
        for (let k = xg - 4; k <= xg + 4; k++) if (prof[k] < insideMin) insideMin = prof[k];
        let leftEdge = 255, rightEdge = 255;
        for (let k = xg - 12; k < xg - 5; k++) if (prof[k] < leftEdge) leftEdge = prof[k];
        for (let k = xg + 5; k < xg + 13; k++) if (prof[k] < rightEdge) rightEdge = prof[k];
        let sc = inside - 0.5 * (leftEdge + rightEdge) - 0.14 * Math.abs(xg - xMid);
        let okBand = (inside >= outFloor - 12.0) && (insideMin >= outFloor - 28.0);
        if (isHdr) {
          let inLHdr = 0, inRHdr = 0;
          for (let k = xg - 26; k < xg - 12; k++) inLHdr += prof[k];
          for (let k = xg + 12; k < xg + 26; k++) inRHdr += prof[k];
          inLHdr /= 14; inRHdr /= 14;
          if (inLHdr > inCeil || inRHdr > inCeil) {
            okBand = false;
            sc -= 180.0;
          }
        }
        if (!okBand) sc -= 140.0;
        if (sc > bestSc) {
          bestSc = sc;
          bestXg = xg;
          bestValid = okBand;
        }
      }
      let xlr = bestXg - 9, minL = 255;
      for (let k = bestXg - 12; k < bestXg - 4; k++) {
        if (prof[k] < minL) { minL = prof[k]; xlr = k; }
      }
      let xrl = bestXg + 9, minR = 255;
      for (let k = bestXg + 5; k < bestXg + 13; k++) {
        if (prof[k] < minR) { minR = prof[k]; xrl = k; }
      }
      let ym = 0;
      for (let i = 0; i < rows.length; i++) ym += rows[i];
      ym /= Math.max(1, rows.length);
      return { ym, xlr, xrl, score: bestSc, xgCanon: bestXg - PAD_X, okBand: bestValid };
    };

    const gutterBands = [
      { isHdr: true, rows: clampRows(Math.max(detYs0[0], detYs3[0]) + 4, Math.min(detYs0[1], detYs3[1]) - 2) },
      { isHdr: false, rows: clampRows(Math.max(detYs0[1], detYs3[1]), Math.min(detYs0[2], detYs3[2])) },
      { isHdr: false, rows: clampRows(Math.max(detYs0[3], detYs3[3]), Math.min(detYs0[4], detYs3[4])) },
      { isHdr: false, rows: clampRows(Math.max(detYs0[5], detYs3[5]), Math.min(EH - 2, Math.min(detYs0[6], detYs3[6]))) },
    ];
    const gPtsL = [], gPtsR = [];
    const radHdr = searchRadX >= 40 ? 28 : 14;
    const radBody = searchRadX >= 40 ? 24 : 12;
    for (let i = 0; i < gutterBands.length; i++) {
      const { isHdr, rows } = gutterBands[i];
      if (rows.length < 6) continue;
      let ym = 0;
      for (let r = 0; r < rows.length; r++) ym += rows[r];
      ym /= rows.length;
      const estM = (interpXL(ym) - PAD_X) + 0.5 * (interpXR(ym) - interpXL(ym));
      const gd = detectGutterInBand(rows, estM, isHdr ? radHdr : radBody, isHdr);
      if (gd.okBand && gd.score > 12.0) {
        gPtsL.push({ y: gd.ym, x: gd.xlr });
        gPtsR.push({ y: gd.ym, x: gd.xrl });
      }
    }

    const interpXLR = fitLinePts(gPtsL, PAD_X + LISTEN_X1);
    const interpXRL = fitLinePts(gPtsR, PAD_X + READ_X0);

    const yTChk = detYs3[0] + 40;
    const yBChk = detYs3[5] - 30;
    const wLt = interpXLR(yTChk) - interpXL(yTChk), wLb = interpXLR(yBChk) - interpXL(yBChk);
    const wRt = interpXR(yTChk) - interpXRL(yTChk), wRb = interpXR(yBChk) - interpXRL(yBChk);
    if (!(0.86 * wLt <= wRt && wRt <= 1.14 * wLt) || !(0.86 * wLb <= wRb && wRb <= 1.14 * wLb)) {

        const vLumWann = getSortedOffsetsArr(wLum, cx, cy, OFF_WHITE_ANN);
        const vLumLet = getSortedOffsetsArr(wLum, cx, cy, OFF_LETTER);

        const meanOf = (a) => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 255;
        wannM.push(meanOf(vWann));
        diskM.push(meanOf(vDisk));
        letM.push(meanOf(vLet));

        const nD = vDisk.length;
        const i0 = Math.floor(nD * 0.50);
        const i1 = Math.max(i0 + 1, Math.floor(nD * 0.90));
        let pwSum = 0;
        for (let i = i0; i < i1; i++) pwSum += vDisk[i];
        pwM.push(pwSum / (i1 - i0));

        const p85W = vLumWann[Math.min(vLumWann.length - 1, Math.floor(vLumWann.length * 0.85))] || 255;
        const p15L = vLumLet[Math.min(vLumLet.length - 1, Math.floor(vLumLet.length * 0.15))] || 0;
        oblitM.push(Math.max(0, p85W - p15L));

        const mLD = meanOf(vLumDisk);
        let varLD = 0;
        for (let i = 0; i < vLumDisk.length; i++) varLD += (vLumDisk[i] - mLD) * (vLumDisk[i] - mLD);
        stdM.push(vLumDisk.length ? Math.sqrt(varLD / vLumDisk.length) : 0);

        const ix = Math.round(cx), iy = Math.round(cy);
        let rcSum = 0, bcSum = 0, cnt = 0;
        for (let i = 0; i < OFF_LETTER.length; i++) {
          const xx = ix + OFF_LETTER[i].dx;
          const yy = iy + OFF_LETTER[i].dy;
          if (xx >= 0 && xx < SHEET_W && yy >= 0 && yy < SHEET_H) {
            const di = (yy * SHEET_W + xx) * 4;
            const rv = wData[di], gv = wData[di + 1], bv = wData[di + 2];
            rcSum += Math.max(0, rv - gv);
            bcSum += Math.max(0, bv - gv);
            cnt++;
          }
        }
        redM.push(cnt ? (rcSum / cnt) / 255 : 0);
        blueM.push(cnt ? (bcSum / cnt) / 255 : 0);
      }

      const fWann = relDrop(wannM);
      const fDisk = relDrop(diskM);
      const fLet = relDrop(letM);
      const fPw = relDrop(pwM);
      const fOblit = relDrop(oblitM);
      const fStd = relDrop(stdM);

      const comb = [0, 1, 2, 3].map((k) => (
        0.28 * fWann[k] +
        0.24 * fPw[k] +
        0.18 * fDisk[k] +
        0.08 * fLet[k] +
        0.14 * fOblit[k] +
        0.08 * fStd[k]
      ));
      const cMean = (comb[0] + comb[1] + comb[2] + comb[3]) * 0.25;
      const cVar = ((comb[0] - cMean) ** 2 + (comb[1] - cMean) ** 2 + (comb[2] - cMean) ** 2 + (comb[3] - cMean) ** 2) * 0.25;
      const cStd = Math.max(0.04, Math.sqrt(cVar));

      const allScores = [0, 1, 2, 3].map((k) => {
        const candLimit = isPart2 ? 3 : 4;
        let otherBest = 0;
        for (let j = 0; j < candLimit; j++) {
          if (j !== k && comb[j] > otherBest) otherBest = comb[j];
        }
        const mlpProb = evalOmrMlp([
          fWann[k],
          fPw[k],
          fDisk[k],
          fLet[k],
          fOblit[k],
          fStd[k],
          redM[k],
          blueM[k],
          comb[k],
          comb[k] - otherBest,
          ((comb[k] - cMean) / cStd) * 0.25,
          (isPart2 && k === 3) ? 1.0 : 0.0
        ]);
        return {
          letter: letters[k],
          fill: comb[k],
          prob: mlpProb
        };
      });

      const candScores = (isPart2 ? allScores.slice(0, 3) : allScores).slice().sort((a, b) => (b.prob * 0.65 + b.fill * 0.35) - (a.prob * 0.65 + a.fill * 0.35));
      rawScores[q] = candScores;
    }

    // OMRChecker First-Large-Gap Sheet-Global Adaptive Threshold across all 800 bubbles
    const allCombs = [];
    for (let q = 1; q <= 200; q++) {
      const cs = rawScores[q];
      for (let i = 0; i < cs.length; i++) allCombs.push(cs[i].fill);
    }
    allCombs.sort((a, b) => a - b);
    const nC = allCombs.length;
    const p55 = allCombs[Math.floor(nC * 0.55)] || 0;
    let bestJump = 0.04;
    let sheetThr = Math.max(0.14, p55 + 0.10);
    const lsGap = 6;
    for (let i = Math.floor(nC * 0.55); i < Math.floor(nC * 0.88); i++) {
      const jump = allCombs[Math.min(nC - 1, i + lsGap)] - allCombs[Math.max(0, i - lsGap)];
      if (jump > bestJump) {
        bestJump = jump;
        sheetThr = allCombs[Math.max(0, i - lsGap)] + jump * 0.45;
      }
    }
    sheetThr = Math.max(0.11, Math.min(0.32, sheetThr));

    for (let q = 1; q <= 200; q++) {
      const isPart2 = q >= 7 && q <= 31;
      const candScores = rawScores[q];
      const best = candScores[0];
      const second = candScores[1];
      const secondFill = second ? second.fill : 0;
      const secondProb = second ? second.prob : 0;

      if (best.prob >= 0.45 || best.fill >= sheetThr * 0.82 || best.fill >= 0.16 || (best.fill >= 0.12 && (best.fill - secondFill) >= 0.08)) {
        answers[q] = best.letter;
        const isDoubleMark = second && ((secondProb >= 0.60 && (best.prob - secondProb) < 0.22) || (secondFill >= 0.32 && (best.fill - secondFill) < 0.09));
        const isFaintMark = best.prob < 0.42 && best.fill < 0.16;
        if (isDoubleMark || isFaintMark) {
          uncertain[q] = true;
        }
      } else {
        answers[q] = '';
      }
    }

    return { warpedCanvas, answers, uncertain, rawScores, subblockShifts, snappedCorners };
  }

  function buildPaperBookletHtml(testCode) {
    const code = testCode || paperState.testCode || 'T01';
    const itemsArr = ETS.getTestData ? ETS.getTestData(code) : [];
    const groups = [];
    let i = 0;
    while (i < itemsArr.length) {
      const cur = itemsArr[i];
      const grp = [cur];
      if (cur.group_id) {
        let j = i + 1;
        while (j < itemsArr.length && itemsArr[j].group_id === cur.group_id) {
          grp.push(itemsArr[j]);
          j++;
        }
        i = j;
      } else {
        i++;
      }
      groups.push(grp);
    }

    const partNames = {
      1: 'PART 1 — PHOTOGRAPHS (Q1–Q6)',
      2: 'PART 2 — QUESTION-RESPONSE (Q7–Q31)',
      3: 'PART 3 — CONVERSATIONS (Q32–Q70)',
      4: 'PART 4 — TALKS (Q71–Q100)',
      5: 'PART 5 — INCOMPLETE SENTENCES (Q101–Q130)',
      6: 'PART 6 — TEXT COMPLETION (Q131–Q146)',
      7: 'PART 7 — READING COMPREHENSION (Q147–Q200)'
    };

    const parts = [];
    parts.push(`
      <div style="border-bottom:2px solid #0f172a;padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div>

        </div>
        <div style="font-size:9.5pt;font-weight:700;border:1px solid #0f172a;padding:3px 10px;border-radius:4px;">TEST ${ETS.esc(code)}</div>
      </div>
    `);

    let lastPart = 0;
    groups.forEach((grp) => {
      const first = grp[0];
      if (!first) return;
      const pNum = first.part || 1;
      if (pNum !== lastPart) {
        lastPart = pNum;
        parts.push(`<div style="font-size:11.5pt;font-weight:800;background:#f1f5f9;border-left:4px solid #0f172a;padding:6px 10px;margin:14px 0 8px;break-after:avoid;">${ETS.esc(partNames[pNum] || ('PART ' + pNum))}</div>`);
      }

      if (pNum === 1) {
        parts.push(`<div class="ets-print-qblock">`);
        parts.push(`<div style="font-weight:700;margin-bottom:6px;">Question ${first.q}</div>`);
        if (first.photo) {
          const printPhotoSrc = String(first.photo).includes('?') ? first.photo : `${first.photo}?v=2`;
          parts.push(`<div style="margin-bottom:6px;"><img src="${ETS.esc(printPhotoSrc)}" alt="Part 1 Q${first.q}" style="max-width:340px;max-height:240px;object-fit:contain;border:1px solid #cbd5e1;border-radius:4px;"></div>`);
        }
        parts.push(`<div style="font-size:9.5pt;color:#334155;">Mark your answer on your answer sheet: &nbsp; (A) &nbsp;&nbsp; (B) &nbsp;&nbsp; (C) &nbsp;&nbsp; (D)</div>`);
        parts.push(`</div>`);
        return;
      }

      if (pNum === 2) {
        parts.push(`<div class="ets-print-qblock" style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;margin-bottom:4px;">`);
        parts.push(`<span><b>${first.q}.</b> Listen to the audio and choose your response.</span>`);
        parts.push(`<span style="color:#334155;font-size:9.5pt;">(A) &nbsp; (B) &nbsp; (C)</span>`);
        parts.push(`</div>`);
        return;
      }

      if ((pNum === 3 || pNum === 4) && first.graphicDoc && ETS.renderGraphicDoc) {
        parts.push(`<div class="ets-print-passage">${ETS.renderGraphicDoc(first.graphicDoc)}</div>`);
      } else if (pNum === 6 && ETS.renderPart6Document) {
        parts.push(`<div class="ets-print-passage">${ETS.renderPart6Document(first, grp, 'exam', code, 0, false, {})}</div>`);
      } else if (pNum === 7 && ETS.linesToDocBlocks && ETS.renderExamDocument) {
        const blocks = ETS.linesToDocBlocks(first, grp);
        parts.push(blocks.map((b) => `<div class="ets-print-passage">${ETS.renderExamDocument(b, false)}</div>`).join(''));
      }

      grp.forEach((item) => {
        const optKeys = ['A', 'B', 'C', 'D'];
        parts.push(`<div class="ets-print-qblock">`);
        parts.push(`<div style="font-weight:700;margin-bottom:4px;">${item.q}. ${ETS.esc(item.stem_en || '')}</div>`);
        parts.push(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;padding-left:14px;">`);

          parts.push(`<div><b>(${k})</b> ${ETS.esc(txt)}</div>`);
        });
        parts.push(`</div></div>`);
      });
    });

    return parts.join('');
  }
