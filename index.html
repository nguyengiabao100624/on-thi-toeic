                  ? `<span class="badge ${omrState.corners.mode === 'manual-fallback' ? 'badge-warn' : 'badge-success'}">${omrState.corners.mode === 'web-bullseye' ? 'Khớp Phiếu Web' : (omrState.corners.mode === 'ets-grid' ? 'Khớp Mẫu ETS PDF' : 'Kéo chỉnh 4 góc')}</span>`
                  : ''}
              </div>
              <div style="display:flex;gap:6px;">
                <button class="btn btn-xs ${omrState.showWarped ? 'btn-primary' : ''}" onclick="ETS.toggleOmrWarpedPreview()" ${omrState.warpedCanvas ? '' : 'disabled'}>
                  ${ETS.icon('eye')} ${omrState.showWarped ? 'Xem Ảnh Gốc' : 'Xem Bản Nắn Phẳng'}
                </button>
                <button class="btn btn-xs btn-primary" onclick="ETS.regradeFromCorners()" ${omrState.srcCanvas ? '' : 'disabled'}>
                  ${ETS.icon('refresh')} Chấm Lại Từ 4 Góc
                </button>
              </div>
            </div>
            <div class="omr-canvas-stage" id="omrStage">
              ${omrState.srcCanvas
                ? `<canvas id="omrPreviewCanvas"></canvas>`
                : `<div style="text-align:center;color:#94a3b8;padding:40px 20px;">
                    <div style="margin-bottom:10px;">${ETS.icon('scan')}</div>
                    <div style="font-weight:700;color:#e2e8f0;margin-bottom:6px;">Chưa có ảnh phiếu tô</div>
                    <div style="font-size:12.5px;">Bấm <strong>Tải Ảnh Phiếu Tô</strong> hoặc <strong>Mở Camera</strong> để bắt đầu chấm điểm tự động.</div>
                  </div>`}
            </div>
          </div>

          <div class="card" style="padding:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
              <div>
                <strong style="font-size:14px;">Kết Quả Đọc Nhanh</strong>
                <div style="font-size:12px;color:var(--ink-muted);">Đã nhận diện: <strong>${filledCount}/200</strong> · Nghi vấn tô mờ: <strong style="color:var(--warn);">${uncCount}</strong></div>
              </div>
              <button class="btn btn-primary btn-sm" onclick="ETS.saveOmrResultAndOpenCert()">
                ${ETS.icon('award')} Chốt & Xem Bảng Điểm
              </button>
            </div>

            <div class="formula-filter-group" style="margin-bottom:10px;">
              <button class="formula-pill-btn ${omrState.filterMode === 'all' ? 'active' : ''}" onclick="ETS.setOmrFilter('all')">Tất cả (200)</button>
              <button class="formula-pill-btn ${omrState.filterMode === 'uncertain' ? 'active' : ''}" onclick="ETS.setOmrFilter('uncertain')">Nghi vấn (${uncCount})</button>
              <button class="formula-pill-btn ${omrState.filterMode === 'blank' ? 'active' : ''}" onclick="ETS.setOmrFilter('blank')">Chưa tô (${200 - filledCount})</button>
            </div>

            <div class="omr-review-grid">
              ${qsList.map((q) => {
                const picked = omrState.answers[q] || '';
                const isUnc = !!omrState.uncertain[q];
                const opts = (q >= 7 && q <= 31) ? ['A', 'B', 'C'] : ['A', 'B', 'C', 'D'];
                return `<div class="omr-q-row ${isUnc ? 'uncertain' : ''}">
                  <span>${q}</span>
                  <div class="omr-q-bubbles">
                    ${opts.map((lt) => `<button class="omr-q-pip ${picked === lt ? 'active' : ''}" onclick="ETS.toggleOmrAnswer(${q}, '${lt}')">${lt}</button>`).join('')}
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>`;

    const root = document.getElementById('appContent');
    if (root) root.innerHTML = html;
    if (omrState.stream) {
      const vid = document.getElementById('omrVideoEl');
      if (vid) vid.srcObject = omrState.stream;
    }
    if (omrState.srcCanvas) bindAndDrawPreviewCanvas();
    if (preserveScroll) {
      const grid = document.querySelector('.omr-review-grid');
      if (grid) grid.scrollTop = preserveScroll.gridTop || 0;
      window.scrollTo(0, preserveScroll.winY || 0);
    }
  }

  function bindAndDrawPreviewCanvas() {
    const canvas = document.getElementById('omrPreviewCanvas');
    if (!canvas) return;
    const src = (omrState.showWarped && omrState.warpedCanvas) ? omrState.warpedCanvas : omrState.srcCanvas;
    canvas.width = src.width;
    canvas.height = src.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(src, 0, 0);

    if (!omrState.showWarped && omrState.corners) {
      const c = omrState.corners;
      const pts = [c.tl, c.tr, c.br, c.bl];
      ctx.save();
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = Math.max(2, canvas.width / 340);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      pts.slice(1).forEach((p) => ctx.lineTo(p.x, p.y));
      ctx.closePath();
      ctx.stroke();

      // Guide lines for Listening/Reading inner borders & 5-row band boundaries
      const Hprev = computeHomographyDstToSrc(c);
      if (Hprev) {
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = 'rgba(14, 165, 233, 0.72)';
        ctx.lineWidth = Math.max(1.4, canvas.width / 520);
        ctx.beginPath();
        if (c.listenCorners && c.readCorners) {
          ctx.moveTo(c.listenCorners.tr.x, c.listenCorners.tr.y);
          ctx.lineTo(c.listenCorners.br.x, c.listenCorners.br.y);
          ctx.moveTo(c.readCorners.tl.x, c.readCorners.tl.y);
          ctx.lineTo(c.readCorners.bl.x, c.readCorners.bl.y);
        } else {
          const midTop = applyHomography(Hprev, ANS_W * 0.5, 0);
          const midBot = applyHomography(Hprev, ANS_W * 0.5, ANS_H);
          ctx.moveTo(midTop.x, midTop.y);
          ctx.lineTo(midBot.x, midBot.y);
        }
        for (let kb = 0; kb < 5; kb++) {
          const bL = applyHomography(Hprev, 0, CANON_BAND_Y[kb]);
          const bR = applyHomography(Hprev, ANS_W, CANON_BAND_Y[kb]);
          ctx.moveTo(bL.x, bL.y);
          ctx.lineTo(bR.x, bR.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      // Translucent target-ring handles with crosshairs + outer pill labels so corners are never obscured
      const labels = ['TL', 'TR', 'BR', 'BL'];
      const labelDirs = [
        { dx: -1.35, dy: -1.35 },
        { dx: 1.35, dy: -1.35 },
        { dx: 1.35, dy: 1.35 },
        { dx: -1.35, dy: 1.35 }
      ];
      const rHandle = Math.max(11, canvas.width / 62);
      pts.forEach((p, idx) => {
        ctx.fillStyle = 'rgba(2, 132, 199, 0.22)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, rHandle, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = Math.max(2, canvas.width / 380);
        ctx.stroke();

        // Inner precision crosshair right at the exact corner vertex
        const ch = rHandle * 0.55;
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(2.2, canvas.width / 340);
        ctx.moveTo(p.x - ch, p.y); ctx.lineTo(p.x + ch, p.y);
        ctx.moveTo(p.x, p.y - ch); ctx.lineTo(p.x, p.y + ch);
        ctx.stroke();
        ctx.beginPath();
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = Math.max(1.2, canvas.width / 550);
        ctx.moveTo(p.x - ch, p.y); ctx.lineTo(p.x + ch, p.y);
        ctx.moveTo(p.x, p.y - ch); ctx.lineTo(p.x, p.y + ch);
        ctx.stroke();

        // Outer label badge
        const lx = p.x + labelDirs[idx].dx * rHandle;
        const ly = p.y + labelDirs[idx].dy * rHandle;
        const bw = rHandle * 1.65, bh = rHandle * 1.15;
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.roundRect(lx - bw / 2, ly - bh / 2, bw, bh, 4);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.round(rHandle * 0.72)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(labels[idx], lx, ly);
      });
      ctx.restore();

      const cornerKeys = ['tl', 'tr', 'bl', 'br'];
      const toCanvasXY = (ev) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };
      canvas.onpointerdown = (ev) => {
        const pos = toCanvasXY(ev);
        const tol = rHandle * 2.4;
        let hit = null, bestD = 1e9;
        cornerKeys.forEach((k) => {
          const p = omrState.corners[k];
          const d = Math.hypot(p.x - pos.x, p.y - pos.y);
          if (d < tol && d < bestD) { bestD = d; hit = k; }
        });
        if (hit) {
          omrState.draggingCorner = hit;
          canvas.setPointerCapture(ev.pointerId);
        }
      };
      canvas.onpointermove = (ev) => {
        if (!omrState.draggingCorner) return;
        const pos = toCanvasXY(ev);
        omrState.corners[omrState.draggingCorner] = {
          x: Math.max(0, Math.min(canvas.width, pos.x)),
          y: Math.max(0, Math.min(canvas.height, pos.y))
        };
        delete omrState.corners.listenCorners;
        delete omrState.corners.readCorners;
        bindAndDrawPreviewCanvas();
      };
      canvas.onpointerup = () => { omrState.draggingCorner = null; };
    } else if (omrState.showWarped && omrState.warpedCanvas) {
      // Overlay all 800 bubble grid rings + highlighted answer rings on warped sheet
      ctx.save();
      for (let q = 1; q <= 200; q++) {
        const picked = omrState.answers[q];
        const pickedIdx = picked ? ['A', 'B', 'C', 'D'].indexOf(picked) : -1;
        const colIdx = Math.floor((q - 1) / 25);
        const bandIdx = Math.floor(((q - 1) % 25) / 5);
        const shf = (omrState.subblockShifts && omrState.subblockShifts[colIdx] && omrState.subblockShifts[colIdx][bandIdx]) || { dx: 0, dy: 0 };
        for (let k = 0; k < 4; k++) {
          const p = getBubbleCenter(q, k);
          const isPicked = (k === pickedIdx);
          ctx.strokeStyle = isPicked
            ? (omrState.uncertain[q] ? '#f59e0b' : '#10b981')
            : 'rgba(56, 189, 248, 0.65)';
          ctx.lineWidth = isPicked ? 2.4 : 1.1;
          ctx.beginPath();
          ctx.arc(p.x + shf.dx, p.y + shf.dy, isPicked ? 7.2 : 6.2, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  function processOmrImageElement(imgEl, customCorners) {
    const maxDim = 1500;
    const sw = imgEl.videoWidth || imgEl.naturalWidth || imgEl.width;
    const sh = imgEl.videoHeight || imgEl.naturalHeight || imgEl.height;
    const scale = Math.min(1, maxDim / Math.max(sw, sh));
    const cw = Math.round(sw * scale);
    const ch = Math.round(sh * scale);

    const c = document.createElement('canvas');
    c.width = cw;
    c.height = ch;
    c.getContext('2d').drawImage(imgEl, 0, 0, cw, ch);
    omrState.srcCanvas = c;

    if (customCorners) {
      omrState.corners = {
        tl: { x: customCorners.tl.x * scale, y: customCorners.tl.y * scale },
        tr: { x: customCorners.tr.x * scale, y: customCorners.tr.y * scale },
        bl: { x: customCorners.bl.x * scale, y: customCorners.bl.y * scale },
        br: { x: customCorners.br.x * scale, y: customCorners.br.y * scale }
      };
    } else {
      omrState.corners = autoDetectFiducials(c);
    }
    return regradeFromCorners(true);
  }

  function regradeFromCorners(skipRender) {
    if (!omrState.srcCanvas || !omrState.corners) return null;
    const res = warpAndGradeSource(omrState.srcCanvas, omrState.corners);
    if (!res) {
      ETS.toast('Không thể giải ma trận biến đổi 4 góc — hãy kéo 4 góc rõ hơn.');
      return null;
    }
    if (res.snappedCorners) {
      omrState.corners = res.snappedCorners;
    }
    omrState.warpedCanvas = res.warpedCanvas;
    omrState.answers = res.answers;
    omrState.uncertain = res.uncertain;
    omrState.subblockShifts = res.subblockShifts;
    omrState.gradedOnce = true;
    res.detectedMode = (omrState.corners && omrState.corners.mode) || 'custom';
    res.corners = omrState.corners;
    if (!skipRender && ETS.state.route === 'omr-scan') renderOmrScannerView();
    return res;
  }

  function handleOmrFileUpload(ev) {
    const file = ev.target && ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        omrState.showWarped = false;
        const res = processOmrImageElement(img, null);
        renderOmrScannerView();
        if (res && res.detectedMode === 'manual-fallback') {
          ETS.toast('Chưa tự khóa được khung — hãy kéo 4 chấm TL/TR/BL/BR vào 4 góc khối LISTENING + READING rồi bấm Chấm Lại Từ 4 Góc.');
        } else {
          ETS.toast('Đã nhận diện phiếu tô (chỉ chấm 200 ô Listening & Reading)! Kiểm tra nhanh các câu đánh dấu vàng rồi bấm Chốt & Xem Bảng Điểm.');
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function toggleOmrCamera() {
    if (omrState.stream) {
      stopCameraStream();
      renderOmrScannerView();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      ETS.toast('Trình duyệt không hỗ trợ Camera trực tiếp — vui lòng dùng Tải Ảnh Phiếu Tô.');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } } })
      .then((stream) => {
        omrState.stream = stream;
        renderOmrScannerView();
      })
      .catch(() => {
        ETS.toast('Không thể truy cập Camera (chưa cấp quyền hoặc không có thiết bị).');
      });
  }

  function captureOmrCameraFrame() {
    const vid = document.getElementById('omrVideoEl');
    if (!vid || !vid.videoWidth) return;
    omrState.showWarped = false;
    processOmrImageElement(vid, null);
    stopCameraStream();
    renderOmrScannerView();
  }

  function setOmrTestCode(val) { omrState.testCode = val; renderOmrScannerView(); }
  function setOmrFilter(mode) { const s = captureOmrScroll(); omrState.filterMode = mode; renderOmrScannerView({ preserveScroll: s }); }
  function toggleOmrWarpedPreview() { const s = captureOmrScroll(); omrState.showWarped = !omrState.showWarped; renderOmrScannerView({ preserveScroll: s }); }
  function toggleOmrAnswer(q, letter) {
    const s = captureOmrScroll();
    omrState.answers[q] = (omrState.answers[q] === letter) ? '' : letter;
    delete omrState.uncertain[q];
    renderOmrScannerView({ preserveScroll: s });
  }

  function saveOmrResultAndOpenCert(forceFinalize) {
    const code = omrState.testCode || 'T01';
    const qs = ETS.getTestData ? ETS.getTestData(code) : [];
    const keys = (ETS.DB && ETS.DB.answerKeys && ETS.DB.answerKeys[code]) || {};
    if (!qs.length && !Object.keys(keys).length) {
      ETS.toast(`Không tìm thấy dữ liệu đáp án đề ${code}.`);
      return;
    }

    const filledCount = Object.values(omrState.answers).filter(Boolean).length;
    const uncList = Object.keys(omrState.uncertain).filter((k) => omrState.uncertain[k]).map((k) => Number(k)).sort((a, b) => a - b);

    if (!forceFinalize && filledCount === 0) {
      if (ETS.openModal) {
        ETS.openModal({
          title: 'Chưa có đáp án trên phiếu',
          bodyHtml: `<p style="font-size:13.5px;color:var(--ink-muted);margin:0;">Hệ thống chưa ghi nhận đáp án nào cho đề <strong>${ETS.esc(code)}</strong>. Vui lòng tải ảnh phiếu tô, chụp camera, hoặc đánh dấu thủ công trước khi chốt bảng điểm.</p>`,
          footHtml: `<button class="btn btn-primary btn-sm" onclick="ETS.closeModal()">Đã hiểu</button>`
        });
      } else {
        ETS.toast('Chưa có đáp án nào để chốt điểm.');
      }
      return;
    }

    if (!forceFinalize && uncList.length > 0 && ETS.openModal) {
      const previewQs = uncList.slice(0, 12).map((q) => `Câu ${q}`).join(', ') + (uncList.length > 12 ? ` và ${uncList.length - 12} câu khác` : '');
      ETS.openModal({
        title: `Còn ${uncList.length} câu nghi vấn tô mờ / tô đúp`,
        bodyHtml: `<p style="font-size:13.5px;color:var(--ink);margin:0 0 8px;">Phát hiện <strong>${uncList.length} câu</strong> cần bạn kiểm tra lại trước khi chốt điểm (<strong>${ETS.esc(previewQs)}</strong>).</p>
          <p style="font-size:12.5px;color:var(--ink-muted);margin:0;">Chọn <strong>Rà Soát Nghi Vấn</strong> để lọc riêng các câu này và bấm chọn đáp án đúng, hoặc bấm <strong>Vẫn Chốt Bảng Điểm</strong> nếu muốn giữ nguyên kết quả hiện tại.</p>`,
        footHtml: `<button class="btn btn-sm" onclick="ETS.closeModal(); ETS.setOmrFilter('uncertain')">Rà Soát Nghi Vấn (${uncList.length})</button>
          <button class="btn btn-primary btn-sm" onclick="ETS.closeModal(); ETS.saveOmrResultAndOpenCert(true)">Vẫn Chốt Bảng Điểm</button>`
      });
      return;
    }

    const cleanAns = {};
    if (!ETS.state.test.answers[code]) ETS.state.test.answers[code] = {};
    if (!ETS.state.test.checked[code]) ETS.state.test.checked[code] = {};
    let lcRight = 0, rcRight = 0, wrongCount = 0, skippedCount = 0;
    const partStats = (ETS.PART_RANGES || []).map((p) => ({ ...p, right: 0, total: p.end - p.start + 1 }));

    for (let q = 1; q <= 200; q++) {
      const picked = omrState.answers[q] || '';
      const qObj = qs[q - 1];
      const correctAns = keys[q] || (qObj && qObj.ans) || '';
      if (!picked) {
        skippedCount += 1;
        delete ETS.state.test.answers[code][q];
        delete ETS.state.test.checked[code][q];
      } else {
        ETS.state.test.checked[code][q] = true;
        cleanAns[q] = picked;
        ETS.state.test.answers[code][q] = picked;
        if (picked === correctAns) {
          if (q <= 100) lcRight += 1;
          else rcRight += 1;
          const ps = partStats.find((x) => q >= x.start && q <= x.end);
          if (ps) ps.right += 1;
        } else {
          wrongCount += 1;
        }
      }
    }
    const lcScore = ETS.scaledToeicSection(lcRight, 'LC');
    const rcScore = ETS.scaledToeicSection(rcRight, 'RC');
    const elapsedSec = omrState.handoffElapsedSec > 0
      ? omrState.handoffElapsedSec
      : Math.max(60, (120 * 60) - (paperState.timerSec || 0));
    const attempt = {
      id: `OMR_${code}_${Date.now()}`,
      testCode: code,
      source: 'omr',
      mode: 'omr-paper',
      createdAt: Date.now(),
      date: new Date().toLocaleString('vi-VN'),
      totalSec: elapsedSec,
      lcRight, rcRight, wrongCount, skippedCount,
      lcScore, rcScore,
      totalScore: lcScore + rcScore,
      partStats,
      answers: { ...cleanAns }
    };
    ETS.state.test.attempts.push(attempt);
    omrState.handoffElapsedSec = 0;
    ETS.saveState();
    stopCameraStream();
    if (ETS.openAttemptResult) ETS.openAttemptResult(attempt.id);
    else ETS.navigate('test-hub');
  }

  // Programmatic API for offline canvas OMR grading verification & testing
  ETS.gradeOmrCanvas = function (imgEl, customCorners) {
    return processOmrImageElement(imgEl, customCorners || null);
  };
  ETS.buildPrintableSheetSvg = buildPrintableSheetSvg;
  ETS.getOmrBubbleCenter = getBubbleCenter;
  ETS.getOmrWebGeometry = function () {
    return {
      ansW: ANS_W,
      ansH: ANS_H,
      webScale: WEB_SCALE,
      webAx0: WEB_AX0,
      webAy0: WEB_AY0,
      webPad: WEB_PAD,
      pdfBox: PDF_BOX,
      pdfColX: PDF_COL_X,
      pdfRowY0: PDF_ROW_Y0,
      pdfRowDy: PDF_ROW_DY
    };
  };
  ETS.OMR_FIDUCIALS = FIDUCIALS;
  ETS.OMR_SHEET_DIM = { width: SHEET_W, height: SHEET_H };

  ETS.renderPaperExamView = renderPaperExamView;
  ETS.setPaperTestCode = setPaperTestCode;
  ETS.togglePaperAudio = togglePaperAudio;
  ETS.stepPaperTrack = stepPaperTrack;
  ETS.togglePaperTimer = togglePaperTimer;
  ETS.resetPaperTimer = resetPaperTimer;
  ETS.stopPaperAudioAndTimer = stopPaperAudioAndTimer;
  ETS.printOmrSheet = printOmrSheet;
  ETS.buildPaperBookletHtml = buildPaperBookletHtml;
  ETS.printPaperBooklet = printPaperBooklet;

  ETS.openOmrScanner = openOmrScanner;
  ETS.openOmrFromPaperLive = openOmrFromPaperLive;
  ETS.renderOmrScannerView = renderOmrScannerView;
  ETS.stopOmrCamera = stopCameraStream;
  ETS.setOmrTestCode = setOmrTestCode;
  ETS.setOmrFilter = setOmrFilter;
  ETS.toggleOmrWarpedPreview = toggleOmrWarpedPreview;
  ETS.toggleOmrAnswer = toggleOmrAnswer;
  ETS.handleOmrFileUpload = handleOmrFileUpload;
  ETS.toggleOmrCamera = toggleOmrCamera;
  ETS.captureOmrCameraFrame = captureOmrCameraFrame;
  ETS.regradeFromCorners = regradeFromCorners;
  ETS.saveOmrResultAndOpenCert = saveOmrResultAndOpenCert;
})();


ETS.init();
  </script>
</body>
