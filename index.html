  function renderSplitSentenceMarks(sent, mks) {
    if (!mks || !mks.length) return esc(sent);
    const fmtTag = (jb) => esc(jb.badge || `Câu ${jb.qNum}`);
    if (mks.length === 1) {
      const jb = mks[0];
      const vq = (jb.viQuote || '').trim();
      if (vq && vq.length >= 4 && vq.length < sent.length * 0.88) {
        const idx = sent.toLowerCase().indexOf(vq.toLowerCase());
        if (idx >= 0) {
          const pre = sent.slice(0, idx);
          const mid = sent.slice(idx, idx + vq.length);
          const post = sent.slice(idx + vq.length);
          return `${esc(pre)}<mark class="evidence-hl ${jb.cCls}" data-ev-q="${jb.qNum}" data-ev-badge="${fmtTag(jb)}"><span class="ev-q-tag">[${fmtTag(jb)}]</span>${esc(mid)}</mark>${esc(post)}`;
        }
      }
      return `<mark class="evidence-hl ${jb.cCls}" data-ev-q="${jb.qNum}" data-ev-badge="${fmtTag(jb)}"><span class="ev-q-tag">[${fmtTag(jb)}]</span>${esc(sent)}</mark>`;
    }
    // Check if multiple jobs have exact non-overlapping viQuote substrings inside `sent`
    const subSpans = [];
    let allFound = true;
    for (const jb of mks) {
      const vq = (jb.viQuote || '').trim();
      if (!vq || vq.length < 3) { allFound = false; break; }
      const idx = sent.toLowerCase().indexOf(vq.toLowerCase());
      if (idx < 0) { allFound = false; break; }
      subSpans.push({ start: idx, end: idx + vq.length, jb });
    }
    if (allFound && subSpans.length === mks.length) {
      subSpans.sort((a, b) => a.start - b.start);
      let nonOverlap = true;
      for (let i = 1; i < subSpans.length; i++) {
        if (subSpans[i].start < subSpans[i - 1].end) { nonOverlap = false; break; }
      }
      if (nonOverlap) {
        let out = '';
        let pos = 0;
        for (const sp of subSpans) {
          if (sp.start > pos) out += esc(sent.slice(pos, sp.start));
          const tagTxt = fmtTag(sp.jb);
          out += `<mark class="evidence-hl ${sp.jb.cCls}" data-ev-q="${sp.jb.qNum}" data-ev-badge="${tagTxt}"><span class="ev-q-tag">[${tagTxt}]</span>${esc(sent.slice(sp.start, sp.end))}</mark>`;
          pos = sp.end;
        }
        if (pos < sent.length) out += esc(sent.slice(pos));
        return out;
      }
    }

    // Multiple questions/options map to this single Vietnamese sentence -> split by clauses or words so every item gets its own <mark> & color
    const rawClauses = String(sent || '').split(/(?<=[;:])\s+|,\s+/u).map((c) => c.trim()).filter(Boolean);
    const nJ = mks.length;
    if (rawClauses.length >= nJ) {
      const nC = rawClauses.length;
      const chunks = [];
      for (let j = 0; j < nJ; j++) {
        const c0 = Math.min(nC - 1, Math.round((j * nC) / nJ));
        const c1 = j === nJ - 1 ? nC : Math.max(c0 + 1, Math.round(((j + 1) * nC) / nJ));
        const segText = rawClauses.slice(c0, c1).join(', ');
        const jb = mks[j];
        chunks.push(`<mark class="evidence-hl ${jb.cCls}" data-ev-q="${jb.qNum}" data-ev-badge="${fmtTag(jb)}"><span class="ev-q-tag">[${fmtTag(jb)}]</span>${esc(segText)}</mark>`);
      }
      return chunks.join(', ');
    }
    const words = String(sent || '').split(/\s+/).filter(Boolean);
    if (words.length >= nJ) {
      const nW = words.length;
      const chunks = [];
      for (let j = 0; j < nJ; j++) {
        const w0 = Math.min(nW - 1, Math.round((j * nW) / nJ));
        const w1 = j === nJ - 1 ? nW : Math.max(w0 + 1, Math.round(((j + 1) * nW) / nJ));
        const segText = words.slice(w0, w1).join(' ');
        const jb = mks[j];
        chunks.push(`<mark class="evidence-hl ${jb.cCls}" data-ev-q="${jb.qNum}" data-ev-badge="${fmtTag(jb)}"><span class="ev-q-tag">[${fmtTag(jb)}]</span>${esc(segText)}</mark>`);
      }
      return chunks.join(' ');
    }
    return mks.map((jb, idx) => `<mark class="evidence-hl ${jb.cCls}" data-ev-q="${jb.qNum}" data-ev-badge="${fmtTag(jb)}"><span class="ev-q-tag">[${fmtTag(jb)}]</span>${idx === 0 ? esc(sent) : ''}</mark>`).join(' ');
  }

  function renderMultiViHighlights(viEl, jobs) {
    if (!viEl || !jobs || !jobs.length) return;
    const rawVi = viEl.dataset.rawVi != null ? viEl.dataset.rawVi : (viEl.textContent || '').trim();
    if (viEl.dataset.rawVi == null) viEl.dataset.rawVi = rawVi;
    if (!rawVi) return;

    const splitSents = (txt) => String(txt || '')
      .replace(/\[Câu\s*\d+[^\]]*\]/g, '')
      .split(/(?<=[.?!…])\s+(?=[A-ZÀÁẠẢÃÂẦẤẬẨẪĂẰẮẶẲẴÈÉẸẺẼÊỀẾỆỂỄÌÍỊỈĨÒÓỌỎÕÔỒỐỘỔỖƠỜỚỢỞỠÙÚỤỦŨƯỪỨỰỬỮỲÝỴỶỸĐ0-9"'\u201C(])/u)
      .map((s) => s.trim())
      .filter(Boolean);

    // Deduplicate jobs by (qNum + badge + viQuote) while keeping earliest ratio
    const qMap = new Map();
    jobs.forEach((jb) => {
      const ratio = getMarkOffsetRatio(jb.enContainer, jb.mk);
      const mkText = (jb.mk.textContent || '').replace(/^\[Câu\s*\d+[^\]]*\]\s*/, '').trim();
      const badge = jb.mk.dataset.evBadge || `Câu ${jb.qNum}`;
      const viQuote = jb.mk.dataset.evViQuote || '';
      const key = `${jb.qNum}__${badge}__${viQuote || mkText}`;
      if (!qMap.has(key)) {
        qMap.set(key, { ...jb, badge, viQuote, ratio, mkText });
      }
    });
    const uniqueJobs = Array.from(qMap.values()).sort((a, b) => a.ratio - b.ratio || Number(a.qNum) - Number(b.qNum));
    if (!uniqueJobs.length) return;

    // Priority 1: Direct exact viQuote substring matching on rawVi (works across '?' in forms/tables and multi-clause lines)
    const directSpans = [];
    let allDirectMatched = true;
    const lowRawVi = rawVi.toLowerCase();
    for (const jb of uniqueJobs) {
      const vq = (jb.viQuote || '').trim();
      if (!vq || vq.length < 3) { allDirectMatched = false; break; }
      const idx = lowRawVi.indexOf(vq.toLowerCase());
      if (idx < 0) { allDirectMatched = false; break; }
      directSpans.push({ start: idx, end: idx + vq.length, jb });
    }
    if (allDirectMatched && directSpans.length === uniqueJobs.length) {
      directSpans.sort((a, b) => a.start - b.start);
      let nonOverlap = true;
      for (let i = 1; i < directSpans.length; i++) {
        if (directSpans[i].start < directSpans[i - 1].end) { nonOverlap = false; break; }
      }
      if (nonOverlap) {
        let outHtml = '';
        let pos = 0;
        for (const sp of directSpans) {
          if (sp.start > pos) outHtml += esc(rawVi.slice(pos, sp.start));
          const tagTxt = esc(sp.jb.badge || `Câu ${sp.jb.qNum}`);
          outHtml += `<mark class="evidence-hl ${sp.jb.cCls}" data-ev-q="${sp.jb.qNum}" data-ev-badge="${tagTxt}"><span class="ev-q-tag">[${tagTxt}]</span>${esc(rawVi.slice(sp.start, sp.end))}</mark>`;
          pos = sp.end;
        }
        if (pos < rawVi.length) outHtml += esc(rawVi.slice(pos));
        viEl.innerHTML = outHtml;
        return;
      }
    }

    const viSents = splitSents(rawVi);
    const enContainer = uniqueJobs[0].enContainer;
    const enFull = enContainer ? (enContainer.textContent || '') : '';
    const enSents = splitSents(enFull);

    if (viSents.length > 1) {
      const sentMarks = Array.from({ length: viSents.length }, () => []);
      uniqueJobs.forEach((jb) => {
        let sIdx = -1;
        if (enSents.length > 1 && jb.mkText.length >= 4) {
          const lowMk = jb.mkText.toLowerCase();
          for (let i = 0; i < enSents.length; i++) {
            const lowEn = enSents[i].toLowerCase();
            if (lowEn.includes(lowMk) || lowMk.includes(lowEn)) {
              sIdx = Math.min(viSents.length - 1, Math.round((i / Math.max(1, enSents.length - 1)) * (viSents.length - 1)));
              break;
            }
          }
        }
        if (sIdx < 0) {
          sIdx = Math.min(viSents.length - 1, Math.floor(jb.ratio * viSents.length));
        }
        if (sentMarks[sIdx].length > 0 && uniqueJobs.length <= viSents.length) {
          if (sIdx + 1 < viSents.length && sentMarks[sIdx + 1].length === 0) {
            sIdx = sIdx + 1;
          } else if (sIdx > 0 && sentMarks[sIdx - 1].length === 0) {
            sIdx = sIdx - 1;
          }
        }
        sentMarks[sIdx].push(jb);
      });

      viEl.innerHTML = viSents.map((sent, idx) => renderSplitSentenceMarks(sent, sentMarks[idx])).join(' ');
      return;
    }

    viEl.innerHTML = renderSplitSentenceMarks(rawVi, uniqueJobs);
  }

  function expandCandidateQuotes(rawQuote) {
    const base = String(rawQuote || '').trim();
    if (!base) return [];
    const out = [];
    const pushClean = (s) => {
      const c = String(s || '')
        .replace(/^[A-Z][A-Za-z.\s'-]{1,28}\(\d{1,2}:\d{2}\s*(?:A\.?M\.?|P\.?M\.?)?\)\s*:?\s*/i, '')
        .replace(/^\s*(?:To|From|Date|Subject|Re)\s*:\s*/i, '')
        .replace(/^["'\u201C\u201D\u2018\u2019]+|["'\u201C\u201D\u2018\u2019]+$/g, '')
        .trim();
      if (c.length >= 4 && !out.includes(c)) out.push(c);
    };
    // 1. Split by ellipsis / newlines / Part 6 blanks "[135] -------" / "--- [135] ---"
    const parts = base.split(/\s*(?:\.\.\.|…|\n|(?:[-—_]{2,}\s*)?\[\d{3}\](?:\s*[-—_]{2,})?|\s+[-—_]{3,}\s+)\s*/);
    parts.forEach((p) => {
      pushClean(p);
      // Also split multi-sentence quotes into individual sentences so 1-sentence units match cleanly
      const sents = String(p || '')
        .replace(/^[A-Z][A-Za-z.\s'-]{1,28}\(\d{1,2}:\d{2}\s*(?:A\.?M\.?|P\.?M\.?)?\)\s*:?\s*/i, '')
        .split(/(?<=[.?!])\s+/)
        .map((x) => x.trim())
        .filter((x) => x.length >= 6);
      // Sort sentences longest first if there are multiple sentences (avoids matching just "OK." or "Hi." or "Yes.")
      if (sents.length > 1) {
        sents.slice().sort((a, b) => b.length - a.length).forEach(pushClean);
      } else {
        sents.forEach(pushClean);
      }
    });
    return out;
  }

  function buildEvTargetsForRich(rich, qNum, fallbackQuotes) {
    const ans = (rich && rich.ans) || '';
    const defaultBadge = ans ? `Câu ${qNum} · Đáp án ${ans}` : `Câu ${qNum}`;
    if (rich && Array.isArray(rich.evTargets) && rich.evTargets.length) {
      return rich.evTargets.map((t) => ({
        quote: String(t.quote || '').trim(),
        viQuote: String(t.viQuote || '').trim(),
        badge: String(t.badge || defaultBadge).trim(),
        opt: t.opt || ans,
        isCorrect: !!t.isCorrect
      })).filter((t) => t.quote.length >= 2);
    }
    const qArr = (Array.isArray(fallbackQuotes) && fallbackQuotes.length)
      ? fallbackQuotes
      : ((rich && Array.isArray(rich.evQuotes) && rich.evQuotes.length) ? rich.evQuotes : (rich && rich.stem_en ? [rich.stem_en] : []));
    return qArr.map((qStr) => ({
      quote: String(qStr || '').trim(),
      viQuote: '',
      badge: defaultBadge,
      opt: ans,
      isCorrect: true
    })).filter((t) => t.quote.length >= 2);
  }

  function applyEvidenceHighlights(sc) {
    if (!ws || !sc) return;
    const evList = [];
    const itemsArr = getTestItems(ws.testCode);
    const isAllMode = isAllEvOnForScreen(sc);
    if (isAllMode) {
      for (let q = sc.qStart; q <= sc.qEnd; q++) {
        const rich = itemsArr && itemsArr[q - 1];
        if (!rich) continue;
        const targets = buildEvTargetsForRich(rich, q);
        evList.push({ q, targets, docIdx: rich.evDocIdx != null ? rich.evDocIdx : null, colorIdx: (q - sc.qStart) % 5 });
      }
    } else if (ws.activeEvidence && ws.activeEvidence.q >= sc.qStart && ws.activeEvidence.q <= sc.qEnd) {
      const ev = ws.activeEvidence;
      const rich = itemsArr && itemsArr[ev.q - 1];
      const targets = (Array.isArray(ev.targets) && ev.targets.length)
        ? ev.targets
        : buildEvTargetsForRich(rich, ev.q, ev.quotes);
      evList.push({ q: ev.q, targets, docIdx: ev.docIdx, colorIdx: (ev.q - sc.qStart) % 5 });
    }
    if (!evList.length) return;

    const lp = document.getElementById('wsLeftPane');
    const rp = document.getElementById('wsRightPane');
    let anyPrimaryMarked = false;

    evList.forEach((evItem) => {
      const docWrap = (lp && evItem.docIdx != null) ? lp.querySelector(`.ets-p7-doc-wrap[data-doc-idx="${evItem.docIdx}"]`) : null;
      const leftTargets = [docWrap, lp].filter(Boolean);
      const qCardEl = (rp && rp.querySelector(`#qCard_${evItem.q}`)) || (lp && lp.querySelector(`#qCard_${evItem.q}`));
      const allTargets = [docWrap, lp, qCardEl, rp].filter(Boolean);
      let qMatchedCount = 0;

      const matchSingleTarget = (tObj, tColor, allowInsideMark, searchRoots) => {
        const candidates = expandCandidateQuotes(tObj.quote);
        for (const qStr of candidates) {
          for (const root of searchRoots) {
            if (highlightEvidenceQuoteInRoot(root, qStr, evItem.q, !anyPrimaryMarked, tColor, allowInsideMark, tObj.badge, tObj.viQuote)) {
              anyPrimaryMarked = true;
              return true;
            }
          }
          if (qStr.length > 18) {
            const words = qStr.replace(/^\s*\d{1,3}\.\s*/, '').trim().split(/\s+/);
            const slices = [];
            for (const wLen of [7, 5, 4]) {
              if (words.length >= wLen) {
                slices.push(words.slice(0, wLen).join(' '));
                slices.push(words.slice(-wLen).join(' '));
                if (words.length >= wLen + 2) {
                  const mid = Math.floor((words.length - wLen) / 2);
                  slices.push(words.slice(mid, mid + wLen).join(' '));
                }
              }
            }
            for (const chunk of slices) {
              for (const root of searchRoots) {
                if (highlightEvidenceQuoteInRoot(root, chunk, evItem.q, !anyPrimaryMarked, tColor, allowInsideMark, tObj.badge, tObj.viQuote)) {
                  anyPrimaryMarked = true;
                  return true;
                }
              }
            }
          }
        }
        return false;
      };

      // Highlight EVERY target in evItem.targets (e.g. Có A, Có B, Có C, Đáp án D, or multi-doc clues!)
      evItem.targets.forEach((tObj, tIdx) => {
        const tColor = isAllMode
          ? (evItem.colorIdx % 5)
          : (evItem.targets.length > 1 ? (tObj.isCorrect ? 0 : ((tIdx + 1) % 5)) : (evItem.colorIdx % 5));
        let matchedThisTarget = matchSingleTarget(tObj, tColor, false, leftTargets);
        if (!matchedThisTarget) {
          matchedThisTarget = matchSingleTarget(tObj, tColor, true, leftTargets);
        }
        if (!matchedThisTarget && sc.part <= 5) {
          matchedThisTarget = matchSingleTarget(tObj, tColor, true, allTargets);
        }
        if (matchedThisTarget) qMatchedCount++;
      });

      // Fallback for Part 6 (Q131..146) if nothing matched yet
      if (qMatchedCount === 0 && lp && evItem.q >= 131 && evItem.q <= 146) {
        const blankEl = lp.querySelector(`[data-blank-q="${evItem.q}"], .ets-p6-blank-slot`);
        const unitOrP = Array.from(lp.querySelectorAll('.ets-unit-en, .ets-doc-p')).find((el) => el.textContent.includes(`[${evItem.q}]`)) || (blankEl && blankEl.closest('.ets-unit-en, .ets-doc-p'));
        const fbBadge = (evItem.targets[0] && evItem.targets[0].badge) || `Câu ${evItem.q}`;
        if (unitOrP) {
          const walker = document.createTreeWalker(unitOrP, NodeFilter.SHOW_TEXT, null);
          let bestNode = null;
          let n;
          while ((n = walker.nextNode())) {
            if (n.parentElement && !n.parentElement.closest('.ev-q-tag, .ets-p6-blank-slot, .ets-unit-vi, .ets-doc-vi-line') && n.nodeValue.trim().length >= 4) {
              bestNode = n;
              break;
            }
          }
          if (bestNode) {
            highlightEvidenceQuoteInRoot(unitOrP, bestNode.nodeValue.trim(), evItem.q, !anyPrimaryMarked, evItem.colorIdx % 5, true, fbBadge, '');
            qMatchedCount++;
            anyPrimaryMarked = true;
          }
        }
      }
      // Final fallback across allTargets if still 0 matched
      if (qMatchedCount === 0) {
        for (let tIdx = 0; tIdx < evItem.targets.length; tIdx++) {
          if (matchSingleTarget(evItem.targets[tIdx], evItem.colorIdx % 5, true, allTargets)) {
            qMatchedCount++;
          }
        }
      }
    });

    const wsRootEl = document.getElementById('wsRoot');
    if (wsRootEl) {
      wsRootEl.querySelectorAll('.ets-unit-vi.is-ev-pair, .ets-doc-vi-line.is-ev-pair, .vi-text.is-ev-pair, .opt-vi.is-ev-pair').forEach((el) => el.classList.remove('is-ev-pair'));
      const viJobsMap = new Map();
      wsRootEl.querySelectorAll('mark.evidence-hl').forEach((mk) => {
        const qNum = mk.dataset.evQ || '';
        const cCls = mk.dataset.evColor || 'ev-c0';
        const paired = findPairedViTarget(mk);
        if (!paired || !paired.viEls || !paired.viEls.length) return;
        paired.viEls.forEach((viEl) => {
          if (!viJobsMap.has(viEl)) viJobsMap.set(viEl, []);
          viJobsMap.get(viEl).push({ mk, enContainer: paired.enContainer, qNum, cCls });
        });
      });
      viJobsMap.forEach((jobs, viEl) => {
        renderMultiViHighlights(viEl, jobs);
      });
    }
    const mainMark = document.getElementById('evMarkMain');
    if (mainMark) {
      setTimeout(() => {
        try {
          if (sc && (sc.part === 2 || sc.part === 5)) {
            if (lp) lp.scrollTop = 0;
          } else {
            mainMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } catch (e) {}
      }, 45);
    }
  }

  function toggleAllScreenEvidence() {
    if (!ws) return;
    const sc = currentScreen();
    if (!sc) return;
    const curKey = getScreenEvKey(sc);
    const turningOn = !isAllEvOnForScreen(sc);
    ws.showAllEvidence = turningOn;
    ws.showAllEvidenceGroup = turningOn ? curKey : null;
    if (turningOn) {
      if (sc.part <= 4) {
        ws.showScript = true;
        ws.clozeScript = false;
      }
      toast(`Đã BẬT tô sáng đa màu dẫn chứng Câu ${sc.qStart}–${sc.qEnd} (Anh + Việt)!`);
    } else {
      ws.activeEvidence = null;
      toast(`Đã tắt tô sáng dẫn chứng Câu ${sc.qStart}–${sc.qEnd}.`);
    }
    updatePanesAndDockKeepAudio();
  }

  function locateQuestionEvidence(qNum, forceOn) {
    if (!ws) return;
    const q = Number(qNum);
    ws.showAllEvidence = false;
    ws.showAllEvidenceGroup = null;
    const itemsArr = getTestItems(ws.testCode);
    const rich = itemsArr[q - 1] || null;
    const scIdx = ws.allScreens.findIndex((s) => q >= s.qStart && q <= s.qEnd);
    if (scIdx >= 0 && currentScreen() && (q < currentScreen().qStart || q > currentScreen().qEnd)) {
      const actPos = ws.activeIndices.indexOf(scIdx);
      if (actPos >= 0) ws.posInActive = actPos;
    }
    const alreadyOn = ws.activeEvidence && ws.activeEvidence.q === q;
    if (alreadyOn && !forceOn) {
      ws.activeEvidence = null;
      updatePanesAndDockKeepAudio();
      return;
    }
    const targets = buildEvTargetsForRich(rich, q);
    const quotes = targets.map((t) => t.quote);

    ws.activeEvidence = {
      q,
      quotes,
      targets,
      docIdx: (rich && rich.evDocIdx != null) ? rich.evDocIdx : null
    };
    const sc = currentScreen();
    if (sc && sc.part <= 4) {
      ws.showScript = true;
      ws.clozeScript = false;
    }
    updatePanesAndDockKeepAudio();
    if (!quotes.length) {
      toast(`Đã mở script/ngữ cảnh Câu ${q} ở khung bên trái.`);
    }
  }

  function postRenderDomHighlights(sc) {
    if (!ws || !sc) return;
    const first = (sc.items && sc.items[0]) || null;
    const gKey = (first && first.group_id) || `Q${sc.qStart}`;
    const hls = (state.test.highlights[ws.testCode] || {})[gKey] || [];
    const lp = document.getElementById('wsLeftPane');
    const rp = document.getElementById('wsRightPane');
    if (hls.length) {
      if (lp) wrapMatchesInContainer(lp, hls);
      if (rp) wrapMatchesInContainer(rp, hls);
    }
    applyEvidenceHighlights(sc);
  }

  function highlightSelectedText(arg) {
    if (!ws) return;
    const sc = currentScreen();
    if (!sc) return;
    const first = (sc.items && sc.items[0]) || null;
    const defaultGKey = (first && first.group_id) || `Q${sc.qStart}`;
    let sel = window.getSelection ? window.getSelection().toString().trim() : '';
    let gKey = defaultGKey;
    if (arg && typeof arg === 'string') {
      const testMap = state.test.highlights[ws.testCode] || {};
      const isKey = arg === defaultGKey || /^Q\d+/.test(arg) || /^G_/.test(arg) || Object.prototype.hasOwnProperty.call(testMap, arg);
      if (isKey && (!first || arg === first.group_id || arg === `Q${sc.qStart}`)) {
        gKey = arg;
      } else if (!sel || arg.trim().length >= sel.length) {
        sel = arg.trim();
      }
    }
    if (!sel || sel.length < 2) {
      toast('Hãy dùng chuột bôi đen một từ/cụm trong đoạn văn bên trái hoặc đáp án!');
      return;
    }
    ensureTestMaps(ws.testCode);
    const map = state.test.highlights[ws.testCode];
    if (!map[gKey]) map[gKey] = [];
    if (!map[gKey].includes(sel)) map[gKey].push(sel);
    saveState();
    updatePanesAndDockKeepAudio();
  }
  function clearHighlights(gKey) {
    if (!state.test.highlights[ws.testCode]) return;
    delete state.test.highlights[ws.testCode][gKey];
    saveState();
    updatePanesAndDockKeepAudio();
  }
  function removeHighlightPhrase(phrase) {
    if (!ws || !state.test.highlights[ws.testCode]) return;
    const clean = String(phrase || '').trim();
    if (!clean) return;
    const sc = currentScreen();
    const first = sc && sc.items && sc.items[0];
    const gKey = (first && first.group_id) || (sc ? `Q${sc.qStart}` : '');
    const map = state.test.highlights[ws.testCode];
    const filterArr = (arr) => arr.filter((p) => p !== clean && p.toLowerCase() !== clean.toLowerCase());
    if (gKey && Array.isArray(map[gKey])) {
      map[gKey] = filterArr(map[gKey]);
      if (!map[gKey].length) delete map[gKey];
    } else {
      Object.keys(map).forEach((k) => {
        if (Array.isArray(map[k])) {
          map[k] = filterArr(map[k]);
          if (!map[k].length) delete map[k];
        }
      });
    }
    saveState();
    updatePanesAndDockKeepAudio();
    toast('Đã bỏ Highlight');
  }

      </div>
    `);
  }

  // ===================== PERSISTENT AUDIO PLAYBACK ENGINE =====================
  function attachWorkspaceAudio(forceReload = false) {
    const sc = currentScreen();
    if (!sc || !sc.audio) {
      stopPersistentTestAudio();
      ws.loadedAudioTrack = null;
      return;
    }

    if (forceReload || ws.loadedAudioTrack !== sc.audio || persistentTestAudio.dataset.loadedSrc !== sc.audio) {
      persistentTestAudio.src = sc.audio;
      persistentTestAudio.dataset.loadedSrc = sc.audio;
      ws.loadedAudioTrack = sc.audio;
    }
    persistentTestAudio.playbackRate = ws.mode === 'exam' ? 1.0 : (ws.playbackRate || 1.0);
    persistentTestAudio.volume = ws.mode === 'exam' ? (ws.audioVolume ?? 1.0) : 1.0;

    persistentTestAudio.ontimeupdate = () => {
      if (!ws) return;
      ws.audioCurrent = persistentTestAudio.currentTime || 0;
      ws.audioDuration = persistentTestAudio.duration || 0;
      if (ws.mode === 'practice') {
        if (ws.abLoop.active && ws.abLoop.b != null && persistentTestAudio.currentTime >= ws.abLoop.b) {
          persistentTestAudio.currentTime = ws.abLoop.a || 0;
        }
        const rng = document.getElementById('wsAudioRange');
        const tm = document.getElementById('wsAudioTime');
        const pct = persistentTestAudio.duration ? (persistentTestAudio.currentTime / persistentTestAudio.duration) * 100 : 0;
        if (rng && persistentTestAudio.duration) {
          rng.value = pct;
          rng.style.setProperty('--audio-pct', `${pct.toFixed(1)}%`);
        }
        if (tm) tm.textContent = `${fmtTime(persistentTestAudio.currentTime)}/${fmtTime(persistentTestAudio.duration)}`;
      } else if (ws.mode === 'exam') {
        const remEl = document.getElementById('examTrackRemain');
        if (remEl && persistentTestAudio.duration) {
          const left = Math.max(0, Math.ceil(persistentTestAudio.duration - persistentTestAudio.currentTime));
          remEl.textContent = `-${fmtTime(left)}`;
        }
      }
    };

    persistentTestAudio.onplay = () => {
      if (ws) ws.audioPlaying = true;
      const b = document.getElementById('wsPlayBtn');
      if (b) b.innerHTML = icon('pause');
    };
    persistentTestAudio.onpause = () => {
      if (ws) ws.audioPlaying = false;
      const b = document.getElementById('wsPlayBtn');
      if (b) b.innerHTML = icon('play');
    };
    persistentTestAudio.onended = () => {
      if (!ws) return;
      ws.audioPlaying = false;
      const b = document.getElementById('wsPlayBtn');
      if (b) b.innerHTML = icon('play');
      if (ws.mode === 'exam') handleExamTrackEnded();
    };
  }

  function togglePracticeAudio() {
    if (!ws || ws.mode !== 'practice') return;
    const sc = currentScreen();
    if (!sc || !sc.audio) return;
    if (persistentTestAudio.dataset.loadedSrc !== sc.audio) {
      attachWorkspaceAudio(true);
    }
    if (persistentTestAudio.paused) persistentTestAudio.play().catch(() => {});
    else persistentTestAudio.pause();
  }
  function seekPracticeAudio(pct) {
    if (!ws || ws.mode !== 'practice') return;
    if (persistentTestAudio.duration) persistentTestAudio.currentTime = (pct / 100) * persistentTestAudio.duration;
  }
  function nudgePracticeAudio(sec) {
    if (!ws || ws.mode !== 'practice') return;
    persistentTestAudio.currentTime = Math.max(0, Math.min(persistentTestAudio.duration || 9999, (persistentTestAudio.currentTime || 0) + sec));
  }

  // Real Exam Track Auto-Sequencer & Unanswered Countdown Warning
  function playExamCurrentTrack(force = false) {

  function handleExamTrackEnded() {
    if (!ws || ws.mode !== 'exam' || ws.lcFinished) return;
    clearInterval(countdownInterval);
    const sc = currentScreen();
    const missing = [];
    for (let q = sc.qStart; q <= sc.qEnd; q++) {
      if (!ws.examAnswers[q]) missing.push(q);
    }
    ws.countdownMissing = missing;
    ws.countdownRemaining = missing.length > 0 ? Math.max(ws.countdownBase + 2, 5) : ws.countdownBase;
    renderWorkspace();

    countdownInterval = setInterval(() => {
      if (!ws || ws.mode !== 'exam') { clearInterval(countdownInterval); return; }
      ws.countdownRemaining--;
      if (ws.countdownRemaining <= 0) {
        clearInterval(countdownInterval);
        ws.countdownRemaining = 0;
        advanceExamFromListening();
      } else {
        const bar = document.querySelector('.exam-countdown-bar');
        if (bar) {
          bar.innerHTML = ws.countdownMissing.length
            ? `<span>${icon('alert')} CẢNH BÁO: Bạn chưa chọn đáp án câu <strong>${ws.countdownMissing.join(', ')}</strong>! Hệ thống vẫn tự chuyển sau <strong>${ws.countdownRemaining}s</strong>...</span>`
            : `<span>${icon('check-circle')} Đã xong audio · Tự động chuyển tiếp sau <strong>${ws.countdownRemaining}s</strong>...</span>`;
        }
      }
    }, 1000);
  }

  function advanceExamFromListening() {
    if (!ws || ws.mode !== 'exam') return;
    clearInterval(countdownInterval);
    ws.countdownRemaining = 0;
    ws.countdownMissing = [];
    const nxt = ws.posInActive + 1;
    if (nxt >= ws.activeIndices.length) return;
    ws.posInActive = nxt;
    ws.overridePageNum = null;
    ws.paletteOpen = false;
    startQuestionPaceTimer();
    const nextScreen = currentScreen();
    if (nextScreen.qStart >= 101 || !nextScreen.audio) {
      ws.lcFinished = true;
      stopPersistentTestAudio();
      playExamBell(2);
      toast('🔔 Đã hoàn thành phần Listening (Q1–Q100)! Đã MỞ KHÓA Bản đồ phần Reading (Q101–Q200) để bạn tự do chuyển câu.', 4800);
      renderWorkspace();
    } else {
      renderWorkspace();
      playExamCurrentTrack(true);
    }
  }

  function exitWorkspace() {
    if (!ws) { ETS.navigate('test-hub'); return; }
    if (ws.mode === 'exam') {
      confirmModal({
        title: 'Thoát Phiên Thi Thật Đang Diễn Ra?',
        message: 'Bạn đang trong chế độ <strong>Thi Thật 120 phút</strong>. Nếu thoát lúc này mà chưa bấm Nộp bài, kết quả phiên thi hiện tại sẽ bị hủy. Bạn có muốn Nộp bài chấm điểm ngay hay Thoát hủy phiên?',
        confirmText: 'Thoát & Hủy phiên thi',
        cancelText: 'Quay lại làm tiếp',
        danger: true,
        onConfirm: () => {
          clearWorkspaceTimers();
          stopAllAudio();
          ws = null;
          ETS.navigate('test-hub');
        }
      });
      return;
    }
    clearWorkspaceTimers();
    stopAllAudio();
    ws = null;
    ETS.navigate('test-hub');
  }

  // ===================== REAL EXAM SUBMISSION & SCORED RESULT SCREEN =====================
  function confirmSubmitExam() {
    if (!ws || ws.mode !== 'exam') return;
    const answered = Object.keys(ws.examAnswers).length;
    const unanswered = 200 - answered;
    openModal(`
      <h2 style="margin:0 0 8px;">Xác Nhận Nộp Bài Thi</h2>
      <p style="font-size:0.9333rem;">Bạn đã chọn <strong>${answered} / 200</strong> câu.${unanswered > 0 ? ` Còn <strong style="color:var(--danger);">${unanswered} câu bỏ trống</strong>.` : ' Đã hoàn thành đầy đủ 200 câu!'}</p>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
        <button class="btn" onclick="ETS.closeModal()">Tiếp tục làm bài</button>
        <button class="btn btn-danger" onclick="ETS.closeModal();ETS.submitRealExam(false)">Xác nhận Nộp Bài Ngay</button>
      </div>
    `);
  }

  let latestResultAttempt = null;

  function submitRealExam(autoSubmitted = false) {
    if (!ws || ws.mode !== 'exam') return;
    clearWorkspaceTimers();
    stopAllAudio();

    const tCode = ws.testCode;
    const keys = DB.answerKeys[tCode] || {};
    const examAns = ws.examAnswers;
    const elapsedSec = Math.max(1, 7200 - ws.remainingSec);

    let lcRight = 0, rcRight = 0, wrongCount = 0, skippedCount = 0;
    const partStats = PART_RANGES.map((p) => ({ ...p, right: 0, total: p.end - p.start + 1 }));

    ensureTestMaps(tCode);
    for (let q = 1; q <= 200; q++) {
      const picked = examAns[q];
      const right = keys[q];
      state.test.checked[tCode][q] = true;
      if (!picked) {
        skippedCount++;
        delete state.test.answers[tCode][q];
      } else {
        state.test.answers[tCode][q] = picked;
        if (picked === right) {
          if (q <= 100) lcRight++; else rcRight++;
          const ps = partStats.find((x) => q >= x.start && q <= x.end);
          if (ps) ps.right++;
        } else {
          wrongCount++;
        }
      }
    }

    const lcScore = scaledToeicSection(lcRight, 'LC');
    const rcScore = scaledToeicSection(rcRight, 'RC');
    const totalScore = lcScore + rcScore;

    const attempt = {
      id: 'att_' + Date.now(),
      testCode: tCode,
      source: 'online',
      mode: 'exam-online',
      createdAt: Date.now(),
      date: new Date().toLocaleString('vi-VN'),
      totalSec: elapsedSec,
      lcRight, rcRight, wrongCount, skippedCount,
      lcScore, rcScore, totalScore,
      partStats,
      answers: { ...examAns },
      autoSubmitted,
    };
    state.test.attempts.push(attempt);
    saveState();

    latestResultAttempt = attempt;
    ws = null;
    ETS.navigate('test-result');
  }

  function viewAttemptResult(attemptId) {
    const att = state.test.attempts.find((a) => a.id === attemptId);
    if (!att) return;
    latestResultAttempt = att;
    selectedResultQ = 0;
    ETS.navigate('test-result');
  }

    if (!ws || ws.mode !== 'exam') return;

      ws.timerHidden = false;

    document.body.classList.remove('print-booklet-mode');
    document.body.classList.add('print-result-mode');
    const cleanup = () => {
      document.body.classList.remove('print-result-mode');
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    window.print();
    setTimeout(cleanup, 1200);

  let selectedResultQ = 0;
  function inspectResultQuestion(attemptId, qNum) {
    let a = null;
    if (qNum == null && typeof attemptId === 'number') {
      qNum = attemptId;
      a = latestResultAttempt || (state.test.attempts || [])[(state.test.attempts || []).length - 1];
    } else {
      a = (state.test.attempts || []).find((x) => x.id === attemptId) || latestResultAttempt || (state.test.attempts || [])[(state.test.attempts || []).length - 1];
    }
    if (!a) return;
    selectedResultQ = Number(qNum) || 0;

    if (box) {
      box.innerHTML = buildResultInspectorHtml(a, selectedResultQ);
      document.querySelectorAll('.q-matrix-cell.is-picked').forEach((el) => el.classList.remove('is-picked'));
      const cell = document.querySelector(`.q-matrix-cell[data-q="${selectedResultQ}"]`);
      if (cell) cell.classList.add('is-picked');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    const keys = DB.answerKeys[a.testCode] || {};

    if (!selectedResultQ || selectedResultQ < 1 || selectedResultQ > 200) {
      let firstWrong = 0;
      let firstAnswered = 0;
      for (let q = 1; q <= 200; q++) {

        if (picked) {

          if (picked !== keys[q] && !firstWrong) {
            firstWrong = q;
            break;
          }

            ${a.skippedCount > 0 ? `<button class="btn btn-sm" onclick="ETS.launchTestPractice('${escJsStr(a.testCode)}', { filterMode: 'skipped' })">${icon('clock')} Ôn ${a.skippedCount} Câu Bỏ</button>` : ''}
          </div>
        </div>

        <div class="result-bento-grid">
          <div class="result-left-col">
            <div class="result-cert-card">
              <svg class="result-cert-watermark" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <circle cx="50" cy="46" r="34" />

                <path d="M38 77 L34 95 L50 86 L66 95 L62 77" />
              </svg>

                <span>ETS 2026 SCORE CERTIFICATE</span>
                <span class="result-cefr-pill" title="Chuẩn ETS Mapping TOEIC to CEFR (L≥490/R≥455=C1, L≥400/R≥385=B2, L≥275/R≥275=B1)">CEFR ${esc(cefr.level)} · L:${esc(cefr.lcCefr || cefr.level)} / R:${esc(cefr.rcCefr || cefr.level)}</span>
              </div>
              <div class="result-score-hero">
                <div>
                  <div class="result-score-total">${a.totalScore}<span class="result-score-max">/ 990</span></div>
                  <div class="result-cefr-caption">${esc(cefr.label)}</div>

                <span>${a.totalSec ? fmtTime(a.totalSec) + ' · ' : ''}${esc(a.date)}${a.autoSubmitted ? ' (Tự nộp)' : ''}</span>

              ${partsList.map((ps) => {

  function getFallbackTopicLabel(part) {
    if (part === 1) return 'Part 1 — Mô tả hành động & trạng thái bức tranh';
    if (part === 2) return 'Part 2 — Câu hỏi & Phản hồi hội thoại ngắn';
    if (part === 3) return 'Part 3 — Hội thoại nơi công sở & Tình huống giao tiếp';
    if (part === 4) return 'Part 4 — Bài nói ngắn (Thông báo / Tin nhắn / Hướng dẫn)';
    if (part === 5) return 'Part 5 — Hoàn thành câu (Ngữ pháp & Từ vựng TOEIC)';
    if (part === 6) return 'Part 6 — Hoàn thành đoạn văn (Ngữ pháp & Mạch văn)';
    return 'Part 7 — Đọc hiểu văn bản & Paraphrase dẫn chứng';
  }

  function getUsageSituationTip(rich) {
    if (!rich) return '';
    const part = Number(rich.part) || 1;
    const gt = rich.grammarType || '';
    const exp = String(rich.explanation || '');
    const customTip = exp.split(/\r?\n/).find((ln) => /^(Mẹo|Tình huống|Lưu ý|Tại sao|Ghi nhớ):/i.test(ln.trim()));
    if (customTip) return customTip.trim();
    if (part === 1) return 'Quan sát người/vật chủ thể và phân biệt động từ đang làm (being/doing) vs trạng thái sẵn (be + V-ed/wearing) để loại bẫy đồng âm và bẫy danh từ xuất hiện trong ảnh.';
    if (part === 2) return 'Lắng nghe 2 từ đầu câu hỏi (Wh-/Trợ động từ) và chú ý các câu trả lời gián tiếp trong tình huống giao tiếp thực tế ("I\'m not sure", "Let me check", "Actually...").';
    if (part === 3 || part === 4) return 'Đọc lướt từ khóa câu hỏi trước khi nghe; đối chiếu ý chính, yêu cầu/hành động tiếp theo (next step) và ghép cột bảng biểu (nếu có hình minh họa).';
    if (part === 5 || part === 6) {
      if (gt.includes('Loại từ')) return `Chuyên đề ${gt}: Xác định thành phần đứng ngay trước & sau chỗ trống (mạo từ, giới từ, động từ nối, trợ động từ) để chọn đúng Danh từ / Động từ / Tính từ / Trạng từ trong ngữ cảnh này.`;
      if (gt.includes('Giới từ') || gt.includes('Liên từ')) return `Chuyên đề ${gt}: Kiểm tra phía sau chỗ trống là cụm danh từ/V-ing (dùng Giới từ) hay mệnh đề S+V (dùng Liên từ), đồng thời xét quan hệ nhân-quả / tương phản / thời gian của cả câu.`;
      if (gt.includes('Thì') || gt.includes('Bị động')) return `Chuyên đề ${gt}: Tìm trạng từ chỉ thời gian (last week, by next month, since...) và xét xem chủ ngữ tự thực hiện hành động (chủ động) hay chịu tác động (bị động).`;
      return gt ? `Áp dụng quy tắc "${gt}" bằng cách phân tích cấu trúc câu và ngữ nghĩa mạch văn xung quanh chỗ trống.` : 'Phân tích cấu trúc ngữ pháp quanh chỗ trống trước, sau đó kiểm tra sắc thái nghĩa hợp ngữ cảnh doanh nghiệp.';
    }
    return 'Tìm câu chứa từ khóa paraphrase đồng nghĩa trực tiếp trong đoạn văn; kiểm tra kỹ mốc thời gian, người gửi/người nhận và điều kiện ngoại lệ để tránh bẫy suy diễn.';
  }

  function buildRichExplanationHtml(rich, correctAns, pickedAns, optKeys, opts = {}) {
    const qNum = opts.qNum || (rich && rich.q) || 1;
    const keys = optKeys || (Number(rich && rich.part) === 2 ? ['A', 'B', 'C'] : ['A', 'B', 'C', 'D']);
    const grammarLabel = (rich && rich.grammarType) || getFallbackTopicLabel((rich && rich.part) || 1);
    const expStr = String((rich && rich.explanation) || '');
    const rawLines = expStr.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);

    let answerDetail = '';
    let evidenceDetail = '';
    let customTipLine = '';
    const trapsMap = {};
    const seenNorm = new Set();
    const cleanOptPrefix = (s) => String(s || '').replace(/^\s*(?:\([A-D]\)\s*)+/i, '').trim();
    const normCmp = (s) => cleanOptPrefix(s).replace(/[^\p{L}\p{N}]+/giu, ' ').trim().toLowerCase();

    rawLines.forEach((ln) => {
      const nk = normCmp(ln);
      if (!nk || seenNorm.has(nk)) return;
      seenNorm.add(nk);
      if (/^Phân tích( từng phương án)? bẫy:?$/i.test(ln)) return;
      if (/^Đáp án đúng:/i.test(ln)) {
        if (!answerDetail) answerDetail = ln.replace(/^Đáp án đúng:\s*/i, '').trim();
        return;
      }
      if (/^Dẫn chứng( trong bài nghe)?:/i.test(ln)) {
        if (!evidenceDetail) evidenceDetail = ln.replace(/^Dẫn chứng( trong bài nghe)?:\s*/i, '').trim();
        return;
      }
      if (/^(Mẹo|Tình huống|Lưu ý|Tại sao|Ghi nhớ):/i.test(ln)) {

        while ((seg = segRx.exec(rest)) !== null) {

  document.addEventListener('keydown', (e) => {

  // LOCKED REAL-ROOM PAPER EXAM (54 AUDIO TRACKS + 75 MIN READING -> OMR)
  // --------------------------------------------------------------------------
  let paperLive = null;

  function stopPaperLiveExam() {
    if (!paperLive) return;
    if (paperLive.timerId) {
      clearInterval(paperLive.timerId);
      paperLive.timerId = null;
    }
    if (paperLive.gapId) {
      clearTimeout(paperLive.gapId);
      paperLive.gapId = null;
    }
    persistentTestAudio.onended = null;
    persistentTestAudio.onerror = null;
    stopPersistentTestAudio();
    paperLive = null;
  }

  function startPaperLiveExam(testCode, countdownSec) {
    const code = testCode || (ws && ws.testCode) || 'T01';
    const meta = (DB.testsMeta && (Array.isArray(DB.testsMeta) ? DB.testsMeta.find((m) => m.code === code || m.id === code) : DB.testsMeta[code])) || { tracks: [] };
    const tracks = meta.tracks || [];
    const cd = countdownSec != null ? Number(countdownSec) : (preExamCountdownChoice || 3);
    ETS.closeModal();
    stopPaperLiveExam();
    stopPersistentTestAudio();
    clearWorkspaceTimers();

    paperLive = {
      testCode: code,
      tracks,
      trackIdx: 0,
      phase: cd > 0 ? 'countdown' : (tracks.length ? 'listening' : 'reading'),
      countdownSec: Math.max(0, cd),
      startedAt: Date.now(),
      examStartAt: cd > 0 ? null : Date.now(),   // official 120:00 starts when Track 1 starts
      totalSec: 120 * 60,
      readingStartAt: null,
      readingSec: 75 * 60,
      audioVolume: 0.9,
      betweenTracks: false,
      warned5: false,
      timeUp: false,
      timerId: null,
      gapId: null
    };
    if (paperLive.phase === 'reading') paperLive.readingStartAt = Date.now();

    paperLive.timerId = setInterval(() => {
      if (!paperLive || state.route !== 'paper-live') return;
      if (paperLive.phase === 'countdown') {
        paperLive.countdownSec -= 1;
        if (paperLive.countdownSec <= 0) {
          paperLive.examStartAt = Date.now();
          paperLive.phase = paperLive.tracks.length ? 'listening' : 'reading';
          if (paperLive.phase === 'reading') paperLive.readingStartAt = Date.now();
          playExamBell(1);
          renderPaperLiveView();
          if (paperLive.phase === 'listening') playCurrentPaperLiveTrack();
        } else {
          const el = document.getElementById('plCountdown');
          if (el) el.textContent = `${paperLive.countdownSec}`;
        }
        return;
      }
      const remain = paperLiveRemainingSec();
      paperLive.readingSec = remain;
      updatePaperLiveClocks();
      if (!paperLive.warned5 && remain <= 300 && remain > 0) {
        paperLive.warned5 = true;
        playExamBell(2);
        toast('⏰ Còn 5 phút cuối! Kiểm tra lại các câu chưa tô trên phiếu.');
      }
      if (remain <= 0 && !paperLive.timeUp) {
        paperLive.timeUp = true;
        persistentTestAudio.onended = null;
        persistentTestAudio.onerror = null;
        stopPersistentTestAudio();
        clearInterval(paperLive.timerId);
        paperLive.timerId = null;
        showTimeUpOverlay({
          title: 'HẾT GIỜ LÀM BÀI',
          sub: `Đề ${paperLive.testCode} · Đã hết 120 phút. Đặt bút xuống, ngừng tô phiếu trả lời.`,
          actionLabel: 'Chuyển sang Quét Chấm Phiếu OMR',
          actionJs: 'ETS.closeTimeUpOverlay(); ETS.finishPaperLiveToOmr(true)'
        });
      }
    }, 1000);

    ETS.navigate('paper-live');
    if (paperLive.phase === 'listening') playCurrentPaperLiveTrack();
  }

  function playCurrentPaperLiveTrack() {
    if (!paperLive || paperLive.phase !== 'listening') return;
    const t = paperLive.tracks[paperLive.trackIdx];
    const audioSrc = t && (t.src || t.file);
    if (!t || !audioSrc) {
      transitionPaperLiveToReading();
      return;
    }
    paperLive.betweenTracks = false;
    stopPersistentTestAudio();
    const aud = persistentTestAudio;
    aud.onended = null;
    aud.onerror = null;
    aud.playbackRate = 1;
    aud.src = audioSrc;
    aud.volume = paperLive.audioVolume;
    aud.onended = () => {
      if (!paperLive || paperLive.phase !== 'listening') return;
      if (paperLive.trackIdx < paperLive.tracks.length - 1) {
        paperLive.betweenTracks = true;
        renderPaperLiveView();
        paperLive.gapId = setTimeout(() => {
          if (!paperLive || paperLive.phase !== 'listening') return;
          paperLive.trackIdx += 1;
          renderPaperLiveView();
          playCurrentPaperLiveTrack();
        }, 2500);
      } else {
        transitionPaperLiveToReading();
      }
    };
    aud.onerror = () => {
      if (!paperLive || paperLive.phase !== 'listening') return;
      if (paperLive.trackIdx < paperLive.tracks.length - 1) {
        paperLive.trackIdx += 1;
        renderPaperLiveView();
        playCurrentPaperLiveTrack();
      } else {
        transitionPaperLiveToReading();
      }
    };
    aud.play().catch(() => {});
  }

  function transitionPaperLiveToReading() {
    if (!paperLive) return;
    persistentTestAudio.onended = null;
    persistentTestAudio.onerror = null;

    paperLive.betweenTracks = false;

    toast('Hết phần Nghe — Bắt đầu phần Đọc (Câu 101–200). Đồng hồ 120 phút vẫn tiếp tục đếm ngược.');

  }

  // ===================== EXAM ROOM HELPERS (bell, clocks, time-up overlay) =====================

  let _bellCtx = null;

  // Synthesised school/exam bell — Web Audio, works fully offline. times = number of strikes.

  function playExamBell(times = 1, volume = 0.9) {

    try {

      const AC = window.AudioContext || window.webkitAudioContext;

      if (!AC) return;

      if (!_bellCtx) _bellCtx = new AC();

      const ctx = _bellCtx;

      if (ctx.state === 'suspended') ctx.resume();

      const master = ctx.createGain();

      master.gain.value = Math.max(0.05, Math.min(1, volume));

      master.connect(ctx.destination);

      for (let i = 0; i < times; i++) {

        const t0 = ctx.currentTime + i * 1.15;

        [[880, 1], [1320, 0.55], [1760, 0.35], [2640, 0.18], [440, 0.4]].forEach(([f, a]) => {

          const o = ctx.createOscillator();

          const g = ctx.createGain();

          o.type = 'sine';

          o.frequency.setValueAtTime(f, t0);

          g.gain.setValueAtTime(0.0001, t0);

          g.gain.exponentialRampToValueAtTime(0.5 * a, t0 + 0.012);

          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);

          o.connect(g); g.connect(master);

          o.start(t0); o.stop(t0 + 2.0);

        });

      }

      if (navigator.vibrate) navigator.vibrate(Array.from({ length: times }, () => [400, 250]).flat());

    } catch (e) {}

  }

  function paperLiveReadingPlan(remain) {

    // Recommended pacing for Reading (ETS strategy guides): Part 5 ≈ 10', Part 6 ≈ 8', Part 7 ≈ 55', review 2'

    const readStart = paperLive.readingStartAt || Date.now();

    const usedR = Math.max(0, Math.floor((Date.now() - readStart) / 1000));

    const steps = [

      { name: 'Part 5 · Câu 101–130', min: 10 },

      { name: 'Part 6 · Câu 131–146', min: 8 },

      { name: 'Part 7 · Câu 147–200', min: 55 },

      { name: 'Soát lại phiếu', min: 2 },

    ];

    let acc = 0;

    return steps.map((s) => {

      const from = acc; acc += s.min * 60;

      const status = usedR >= acc ? 'done' : (usedR >= from ? 'now' : 'next');

      return { ...s, status, endsIn: Math.max(0, acc - usedR) };

    });

  }

      if (p) {
        totalAnswered++;
        if (p === pq.ans) totalCorrect++;
      }
    });

    let drills = allDrills.filter((pq) => {
      if (activeSub !== 'ALL' && pq.subType !== activeSub) return false;
      if (activeDiff !== 'ALL' && (pq.difficulty || 'medium') !== activeDiff) return false;
      return true;
    });
    if (drillOrder && drillOrder.tid === active.id && Array.isArray(drillOrder.ids)) {
      const rank = new Map(drillOrder.ids.map((id, i) => [id, i]));
      drills = [...drills].sort((a, b) => (rank.get(a.qId) ?? 9999) - (rank.get(b.qId) ?? 9999));
    }

    const diffLabelMap = { easy: 'Cơ bản', medium: 'Trung bình', hard: 'Nâng cao' };
    const totalPages = Math.ceil(drills.length / DRILLS_PER_PAGE);
    if (drillPage >= totalPages) drillPage = 0;
    const isPaged = drills.length > DRILLS_PER_PAGE && drillPage >= 0;
    const visibleDrills = isPaged
      ? drills.slice(drillPage * DRILLS_PER_PAGE, (drillPage + 1) * DRILLS_PER_PAGE)
      : drills;
    const startOffset = isPaged ? (drillPage * DRILLS_PER_PAGE) : 0;

    return `
      <div class="drill-section-wrap" id="formulaDrillSection">
        <div class="drill-header-bar formula-drill-head">
          <div style="min-width:0;">
            <div style="font-size:0.75rem;font-weight:800;color:var(--primary);letter-spacing:.03em;display:flex;align-items:center;gap:5px;">
              ${icon('edit')} <span>BÀI TẬP THỰC CHIẾN</span>
            </div>
            <h3 class="hide-mob" style="margin:4px 0 0;font-size:1.1333rem;">Luyện Tập Áp Dụng: ${esc(formatTopicTitle(active.title))}</h3>
          </div>
          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
            <span class="badge ${totalAnswered === allDrills.length && totalCorrect === allDrills.length ? 'badge-success' : 'badge-primary'}" style="font-size:0.78rem;padding:4px 8px;">
              ${totalAnswered}/${allDrills.length} · Đúng ${totalCorrect}
            </span>
            <button class="btn btn-xs" onclick="ETS.shuffleFormulaDrills(${active.id})" title="Đảo thứ tự">${icon('shuffle')} <span class="hide-mob">Đảo thứ tự</span></button>
            <button class="btn btn-xs ${bi ? 'btn-primary' : ''}" onclick="ETS.toggleFormulaDrillBilingual()" title="Song ngữ">${icon('globe')} <span class="hide-mob">Song ngữ: ${bi ? 'BẬT' : 'TẮT'}</span></button>
            <button class="btn btn-xs" onclick="ETS.resetFormulaTopicDrills(${active.id})" title="Làm lại ${allDrills.length} câu này">${icon('refresh')} <span class="hide-mob">Làm lại ${allDrills.length} câu này</span></button>
          </div>
        </div>

        ${active.relatedPart === 5 && active.id !== 48 ? `
          <div class="formula-filter-bar" style="background:var(--primary-soft);border-color:var(--primary);justify-content:space-between;margin-top:8px;">
            <span style="font-size:0.8667rem;font-weight:700;color:var(--primary);">Muốn luyện thêm Bộ 199 Câu Part 5 kèm giải thích chi tiết &amp; bẫy?</span>
            <button class="btn btn-xs btn-primary" onclick="ETS.selectFormulaTopic(48);ETS.setFormulaViewMode('drill')">${icon('play')} Mở Bộ 199 Câu Part 5 →</button>
          </div>
        ` : ''}

        ${drills.length > DRILLS_PER_PAGE ? `
          <div class="formula-filter-bar" style="margin-top:8px;">
            <div class="formula-filter-group">
              <span style="font-size:0.7667rem;font-weight:800;color:var(--ink-subtle);">CHIA CHẶNG (${drills.length} CÂU):</span>
              ${Array.from({ length: totalPages }, (_, pi) => {
                const a = pi * DRILLS_PER_PAGE + 1;
                const b = Math.min(drills.length, (pi + 1) * DRILLS_PER_PAGE);
                return `<button class="formula-pill-btn ${drillPage === pi ? 'active' : ''}" onclick="ETS.setDrillPage(${pi})">Câu ${a}–${b}</button>`;
              }).join('')}
              <button class="formula-pill-btn ${drillPage === -1 ? 'active' : ''}" onclick="ETS.setDrillPage(-1)">Tất cả (${drills.length})</button>
            </div>
          </div>
        ` : ''}

        <details class="formula-filter-collapse" ${(typeof window !== 'undefined' && window.innerWidth > 760) ? 'open' : ''}>
          <summary class="formula-filter-summary">
            <span>${icon('filter')} Bộ lọc Dạng (${activeSub === 'ALL' ? `Tất cả ${allDrills.length}` : esc(activeSub)}) · Độ khó</span>
            <span>Mở ▾</span>
          </summary>
          <div class="formula-filter-bar">
            <div class="formula-filter-group">
              <span style="font-size:0.7667rem;font-weight:800;color:var(--ink-subtle);display:inline-flex;align-items:center;gap:4px;">${icon('filter')} Dạng:</span>
              <button class="formula-pill-btn ${activeSub === 'ALL' ? 'active' : ''}" onclick="ETS.setDrillSubTypeFilter('ALL')">Tất cả (${allDrills.length})</button>
              ${subTypes.map((st) => `
                <button class="formula-pill-btn ${activeSub === st ? 'active' : ''}" onclick="ETS.setDrillSubTypeFilter('${escJsStr(st)}')">${esc(st)}</button>
              `).join('')}
            </div>
            <div class="formula-filter-group">
              <span style="font-size:0.7667rem;font-weight:800;color:var(--ink-subtle);display:inline-flex;align-items:center;gap:4px;">${icon('gauge')} Độ khó:</span>
              <button class="formula-pill-btn ${activeDiff === 'ALL' ? 'active' : ''}" onclick="ETS.setDrillDiffFilter('ALL')">Mọi mức</button>
              ${diffCounts.easy ? `<button class="formula-pill-btn ${activeDiff === 'easy' ? 'active' : ''}" onclick="ETS.setDrillDiffFilter('easy')">Cơ bản (${diffCounts.easy})</button>` : ''}
              ${diffCounts.medium ? `<button class="formula-pill-btn ${activeDiff === 'medium' ? 'active' : ''}" onclick="ETS.setDrillDiffFilter('medium')">Trung bình (${diffCounts.medium})</button>` : ''}
              ${diffCounts.hard ? `<button class="formula-pill-btn ${activeDiff === 'hard' ? 'active' : ''}" onclick="ETS.setDrillDiffFilter('hard')">Nâng cao (${diffCounts.hard})</button>` : ''}
            </div>
          </div>
        </details>

        ${!drills.length ? `
          <div class="card" style="padding:20px;text-align:center;color:var(--ink-muted);">
            Không có câu nào khớp bộ lọc hiện tại. <button class="btn btn-xs btn-primary" style="margin-left:8px;" onclick="ETS.setDrillSubTypeFilter('ALL');ETS.setDrillDiffFilter('ALL');">Hiện tất cả</button>
          </div>
        ` : ''}

        <div class="drill-cards-list">
          ${visibleDrills.map((pq, rawIdx) => {
            const idx = startOffset + rawIdx;
            const picked = ansMap[pq.qId] || null;
            const isAnswered = !!picked;
            const isCorrect = isAnswered && picked === pq.ans;
            const showVi = bi || isAnswered;
            const diffKey = pq.difficulty || 'medium';

            return `
              <div class="drill-card ${isAnswered ? (isCorrect ? 'is-correct-card' : 'is-wrong-card') : ''}" id="fdrill_${esc(pq.qId)}">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span class="badge badge-primary">Câu ${idx + 1}/${drills.length} · ${esc(pq.qId)}</span>
                    ${pq.subType ? `<span class="badge badge-accent">${esc(pq.subType)}</span>` : ''}
                    <span class="formula-diff-badge diff-${esc(diffKey)}">${diffLabelMap[diffKey] || 'Chuẩn ETS'}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    ${isAnswered ? `
                      <span class="badge ${isCorrect ? 'badge-success' : 'badge-danger'}" style="white-space:nowrap;">
                        ${isCorrect ? `${icon('check-circle')} Chính xác` : `${icon('x-circle')} Sai (${picked} · Đúng ${pq.ans})`}
                      </span>
                      <button class="btn btn-xs" style="white-space:nowrap;" onclick="ETS.resetSingleFormulaDrill('${escJsStr(pq.qId)}')">${icon('refresh')} Làm lại<span class="hide-mob"> câu này</span></button>
                    ` : `<span class="badge" style="white-space:nowrap;">Chưa chọn đáp án</span>`}
                    <button class="btn btn-xs" style="white-space:nowrap;" onclick="ETS.speakEnglish('${escJsStr(pq.stem_en)}')" title="Nghe đọc câu hỏi">${icon('volume')} Đọc câu</button>
                  </div>
                </div>

                ${pq.context_en ? `
                  <div class="drill-context-box">
                    <div style="font-size:0.7667rem;font-weight:800;color:var(--primary);margin-bottom:4px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px;">
                      <span style="display:inline-flex;align-items:center;gap:5px;">${icon('file-text')} Ngữ cảnh / Đoạn trích (Context / Passage)</span>
                      <button class="btn btn-xs" onclick="ETS.speakEnglish('${escJsStr(pq.context_en)}')">${icon('volume')} Nghe đoạn</button>
                    </div>
                    <div style="white-space:pre-line;font-size:0.92rem;line-height:1.65;color:var(--ink);font-weight:500;">${esc(pq.context_en)}</div>
                    ${showVi && pq.context_vi ? `
                      <div class="vi-text" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-strong);white-space:pre-line;"><strong>Dịch nghĩa:</strong> ${esc(pq.context_vi)}</div>
                    ` : ''}
                  </div>
                ` : ''}

                <div class="q-stem" style="margin-bottom:10px;">
                  <div style="font-weight:700;color:var(--ink);">${esc(pq.stem_en)}</div>
                  ${showVi && pq.stem_vi ? `<div class="vi-text" style="margin-top:5px;"><strong>Dịch câu:</strong> ${esc(pq.stem_vi)}</div>` : ''}
                </div>

                <div class="opt-list">
                  ${['A', 'B', 'C', 'D'].map((k) => {
                    const opt = (pq.options && pq.options[k]) || { en: k, vi: '' };
                    const elimKey = `${pq.qId}_${k}`;
                    const isElim = !!drillEliminated[elimKey];
                    let cls = 'opt-btn';
                    if (isElim && !isAnswered) cls += ' is-eliminated';
                    if (isAnswered) {
                      cls += ' is-locked-choice';
                      if (k === pq.ans) cls += ' is-correct';
                      else if (k === picked) cls += ' is-wrong';
                    }
                    return `
                      <div class="opt-row-wrap">
                        <div role="button" tabindex="0" class="${cls}"
                          onclick="ETS.pickFormulaDrillOption(${active.id}, '${escJsStr(pq.qId)}', '${k}')"
                          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ETS.pickFormulaDrillOption(${active.id}, '${escJsStr(pq.qId)}', '${k}');}"
                          oncontextmenu="ETS.elimFormulaDrillOption(event, '${escJsStr(pq.qId)}', '${k}')">
                          <span class="opt-key">${k}</span>
                          <div style="flex:1;min-width:0;">
                            <div class="opt-en-line opt-txt" style="font-weight:600;">${esc(opt.en)}</div>
                            ${showVi && opt.vi ? `<div class="vi-text" style="margin-top:3px;font-size:0.8333rem;">${esc(opt.vi)}</div>` : ''}
                          </div>
                        </div>
                        ${!isAnswered ? `
                          <button class="opt-elim-btn ${isElim ? 'active' : ''}" title="Gạch loại phương án ${k} (hoặc chuột phải)"
                            onclick="ETS.elimFormulaDrillOption(event, '${escJsStr(pq.qId)}', '${k}')">${icon('close')}</button>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>

                ${isAnswered ? `
                  <div class="exp-box" style="margin-top:12px;">
                    ${pq.formula ? `
                      <div style="padding:8px 12px;border-radius:8px;background:var(--warn-soft);border-left:4px solid var(--warn);margin-bottom:8px;font-size:0.8667rem;">
                        <strong style="color:#b45309;display:inline-flex;align-items:center;gap:5px;">${icon('formulas')} Công thức & Quy tắc cốt lõi:</strong> ${esc(pq.formula)}
                      </div>
                    ` : ''}
                    <div style="font-size:0.9rem;line-height:1.65;">
                      <strong style="color:var(--primary);display:inline-flex;align-items:center;gap:5px;">${icon('lightbulb')} Giải thích chi tiết & Phân tích bẫy:</strong>
                      <div style="margin-top:4px;white-space:pre-line;">${esc(pq.explanation)}</div>
                    </div>
                    ${(pq.vocab && pq.vocab.length) ? `
                      <div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--border-strong);">
                        <div style="font-size:0.8rem;font-weight:800;color:var(--ink-subtle);margin-bottom:6px;display:flex;align-items:center;gap:5px;">${icon('voca')} TỪ VỰNG TRỌNG TÂM TRONG CÂU (BẤM ĐỂ NGHE & TRA CỨU):</div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">
                          ${pq.vocab.map((v) => `
                            <span class="vocab-chip" style="cursor:pointer;" onclick="ETS.speakEnglish('${escJsStr(v.word)}'); if(ETS.showVocaLookupModal) ETS.showVocaLookupModal('${escJsStr(v.word)}')">
                              ${icon('volume')} <strong>${esc(v.word)}</strong> <small>(${esc(v.pos || 'vocab')})</small>: ${esc(v.meaning)}
                            </span>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function buildSidebarTopicsHtml(rich, activeId) {
    const q = (state.formulas.search || '').trim().toLowerCase();
    const filtered = rich.filter((t) => {
      if (onlyQuizFilter && !(t.quizCards && t.quizCards.length)) return false;
      if (!q) return true;
      return (`${t.title} ${t.category} ${(t.summary && t.summary.headline) || ''}`).toLowerCase().includes(q);
    });
    const catMap = new Map();
    filtered.forEach((t) => {
      if (!catMap.has(t.category)) catMap.set(t.category, []);
      catMap.get(t.category).push(t);
    });
    const ansMap = (state.formulas && state.formulas.drillAnswers) || {};
    return Array.from(catMap.entries()).map(([cat, list]) => `
      <div style="font-size:0.7333rem;font-weight:800;color:var(--ink-subtle);margin:10px 4px 4px;text-transform:uppercase;">${esc(cat)}</div>
      ${list.map((t) => {
        const drills = t.practiceQuestions || [];
        const doneDrills = drills.filter((pq) => !!ansMap[pq.qId]).length;
        return `
          <button class="topic-item ${t.id === activeId ? 'active' : ''}" onclick="ETS.selectFormulaTopic(${t.id})">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(formatTopicTitle(t.title))}</span>
            <span style="display:flex;gap:4px;align-items:center;flex-shrink:0;">
              ${drills.length ? `<span class="badge ${doneDrills === drills.length ? 'badge-success' : 'badge-primary'}" style="font-size:0.6667rem;" title="Bài tập thực chiến">${doneDrills}/${drills.length}</span>` : ''}
              ${t.quizCards && t.quizCards.length ? `<span class="badge" style="font-size:0.6667rem;" title="Thẻ khảo bài">${t.quizCards.length}</span>` : ''}
            </span>
          </button>
        `;
      }).join('')}
    `).join('');
  }

  function renderFormulas() {
    ensureFormulaState();
    const root = document.getElementById('appContent');
    const rich = (DB.formulasRich && DB.formulasRich.parsed) || [];
    if (!rich.length) {
      root.innerHTML = `<div class="card" style="padding:24px;">Không tìm thấy dữ liệu công thức.</div>`;
      return;
    }

    const q = (state.formulas.search || '').trim().toLowerCase();
    const filtered = rich.filter((t) => {
      if (onlyQuizFilter && !(t.quizCards && t.quizCards.length)) return false;
      if (!q) return true;
      return (`${t.title} ${t.category} ${(t.summary && t.summary.headline) || ''}`).toLowerCase().includes(q);
    });

    const active = rich.find((t) => t.id === state.formulas.activeId) || filtered[0] || rich[0];
    state.formulas.activeId = active.id;
    const mode = state.formulas.viewMode || 'quick';
    const isStar = !!state.formulas.bookmarks[active.id];
    const drillList = active.practiceQuestions || [];
    const totalDrillsAllTopics = rich.reduce((acc, t) => acc + ((t.practiceQuestions && t.practiceQuestions.length) || 0), 0);
    const totalDrillsSolved = Object.keys(state.formulas.drillAnswers || {}).length;

    let bodyContentHtml = '';
    if (mode === 'quick') {
      const sm = active.summary || { headline: active.title, quickFormula: '', steps: [], traps: [] };
      bodyContentHtml = `
        <div class="cheatsheet-box">
          <div style="font-size:0.8rem;font-weight:800;color:var(--primary);letter-spacing:.05em;display:inline-flex;align-items:center;gap:5px;">${icon('zap')} BẢN TÓM GỌN TINH GỌN (ĐỌC NHANH 60 GIÂY)</div>
          <h3 style="margin:6px 0 4px;font-size:1.2rem;">${esc(sm.headline)}</h3>
          ${sm.quickFormula ? `<div class="cheat-formula-banner">${icon('target')} CÔNG THỨC CỐT LÕI: ${esc(sm.quickFormula)}</div>` : ''}

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px;">
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;">
              <strong style="color:var(--primary);font-size:0.9333rem;display:inline-flex;align-items:center;gap:6px;">${icon('check-circle')} CÁC BƯỚC GIẢI & DẤU HIỆU NHANH</strong>
              <ol style="margin:8px 0 0;padding-left:18px;font-size:0.9rem;line-height:1.6;">
                ${(sm.steps || []).map((st) => `<li style="margin-bottom:5px;">${esc(st)}</li>`).join('')}
              </ol>
            </div>
            <div style="background:var(--danger-soft);border:1px solid #fca5a5;border-radius:11px;padding:14px;">
              <strong style="color:var(--danger);font-size:0.9333rem;display:inline-flex;align-items:center;gap:6px;">${icon('alert')} BẪY THƯỜNG GẶP & CẦN TRÁNH</strong>
              <ul style="margin:8px 0 0;padding-left:18px;font-size:0.9rem;line-height:1.6;">
                ${(sm.traps || []).map((tr) => `<li style="margin-bottom:5px;">${esc(tr)}</li>`).join('')}
              </ul>
            </div>
          </div>

          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
            <button class="btn btn-primary btn-sm" onclick="ETS.setFormulaViewMode('drill')">${icon('edit')} Làm Ngay ${drillList.length} Bài Tập Thực Chiến Của Chuyên Đề Này</button>
            <button class="btn btn-sm" onclick="ETS.setFormulaViewMode('full')">${icon('voca')} Mở Bản Bảng Chi Tiết (${active.blocks.length} mục)</button>
            ${active.quizCards && active.quizCards.length ? `<button class="btn btn-sm" style="border-color:var(--accent);color:var(--accent);" onclick="ETS.setFormulaViewMode('quiz')">${icon('target')} Tự Khảo Bài (${active.quizCards.length} thẻ)</button>` : ''}
          </div>
        </div>

        ${active.blocks.filter((b) => b.type === 'table' || b.type === 'kv_table').slice(0, 1).map((b) => `
          <div style="margin-top:12px;">
            <div style="font-size:0.8333rem;font-weight:800;color:var(--ink-subtle);margin-bottom:6px;">TRÍCH XUẤT BẢNG TRỌNG TÂM ĐẦU TIÊN (XEM HẾT Ở MỤC "CHI TIẾT"):</div>
            ${renderBlockHtml({ ...b, rows: (b.rows || []).slice(0, 8) })}
          </div>
        `).join('')}

        <div style="margin-top:22px;padding-top:18px;border-top:2px dashed var(--border-strong);">
          ${renderFormulaDrillSection(active)}
        </div>
      `;
    } else if (mode === 'full') {
      const headings = (active.blocks || []).map((b, idx) => ({ b, idx })).filter((x) => x.b && x.b.type === 'heading');
      bodyContentHtml = `
        <div>
          ${headings.length > 1 ? `
            <details class="toc-collapse" ${(typeof window !== 'undefined' && window.innerWidth > 760) ? 'open' : ''}>
              <summary class="toc-collapse-summary">
                <span>${icon('compass')} Mục lục nhảy nhanh (${headings.length} mục)</span>
                <span>Mở ▾</span>
              </summary>
              <div class="toc-bar">
                <span class="hide-mob" style="font-size:0.7667rem;font-weight:800;color:var(--primary);display:inline-flex;align-items:center;gap:4px;">${icon('compass')} Mục lục nhảy nhanh:</span>
                ${headings.map((h, i) => `
                  <button class="toc-pill" onclick="ETS.scrollToFormulaSec('fsec_${h.idx}')">${i + 1}. ${esc((h.b.text || '').slice(0, 36))}</button>
                `).join('')}
                <button class="toc-pill" style="background:var(--primary-soft);color:var(--primary);font-weight:800;" onclick="ETS.scrollToFormulaSec('formulaDrillSection')">${icon('edit')} Bài Tập Thực Chiến (${drillList.length})</button>
              </div>
            </details>
          ` : ''}
          ${(active.blocks || []).map((b, idx) => renderBlockHtml(b, idx)).join('')}
          <div style="margin-top:24px;padding-top:18px;border-top:2px dashed var(--border-strong);">
            ${renderFormulaDrillSection(active)}
          </div>
        </div>
      `;
    } else if (mode === 'drill') {
      bodyContentHtml = renderFormulaDrillSection(active);
    } else if (mode === 'quiz') {
      const baseCards = active.quizCards || [];
      if (!baseCards.length) {
        bodyContentHtml = `
          <div class="card" style="padding:20px;text-align:center;margin-bottom:16px;">
            Chuyên đề này tập trung vào chiến thuật thực chiến; bạn có thể làm ngay <strong>${drillList.length} câu hỏi trắc nghiệm chuẩn ETS</strong> bên dưới!
          </div>
          ${renderFormulaDrillSection(active)}
        `;
      } else {
        const cards = (quizOrder && quizOrder.tid === active.id) ? quizOrder.list : baseCards.map((c, idx) => ({ ...c, origIdx: idx }));

          parts.push(`<text x="${bx.toFixed(1)}" y="${(by + 2.1).toFixed(1)}" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="5.8" font-weight="700" fill="#64748b">${letters[k]}</text>`);
        }
      }
    }

    // Compact bottom instructions + clean note box (no sections 10-13 clutter)
    const noteTop = WEB_AY0 + ahSvg + 56;
    parts.push(`<rect x="115" y="${noteTop.toFixed(1)}" width="771" height="${(1346 - noteTop).toFixed(1)}" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>`);
    parts.push(`<text x="138" y="${(noteTop + 34).toFixed(1)}" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#0f172a">HƯỚNG DẪN TÔ PHIẾU CHUẨN IIG (OMR TỰ ĐỘNG)</text>`);
    parts.push(`<text x="138" y="${(noteTop + 58).toFixed(1)}" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#334155">1. In ở tỉ lệ 100% (Actual size) trên giấy A4. Tô kín tròn bằng bút chì 2B hoặc bút mực tối màu, tránh làm nhòe sang ô bên cạnh.</text>`);
    parts.push(`<text x="138" y="${(noteTop + 77).toFixed(1)}" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#334155">2. Mục 10 (Group Code), 11 (Questionnaire), 12 (Custom) và 13 (Chữ ký) đã được lược bỏ — chỉ chấm 200 câu Listening &amp; Reading.</text>`);
    parts.push(`<text x="138" y="${(noteTop + 96).toFixed(1)}" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#334155">3. Máy quét OMR nhận diện chính xác cả Phiếu in từ Web này lẫn ảnh chụp từ file PDF mẫu IIG gốc (mẫu tô trắc nghiệm.pdf).</text>`);
    parts.push(`<line x1="138" y1="${(noteTop + 116).toFixed(1)}" x2="862" y2="${(noteTop + 116).toFixed(1)}" stroke="#cbd5e1" stroke-width="1"/>`);
    parts.push(`<text x="138" y="${(noteTop + 142).toFixed(1)}" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#64748b">GHI CHÚ / NHÁP PHÒNG THI</text>`);
    for (let ln = 0; ln < 12; ln++) {
      const ly = noteTop + 174 + ln * 36;
      if (ly > 1326) break;
      parts.push(`<line x1="138" y1="${ly.toFixed(1)}" x2="862" y2="${ly.toFixed(1)}" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>`);
